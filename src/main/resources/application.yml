# ============================================================================
# PCMS 2026-003 공통 설정 (프로파일 무관)
# ============================================================================
# · 이 파일의 주석은 운영 정책 문서다. 값 변경 시 주석도 함께 갱신할 것.
# · 비밀값은 기본값 없는 ${VAR} 로만 주입한다 — 평문 fallback 절대 금지.
#   (001 은 지도 API 키 3종·DB 비밀번호를 yml 에 박아 두었다. 003 은 전량 환경변수)
# · 프로파일별 override 는 application-{local,dev,prod}.yml
# ----------------------------------------------------------------------------

# ----------------------------------------------------------------------------
# Server
#   port : 8083 — 001(8081)·001 로컬(8080) 과 분리해 동시 기동 가능하게 한다(D4).
# ----------------------------------------------------------------------------
server:
  port: 8083
  shutdown: graceful
  # HTTP 응답 압축. text/* + JSON/JS/CSS 만 압축 (이미지/binary 는 자체 압축).
  compression:
    enabled: true
    mime-types:
      - text/html
      - text/xml
      - text/plain
      - text/css
      - text/javascript
      - application/javascript
      - application/json
      - application/xml
      - image/svg+xml
    min-response-size: 1024
  # ngrok / Nginx / ALB 등 리버스 프록시 뒤에서 X-Forwarded-{Proto,Host,For} 해석.
  # 미설정 시 redirect Location 이 http:// 로 생성되어 HTTPS 클라이언트에서 차단됨.
  forward-headers-strategy: native
  servlet:
    session:
      timeout: 30m
      # ---------------------------------------------------------------
      # 세션 쿠키 보안 플래그 — 명시 선언으로 방어층 고정
      #  · http-only = true    : JS document.cookie 접근 차단 (XSS 탈취 방지)
      #  · secure    = true    : HTTPS 전송 전용 (운영). 로컬은 프로파일 override 로 false
      #  · same-site = lax     : cross-site form POST 차단 (CSRF 공격 벡터 축소)
      #  · name      = PCMS_SID: 기본 JSESSIONID 와 구분
      # ---------------------------------------------------------------
      cookie:
        name: PCMS_SID
        http-only: true
        secure: true
        same-site: lax
        path: /
  tomcat:
    max-http-form-post-size: 60MB
    connection-timeout: 20000
    accesslog:
      enabled: false
  error:
    whitelabel:
      enabled: false
    include-stacktrace: never
    include-message: never

---

spring:
  application:
    name: pcms2026-003
  # --------------------------------------------------------------------------
  # Virtual Threads (Java 21 Loom)
  #   · Tomcat 워커 + @Async (지정 executor 없는 메서드) + @Scheduled 가 모두
  #     virtual threads 로 자동 전환. 동시 요청 수가 platform thread 풀에 묶이지 않음.
  #   · synchronized 사용 0건을 ArchUnit 으로 가드 — pinning 위험 없음.
  #   · CPU-bound executor (썸네일·메일 발송) 는 의도적으로 platform thread 유지
  #     — @Async("name") 명시로 격리한다.
  #   ⚠️ 로컬(Windows) 은 application-local.yml 에서 false 로 override — 사유는 해당 파일 참조.
  # --------------------------------------------------------------------------
  threads:
    virtual:
      enabled: true
  profiles:
    active: local
  main:
    banner-mode: console
  mvc:
    throw-exception-if-no-handler-found: true
    hiddenmethod:
      filter:
        enabled: true   # HTML form 의 _method=delete/put/patch 지원
    # ------------------------------------------------------------------
    # 전역 날짜 포맷 — Thymeleaf `${dto.createdAt}` 같은 표현식이 ISO-8601
    # (2026-04-24T14:10:41) 대신 'yyyy-MM-dd HH:mm:ss' 로 렌더되도록.
    # Spring 이 LocalDate/LocalDateTime/LocalTime 용 Formatter 를 자동 등록한다.
    # ------------------------------------------------------------------
    format:
      date: yyyy-MM-dd
      date-time: yyyy-MM-dd HH:mm:ss
      time: HH:mm:ss
  web:
    resources:
      add-mappings: true
      static-locations: classpath:/static/
  thymeleaf:
    mode: HTML
    encoding: UTF-8
    cache: true
    prefix: classpath:/templates/
    suffix: .html
    # 기본(classpath) 리졸버 순서 명시 — 미지정 시 order 없는 리졸버로 취급되어 외부 콘텐츠
    # 리졸버(order 50)보다 뒤로 밀리고, 외부 디렉터리의 구버전 파일이 소스 템플릿을 가리는
    # 사고가 발생한다(001 실측 2026-07-07). 정책: classpath(소스 관리) 우선, 외부는
    # classpath 에 없는 슬러그(CMS 생성 콘텐츠·스캐폴딩)만 담당.
    template-resolver-order: 1
  servlet:
    multipart:
      enabled: true
      # 휴대폰 사진/동영상 업로드 대응 — 단일 파일 200MB, 요청 전체 250MB.
      # file-size-threshold 이상이면 메모리가 아닌 temp 디스크에 저장되어 OOM 방지.
      max-file-size: 200MB
      max-request-size: 250MB
      file-size-threshold: 10MB
      location: ${java.io.tmpdir}

  # --------------------------------------------------------------------------
  # SMTP
  #   ⚠️ 보안 — username/password 모두 기본값 없음 (의도된 fail-fast).
  #     001 은 발신자 주소를 yml 에 하드코딩했으나 003 은 환경변수로 뺀다.
  #     평문 fallback 을 두면 운영 환경변수 미설정 시 개발용 계정이 그대로
  #     사용되는 회귀가 발생한다.
  # --------------------------------------------------------------------------
  mail:
    host: ${PCMS_MAIL_HOST:smtp.gmail.com}
    port: ${PCMS_MAIL_PORT:587}
    username: ${PCMS_MAIL_USERNAME}
    password: ${GMAIL_SMTP_USER_PASSWD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
    default-encoding: UTF-8

  # --------------------------------------------------------------------------
  # Jackson (JSON serialization)
  #   · date-format 은 java.util.Date 용. java.time.* 은 JacksonConfig 의
  #     Jackson2ObjectMapperBuilderCustomizer 에서 LocalDateTimeSerializer 로 처리
  #   · write-dates-as-timestamps=false 기본 + 커스텀 포매터로 yyyy-MM-dd HH:mm:ss
  #   · JSON 직렬화 시 HTML 이스케이프(HtmlSafeJson) — 001 에서 검색어 저장형 XSS 실제 발생
  # --------------------------------------------------------------------------
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Seoul
    serialization:
      write-dates-as-timestamps: false

# ----------------------------------------------------------------------------
# Jasypt 설정 (ENC(...) 복호화용)
#
# ⚠️ 보안 — 기본값 없음 (의도된 fail-fast).
#   평문 fallback 을 두면 운영 환경변수 미설정 시 개발용 키로 ENC(...) 가
#   정상 복호화되어 비밀이 노출되는 회귀가 발생한다.
# ----------------------------------------------------------------------------
jasypt:
  encryptor:
    password: ${JASYPT_ENCRYPTOR_PASSWORD}
    algorithm: PBEWITHHMACSHA512ANDAES_256
    key-obtention-iterations: 1000
    pool-size: 1
    salt-generator-classname: org.jasypt.salt.RandomSaltGenerator
    iv-generator-classname: org.jasypt.iv.RandomIvGenerator

# ----------------------------------------------------------------------------
# JODConverter — LibreOffice 헤드리스 wrapper (문서 뷰어 변환).
# Spring Boot starter 가 이 블록을 읽어 LocalOfficeManager + DocumentConverter 빈 자동 구성.
#
# 풀 크기 1 (port-numbers 1개) — 동시 변환 1건만 허용. 변환 빈도 낮은 환경에 적합.
# enabled 는 gopcms.file.converter.enabled 와 동기화 — 둘 다 true 여야 동작.
# (false 면 LocalOfficeManager 빈 미생성 → 컨버터 빈 자동 비활성)
# ----------------------------------------------------------------------------
jodconverter:
  local:
    enabled: ${gopcms.file.converter.enabled:false}
    office-home: ${PCMS_LIBREOFFICE_HOME:}      # 빈 값이면 PATH 에서 자동 검색
    port-numbers: 2002                          # 풀 크기 1
    process-timeout: 120000                     # LibreOffice 시작 timeout 2분
    task-execution-timeout: ${gopcms.file.converter.task-execution-timeout-ms:60000}
    task-queue-timeout: 30000                   # 큐 대기 timeout 30초
    max-tasks-per-process: 100                  # 100건 후 LibreOffice 재시작 (메모리 누수 방지)

# ----------------------------------------------------------------------------
# 프로젝트 식별자 — 화면 헤더 / 메타 / 푸터 / 메일 발신자명 등에 사용
#  · name-ko : 한글 프로젝트명 (UI 노출용)
#  · name-en : 영문 프로젝트명 (sitemap.xml / robots / X-Powered-By 등 기술 영역)
# ----------------------------------------------------------------------------
gopcms:
  project:
    name-ko: ${PCMS_PROJECT_NAME_KO:(주)지오넷 PCMS}
    name-en: ${PCMS_PROJECT_NAME_EN:GoPCMS}

  # ------------------------------------------------------------------------
  # 사이트별 KRDS 테마 — tb_site.theme 컬럼으로 관리.
  #   · yml 매핑 없음. 관리자 > 시스템 > 사이트에서 theme 필드(theme-* 클래스)로 지정
  #     — 저장 시 캐시 evict 로 즉시 반영.
  #   · <html> 에 themeClass 로 부착되어 --brand-* 팔레트를 스왑한다.
  #     미지정(빈값) 사이트는 적용 템플릿 CSS 의 기본 브랜드(:root 램프).
  # ------------------------------------------------------------------------

  # ------------------------------------------------------------------------
  # 지도 API 키 — 전부 환경변수. 평문 금지.
  #   001 은 세 키의 실제 값을 yml 에 박아 두었다(커밋됨). 003 은 반복하지 않는다.
  #   · kakao  : https://apis.map.kakao.com — JavaScript 키. 발급 페이지 "사이트 도메인" 등록 필수
  #   · naver  : ncloud 콘솔 → AI·Application → Maps. Application 의 Web 서비스 URL 등록 필수
  #   · google : Cloud Console → Credentials. HTTP referrers 제한 + Maps JavaScript API 활성화
  #   빈 값이면 해당 지도 기능만 비활성 — 부팅은 정상.
  # ------------------------------------------------------------------------
  kakao:
    map:
      appkey: ${PCMS_KAKAO_MAP_APPKEY:}
  naver:
    map:
      client-id: ${PCMS_NAVER_MAP_CLIENT_ID:}
  google:
    map:
      api-key: ${PCMS_GOOGLE_MAP_API_KEY:}

  # ------------------------------------------------------------------------
  # 3-DB DataSource (primary / secondary / logging)
  #   커스텀 DataSource 3개라 spring.datasource 자동설정을 쓰지 않는다
  #   — Pcms2026Application 에서 DataSourceAutoConfiguration 을 제외한다.
  #   드라이버 기본값은 MariaDB — 003 은 MariaDB 단일 벤더다(개발가이드 §6-4).
  # ------------------------------------------------------------------------
  datasource:
    primary:
      jdbc-url: ${PCMS_DB_PRIMARY_URL}
      username: ${PCMS_DB_PRIMARY_USER}
      password: ${PCMS_DB_PRIMARY_PASSWORD}
      driver-class-name: ${PCMS_DB_PRIMARY_DRIVER:org.mariadb.jdbc.Driver}
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000
      validation-timeout: 3000
      max-lifetime: 1800000
      idle-timeout: 600000
      pool-name: HikariPrimary
    secondary:
      jdbc-url: ${PCMS_DB_SECONDARY_URL}
      username: ${PCMS_DB_SECONDARY_USER}
      password: ${PCMS_DB_SECONDARY_PASSWORD}
      driver-class-name: ${PCMS_DB_SECONDARY_DRIVER:org.mariadb.jdbc.Driver}
      maximum-pool-size: 10
      minimum-idle: 2
      pool-name: HikariSecondary
    logging:
      jdbc-url: ${PCMS_DB_LOGGING_URL}
      username: ${PCMS_DB_LOGGING_USER}
      password: ${PCMS_DB_LOGGING_PASSWORD}
      driver-class-name: ${PCMS_DB_LOGGING_DRIVER:org.mariadb.jdbc.Driver}
      maximum-pool-size: 10
      minimum-idle: 2
      pool-name: HikariLogging

  # ------------------------------------------------------------------------
  # Flyway — 3-DB 전부 적용(D2). DataSource 별 Flyway 빈을 명시 구성한다.
  #   spring.flyway.* 자동설정은 쓸 수 없다 — spring.datasource 가 아니기 때문.
  #   위치: classpath:db/migration/{primary,secondary,logging}/mariadb
  #
  #   ⚠️ 실행 계정 (D1 ③ 확정, 2026-07-31) — Flyway 는 DDL 권한이 필요하다.
  #     앱 런타임 계정에 DDL 을 주지 않는 보수 방침에 따라 **local·dev 에서만 앱이 실행**하고,
  #     **운영은 DBA 가 같은 마이그레이션 파일을 Flyway CLI 로 집행**한다.
  #     prod 는 환경변수 override 없이 false 로 고정돼 있다(application-prod.yml 참조).
  #     이 base 기본값이 false 인 이유: 프로파일을 명시하지 않은 실행에서 DDL 이 돌지 않게 한다.
  #   baseline-on-migrate : 기존 스키마 도입이라 현재 상태를 베이스라인으로 잡는다.
  #   out-of-order        : false 고정 — 버전 건너뛴 적용을 막는다.
  # ------------------------------------------------------------------------
  flyway:
    enabled: ${PCMS_FLYWAY_ENABLED:false}
    baseline-on-migrate: true
    baseline-version: "0"
    validate-on-migrate: true
    out-of-order: false

  # ------------------------------------------------------------------------
  # PII AES-256-GCM 암호화 키 (@Encrypt {AG})
  # 운영은 Vault/KMS 경유, dev/local 은 환경변수
  # ------------------------------------------------------------------------
  crypto:
    pii:
      # ⚠️ 보안 — 평문 fallback 절대 금지.
      #   001 의 이전 fallback "0123456789abcdef..." 는 명백한 테스트 키였고,
      #   환경변수 미주입 시 전체 PII 가 약한 키로 영구 암호화되는 회귀가 발생했다.
      #   미주입 시 부팅 실패가 의도된 동작이다.
      master-key: ${PCMS_PII_MASTER_KEY}   # AES-256-GCM 암호화 키. base64, 32 bytes
      key-id: ${PCMS_PII_KEY_ID:v1}
      # ----------------------------------------------------------------------
      # HMAC-SHA256 전용 키 — `*_hash` 컬럼 산출용 (2026-07-31 분리 결정).
      #   대상: email_hash · login_id_hash · di_hash · parent_di_hash ·
      #         voter_name_hash · birth_date_hash · resident_no_suffix_hash
      #
      #   001 은 master-key 를 HMAC 에도 재사용했다("별도 키 관리 간소화").
      #   003 은 key separation 원칙에 따라 분리한다 — 암호화 키와 MAC 키를 공유하면
      #   감사 지적 대상이 되고, 키 회전 시 두 작업이 강제로 묶인다.
      #
      #   ⚠️ 회전 비용이 다르다는 점에 주의:
      #     · master-key 회전  → 암호문을 복호화 후 재암호화하면 된다(가역).
      #     · hmac-key 회전    → 해시는 단방향이라 원문을 다시 얻어야 한다.
      #       즉 master-key 로 복호화한 평문을 새 hmac-key 로 재해시해야 하며,
      #       그동안 완전일치 검색(로그인·중복확인)이 깨진다. 회전은 점검 시간에 일괄 수행할 것.
      #
      #   생성: openssl rand -base64 32
      # ----------------------------------------------------------------------
      hmac-key: ${PCMS_PII_HMAC_KEY}       # HMAC-SHA256 키. base64, 32 bytes

  # ------------------------------------------------------------------------
  # 보안 정책
  # ------------------------------------------------------------------------
  security:
    login:
      max-fail-count: 5
      lock-minutes: 30
    rate-limit:
      # 동일 IP 로그인 시도 분당 허용
      login-per-ip-per-minute: 10
      # 동일 loginId 로그인 시도 분당 허용 — IP 분산 공격 2차 방어선
      login-per-user-per-minute: 5
      api-per-ip-per-minute: 120
    csp:
      enabled: true
    tfa:
      issuer: GoPCMS

  # ------------------------------------------------------------------------
  # 파일 업로드 보안
  #   · root/quarantine/thumbnail 은 모두 웹 루트 외부 디렉터리
  #   · 저장 경로 규칙: {root}/{ENTITY_TYPE}/{yyyy}/{MM}/{uuid}.{ext}
  #     - entityType 이 ETC 거나 비어있으면 디렉터리 생략 → {root}/{yyyy}/{MM}/{uuid}.{ext}
  #   · 썸네일: 이미지 업로드 시 자동 생성
  #   · 대용량 업로드: 200MB 까지 허용. 이미지 해상도 100M 픽셀 초과 시 재인코딩 skip (OOM 방지)
  #   · 업로드 6중 방어(확장자/Tika 매직바이트/격리/재인코딩/FIM/ClamAV) + 경로 containment 검사
  # ------------------------------------------------------------------------
  file:
    upload:
      root:       ${PCMS_UPLOAD_ROOT:/data/pcms2026-003/uploads}
      quarantine: ${PCMS_QUARANTINE:/data/pcms2026-003/quarantine}
      thumbnail:  ${PCMS_THUMBNAIL:/data/pcms2026-003/thumbnail}
      # 허용 확장자 — 문서/이미지/압축 + 휴대폰 동영상(mp4/mov/webm)
      allowed-extensions: jpg,jpeg,png,gif,webp,csv,dat,pdf,hwp,hwpx,doc,docx,xlsx,pptx,zip,gzip,gz,txt,mp4,mov,webm
      doc-extensions: pdf,hwp,hwpx,doc,docx,xlsx,pptx,txt
      image-extensions: jpg,jpeg,png,gif,webp
      video-extensions: mp4,mov,webm
      max-file-size-mb: 200
      # 썸네일 생성 파라미터
      thumbnail-width: 400
      thumbnail-quality: 0.85
      # 이미지 재인코딩 skip 기준 — 픽셀 수(width*height) 가 이 값보다 크면 skip (OOM 방지)
      reencode-max-pixels: 100000000   # 약 100M 픽셀 (10000x10000)
      # 비동기 썸네일 생성 — 대용량·다수 파일 업로드 시 응답 지연 완화.
      # 업로드 응답은 즉시 반환되고 썸네일은 백그라운드 풀에서 생성 후 tb_file.thumbnail_path 를 UPDATE.
      thumbnail-async:
        core-pool: 2
        max-pool: 4
        queue-capacity: 100
        thread-name-prefix: thumb-
    # ----------------------------------------------------------------------
    # 파일 물리 삭제 배치 — 매일 새벽 04시 (Asia/Seoul).
    # 정책: delete_yn='Y' 이고 updated_at 가 retention-days 이상 경과한 파일을
    #       uploads / thumbnail / quarantine 세 저장소에서 모두 삭제 + tb_file 행 hard delete.
    # 6개월 유예는 문제 있는 파일 삭제 조작을 감지하기 위한 감사 창구다.
    #
    # 본 자체 cron(04:00) 과 retention(04:30) 두 스케줄러가 같은 서비스를 호출한다.
    # 동일 cutoff 면 두 번째 실행은 candidates=0 으로 무해. retention bucket(tb_file)과
    # retention-days 를 일치시킬 것. retention 으로 일원화하려면 enabled=false 권장.
    # ----------------------------------------------------------------------
    purge:
      enabled: true
      cron: "0 0 4 * * *"     # 매일 04:00
      retention-days: 180     # 약 6개월 — buckets.tb_file (DAYS_180) 과 동일 정책
      batch-size: 500         # 한 번 실행 시 최대 처리 건수 (DB 부하 조절)
      dry-run: false          # true 면 로그만 남기고 실제 삭제 안 함 — 초기 검증용
    # ----------------------------------------------------------------------
    # ClamAV 스캔 — 별도 JAR Daemon 으로 분리.
    #
    #   본 웹 프로세스는 업로드 직후 tb_file 에 virus_scan_status='PENDING' 으로
    #   INSERT 만 한다. clamd 연결/스레드풀 모두 본 프로세스에 없다.
    #   실제 스캔은 별도 데몬이 tb_file 을 폴링해 처리하고 결과를
    #   CLEAN / INFECTED / ERROR 로 UPDATE 한다.
    #
    # 다운로드 정책: PENDING / CLEAN 허용, INFECTED / ERROR 차단.
    #   ※ 데몬 미기동 환경이라도 PENDING 상태로 잔존하여 다운로드는 정상.
    #     6중 방어 중 1~5단계(확장자/MIME/격리/재인코딩/FIM)는 웹에서 이미 통과했다.
    # ----------------------------------------------------------------------

    # ----------------------------------------------------------------------
    # 문서 뷰어 변환 (PPTX·DOC·DOCX → PDF) — JODConverter 기반.
    # 클라이언트 사이드 라이브러리 정확도가 낮아 LibreOffice 서버 변환으로 대체.
    # 운영 서버에 LibreOffice headless 설치 필수 — 위치는 PCMS_LIBREOFFICE_HOME.
    #
    # 동작:
    #   enabled=true + LibreOffice 설치 → LocalOfficeManager 자동 구성
    #     · 첫 뷰어 요청 시 동기 변환 (~5~30초)
    #     · 변환된 PDF 는 cache-root 에 file_hash 키로 저장 → 재요청 시 즉시 응답
    #     · PDF.js 뷰어가 변환된 PDF 를 표시
    #   enabled=false → 컨버터 빈 미주입, preview-unsupported 로 폴백 (다운로드 안내)
    # ※ HWP/HWPX 는 LibreOffice 가 아니라 hwplib/hwpxlib 로 텍스트 추출한다.
    # ----------------------------------------------------------------------
    converter:
      enabled: true                                      # 운영 LibreOffice 설치 후 true 전환
      cache-root: ${PCMS_PREVIEW_CACHE:/data/pcms2026-003/preview-cache}
      task-execution-timeout-ms: 60000                   # 변환 timeout — 큰 PPTX 대비 60초

  # ------------------------------------------------------------------------
  # SiteContext 캐시
  # ------------------------------------------------------------------------
  cache:
    site-context-ttl-minutes: 10

  # ----------------------------------------------------------------------
  # 사용자 라이프사이클 — 휴면(tb_member_dormant) / 탈퇴(tb_*_withdraw) 자동 정리
  #
  # 회원 (member) — 3단계:
  #   1) 활성 → 휴면 (1년 미접속, DormantScheduler 01:00)
  #   2) 휴면 → 탈퇴 (휴면 후 1년)
  #   3) 탈퇴 → 영구 삭제 (retention_expire_at 만료, WithdrawPurgeScheduler 04:45)
  #
  # 관리자 (admin) — 휴면 단계 없음:
  #   탈퇴 처리 시점에 retention_expire_at 부여 (회원과 동일 1년 권고).
  #   ▶ 이 시스템은 홈페이지 인증·권한 용도다. 실제 퇴사·노동법 보존 의무는 MIS 가
  #     관리하므로 짧은 보존 기간이 합리적.
  #   ※ 직원(tb_employee)은 로그인·권한 주체가 아니므로 라이프사이클 대상이 아니다
  #     (2026-07-31 — tb_employee_withdraw 삭제).
  #
  # 도입 안전장치 — dry-run=true 로 첫 1~2주 운영. 매일 04:45 로그
  # "WITHDRAW_PURGE_DRY_RUN table=xxx candidates=N" 카운트가 예상치와 일치하는지
  # 확인한 뒤 false 로 전환한다.
  # ----------------------------------------------------------------------
  lifecycle:
    withdraw-purge:
      enabled: true
      cron: "0 45 4 * * *"           # 매일 04:45
      dry-run: false                 # 운영 기본값 — dev/local 에서 true 로 override

  # ----------------------------------------------------------------------
  # 회원 인증번호(OTP) — 휴면 해제 수단 B (개발가이드 §10-6, P5)
  #
  # 값을 코드에 박지 않는 이유: 남용 사고가 나면 **배포 없이** 조일 수 있어야 한다.
  # 아래 숫자들은 서로 맞물려 있으므로 하나만 바꾸지 말 것.
  #
  #   length 6 + max-attempts 5
  #     6자리 = 100만 조합. 시도 5회면 코드 1개당 대입 성공률 5e-6.
  #     자릿수를 줄이려면 시도 상한도 함께 줄여야 한다.
  #
  #   ttl 5분
  #     메일 전달 지연(보통 수 초, 드물게 1~2분)을 견디는 최소치.
  #     더 짧으면 정상 사용자가 못 쓰고, 더 길면 탈취된 메일함의 공격 창이 넓어진다.
  #
  #   resend-cooldown 60초 + max-per-hour 5
  #     쿨다운은 **피해자 메일함 폭탄**을 막는다(공격자가 남의 주소로 반복 발송).
  #     시간당 상한은 쿨다운을 지키며 천천히 반복하는 저속 남용을 막는다.
  #     5회/시간 = 정상 사용자가 오타·스팸함 확인으로 재요청하는 횟수의 상한선.
  #
  # ※ 발급 제한에 걸려도 사용자에게는 알리지 않는다 — "잠시 후 다시" 라는 응답이
  #   곧 "그 계정은 존재한다" 는 뜻이 되기 때문이다(DormantRestoreServiceImpl 참조).
  # ----------------------------------------------------------------------
  member:
    # --------------------------------------------------------------------
    # 휴면 라이프사이클 배치 (P7) — 되돌릴 수 없는 작업이다.
    #   회원을 tb_member 밖으로 옮기고(tb_member_dormant), 보존기간이 지난 휴면
    #   계정을 파기한다. 그래서 보존 정리·탈퇴 파기와 같은 3단 안전장치를 둔다.
    #
    #   dry-run: true 면 **대상 건수만** 로그로 남긴다(DORMANT_DRY_RUN).
    #     ▶ 도입 직후에는 true 로 두고, 매일 01:00 로그의
    #       "notice30D=N notice7D=N notice1D=N transfer=N purge=N" 이 예상치와
    #       맞는지 1~2주 확인한 뒤 false 로 전환한다.
    #     ▶ 미리보기는 실행 경로와 **같은 매퍼 질의**를 쓴다. 별도 카운트 쿼리를
    #       만들면 조건이 갈려서 "미리보기 0건, 실제 200명" 이 된다.
    #
    #   001 은 cron 이 하드코딩("0 0 1 * * *")이고 dry-run 도 없었다 — 이식하면서 교정.
    # --------------------------------------------------------------------
    dormant:
      enabled: true
      cron: "0 0 1 * * *"            # 매일 01:00
      dry-run: false                 # 운영 기본값 — 도입 초기에는 true 권장

    otp:
      length: 6
      ttl: 5m
      max-attempts: 5
      resend-cooldown: 60s
      max-per-hour: 5

  # ----------------------------------------------------------------------
  # Soft-delete retention — delete_yn='Y' 행을 bucket 별 보존 기간 후 hard delete
  #   cron     : 매일 04:30 (LogRetention 03:30 ~ FilePurge 04:00 사이)
  #   dry-run  : true 면 countCandidates 만 로그, DELETE 없음
  #              ▶ 도입 직후 기본값은 true 로 두고, 매일 04:30 로그의
  #                "RETENTION_DRY_RUN table=xxx candidates=N" 이 예상치와 일치하는지
  #                확인한 뒤 false 로 전환한다.
  #   buckets  : 테이블 → DAYS_30 / DAYS_90 / DAYS_180
  # ----------------------------------------------------------------------
  retention:
    enabled: true
    cron: "0 30 4 * * *"
    dry-run: false                    # 운영 기본값 — dev/local 에서 true 로 override
    buckets:
      tb_bbs_article:      DAYS_30
      tb_bbs_comment:      DAYS_30
      # ▶ tb_file 은 보안 이슈(웹쉘 침해 흔적·악성 업로드 추적·삭제 조작 감지) 대비
      #   6개월 감사 창구로 DAYS_180. file.purge.retention-days(180일) 와 정합.
      #   retention 호출 시 FilePurgeService 로 위임해 디스크(upload/quarantine/thumbnail)
      #   + DB 를 통합 정리한다 — orphan 디스크 파일 회귀 차단.
      tb_file:             DAYS_180
      tb_popup:            DAYS_30
      tb_banner:           DAYS_30
      # ▶ tb_content / tb_content_history 는 운영 의사결정 + 복구 여유를 위해 DAYS_90.
      #   childOrder=10(history) → 30(content) 로 자식 history 가 먼저 정리된다.
      #   같은 bucket 을 써야 같은 cutoff 로 부모·자식이 일관 정리된다.
      tb_content_history:  DAYS_90
      tb_content:          DAYS_90
      # ─────────────────────────────────────────────────────────────
      # FK 정합 보강 (file_group / bbs_category / bbs_master)
      # ─────────────────────────────────────────────────────────────
      tb_file_group:       DAYS_180   # file(DAYS_180) 부모. 보안 감사 창구 정합 (childOrder=20)
      tb_bbs_category:     DAYS_30    # article 의 부모 (childOrder=15)
      tb_bbs_master:       DAYS_90    # 게시판 자체 폐기 — 오삭제 복구 시간 여유 (childOrder=40)
      # ─────────────────────────────────────────────────────────────
      # 게시판 상호작용 + 설문
      # ─────────────────────────────────────────────────────────────
      tb_bbs_like:         DAYS_30    # article/comment 자식 (childOrder=5)
      tb_bbs_report:       DAYS_90    # 신고 audit — 길게 보존 (childOrder=5)
      tb_survey_answer:    DAYS_90    # 손자 — 부모 survey 의 cutoff 기반 (childOrder=5)
      tb_survey_option:    DAYS_90    # question 자식 (childOrder=5)
      tb_survey_response:  DAYS_90    # 자식 — 부모 survey 의 cutoff 기반 (childOrder=8)
      tb_survey_question:  DAYS_90    # survey 자식 / option 부모 (childOrder=10)
      tb_survey:           DAYS_90    # survey 마스터 (childOrder=30)
      # ▶ tb_survey_response / tb_survey_answer 는 delete_yn 컬럼이 없다(immutable audit).
      #   부모 survey 의 cutoff 만료 기준으로 자식·손자를 정리한다.
      #   childOrder 5(answer) → 8(response) → 30(survey) 순서로 FK 위반을 회피하고,
      #   같은 DAYS_90 bucket 으로 동일 cutoff 를 유지한다.
      tb_notification:     DAYS_30    # 사용자 삭제 알림 누적
      # ─────────────────────────────────────────────────────────────
      # 단순 마스터
      # ─────────────────────────────────────────────────────────────
      tb_holiday:          DAYS_30
      tb_schedule:         DAYS_30
      # ─────────────────────────────────────────────────────────────
      # 회원
      # ▶ tb_member 는 delete_yn='Y'(탈퇴 처리 완료) 행만 대상이다. 탈퇴 자체는
      #   lifecycle.withdraw-purge 가 담당하며, 여기서는 잔여 행을 짧게 정리한다.
      # ─────────────────────────────────────────────────────────────
      tb_member:           DAYS_1
      # ※ 검색 테이블(tb_search_*) 은 003 에 없다 — 검색은 외부 검색엔진
      #   (contextPath=/search) 으로 분리했다(D10).

  log:
    retention:
      months: 12                     # 12개월 이전 데이터 자동 삭제 (일반 log_*)
      cron: "0 30 3 * * *"           # 매일 03:30
    # ----------------------------------------------------------------------
    # log_privacy_access — PIPA §29 + 안전성확보조치 고시 §8
    # 일반 1년 / 5만명+ 또는 고유식별정보·민감정보 시 2년 — 안전 측 24개월 적용
    # ----------------------------------------------------------------------
    privacy-access:
      retention-months: 24
    # ----------------------------------------------------------------------
    # log_security — 보안 이벤트 분리 적재. 일반 log_* 와 동일 6개월 기본
    # ----------------------------------------------------------------------
    security:
      retention-months: 6

  # ------------------------------------------------------------------------
  # 보안 이벤트 외부 알림 — 텔레그램 Bot
  #   enabled      : 운영 환경에서 명시적으로 true. 로컬은 false 권장
  #   bot-token    : @BotFather 발급 — 환경변수/Vault 경유 (평문 커밋 금지)
  #   chat-id      : 알림 받을 그룹/채널/개인 chat_id
  #   min-severity : CRITICAL / WARN / INFO 순서. 낮출수록 트래픽 증가
  # ------------------------------------------------------------------------
  alert:
    telegram:
      enabled:      ${PCMS_ALERT_TELEGRAM_ENABLED:false}
      bot-token:    ${PCMS_ALERT_TELEGRAM_BOT_TOKEN:}
      chat-id:      ${PCMS_ALERT_TELEGRAM_CHAT_ID:}
      base-url:     https://api.telegram.org
      min-severity: WARN
      max-message-length: 3500
      connect-timeout-ms: 5000
      read-timeout-ms:    5000
      # ----------------------------------------------------------------------
      # dedup — 같은 (event_type, actor) 가 window 내 재발생하면 텔레그램만 silent drop.
      #   60 = 한 공격자가 60초 안에 100 URL 을 스캔해도 텔레그램은 1건. DB INSERT 는 영향 없음.
      #   0 이하 = dedup 비활성 (모든 이벤트 알림 — 폭주 위험)
      # ----------------------------------------------------------------------
      dedup-window-seconds: 60
      dedup-max-keys:       10000

  # ------------------------------------------------------------------------
  # 액세스 로그 일별 집계 배치
  #   cron      : 어제 분 (안정 데이터) — 매일 02:00 한 번
  #   live-cron : 오늘 분 (실시간 반영) — 주기적 재집계 (멱등)
  # ------------------------------------------------------------------------
  access-stat:
    cron:      "0 0 2 * * *"        # 매일 02:00 — 어제 분 정식 집계
    live-cron: "0 */20 * * * *"     # 20분마다 — 오늘 분 재집계 (멱등)

  # ------------------------------------------------------------------------
  # 게시판 — 좋아요/신고
  #   report-threshold : 활성 신고 N건 이상 누적 시 PUBLISHED→REPORTED 자동 전환
  # ------------------------------------------------------------------------
  board:
    report-threshold: 5

  # ------------------------------------------------------------------------
  # 기상청 단기예보 (com.gonet.primary.weather)
  #   service-key : data.go.kr 발급 인증키 (URL-encoded 형태 그대로 보관)
  #   base-url    : KMA API 베이스 (변경 거의 없음)
  # 운영 시 service-key 는 환경변수 / Vault 경유. 평문 커밋 금지.
  # ------------------------------------------------------------------------
  weather:
    kma:
      service-key: ${PCMS_KMA_SERVICE_KEY:}
      base-url:    https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0
      connect-timeout-ms: 5000
      read-timeout-ms:    10000
      # ----------------------------------------------------------------------
      # 수집 스케줄러 (com.gonet.scheduler.WeatherCollectScheduler)
      #   · safety-margin-min : now - margin 으로 최근 발표 시각 매핑
      #   · targets           : 호출 격자 좌표. 비어 있으면 수집 skip
      # ----------------------------------------------------------------------
      collect:
        enabled: true
        cron: "0 5 * * * *"
        num-of-rows: 1000
        safety-margin-min: 30
        targets:
          - { nx: 62, ny: 110, label: "천안시청" }
          - { nx: 66, ny: 101, label: "지오넷" }

  # ------------------------------------------------------------------------
  # ------------------------------------------------------------------------
  # 조달청 나라장터 OpenAPI — 2026-07-31 제외.
  #   tb_g2b_* 4종(bid_notice / order_plan / opening_result / collect_log)을
  #   003 으로 이식하지 않기로 확정했다. 관련 설정·환경변수도 함께 걷어냈다.
  # ------------------------------------------------------------------------

  # ------------------------------------------------------------------------
  # 회원 OAuth2 소셜 로그인 (com.gonet.primary.member.oauth2)
  #   · 직접 RestClient 로 token/userinfo 교환 (Spring Security OAuth2 Client 미사용)
  #   · client-id / client-secret 은 provider 콘솔에서 발급 — 환경변수/Vault 경유
  #   · redirect-base-url : provider 별 callback-url 미지정 시 폴백할 공통 origin
  #   · provider 별 callback-url 은 provider 콘솔 등록 값과 정확히 일치해야 한다
  #     (대소문자·슬래시 포함)
  #   · 미설정 provider 는 진입 시 OAUTH2_NOT_CONFIGURED 로 분기
  #
  #   ⚠️ 001 은 개발자 개인 ngrok 도메인을 기본값으로 박아 두었다. 003 은 전부 환경변수다.
  #     redirect-base-url 만 주입하면 3 provider 의 callback 이 자동 도출된다.
  # ------------------------------------------------------------------------
  oauth2:
    enabled: true
    redirect-base-url: ${PCMS_OAUTH2_REDIRECT_BASE_URL:}
    state-session-key: PCMS_OAUTH2_STATE
    external-profile-session-key: PCMS_OAUTH2_EXTERNAL
    connect-timeout-ms: 5000
    read-timeout-ms:    10000
    # ⚠️ client-id/secret 평문 fallback 금지. 미주입 시 해당 provider 는
    #   콜백에서 invalid_client 로 실패한다 — enabled=false 로 비활성하거나 주입할 것.
    naver:
      enabled:       ${PCMS_OAUTH2_NAVER_ENABLED:false}
      client-id:     ${PCMS_OAUTH2_NAVER_CLIENT_ID:}
      client-secret: ${PCMS_OAUTH2_NAVER_CLIENT_SECRET:}
      # 네이버 개발자센터 → 애플리케이션 → API 설정 → 서비스 URL·Callback URL 에 동일 등록
      callback-url:  ${PCMS_OAUTH2_NAVER_CALLBACK_URL:}
    kakao:
      enabled:       ${PCMS_OAUTH2_KAKAO_ENABLED:false}
      client-id:     ${PCMS_OAUTH2_KAKAO_CLIENT_ID:}
      client-secret: ${PCMS_OAUTH2_KAKAO_CLIENT_SECRET:}
      # 카카오 디벨로퍼스 → 내 애플리케이션 → 카카오 로그인 → Redirect URI 에 등록
      callback-url:  ${PCMS_OAUTH2_KAKAO_CALLBACK_URL:}
    google:
      enabled:       ${PCMS_OAUTH2_GOOGLE_ENABLED:false}
      client-id:     ${PCMS_OAUTH2_GOOGLE_CLIENT_ID:}
      client-secret: ${PCMS_OAUTH2_GOOGLE_CLIENT_SECRET:}
      # Google Cloud Console → Credentials → OAuth 2.0 Client → Authorized redirect URIs 에 등록
      callback-url:  ${PCMS_OAUTH2_GOOGLE_CALLBACK_URL:}

  # ------------------------------------------------------------------------
  # NICE CheckPlus 안심본인인증 (com.gonet.primary.identity)
  #   site-code / site-password : NICE 가입 시 부여받는 자격 (Jasypt ENC 권장)
  #   return-url / error-url    : NICE 콘솔 등록 URL 과 정확히 일치해야 함
  #   auth-type                 : "" 기본 선택화면 / M / X / U / F / S / C
  #   customize                 : "" PC 기본 / "Mobile" 모바일 전용
  #
  #   ⚠️ NiceID jar 는 JPMS 플래그가 필요하다(pom.xml 의 nice.jvm.args).
  #     surefire · spring-boot:run · 운영 Tomcat setenv 모두에 적용해야 하며,
  #     누락 시 본인인증에서만 500 이 난다.
  # ------------------------------------------------------------------------
  nice:
    site-code:     ${PCMS_NICE_SITE_CODE:}
    site-password: ${PCMS_NICE_SITE_PASSWORD:}
    return-url:    ${PCMS_NICE_RETURN_URL:}
    error-url:     ${PCMS_NICE_ERROR_URL:}
    auth-type:     ""
    customize:     ""
    popup-url:     https://nice.checkplus.co.kr/CheckPlusSafeModel/checkplus.cb

  # ------------------------------------------------------------------------
  # CAPTCHA — 봇 차단 (회원가입 / find-id|password / 비번재설정 /
  #          로그인 5회 실패 후 / 게시판 작성 시 master.captcha_yn='Y')
  #   enabled               : false 면 NoOpCaptchaService 활성화 (개발/테스트)
  #   provider              : GOOGLE_RECAPTCHA_V3 (현재 유일 구현)
  #   site-key / secret-key : reCAPTCHA Admin Console 발급. secret-key 는 절대 클라이언트 노출 금지
  #   score-threshold       : 0.0~1.0. Google 권장 기본 0.5. VPN/Tor 많은 사이트는 0.3
  # ------------------------------------------------------------------------
  captcha:
    enabled:          ${PCMS_CAPTCHA_ENABLED:false}
    provider:         GOOGLE_RECAPTCHA_V3
    site-key:         ${PCMS_CAPTCHA_SITE_KEY:}
    secret-key:       ${PCMS_CAPTCHA_SECRET_KEY:}
    score-threshold:  0.5
    verify-url:       https://www.google.com/recaptcha/api/siteverify
    connect-timeout-ms: 3000
    read-timeout-ms:    5000

# ----------------------------------------------------------------------------
# MyBatis
#   매퍼 스캔은 @MapperScan 이 아니라 표준프레임워크 MapperConfigurer 로 한다
#   (호환성 규칙 5). 매퍼 인터페이스 애노테이션은 @EgovMapper.
#   XML 은 classpath*:mapper/{db}/**/*_maria.xml — MariaDB 단일.
# ----------------------------------------------------------------------------
mybatis:
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30
    cache-enabled: false
    jdbc-type-for-null: NULL

# ----------------------------------------------------------------------------
# Actuator / 관측성
#   공개는 health·info·prometheus 만. 나머지는 ROLE_ADMIN 으로 제한한다.
# ----------------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus, httpexchanges
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
    tags:
      application: ${spring.application.name}
  # --------------------------------------------------------------------------
  # Tracing — micrometer-tracing-bridge-brave (경량)
  #   sampling.probability: 1.0 → 모든 요청에 traceId 발급
  #   외부 export 없음 — MDC 에만 주입되어 log_*.trace_id / Logback 패턴에 쓰인다.
  #   소규모 CMS 라 전수(1.0) 로 두고, 부하 발생 시 0.1~0.5 로 낮춘다.
  # --------------------------------------------------------------------------
  tracing:
    sampling:
      probability: 1.0

# ----------------------------------------------------------------------------
# SpringDoc (OpenAPI 3 / Swagger UI)
#   /swagger-ui.html  : Swagger UI 진입
#   /v3/api-docs      : OpenAPI JSON
# URL 접근은 tb_role_url_access 에서 관리자 전용으로 강제한다.
# 운영(prod) 에서는 비활성 — application-prod.yml 참조.
# ----------------------------------------------------------------------------
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    disable-swagger-default-url: true
  # ApiController(REST) 만 노출 — UsrController/MngController(HTML 페이지)는 제외
  packages-to-scan:
    - com.gonet
  paths-to-match:
    - /api/**

# ----------------------------------------------------------------------------
# 로깅
# ----------------------------------------------------------------------------
logging:
  level:
    root: INFO
    com.gonet: INFO
    org.springframework.security: INFO
    org.mybatis: INFO
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n'
