# ============================================================================
# PCMS 2026-003 Local Profile (개발자 로컬 환경)
# ============================================================================
# · MariaDB 3-DB 로컬 기동 전제 (pcms2026-003-{primary,secondary,logging})
# · 민감값은 .env / 환경변수로 주입한다. 이 파일에 평문 금지.
#   (001 의 application-dev.yml 은 DB 비밀번호를 평문으로 박아 두었다 — 반복하지 않는다)
# ----------------------------------------------------------------------------

spring:
  thymeleaf:
    cache: false                     # 로컬은 템플릿 즉시 반영

  # --------------------------------------------------------------------------
  # 로컬 가상 스레드 비활성화 (001 실측 격리 결과).
  #   Java 21 + Windows + Tomcat 10.1 가상 스레드 + JIT C2 컴파일 조합에서
  #   30초 주기 폴링 호출이 누적된 뒤 0xC0000005 (STATUS_ACCESS_VIOLATION) 재현.
  #   가상 스레드 비활성화로 격리했다. 운영(application.yml) 은 true 유지 —
  #   Linux JDK 21 LTS 환경에서 검증된 설정이다.
  #   ※ DevTools 는 아예 도입하지 않는다(pom.xml 참조) — 같은 크래시 계열 이력.
  # --------------------------------------------------------------------------
  threads:
    virtual:
      enabled: false

# ----------------------------------------------------------------------------
# 로컬 임베디드 Tomcat.
#   · port 8082 — application.yml 의 8083(외부 Tomcat 운영용) override.
#     001(8081)·001 로컬(8080) 과도 겹치지 않는다.
#   · cookie.secure=false — HTTP 환경에서 secure 쿠키 비활성.
#     운영은 application.yml 의 true 를 그대로 쓴다.
# ----------------------------------------------------------------------------
server:
  port: 8082
  servlet:
    session:
      cookie:
        secure: false

gopcms:
  # --------------------------------------------------------------------------
  # 3-DB — 로컬도 환경변수 주입이 원칙이다(.env 참조).
  #   비밀번호에 기본값을 두지 않는다 — 미주입 시 부팅 실패가 의도된 동작.
  # --------------------------------------------------------------------------
  datasource:
    primary:
      jdbc-url: ${PCMS_DB_PRIMARY_URL}
      username: ${PCMS_DB_PRIMARY_USER}
      password: ${PCMS_DB_PRIMARY_PASSWORD}
      driver-class-name: ${PCMS_DB_PRIMARY_DRIVER:org.mariadb.jdbc.Driver}
    secondary:
      jdbc-url: ${PCMS_DB_SECONDARY_URL}
      username: ${PCMS_DB_SECONDARY_USER}
      password: ${PCMS_DB_SECONDARY_PASSWORD}
      driver-class-name: ${PCMS_DB_SECONDARY_DRIVER:org.mariadb.jdbc.Driver}
    logging:
      jdbc-url: ${PCMS_DB_LOGGING_URL}
      username: ${PCMS_DB_LOGGING_USER}
      password: ${PCMS_DB_LOGGING_PASSWORD}
      driver-class-name: ${PCMS_DB_LOGGING_DRIVER:org.mariadb.jdbc.Driver}

  # --------------------------------------------------------------------------
  # Flyway — 로컬만 기본 활성.
  #   D1(실행 계정) 결정 전까지 dev/prod 는 비활성이다(application.yml 기본 false).
  #   로컬 계정은 DDL 권한을 갖고 있으므로 여기서만 켠다.
  # --------------------------------------------------------------------------
  flyway:
    enabled: ${PCMS_FLYWAY_ENABLED:true}

  crypto:
    pii:
      # 로컬 개발용 키도 환경변수로 주입한다. 생성: openssl rand -base64 32
      master-key: ${PCMS_PII_MASTER_KEY}
      key-id: v1

  # --------------------------------------------------------------------------
  # CAPTCHA — 로컬은 비활성 (NoOpCaptchaService 활성화).
  #   reCAPTCHA v3 의 site-key 는 운영 도메인만 등록되어 있어 127.0.0.1/localhost
  #   에서 'browser-error' 응답이 발생한다. 로컬은 봇 위험도 없으므로 끄는 것이 표준.
  #   ngrok 등 운영급 도메인으로 테스트할 때만 true.
  # --------------------------------------------------------------------------
  captcha:
    enabled: false

  # --------------------------------------------------------------------------
  # 로컬 trusted-proxies — 빈 값. 직접 127.0.0.1 접속이면 RemoteAddr 가 곧 client IP.
  # ngrok 등 fronting proxy 사용 시 PCMS_TRUSTED_PROXIES 환경변수로 주입.
  # --------------------------------------------------------------------------
  security:
    trusted-proxies: ${PCMS_TRUSTED_PROXIES:}
    admin:
      ip-fallback-allow: true   # 로컬 초기 세팅 — 운영은 application-prod.yml 에서 false 강제

  # --------------------------------------------------------------------------
  # 로컬 문서 뷰어 변환 활성화.
  #   · doc/docx/pptx 를 LibreOffice 로 변환해 PDF 뷰어로 표시.
  #   · Windows 에서 LibreOffice 임시 디렉터리 파일 잠금 충돌이 나면 false 로 되돌릴 것.
  #   · 비활성 시: pptx → 미지원 페이지, docx → 클라이언트 폴백.
  #   · LibreOffice 경로는 PCMS_LIBREOFFICE_HOME 으로 주입 (미지정 시 PATH 검색).
  # --------------------------------------------------------------------------
  file:
    converter:
      enabled: true

  # --------------------------------------------------------------------------
  # 라이프사이클 dry-run override — 로컬은 실제 DELETE 를 하지 않는다.
  #   매일 cron 시각에 candidates 카운트만 로그로 남긴다.
  # --------------------------------------------------------------------------
  retention:
    dry-run: true
  lifecycle:
    withdraw-purge:
      dry-run: true

  content:
    sync:
      html-root: ${PCMS_CONTENT_HTML_ROOT:D:/data/pcms2026-003/content-templates}

---

logging:
  level:
    com.gonet: INFO
    org.springframework.security: INFO
    org.springframework.jdbc.datasource.DataSourceTransactionManager: INFO
    # 3-DB 트랜잭션 라우팅 진단용 — transactionManager 지정 누락을 잡는다.
    org.springframework.transaction.interceptor.TransactionInterceptor: TRACE
    org.mybatis: INFO
    # ⚠️ 매퍼 레벨 TRACE 는 개인정보 후보값이 평문으로 로그된다.
    #   진단이 필요할 때만 일시적으로 켜고, 끝나면 INFO 로 되돌릴 것.

# ----------------------------------------------------------------------------
# 로컬 Mail Health 비활성화.
#   메일 비밀번호 미주입/더미 상태에서 MailHealthIndicator 가 매번 SMTP 인증을
#   시도해 535 BadCredentials 가 폭주한다. health 만 끄고 발송 자체는 호출 시점에만
#   실패하도록 둔다. 운영(application-prod.yml) 은 true 유지.
# ----------------------------------------------------------------------------
management:
  health:
    mail:
      enabled: false
