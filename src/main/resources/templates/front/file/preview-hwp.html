<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{front/layouts/VIEWER/viewer}"
      lang="ko">
<head>
  <title th:text="|미리보기 · ${originalName}|">미리보기</title>
  <style th:attr="nonce=${cspNonce}">
    /* HWP 페이지 캔버스 — 그림자 + 배경, 가운데 정렬, 반응형 */
    .hwp-page-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 16px 0;
      background: #f1f5f9;            /* slate-100 */
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      min-height: 480px;
    }
    .hwp-page {
      max-width: 100%;
      height: auto;
      background: white;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.08);
      border: 1px solid #e2e8f0;
    }
    .hwp-status {
      padding: 4px 8px;
      font-size: 12px;
      color: #64748b;            /* slate-500 */
    }
    .hwp-status.is-error {
      color: #b91c1c;            /* red-700 */
    }
  </style>
</head>
<body>
  <section layout:fragment="content">

    <!-- 헤더 1줄: 파일명 + 다운로드. -->
    <header class="mb-1 flex items-center justify-between gap-3 flex-wrap">
      <h1 class="min-w-0 flex-1 text-base font-semibold text-slate-900 truncate"
          th:text="${originalName}" th:title="${originalName}">파일명.hwp</h1>
      <a th:href="@{${downloadUrl}}"
         class="shrink-0 inline-flex items-center gap-1 px-3 py-1.5 rounded bg-blue-600 text-white text-sm font-medium hover:bg-blue-700">
        ⬇ 원본 다운로드
      </a>
    </header>

    <!-- 헤더 2줄: 진행 상태 (1줄, 인라인) -->
    <div id="hwp-status" class="hwp-status mb-2" role="status" aria-live="polite">
      ⏳ 엔진 로딩 중…
    </div>

    <!-- 페이지 캔버스 컨테이너 — 모든 페이지 세로 스택 -->
    <div id="hwp-pages" class="hwp-page-stack" aria-label="HWP 페이지 목록"></div>

    <!-- ──────────────────────────────────────────────────────────────────
         rhwp WASM 로더 — 동적 import + Canvas 직접 렌더링
         · CSP: script-src 의 'strict-dynamic' 가 nonce'd 스크립트가 동적 로드한
           cdn.jsdelivr.net 의 ES module 을 신뢰. WASM 컴파일은 'wasm-unsafe-eval'.
         · WASM 4.5MB 첫 로드 시 1~3 초 소요. 이후 jsdelivr 캐시.
         · pageCount() 는 0-based 인덱싱 (HOP canvas-view.ts 검증).
         ────────────────────────────────────────────────────────────────── -->
    <script type="module" th:attr="nonce=${cspNonce}" th:inline="javascript">
      const inlineUrl   = /*[[${inlineUrl}]]*/ '';
      const downloadUrl = /*[[${downloadUrl}]]*/ '';
      const status      = document.getElementById('hwp-status');
      const container   = document.getElementById('hwp-pages');

      const setStatus = (msg, error) => {
        status.textContent = msg;
        status.classList.toggle('is-error', !!error);
      };

      // rhwp WASM 이 호스트 측에 요구하는 텍스트 폭 측정 함수.
      // wasm-bindgen 의 __wbg_measureTextWidth_* import 가 globalThis.measureTextWidth(text, font)
      // 를 호출 — Canvas 2D measureText 로 구현. fontSpec 은 CSS font 문자열 형식.
      const _measureCanvas = document.createElement('canvas');
      const _measureCtx = _measureCanvas.getContext('2d');
      globalThis.measureTextWidth = function(text, font) {
        _measureCtx.font = font || '12px sans-serif';
        return _measureCtx.measureText(text).width;
      };

      try {
        setStatus('⏳ rhwp WASM 엔진 로딩 중...');
        const rhwp = await import('https://cdn.jsdelivr.net/npm/@rhwp/core@0.7.15/rhwp.js');
        await rhwp.default();      // WASM init — 자동으로 rhwp_bg.wasm fetch

        setStatus('⏳ 파일 다운로드 중...');
        const res = await fetch(inlineUrl, { credentials: 'same-origin' });
        if (!res.ok) {
          throw new Error('파일 응답 ' + res.status + ' ' + res.statusText);
        }
        const buf = await res.arrayBuffer();

        setStatus('⏳ HWP 파싱 중...');
        const doc = new rhwp.HwpDocument(new Uint8Array(buf));
        const total = doc.pageCount();

        if (total <= 0) {
          throw new Error('페이지가 없는 문서입니다.');
        }

        // 페이지별 캔버스 생성 + 렌더 (0-based)
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        for (let i = 0; i < total; i++) {
          setStatus(`렌더링 중 ${i + 1} / ${total}...`);
          const canvas = document.createElement('canvas');
          canvas.className = 'hwp-page';
          canvas.setAttribute('aria-label', `페이지 ${i + 1}`);
          container.appendChild(canvas);
          doc.renderPageToCanvas(i, canvas, dpr);
          // UI yield — 렌더가 무거우면 페이지 응답성 유지
          if (i % 3 === 2) {
            await new Promise(r => setTimeout(r, 0));
          }
        }

        setStatus(`✅ ${total} 페이지 · rhwp v0.7.10`);
      } catch (e) {
        console.error('[rhwp] 렌더 실패:', e);
        const a = document.createElement('a');
        a.href = downloadUrl;
        a.className = 'text-blue-600 hover:underline font-medium';
        a.textContent = '원본 다운로드';
        status.classList.add('is-error');
        status.innerHTML = '';
        const msg = document.createElement('span');
        msg.textContent = '⚠️ 미리보기 실패: ' + (e && e.message ? e.message : '알 수 없는 오류') + ' — ';
        status.appendChild(msg);
        status.appendChild(a);
      }
    </script>

  </section>
</body>
</html>
