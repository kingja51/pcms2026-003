<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{__${layoutPath ?: 'front/layouts/EMPTY/empty'}__}"
      lang="ko">
<head>
  <title>비밀번호 변경</title>
</head>
<body>
  <section layout:fragment="content" class="max-w-md mx-auto">

    <nav aria-label="상위 경로" class="text-sm text-slate-500 mb-2">
      <a th:href="@{/member/mypage}" class="hover:underline">마이페이지</a>
      <span class="mx-1">/</span>
      <span>비밀번호 변경</span>
    </nav>

    <h1 class="text-2xl font-bold text-slate-900 mb-6">비밀번호 변경</h1>

    <div th:if="${error}" role="alert"
         class="mb-4 rounded border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800"
         th:text="${error}"></div>
    <div th:if="${errors}" role="alert"
         class="mb-4 rounded border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800">
      <ul class="list-disc pl-5">
        <li th:each="e : ${errors}" th:text="${e.defaultMessage}">error</li>
      </ul>
    </div>

    <form id="mypagePasswordForm" th:action="@{/member/mypage/password}" method="post" th:object="${form}"
          class="bg-white border border-slate-200 rounded-lg p-6 space-y-4"
          data-validate-password-policy novalidate>
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <th:block th:replace="~{fragments/captcha-v3 :: widget(action='member_password_change', formId='mypagePasswordForm')}"/>

      <div>
        <label for="currentPassword" class="block text-sm font-medium text-slate-700 mb-1">
          현재 비밀번호 <span class="text-red-600">*</span>
        </label>
        <input id="currentPassword" type="password" th:field="*{currentPassword}" required
               autocomplete="current-password"
               class="block w-full rounded border border-slate-300 px-3 py-2 text-sm focus:border-blue-500 focus:ring-2 focus:ring-blue-200 focus:outline-none"/>
      </div>

      <div>
        <label for="newPassword" class="block text-sm font-medium text-slate-700 mb-1">
          새 비밀번호 <span class="text-red-600">*</span>
        </label>
        <input id="newPassword" type="password" th:field="*{newPassword}" required
               minlength="8" maxlength="100" autocomplete="new-password"
               aria-describedby="newPasswordErr newPasswordHelp"
               class="block w-full rounded border border-slate-300 px-3 py-2 text-sm focus:border-blue-500 focus:ring-2 focus:ring-blue-200 focus:outline-none"/>
        <p id="newPasswordHelp" class="text-xs text-slate-500 mt-1">
          8자 이상(영문 대/소문자·숫자·특수기호 중 3종) 또는 10자 이상(2종 이상) 조합. 현재 비밀번호와 달라야 합니다.
        </p>
        <p id="newPasswordErr" data-err="newPassword" class="hidden mt-1 text-xs text-red-600" role="alert"></p>
      </div>

      <div>
        <label for="newPasswordConfirm" class="block text-sm font-medium text-slate-700 mb-1">
          새 비밀번호 확인 <span class="text-red-600">*</span>
        </label>
        <input id="newPasswordConfirm" type="password" th:field="*{newPasswordConfirm}" required
               minlength="8" maxlength="100" autocomplete="new-password"
               aria-describedby="newPasswordConfirmErr"
               class="block w-full rounded border border-slate-300 px-3 py-2 text-sm focus:border-blue-500 focus:ring-2 focus:ring-blue-200 focus:outline-none"/>
        <p id="newPasswordConfirmErr" data-err="newPasswordConfirm" class="hidden mt-1 text-xs text-red-600" role="alert"></p>
      </div>

      <div class="flex items-center justify-end gap-2 pt-4 border-t border-slate-200">
        <a th:href="@{/member/mypage}"
           class="inline-flex items-center px-4 py-2 rounded border border-slate-300 bg-white text-slate-700 text-sm hover:bg-slate-50">
          취소
        </a>
        <button type="submit"
                class="inline-flex items-center px-4 py-2 rounded bg-blue-600 text-white text-sm font-medium hover:bg-blue-700">
          변경
        </button>
      </div>

      <p class="text-xs text-slate-500 text-center">
        변경된 비밀번호는 비밀번호 이력(<code>tb_member_password_history</code>)에 기록됩니다.
      </p>
    </form>

    <script th:src="@{/js/login-validate.js}" th:attr="nonce=${cspNonce}"></script>

  </section>
</body>
</html>
