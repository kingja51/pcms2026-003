<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{__${layoutPath ?: 'front/layouts/EMPTY/empty'}__}"
      lang="ko">
<head>
  <title>본인 확인</title>
</head>
<body>
  <section layout:fragment="content" class="max-w-md mx-auto">

    <nav aria-label="상위 경로" class="text-sm text-slate-500 mb-2">
      <a th:href="@{/member/mypage}" class="hover:underline">마이페이지</a>
      <span class="mx-1">/</span>
      <span>본인 확인</span>
    </nav>

    <h1 class="text-2xl font-bold text-slate-900 mb-1">본인 확인</h1>
    <p class="text-sm text-slate-500 mb-6">
      <span th:if="${next == 'profile'}">개인정보를 수정하려면</span>
      <span th:if="${next == 'withdraw'}">회원 탈퇴를 진행하려면</span>
      본인 이름과 비밀번호를 다시 한 번 입력해 주세요. 확인 후 5분간 민감 작업이 허용됩니다.
    </p>

    <div th:if="${error}" role="alert" aria-live="polite"
         class="mb-4 rounded border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800"
         th:text="${error}"></div>
    <div th:if="${errors}" role="alert" aria-live="polite"
         class="mb-4 rounded border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800">
      <ul class="list-disc pl-5">
        <li th:each="e : ${errors}" th:text="${e.defaultMessage}">error</li>
      </ul>
    </div>

    <div th:if="${failCount != null and failCount > 0}" role="status"
         class="mb-4 rounded border border-amber-200 bg-amber-50 px-4 py-3 text-xs text-amber-800">
      본인 확인 실패 <strong th:text="${failCount}">0</strong>회 /
      <strong th:text="${failLimit}">5</strong>회 도달 시 세션에서 민감 페이지 접근이 잠시 차단됩니다.
    </div>

    <form th:action="@{/member/mypage/verify}" th:object="${form}" method="post"
          autocomplete="off" class="bg-white border border-slate-200 rounded-lg p-6 space-y-4">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <input type="hidden" th:field="*{next}"/>

      <div>
        <label for="memberName" class="block text-sm font-medium text-slate-700 mb-1">
          이름 <span class="text-red-600">*</span>
        </label>
        <input id="memberName" type="text" th:field="*{memberName}"
               required maxlength="100" autocomplete="name"
               class="block w-full rounded border border-slate-300 px-3 py-2 text-sm focus:border-blue-500 focus:ring-2 focus:ring-blue-200 focus:outline-none"/>
        <p class="text-xs text-slate-500 mt-1">가입 시 등록한 실명을 입력하세요.</p>
      </div>

      <div>
        <label for="email" class="block text-sm font-medium text-slate-700 mb-1">
          이메일 <span class="text-red-600">*</span>
        </label>
        <input id="email" type="email" th:field="*{email}"
               required maxlength="255" autocomplete="email"
               class="block w-full rounded border border-slate-300 px-3 py-2 text-sm focus:border-blue-500 focus:ring-2 focus:ring-blue-200 focus:outline-none"/>
        <p class="text-xs text-slate-500 mt-1">가입 시 등록한 이메일로 본인확인합니다.</p>
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-slate-700 mb-1">
          비밀번호 <span class="text-red-600">*</span>
        </label>
        <input id="password" type="password" th:field="*{password}"
               required maxlength="100" autocomplete="current-password"
               class="block w-full rounded border border-slate-300 px-3 py-2 text-sm focus:border-blue-500 focus:ring-2 focus:ring-blue-200 focus:outline-none"/>
        <p class="text-xs text-slate-500 mt-1">CI 등 본인확인 대체값 — 이메일과 비밀번호로 검증합니다.</p>
      </div>

      <div class="flex items-center gap-2 pt-2">
        <button type="submit"
                class="inline-flex items-center px-4 py-2 rounded bg-blue-600 text-white text-sm font-semibold hover:bg-blue-700">
          확인
        </button>
        <a th:href="@{/member/mypage}"
           class="inline-flex items-center px-4 py-2 rounded border border-slate-300 bg-white text-slate-700 text-sm hover:bg-slate-50">
          취소
        </a>
      </div>
    </form>

    <p class="text-center text-xs text-slate-400 mt-4">
      비밀번호가 기억나지 않으면
      <a th:href="@{/member/find-password}" class="text-blue-600 hover:underline">비밀번호 찾기</a>
      를 이용하세요.
    </p>

  </section>
</body>
</html>
