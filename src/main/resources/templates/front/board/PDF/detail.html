<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{__${layoutPath ?: 'front/layouts/EMPTY/empty'}__}"
      lang="ko">
<head>
  <title th:text="${article.title} + ' — ' + ${master.bbsName}">PDF 문서</title>
</head>
<body>
  <section layout:fragment="content" 
           th:with="canManage=${master.bbsMasterId == article.bbsMasterId}">

    <nav aria-label="상위 경로" class="mb-4 text-body-sm text-fg-subtle">
      <a th:href="@{/bbs/{sc}/{bc}(sc=${siteCode}, bc=${bbsCode})}" class="hover:underline"
         th:text="${master.bbsName}">게시판</a>
      <span class="mx-1" aria-hidden="true">/</span>
      <span class="text-fg font-bold" aria-current="page">상세</span>
    </nav>

    <div th:if="${message}" role="status" aria-live="polite" class="krds-alert krds-alert-success mb-4">
      <span class="text-success-icon font-bold shrink-0" aria-hidden="true">✓</span>
      <p th:text="${message}"></p>
    </div>
    <div th:if="${error}" role="alert" aria-live="polite" class="krds-alert krds-alert-danger mb-4">
      <span class="text-danger-icon font-bold shrink-0" aria-hidden="true">✕</span>
      <p th:text="${error}"></p>
    </div>

    <!-- 비밀글 차단 -->
    <div th:unless="${canSeeBody}"
         class="mb-8 rounded-large border border-line bg-surface-subtle p-12 text-center">
      <p class="text-heading-md text-fg-subtle mb-2" aria-hidden="true">🔒</p>
      <p class="text-body-md text-fg-subtle">비밀글입니다. 작성자 또는 관리자만 본문을 볼 수 있습니다.</p>
    </div>

    <th:block th:if="${canSeeBody}">

      <!-- 문서 카드 -->
      <article class="overflow-hidden rounded-large border border-line bg-surface shadow-e1">
        <div class="border-b border-line bg-gradient-to-br from-primary-5 to-surface-subtle p-6">
          <div class="flex items-center gap-2 flex-wrap mb-2">
            <span th:if="${article.noticeYn == 'Y'}" class="krds-badge bg-danger-surface text-danger-fg">공지</span>
            <span th:if="${article.secretYn == 'Y'}" class="krds-badge bg-surface-subtle text-fg-subtle">🔒 비밀</span>
            <span th:if="${article.categoryName != null and !#strings.isEmpty(article.categoryName)}"
                  class="krds-badge bg-primary-5 text-primary-50" th:text="${article.categoryName}">카테고리</span>
          </div>
          <h1 class="text-heading-sm font-bold text-fg-strong mb-2" th:text="${article.title}">문서 제목</h1>
          <div class="flex flex-wrap items-center gap-3 text-body-xs text-fg-subtle">
            <span class="inline-flex items-center gap-1">✍ <span th:text="${article.writerName}">작성자</span></span>
            <span class="inline-flex items-center gap-1" th:text="${@fmt.dt(article.createdAt)}">2026-04-27</span>
            <span class="inline-flex items-center gap-1">👁 <span th:text="${article.viewCount}">0</span></span>
          </div>
        </div>
        <div th:if="${article.content != null and !#strings.isEmpty(article.content)}"
             class="whitespace-pre-wrap break-keep text-body-md text-fg px-6 py-3
                    [&_img]:my-3 [&_img]:h-auto [&_img]:max-w-full [&_img]:rounded-medium"><th:block
            th:replace="~{fragments/bbs-content :: render(content=${article.content}, htmlYn=${master.htmlYn})}"></th:block></div>
      </article>

      <!-- PDF 뷰어 — 첨부 중 PDF 를 본문에 바로 임베드 (preview-pdf.html 과 동일 방식).
           iframe + /file/preview/{id}/inline (Content-Disposition: inline, download_auth 검증 동일) —
           CSP object-src 'none' 이라 <object>/<embed> 는 차단, iframe 만 가능. -->
      <th:block th:if="${master.fileYn == 'Y' and not #lists.isEmpty(existingFiles)}">
        <section th:each="f : ${existingFiles}"
                 th:if="${f.originalName != null and #strings.toLowerCase(f.originalName) matches '.+[.]pdf$'}"
                 class="mt-4 overflow-hidden rounded-large border border-line bg-surface shadow-e1">
          <header class="flex items-center justify-between gap-3 flex-wrap border-b border-line bg-surface-subtle px-4 py-2.5">
            <h2 class="min-w-0 flex-1 truncate text-body-sm font-bold text-fg-strong"
                th:text="${f.originalName}" th:title="${f.originalName}">문서.pdf</h2>
            <a th:href="@{/fileDown/{fid}(fid=${f.fileId})}"
               class="krds-btn krds-btn-sm krds-btn-tertiary shrink-0">⬇ 원본 다운로드</a>
          </header>
          <iframe th:src="@{/file/preview/{fid}/inline(fid=${f.fileId})}"
                  th:title="'PDF 뷰어 — ' + ${f.originalName}"
                  class="w-full bg-surface" style="height: 80vh; min-height: 480px;"></iframe>
        </section>
      </th:block>

      <!-- 첨부파일 다운로드 — 공용 조각(공지 포맷 표준) -->
      <th:block th:replace="~{fragments/bbs-attachments :: box(files=${existingFiles})}"/>

      <!-- 좋아요 / 신고 -->
      <div class="flex items-center justify-end mt-6">
        <th:block th:replace="~{fragments/bbs-like-report :: actions(
            type='ARTICLE',
            id=${article.articleId},
            likeCount=${article.likeCount},
            liked=${articleLikedByMe})}"/>
      </div>

    </th:block>

    <!-- 액션 -->
    <!-- 이전글/다음글 -->
    <th:block th:replace="~{fragments/bbs-prev-next :: nav(prev=${prevArticle}, next=${nextArticle})}"/>

    <div class="flex items-center justify-between gap-2 pt-6 mt-6 border-t border-line">
      <a th:href="@{/bbs/{sc}/{bc}(sc=${siteCode}, bc=${bbsCode})}"
         class="krds-btn krds-btn-tertiary">목록</a>
      <div class="flex items-center gap-2" th:if="${canManage and (canEdit or canDelete)}">
        <a th:if="${canEdit}"
           th:href="@{/bbs/{sc}/{bc}/{aid}/edit(sc=${siteCode}, bc=${bbsCode}, aid=${article.articleId})}"
           class="krds-btn krds-btn-primary">수정</a>
        <form th:if="${canDelete}"
              th:action="@{/bbs/{sc}/{bc}/{aid}/delete(sc=${siteCode}, bc=${bbsCode}, aid=${article.articleId})}"
              method="post"
              data-confirm="모든 데이타가 삭제 됩니다. 삭제 하시겠습니까?"
              class="inline">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button type="submit"
                  class="krds-btn bg-danger-50 text-white hover:bg-danger-60">삭제</button>
        </form>
      </div>
    </div>

    <!-- PDF 게시판은 댓글 미사용 (master.commentYn 'N' 가정) — 그래도 켜져있으면 노출 -->
    <section th:if="${canSeeBody and master.commentYn == 'Y'}"
             xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
             class="mt-10 pt-6 border-t border-line" id="comments">
      <h2 class="text-heading-xs font-bold text-fg-strong mb-4">
        댓글 <span class="text-fg-subtle" th:text="'(' + ${article.commentCount} + ')'">(0)</span>
      </h2>
      <ul th:if="${not #lists.isEmpty(comments)}" class="space-y-3 mb-6">
        <li th:each="cm : ${comments}" class="border-l-2 border-line pl-4">
          <div class="text-body-xs text-fg-subtle mb-1">
            <strong class="text-fg" th:text="${cm.writerName}">작성자</strong>
            <span class="mx-1">·</span>
            <span th:text="${@fmt.dt(cm.createdAt)}">-</span>
          </div>
          <p th:if="${cm.status == 'PUBLISHED'}" class="text-body-sm whitespace-pre-wrap text-fg"
             th:text="${cm.content}">내용</p>
          <p th:unless="${cm.status == 'PUBLISHED'}" class="text-body-sm text-fg-disabled italic">관리자에 의해 가려진 댓글입니다.</p>
          <th:block th:replace="~{fragments/bbs-like-report :: commentActions(cm=${cm}, commentLikedIds=${commentLikedIds})}"/>
        </li>
      </ul>
      <p th:if="${#lists.isEmpty(comments)}" class="text-body-sm text-fg-subtle mb-4">첫 번째 댓글을 남겨보세요.</p>
      <form sec:authorize="isAuthenticated()"
            th:action="@{/bbs/{sc}/{bc}/{aid}/comments(sc=${siteCode}, bc=${bbsCode}, aid=${article.articleId})}"
            method="post" th:object="${commentForm}"
            class="rounded-large border border-line bg-surface-subtle p-3">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <textarea th:field="*{content}" required rows="3" maxlength="4000"
                  placeholder="댓글을 입력하세요"
                  class="krds-input"></textarea>
        <div class="mt-2 flex justify-end">
          <button type="submit" class="krds-btn krds-btn-sm krds-btn-primary">댓글 등록</button>
        </div>
      </form>
      <div sec:authorize="!isAuthenticated()"
           class="rounded-large border border-line bg-surface-subtle p-4 text-center text-body-sm text-fg-subtle">
        <a th:href="@{/member/login}" class="krds-link">로그인</a> 후 댓글 작성이 가능합니다.
      </div>
    </section>

    <script th:src="@{/js/bbs-like-report.js}" th:attr="nonce=${cspNonce}" defer></script>
  </section>
</body>
</html>
