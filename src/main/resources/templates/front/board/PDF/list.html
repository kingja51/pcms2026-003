<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{__${layoutPath ?: 'front/layouts/EMPTY/empty'}__}"
      lang="ko">
<head>
  <title th:text="${master.bbsName}">PDF 문서</title>
</head>
<body>
  <section layout:fragment="content">

    <header class="mb-6">
      <h1 class="text-heading-lg font-bold text-fg-strong" th:text="${master.bbsName}">PDF 문서</h1>
      <p class="text-body-sm text-fg-subtle mt-2">항목을 누르면 내용을 확인할 수 있고, 상세 보기에서 PDF 뷰어로 문서를 바로 열람할 수 있습니다.</p>
    </header>

    <!-- 안내 + 검색 hero -->
    <div class="mb-6 rounded-xlarge border border-line bg-gradient-to-br from-primary-5 to-surface-subtle p-6">
      <h2 class="text-heading-sm font-bold text-fg-strong mb-1" th:text="${master.bbsName}">PDF 문서</h2>
      <p class="text-body-sm text-fg-subtle"
         th:if="${master.description != null and !#strings.isEmpty(master.description)}"
         th:text="${master.description}">PDF 문서를 열람할 수 있는 게시판입니다.</p>
      <p class="text-body-sm text-fg-subtle"
         th:if="${master.description == null or #strings.isEmpty(master.description)}">
        PDF 문서를 열람할 수 있는 게시판입니다. 키워드로 검색하거나 분류를 선택하세요.
      </p>
      <form class="mt-4 flex gap-2" th:action="@{/bbs/{sc}/{bc}(sc=${siteCode}, bc=${bbsCode})}" method="get">
        <input type="hidden" name="categoryId" th:value="${search?.categoryId}"/>
        <input type="hidden" name="searchType" value="TITLE"/>
        <input type="text" name="keyword" th:value="${search?.keyword}" maxlength="100"
               placeholder="문서 제목을 검색하세요" aria-label="검색어"
               class="krds-input flex-1"/>
        <button type="submit" class="krds-btn krds-btn-primary shrink-0">🔍 검색</button>
      </form>
    </div>

    <div th:if="${message}" role="status" aria-live="polite" class="krds-alert krds-alert-success mb-4">
      <span class="text-success-icon font-bold shrink-0" aria-hidden="true">✓</span>
      <p th:text="${message}"></p>
    </div>
    <div th:if="${error}" role="alert" aria-live="polite" class="krds-alert krds-alert-danger mb-4">
      <span class="text-danger-icon font-bold shrink-0" aria-hidden="true">✕</span>
      <p th:text="${error}"></p>
    </div>

    <!-- 카테고리 -->
    <nav th:if="${categories != null and !#lists.isEmpty(categories)}"
         aria-label="카테고리" class="mt-8 mb-4 flex flex-wrap gap-2">
      <a th:href="@{/bbs/{sc}/{bc}(sc=${siteCode}, bc=${bbsCode})}"
         th:classappend="${search?.categoryId == null or search?.categoryId == ''}
                         ? ' border-primary-50 text-primary-50 bg-primary-5 font-bold'
                         : ' border-line text-fg-subtle hover:bg-surface-subtle'"
         class="krds-tag">전체</a>
      <a th:each="c : ${categories}"
         th:href="@{/bbs/{sc}/{bc}(sc=${siteCode}, bc=${bbsCode}, categoryId=${c.categoryId})}"
         th:classappend="${search?.categoryId == c.categoryId}
                         ? ' border-primary-50 text-primary-50 bg-primary-5 font-bold'
                         : ' border-line text-fg-subtle hover:bg-surface-subtle'"
         class="krds-tag" th:text="${c.categoryName}">분류</a>
    </nav>

    <!-- 합계 + 글쓰기 -->
    <div class="flex items-center justify-between mb-2 mt-2">
      <p class="text-body-sm text-fg">
        총 <strong class="text-primary-50 font-bold" th:text="${page.totalElements}">0</strong>건
      </p>
      <a th:if="${canWrite}"
         th:href="@{/bbs/{sc}/{bc}/write(sc=${siteCode}, bc=${bbsCode})}"
         class="krds-btn krds-btn-sm krds-btn-primary">+ 글 등록</a>
    </div>

    <!-- 아코디언 (네이티브 details/summary — Design.md §8) -->
    <div class="mt-4 border-t-2 border-line-strong border-b border-divider divide-y divide-divider">
      <details th:each="row : ${page.content}" class="group">
        <summary class="flex cursor-pointer list-none items-center gap-4 px-5 py-4 transition-colors
                        hover:bg-surface-subtle group-open:bg-surface-subtler
                        [&::-webkit-details-marker]:hidden">
          <span class="flex-1 text-body-md font-bold text-fg-strong">
            <span th:text="${row.title}">문서 제목</span>
          </span>
          <span th:if="${row.categoryName != null and !#strings.isEmpty(row.categoryName)}"
                class="krds-badge bg-primary-5 text-primary-50 shrink-0" th:text="${row.categoryName}">분류</span>
          <svg class="size-5 shrink-0 text-fg-disabled transition-transform group-open:rotate-180 group-open:text-primary-50"
               xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
               stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"/>
          </svg>
        </summary>
        <div class="px-5 pt-4 pb-6">
          <div th:if="${row.content != null and !#strings.isEmpty(row.content)}"
               class="whitespace-pre-wrap break-keep text-body-sm text-fg
                      [&_img]:my-2 [&_img]:h-auto [&_img]:max-w-full [&_img]:rounded-medium"
               th:utext="${@xss.safe(row.content)}">본문</div>

          <!-- PDF 뷰어 임베드 — 컨트롤러가 PDF 게시판에만 filesByArticle 을 주입.
               detail.html 과 동일 방식(iframe + /file/preview/{id}/inline, CSP object-src 'none' 대응).
               loading="lazy" — 닫힌 아코디언의 iframe 도 즉시 로드되는 것을 지연시켜
               목록 초기 로딩 부담을 줄인다(펼침/스크롤 시 로드). -->
          <th:block th:if="${master.fileYn == 'Y' and filesByArticle != null}"
                    th:with="afiles=${filesByArticle[row.articleId]}">
            <th:block th:if="${afiles != null}">
              <section th:each="f : ${afiles}"
                       th:if="${f.originalName != null and #strings.toLowerCase(f.originalName) matches '.+[.]pdf$'}"
                       class="mt-4 overflow-hidden rounded-large border border-line bg-surface">
                <header class="flex items-center justify-between gap-3 flex-wrap border-b border-line bg-surface-subtle px-4 py-2.5">
                  <h3 class="min-w-0 flex-1 truncate text-body-sm font-bold text-fg-strong"
                      th:text="${f.originalName}" th:title="${f.originalName}">문서.pdf</h3>
                  <a th:href="@{/fileDown/{fid}(fid=${f.fileId})}"
                     class="krds-btn krds-btn-sm krds-btn-tertiary shrink-0">⬇ 원본 다운로드</a>
                </header>
                <iframe th:src="@{/file/preview/{fid}/inline(fid=${f.fileId})}"
                        th:title="'PDF 뷰어 — ' + ${f.originalName}"
                        loading="lazy"
                        class="w-full bg-surface" style="height: 75vh; min-height: 480px;"></iframe>
              </section>
            </th:block>
          </th:block>
        </div>
        <div class="flex flex-wrap items-center gap-4 border-t border-dashed border-divider px-5 pt-2.5 pb-4 text-body-xs text-fg-subtle">
          <span title="작성자">✍ <span th:text="${row.writerName}">작성자</span></span>
          <span title="작성일" th:text="${@fmt.d(row.createdAt)}">2026-04-27</span>
          <span title="조회">👁 <span th:text="${row.viewCount}">0</span></span>
          <a th:href="@{/bbs/{sc}/{bc}/{aid}(sc=${siteCode}, bc=${bbsCode}, aid=${row.articleId})}"
             class="ml-auto hover:text-primary-50 hover:underline">상세 보기 →</a>
        </div>
      </details>

      <div th:if="${#lists.isEmpty(page.content)}"
           class="py-16 text-center text-body-sm text-fg-subtle">아직 등록된 문서가 없습니다.</div>
    </div>

    <!-- 페이지 네비 -->
    <nav aria-label="페이지" th:if="${page.totalPages > 1}" class="mt-8">
      <ul class="flex items-center justify-center gap-1 text-body-sm">
        <li th:each="p : ${#numbers.sequence(1, page.totalPages)}">
          <a th:href="@{/bbs/{sc}/{bc}(sc=${siteCode}, bc=${bbsCode},
                       page=${p}, pageSize=${page.pageSize},
                       categoryId=${search?.categoryId},
                       keyword=${search?.keyword}, searchType=${search?.searchType})}"
             th:text="${p}"
             th:class="${p == page.page}
                       ? 'inline-flex size-10 items-center justify-center rounded-medium bg-primary-50 text-white'
                       : 'inline-flex size-10 items-center justify-center rounded-medium border border-line bg-surface text-fg hover:bg-surface-subtle'">1</a>
        </li>
      </ul>
    </nav>

  </section>
</body>
</html>
