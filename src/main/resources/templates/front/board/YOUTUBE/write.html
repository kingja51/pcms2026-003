<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{__${layoutPath ?: 'front/layouts/EMPTY/empty'}__}"
      lang="ko">
<head>
  <title th:text="${mode == 'edit'} ? '영상 수정' : '영상 등록'">영상 등록</title>
</head>
<body>
  <section layout:fragment="content">

    <nav aria-label="상위 경로" class="text-body-sm text-fg-subtle mb-4">
      <a th:href="@{/bbs/{sc}/{bc}(sc=${siteCode}, bc=${bbsCode})}" class="hover:underline"
         th:text="${master.bbsName}">유튜브</a>
      <span class="mx-1">/</span>
      <span th:text="${mode == 'edit'} ? '수정' : '등록'">등록</span>
    </nav>

    <h1 class="text-heading-md font-bold text-fg-strong mb-6"
        th:text="${mode == 'edit'} ? '영상 수정' : '영상 등록'">영상 등록</h1>

    <div th:if="${error}" role="alert" class="krds-alert krds-alert-danger mb-4">
      <svg xmlns="http://www.w3.org/2000/svg" class="size-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/>
      </svg>
      <p th:text="${error}">오류가 발생했습니다.</p>
    </div>
    <div th:if="${errors}" role="alert" class="krds-alert krds-alert-danger mb-4">
      <svg xmlns="http://www.w3.org/2000/svg" class="size-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/>
      </svg>
      <ul class="list-disc list-inside">
        <li th:each="e : ${errors}" th:text="${e.defaultMessage}">err</li>
      </ul>
    </div>

    <form id="boardWriteForm"
          th:action="${mode == 'edit'}
                     ? @{/bbs/{sc}/{bc}/{aid}(sc=${siteCode}, bc=${bbsCode}, aid=${form.articleId})}
                     : @{/bbs/{sc}/{bc}(sc=${siteCode}, bc=${bbsCode})}"
          method="post" th:object="${form}"
          class="bg-surface border border-line rounded-large p-6 space-y-5">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <input type="hidden" th:field="*{bbsMasterId}"/>
      <input type="hidden" th:field="*{articleId}"/>
      <th:block th:if="${master?.captchaYn == 'Y'}"
                th:replace="~{fragments/captcha-v3 :: widget(action='bbs_write', formId='boardWriteForm')}"/>

      <div th:if="${categories != null and !#lists.isEmpty(categories)}">
        <label for="categoryId" class="block text-body-sm font-medium text-fg mb-1">카테고리</label>
        <select id="categoryId" th:field="*{categoryId}" class="krds-input">
          <option value="">— 선택 안 함 —</option>
          <option th:each="c : ${categories}"
                  th:value="${c.categoryId}"
                  th:text="${c.categoryName}">잡담</option>
        </select>
      </div>

      <div th:if="${canEditWriterName}">
        <label for="writerName" class="block text-body-sm font-medium text-fg mb-1">
          작성자명
          <span class="text-body-xs text-fg-subtle font-normal">(비워두면 본인 이름으로 저장)</span>
        </label>
        <input id="writerName" type="text" th:field="*{writerName}" maxlength="100"
               placeholder="예: 홍보팀, 익명, 게스트"
               class="krds-input"/>
      </div>

      <div>
        <label for="title" class="block text-body-sm font-medium text-fg mb-1">
          제목 <span class="text-danger-fg">*</span>
        </label>
        <input id="title" type="text" th:field="*{title}" required maxlength="300"
               class="krds-input"/>
      </div>

      <div>
        <label for="content" class="block text-body-sm font-medium text-fg mb-1">
          본문 <span class="text-danger-fg">*</span>
        </label>
        <textarea id="content" th:field="*{content}" required rows="10"
                  placeholder="영상 소개·요약 등을 입력하세요."
                  class="krds-input text-body-sm"></textarea>
      </div>

      <!-- ===== 유튜브 메타 ===== -->
      <fieldset class="border border-line rounded-large p-4 space-y-4">
        <legend class="px-2 text-body-sm font-bold text-fg">유튜브 정보</legend>

        <div>
          <label for="linkUrl" class="block text-body-sm font-medium text-fg mb-1">
            영상 URL <span class="text-danger-fg">*</span>
          </label>
          <input id="linkUrl" type="url" th:field="*{linkUrl}" required maxlength="500"
                 placeholder="https://www.youtube.com/watch?v=... · https://youtu.be/..."
                 pattern="^https?://(?:www\.|m\.)?(?:youtube\.com|youtu\.be)/.+"
                 class="krds-input"/>
          <p class="mt-1 text-body-xs text-fg-subtle">
            지원 형식: <code>youtube.com/watch?v=ID</code>, <code>youtu.be/ID</code>,
            <code>youtube.com/embed/ID</code>, <code>youtube.com/shorts/ID</code>
          </p>
        </div>

        <div>
          <label for="publishedAt" class="block text-body-sm font-medium text-fg mb-1">
            게시 일자
          </label>
          <input id="publishedAt" type="date" th:field="*{publishedAt}"
                 class="krds-input"/>
          <p class="mt-1 text-body-xs text-fg-subtle">비워두면 작성 일자가 노출됩니다.</p>
        </div>
      </fieldset>

      <div class="flex items-center gap-6 flex-wrap text-body-sm">
        <label class="inline-flex items-center gap-2">
          <input type="checkbox" name="secretYn" value="Y"
                 th:checked="${form.secretYn == 'Y'}"
                 class="rounded-small border-line"/>
          <span>🔒 비밀글 (작성자/관리자만 본문 조회)</span>
        </label>
        <label class="inline-flex items-center gap-2"
               sec:authorize="hasAnyRole('STAFF','EMPLOYEE','ADMIN')"
               xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
          <input type="checkbox" name="noticeYn" value="Y"
                 th:checked="${form.noticeYn == 'Y'}"
                 class="rounded-small border-line"/>
          <span>📌 공지 (관리자만)</span>
        </label>
      </div>

      <div class="flex items-center justify-end gap-2 pt-4 border-t border-line">
        <a th:href="${mode == 'edit'}
                     ? @{/bbs/{sc}/{bc}/{aid}(sc=${siteCode}, bc=${bbsCode}, aid=${form.articleId})}
                     : @{/bbs/{sc}/{bc}(sc=${siteCode}, bc=${bbsCode})}"
           class="krds-btn krds-btn-tertiary">취소</a>
        <button type="submit"
                class="krds-btn krds-btn-primary"
                th:text="${mode == 'edit'} ? '저장' : '등록'">등록</button>
      </div>
    </form>

  </section>
</body>
</html>
