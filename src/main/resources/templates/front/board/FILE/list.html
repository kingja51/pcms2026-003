<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{__${layoutPath ?: 'front/layouts/EMPTY/empty'}__}"
      lang="ko">
<head>
  <title th:text="${master.bbsName}">자료실</title>
  <style th:attr="nonce=${cspNonce}">
    /* 구조적 스타일만 유지 — 색은 KRDS CSS 변수 (Design.md §2) */
    .fl-icon {
      flex-shrink: 0;
      width: 48px; height: 64px;
      border-radius: var(--radius-medium) var(--radius-large) var(--radius-medium) var(--radius-medium);
      position: relative;
      display: flex; align-items: flex-end; justify-content: center;
      padding-bottom: 8px;
      color: var(--c-fg-on);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .04em;
      background: var(--c-fg-subtle);
    }
    .fl-icon::before {
      content: "";
      position: absolute; top: 0; right: 0;
      width: 0; height: 0;
      border-left: 12px solid transparent;
      border-bottom: 12px solid var(--c-surface);
    }
    .fl-icon.is-img  { background: var(--brand-40); }
    .fl-icon.is-doc  { background: var(--brand-60); }
  </style>
</head>
<body>
  <section layout:fragment="content">

    <header class="mb-6">
      <h1 class="text-heading-lg text-fg-strong" th:text="${master.bbsName}">자료실</h1>
    </header>

    <!-- 게시판 상단 안내 hero  -->
    <div class="mb-6 flex items-start gap-4 rounded-xlarge border border-line bg-gradient-to-br from-primary-5 to-surface-subtle p-6">
      <div class="flex size-12 shrink-0 items-center justify-center rounded-xlarge bg-primary-50 text-fg-on">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 9.776c.112-.017.227-.026.344-.026h15.812c.117 0 .232.009.344.026m-16.5 0a2.25 2.25 0 00-1.883 2.542l.857 6a2.25 2.25 0 002.227 1.932H19.05a2.25 2.25 0 002.227-1.932l.857-6a2.25 2.25 0 00-1.883-2.542m-16.5 0V6A2.25 2.25 0 016 3.75h3.879a1.5 1.5 0 011.06.44l2.122 2.12a1.5 1.5 0 001.06.44H18A2.25 2.25 0 0120.25 9v.776"/></svg>
      </div>
      <div>
        <h2 class="text-heading-sm text-fg-strong mb-1" th:text="${master.bbsName}">자료실</h2>
        <p class="text-body-sm text-fg-subtle"
           th:if="${master.description != null and !#strings.isEmpty(master.description)}"
           th:text="${master.description}">업무 자료를 다운로드할 수 있는 공간입니다.</p>
        <p class="text-body-sm text-fg-subtle"
           th:if="${master.description == null or #strings.isEmpty(master.description)}">
          업무 자료를 다운로드할 수 있는 공간입니다. 항목을 클릭하면 첨부 파일을 확인하고 다운로드할 수 있습니다.
        </p>
      </div>
    </div>

    <div th:if="${message}" role="status" aria-live="polite" class="krds-alert krds-alert-success mb-4">
      <span class="text-success-icon font-bold shrink-0" aria-hidden="true">✓</span>
      <p th:text="${message}"></p>
    </div>
    <div th:if="${error}" role="alert" aria-live="polite" class="krds-alert krds-alert-danger mb-4">
      <span class="text-danger-icon font-bold shrink-0" aria-hidden="true">✕</span>
      <p th:text="${error}"></p>
    </div>

    <!-- 카테고리 -->
    <nav th:if="${categories != null and !#lists.isEmpty(categories)}"
         aria-label="카테고리" class="mb-4 flex items-center gap-2 flex-wrap">
      <a th:href="@{/bbs/{sc}/{bc}(sc=${siteCode}, bc=${bbsCode})}"
         th:classappend="${search?.categoryId == null or search?.categoryId == ''} ? ' border-primary-50 text-primary-50 bg-primary-5 font-bold' : ' border-line text-fg-subtle hover:bg-surface-subtle'"
         class="krds-tag">전체</a>
      <a th:each="c : ${categories}"
         th:href="@{/bbs/{sc}/{bc}(sc=${siteCode}, bc=${bbsCode}, categoryId=${c.categoryId})}"
         th:classappend="${search?.categoryId == c.categoryId} ? ' border-primary-50 text-primary-50 bg-primary-5 font-bold' : ' border-line text-fg-subtle hover:bg-surface-subtle'"
         class="krds-tag"
         th:text="${c.categoryName}">분류</a>
    </nav>

    <!-- 검색 -->
    <form th:action="@{/bbs/{sc}/{bc}(sc=${siteCode}, bc=${bbsCode})}" method="get"
          role="search" aria-label="자료 검색"
          class="program-search">
      <input type="hidden" name="categoryId" th:value="${search?.categoryId}"/>
      <div class="program-search__field program-search__field--grow">
        <label for="keyword" class="program-search__label">검색어</label>
        <input id="keyword" name="keyword" type="text"
               th:value="${search?.keyword}" maxlength="100"
               placeholder="자료명 또는 등록자로 검색"
               class="krds-input"/>
      </div>
      <div class="program-search__field">
        <label for="searchType" class="program-search__label">구분</label>
        <select id="searchType" name="searchType" class="krds-input">
          <option value=""        th:selected="${search?.searchType == null or search?.searchType == ''}">전체</option>
          <option value="TITLE"   th:selected="${search?.searchType == 'TITLE'}">자료명</option>
          <option value="WRITER"  th:selected="${search?.searchType == 'WRITER'}">등록자</option>
        </select>
      </div>
      <div class="program-search__actions">
        <button type="submit" class="krds-btn krds-btn-primary">검색</button>
        <a th:href="@{/bbs/{sc}/{bc}(sc=${siteCode}, bc=${bbsCode})}"
           class="krds-btn krds-btn-tertiary">초기화</a>
      </div>
    </form>

    <!-- 합계 + 글쓰기 -->
    <div class="flex items-center justify-between mb-2 mt-4">
      <p class="text-body-sm text-fg">
        총 <strong class="text-primary-50 font-bold" th:text="${page.totalElements}">0</strong>건의 자료
      </p>
      <a th:if="${canWrite}"
         th:href="@{/bbs/{sc}/{bc}/write(sc=${siteCode}, bc=${bbsCode})}"
         class="krds-btn krds-btn-primary">+ 자료 등록</a>
    </div>

    <!-- 자료 목록 (Design.md §8 표 규격) -->
    <div class="overflow-x-auto rounded-large border border-line">
      <table class="w-full border-collapse">
        <thead class="bg-surface-subtle">
          <tr>
            <th scope="col" class="text-left text-label-sm font-bold text-fg-subtle px-3 py-2.5 border-b border-line">자료</th>
            <th scope="col" class="text-left text-label-sm font-bold text-fg-subtle px-3 py-2.5 border-b border-line whitespace-nowrap">등록자</th>
            <th scope="col" class="text-left text-label-sm font-bold text-fg-subtle px-3 py-2.5 border-b border-line whitespace-nowrap">등록일</th>
            <th scope="col" class="text-right text-label-sm font-bold text-fg-subtle px-3 py-2.5 border-b border-line whitespace-nowrap">조회</th>
            <th scope="col" class="text-left text-label-sm font-bold text-fg-subtle px-3 py-2.5 border-b border-line"><span class="sr-only">상세</span></th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="row : ${page.content}" class="hover:bg-surface-subtle"
              th:with="
                isNew=${row.createdAt != null and #temporals.createNow().minusDays(7).isBefore(row.createdAt)}">
            <td class="text-body-sm text-fg px-3 py-2.5 border-b border-divider">
              <div class="flex items-start gap-4">
                <!-- 파일 타입 아이콘 -->
                <div class="fl-icon"
                     th:classappend="${row.coverFileId != null and !#strings.isEmpty(row.coverFileId)} ? ' is-img' : ' is-doc'"
                     th:text="${row.coverFileId != null and !#strings.isEmpty(row.coverFileId)} ? 'IMG' : 'DOC'">DOC</div>
                <div class="min-w-0 flex flex-col gap-1">
                  <div class="flex items-center gap-1.5 flex-wrap">
                    <span th:if="${row.noticeYn == 'Y'}" class="krds-badge bg-danger-surface text-danger-fg">공지</span>
                    <span th:if="${row.secretYn == 'Y'}" class="krds-badge bg-surface-subtle text-fg-subtle">🔒</span>
                    <span th:if="${isNew}" class="krds-badge bg-warning-surface text-warning-fg">NEW</span>
                    <span th:if="${row.categoryName != null and !#strings.isEmpty(row.categoryName)}"
                          class="krds-badge bg-primary-5 text-primary-50" th:text="${row.categoryName}">분류</span>
                  </div>
                  <a th:href="@{/bbs/{sc}/{bc}/{aid}(sc=${siteCode}, bc=${bbsCode}, aid=${row.articleId})}"
                     class="text-body-md font-bold text-fg-strong hover:text-primary-50 line-clamp-2" th:text="${row.title}">자료명</a>
                  <p th:if="${row.content != null and !#strings.isEmpty(row.content)}"
                     class="text-body-xs text-fg-subtle line-clamp-1"
                     th:text="${#strings.abbreviate(#strings.replace(#strings.replace(row.content, '<br>', ' '), '\n', ' '), 120)}">설명</p>
                </div>
              </div>
            </td>
            <td class="text-body-sm text-fg px-3 py-2.5 border-b border-divider whitespace-nowrap" th:text="${row.writerName}">등록자</td>
            <td class="text-body-sm text-fg px-3 py-2.5 border-b border-divider whitespace-nowrap" th:text="${@fmt.d(row.createdAt)}">2026-04-27</td>
            <td class="text-body-sm text-fg px-3 py-2.5 border-b border-divider whitespace-nowrap text-right tabular-nums" th:text="${row.viewCount}">0</td>
            <td class="text-body-sm text-fg px-3 py-2.5 border-b border-divider whitespace-nowrap">
              <a th:href="@{/bbs/{sc}/{bc}/{aid}(sc=${siteCode}, bc=${bbsCode}, aid=${row.articleId})}"
                 class="krds-btn krds-btn-sm krds-btn-primary">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3"/></svg>
                상세
              </a>
            </td>
          </tr>

          <tr th:if="${#lists.isEmpty(page.content)}">
            <td colspan="5" class="py-16 text-center text-body-sm text-fg-subtle">아직 등록된 자료가 없습니다.</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- 페이지 네비 -->
    <nav aria-label="페이지" th:if="${page.totalPages > 1}" class="mt-8">
      <ul class="flex items-center justify-center gap-1 text-body-sm">
        <li th:each="p : ${#numbers.sequence(1, page.totalPages)}">
          <a th:href="@{/bbs/{sc}/{bc}(sc=${siteCode}, bc=${bbsCode},
                       page=${p}, pageSize=${page.pageSize},
                       categoryId=${search?.categoryId},
                       keyword=${search?.keyword}, searchType=${search?.searchType})}"
             th:text="${p}"
             th:attr="aria-current=${p == page.page} ? 'page' : null"
             th:class="${p == page.page}
                       ? 'inline-flex items-center justify-center size-10 rounded-medium bg-primary-50 text-white'
                       : 'inline-flex items-center justify-center size-10 rounded-medium border border-line bg-surface text-fg hover:bg-surface-subtle'">1</a>
        </li>
      </ul>
    </nav>

  </section>
</body>
</html>
