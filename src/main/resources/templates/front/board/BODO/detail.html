<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{__${layoutPath ?: 'front/layouts/EMPTY/empty'}__}"
      lang="ko">
<head>
  <title th:text="${article.title} + ' — ' + ${master.bbsName}">보도자료</title>
  <style th:attr="nonce=${cspNonce}">
    /* 구조적 스타일만 유지 — 색은 KRDS CSS 변수 (Design.md §2) */
    .bd-lightbox {
      position: fixed; inset: 0;
      background: var(--c-dim);
      display: none;
      align-items: center; justify-content: center;
      z-index: 1000;
    }
    .bd-lightbox.is-open { display: flex; }
    .bd-lightbox__img { max-width: 92vw; max-height: 86vh; object-fit: contain; border-radius: var(--radius-medium); }
    .bd-lightbox__close,
    .bd-lightbox__nav {
      position: absolute;
      background: color-mix(in srgb, var(--c-fg-on) 12%, transparent);
      color: var(--c-fg-on);
      border: 0;
      cursor: pointer;
      transition: background .15s;
    }
    .bd-lightbox__close:hover,
    .bd-lightbox__nav:hover { background: color-mix(in srgb, var(--c-fg-on) 22%, transparent); }
    .bd-lightbox__close {
      top: 16px; right: 16px;
      width: 40px; height: 40px;
      border-radius: var(--radius-medium);
      font-size: 22px;
      display: flex; align-items: center; justify-content: center;
    }
    .bd-lightbox__nav {
      top: 50%; transform: translateY(-50%);
      width: 48px; height: 64px;
      border-radius: var(--radius-large);
      font-size: 24px;
      display: flex; align-items: center; justify-content: center;
    }
    .bd-lightbox__nav--prev { left: 20px; }
    .bd-lightbox__nav--next { right: 20px; }
    .bd-lightbox__counter {
      position: absolute;
      bottom: 20px; left: 50%; transform: translateX(-50%);
      color: color-mix(in srgb, var(--c-fg-on) 85%, transparent);
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      background: color-mix(in srgb, var(--c-fg-strong) 60%, transparent);
      padding: 4px 12px;
      border-radius: var(--radius-small);
    }
  </style>
</head>
<body>
  <section layout:fragment="content" 
           th:with="canManage=${master.bbsMasterId == article.bbsMasterId}">

      <a th:href="@{/bbs/{sc}/{bc}(sc=${siteCode}, bc=${bbsCode})}"
         class="text-body-sm text-fg-subtle hover:underline"
         th:text="${master.bbsName}">보도자료</a>
      <span class="text-body-sm text-fg">상세</span>

    <div th:if="${message}" role="status" aria-live="polite"
         class="krds-alert krds-alert-success mb-4">
      <span class="text-success-icon font-bold shrink-0" aria-hidden="true">✓</span>
      <p th:text="${message}">완료되었습니다.</p>
    </div>
    <div th:if="${error}" role="alert" aria-live="polite"
         class="krds-alert krds-alert-danger mb-4">
      <span class="text-danger-icon font-bold shrink-0" aria-hidden="true">✕</span>
      <p th:text="${error}">오류가 발생했습니다.</p>
    </div>

    <!-- 비밀글 차단 -->
    <div th:unless="${canSeeBody}"
         class="bg-surface-subtle border border-line rounded-large p-12 text-center mb-8">
      <p class="text-heading-md text-fg-subtle mb-2">🔒</p>
      <p class="text-fg-subtle">비밀글입니다. 작성자 또는 관리자만 본문을 볼 수 있습니다.</p>
    </div>

    <th:block th:if="${canSeeBody}">

      <!-- 헤더 -->
      <header class="border-t-2 border-line-strong border-b border-line pt-5 pb-4">
        <div class="flex items-center gap-2 flex-wrap">
          <span th:if="${article.noticeYn == 'Y'}" class="krds-badge bg-danger-surface text-danger-fg">공지</span>
          <span th:if="${article.secretYn == 'Y'}" class="krds-badge bg-surface-subtle text-fg-subtle">🔒 비밀</span>
          <span th:if="${article.categoryName != null and !#strings.isEmpty(article.categoryName)}"
                class="krds-badge bg-primary-5 text-primary-50" th:text="${article.categoryName}">카테고리</span>
        </div>
        <h1 class="text-heading-md font-bold text-fg-strong leading-normal mt-1.5 mb-2.5"
            th:text="${article.title}">보도자료 제목</h1>
        <div class="flex items-center gap-4 flex-wrap text-body-xs text-fg-subtle pt-2.5 border-t border-divider">
          <span title="작성자" class="inline-flex items-center gap-1">
            <svg xmlns="http://www.w3.org/2000/svg" class="size-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/></svg>
            <span th:text="${article.writerName}">작성자</span>
          </span>
          <span title="언론사" class="inline-flex items-center gap-1"
                th:if="${article.pressName != null and !#strings.isEmpty(article.pressName)}">
            <svg xmlns="http://www.w3.org/2000/svg" class="size-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7"><path stroke-linecap="round" stroke-linejoin="round" d="M12 7.5h1.5m-1.5 3h1.5m-7.5 3h7.5m-7.5 3h7.5m3-9h3.375c.621 0 1.125.504 1.125 1.125V18a2.25 2.25 0 01-2.25 2.25M16.5 7.5V18a2.25 2.25 0 002.25 2.25M16.5 7.5V4.875c0-.621-.504-1.125-1.125-1.125H4.125C3.504 3.75 3 4.254 3 4.875V18a2.25 2.25 0 002.25 2.25h13.5"/></svg>
            <span class="font-bold text-fg" th:text="${article.pressName}">언론사명</span>
          </span>
          <span title="게시일" class="inline-flex items-center gap-1">
            <svg xmlns="http://www.w3.org/2000/svg" class="size-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7"><path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5"/></svg>
            <span th:text="${article.publishedAt != null ? #temporals.format(article.publishedAt, 'yyyy-MM-dd') : @fmt.dt(article.createdAt)}">2026-04-27</span>
          </span>
          <span title="조회" class="inline-flex items-center gap-1">
            <svg xmlns="http://www.w3.org/2000/svg" class="size-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5s8.577 3.01 9.964 7.183c.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5s-8.577-3.01-9.964-7.178z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            <span th:text="${article.viewCount}">0</span>
          </span>
        </div>
      </header>

      <!-- 이미지 첨부 — 본문보다 먼저, 한 장씩 본문 폭 꽉 차게 세로 스택 (NOTICE 와 동일).
           원본 사용(썸네일 400px 는 화질 열화)·원본 비율 유지(크롭 없음). 클릭 시 라이트박스. -->
      <th:block th:if="${master.fileYn == 'Y' and not #lists.isEmpty(existingFiles)}"
                th:with="imageFiles=${existingFiles.?[isImage()]}">
        <section th:if="${not #lists.isEmpty(imageFiles)}">
          <div id="bdPhotos" class="my-6 flex flex-col gap-4">
            <img th:each="f, st : ${imageFiles}"
                 th:src="@{/fileDown/{fid}(fid=${f.fileId})}"
                 th:data-fp-full="@{/fileDown/{fid}(fid=${f.fileId})}"
                 th:data-fp-caption="${f.originalName}"
                 th:alt="${f.originalName}"
                 class="w-full h-auto rounded-large cursor-zoom-in"
                 th:attr="loading=${st.index == 0 ? 'eager' : 'lazy'}"/>
          </div>
        </section>
      </th:block>

      <!-- 본문 -->
      <article class="py-4 text-body-md leading-[1.85] text-fg whitespace-pre-wrap break-keep
                      [&_img]:max-w-full [&_img]:h-auto [&_img]:my-4 [&_img]:rounded-medium"><th:block
          th:replace="~{fragments/bbs-content :: render(content=${article.content}, htmlYn=${master.htmlYn})}"></th:block></article>

      <!-- 외부 기사 원문 링크 -->
      <div th:if="${article.linkUrl != null and !#strings.isEmpty(article.linkUrl)}"
           class="mt-3 mb-1">
        <a th:href="${article.linkUrl}" target="_blank" rel="noopener noreferrer ugc"
           class="krds-btn krds-btn-tertiary gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="size-4"
               fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M13.19 8.688a4.5 4.5 0 011.242 7.244l-4.5 4.5a4.5 4.5 0 01-6.364-6.364l1.757-1.757m13.35-.622l1.757-1.757a4.5 4.5 0 00-6.364-6.364l-4.5 4.5a4.5 4.5 0 001.242 7.244"/>
          </svg>
          <span>원문 보기</span>
          <span class="text-body-xs text-fg-subtle truncate max-w-[260px]"
                th:text="${article.linkUrl}">https://...</span>
        </a>
      </div>

      <!-- 첨부파일 다운로드 (이미지 포함 전체) — 공용 조각(공지 포맷 표준) -->
      <th:block th:replace="~{fragments/bbs-attachments :: box(files=${existingFiles})}"/>

      <!-- 좋아요 / 신고 -->
      <div class="flex items-center justify-end mt-6 mb-2">
        <th:block th:replace="~{fragments/bbs-like-report :: actions(
            type='ARTICLE',
            id=${article.articleId},
            likeCount=${article.likeCount},
            liked=${articleLikedByMe})}"/>
      </div>

    </th:block>

    <!-- 액션 바 -->
    <!-- 이전글/다음글 -->
    <th:block th:replace="~{fragments/bbs-prev-next :: nav(prev=${prevArticle}, next=${nextArticle})}"/>

    <div class="flex items-center justify-between gap-2 pt-6 mt-6 border-t border-line">
      <a th:href="@{/bbs/{sc}/{bc}(sc=${siteCode}, bc=${bbsCode})}"
         class="krds-btn krds-btn-tertiary">목록</a>
      <div class="flex items-center gap-2" th:if="${canManage and (canEdit or canDelete)}">
        <a th:if="${canEdit}"
           th:href="@{/bbs/{sc}/{bc}/{aid}/edit(sc=${siteCode}, bc=${bbsCode}, aid=${article.articleId})}"
           class="krds-btn krds-btn-primary">수정</a>
        <form th:if="${canDelete}"
              th:action="@{/bbs/{sc}/{bc}/{aid}/delete(sc=${siteCode}, bc=${bbsCode}, aid=${article.articleId})}"
              method="post"
              data-confirm="모든 데이타가 삭제 됩니다. 삭제 하시겠습니까?"
              class="inline">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button type="submit"
                  class="krds-btn bg-danger-50 text-white hover:bg-danger-60">삭제</button>
        </form>
      </div>
    </div>

    <!-- 댓글 -->
    <section th:if="${canSeeBody and master.commentYn == 'Y'}"
             xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
             class="mt-10 pt-6 border-t border-line" id="comments">
      <h2 class="text-heading-xs font-bold text-fg-strong mb-4">
        댓글 <span class="text-fg-subtle" th:text="'(' + ${article.commentCount} + ')'">(0)</span>
      </h2>

      <div th:if="${commentError}" role="alert"
           class="krds-alert krds-alert-danger mb-3">
        <span class="text-danger-icon font-bold shrink-0" aria-hidden="true">✕</span>
        <p th:text="${commentError}">오류</p>
      </div>

      <ul th:if="${not #lists.isEmpty(comments)}" class="space-y-3 mb-6">
        <li th:each="cm : ${comments}"
            th:class="${cm.parentCommentId != null}
                      ? 'pl-8 border-l-2 border-divider'
                      : ''"
            class="bg-surface">
          <div class="flex items-start justify-between gap-3">
            <div class="flex-1 min-w-0">
              <div class="text-body-xs text-fg-subtle mb-1">
                <strong class="text-fg" th:text="${cm.writerName}">작성자</strong>
                <span class="mx-1">·</span>
                <span th:text="${@fmt.dt(cm.createdAt)}">-</span>
                <span th:if="${cm.status == 'HIDDEN'}"
                      class="ml-1 krds-badge bg-surface-subtler text-fg">숨김</span>
                <span th:if="${cm.status == 'REPORTED'}"
                      class="ml-1 krds-badge bg-warning-surface text-warning-fg">신고됨</span>
                <span th:if="${cm.secretYn == 'Y'}"
                      class="ml-1 krds-badge bg-warning-surface text-warning-fg">🔒 비밀</span>
              </div>
              <p th:if="${cm.status == 'PUBLISHED'}"
                 class="text-body-sm whitespace-pre-wrap"
                 th:classappend="${cm.secretYn == 'Y' and #strings.startsWith(cm.content, '🔒')} ? ' text-fg-disabled italic' : ' text-fg'"
                 th:text="${cm.content}">내용</p>
              <p th:unless="${cm.status == 'PUBLISHED'}"
                 class="text-body-sm text-fg-disabled italic">관리자에 의해 가려진 댓글입니다.</p>
              <th:block th:replace="~{fragments/bbs-like-report :: commentActions(cm=${cm}, commentLikedIds=${commentLikedIds})}"/>
            </div>
            <div class="flex items-start gap-1 shrink-0"
                 th:with="
                   isCommentOwner=${#authentication != null
                                     and #authentication.principal instanceof T(com.gonet.primary.system.login.dto.CustomUserDetails)
                                     and #authentication.principal.userId != null
                                     and (#authentication.principal.userId == cm.writerUserId
                                       or #authentication.principal.userId == cm.createdBy)},
                   isAdminUser=${#authentication != null
                                  and #authentication.principal instanceof T(com.gonet.primary.system.login.dto.CustomUserDetails)
                                  and #authentication.principal.userType == 'ADMIN'},
                   canEditComment=${isCommentOwner},
                   canDeleteComment=${isCommentOwner or isAdminUser}">
              <details th:if="${cm.parentCommentId == null and #authentication.authenticated}"
                       class="relative">
                <summary class="list-none px-2 py-1 rounded-medium text-body-xs text-fg-subtle hover:bg-surface-subtle cursor-pointer">↩ 답글</summary>
                <form th:action="@{/bbs/{sc}/{bc}/{aid}/comments(sc=${siteCode}, bc=${bbsCode}, aid=${article.articleId})}"
                      method="post"
                      class="absolute right-0 mt-1 p-3 w-80 bg-surface border border-line rounded-medium shadow-e3 z-10">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                  <input type="hidden" name="parentCommentId" th:value="${cm.commentId}"/>
                  <textarea name="content" required rows="3" maxlength="4000"
                            placeholder="답글 입력"
                            class="krds-input text-body-sm"></textarea>
                  <label class="mt-2 inline-flex items-center gap-1.5 text-body-xs text-fg">
                    <input type="checkbox" name="secretYn" value="Y"
                           class="rounded-small border-line"/>
                    🔒 비밀 답글
                  </label>
                  <button type="submit"
                          class="mt-2 w-full krds-btn krds-btn-primary krds-btn-sm">답글 등록</button>
                </form>
              </details>
              <details th:if="${canManage and (canEditComment or canDeleteComment)}"
                       class="relative">
                <summary class="list-none px-2 py-1 rounded-medium text-body-xs text-fg-subtle hover:bg-surface-subtle cursor-pointer">⋯</summary>
                <div class="absolute right-0 mt-1 p-2 w-48 bg-surface border border-line rounded-medium shadow-e3 z-10 space-y-1">
                  <details th:if="${canEditComment}" class="block">
                    <summary class="list-none w-full px-2 py-1 text-body-xs text-fg hover:bg-surface-subtle rounded-medium cursor-pointer">수정</summary>
                    <form th:action="@{/bbs/{sc}/{bc}/{aid}/comments/{cid}(sc=${siteCode}, bc=${bbsCode}, aid=${article.articleId}, cid=${cm.commentId})}"
                          method="post" class="mt-2">
                      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                      <textarea name="content" required rows="3" maxlength="4000"
                                th:text="${cm.content}"
                                class="krds-input text-body-xs"></textarea>
                      <label class="mt-2 inline-flex items-center gap-1.5 text-body-xs text-fg">
                        <input type="checkbox" name="secretYn" value="Y"
                               th:checked="${cm.secretYn == 'Y'}"
                               class="rounded-small border-line"/>
                        🔒 비밀 댓글
                      </label>
                      <button type="submit"
                              class="mt-2 w-full krds-btn krds-btn-primary krds-btn-sm">저장</button>
                    </form>
                  </details>
                  <form th:if="${canDeleteComment}"
                        th:action="@{/bbs/{sc}/{bc}/{aid}/comments/{cid}/delete(sc=${siteCode}, bc=${bbsCode}, aid=${article.articleId}, cid=${cm.commentId})}"
                        method="post"
                        data-confirm="모든 데이타가 삭제 됩니다. 삭제 하시겠습니까?">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit"
                            class="block w-full text-left px-2 py-1 text-body-xs text-danger-fg hover:bg-danger-surface rounded-medium">삭제</button>
                  </form>
                </div>
              </details>
            </div>
          </div>
        </li>
      </ul>
      <p th:if="${#lists.isEmpty(comments)}"
         class="text-body-sm text-fg-subtle mb-4">첫 번째 댓글을 남겨보세요.</p>

      <form sec:authorize="isAuthenticated()"
            th:action="@{/bbs/{sc}/{bc}/{aid}/comments(sc=${siteCode}, bc=${bbsCode}, aid=${article.articleId})}"
            method="post" th:object="${commentForm}"
            class="bg-surface-subtle border border-line rounded-large p-3">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <textarea th:field="*{content}" required rows="3" maxlength="4000"
                  placeholder="댓글을 입력하세요"
                  class="krds-input text-body-sm"></textarea>
        <div class="mt-2 flex items-center justify-between gap-3">
          <label class="inline-flex items-center gap-1.5 text-body-sm text-fg">
            <input type="checkbox" name="secretYn" value="Y"
                   th:checked="${commentForm.secretYn == 'Y'}"
                   class="rounded-small border-line"/>
            🔒 비밀 댓글 (작성자 · 글 주인 · 관리자만 본문 조회)
          </label>
          <button type="submit" class="krds-btn krds-btn-primary krds-btn-sm">댓글 등록</button>
        </div>
      </form>
      <div sec:authorize="!isAuthenticated()"
           class="bg-surface-subtle border border-line rounded-large p-4 text-center text-body-sm text-fg-subtle">
        <a th:href="@{/member/login}" class="krds-link">로그인</a>
        후 댓글 작성이 가능합니다.
      </div>
    </section>

    <!-- 라이트박스 -->
    <div id="bdLightbox" class="bd-lightbox" role="dialog" aria-modal="true" aria-hidden="true">
      <button type="button" class="bd-lightbox__close" aria-label="닫기">×</button>
      <button type="button" class="bd-lightbox__nav bd-lightbox__nav--prev" aria-label="이전">‹</button>
      <img class="bd-lightbox__img" src="" alt=""/>
      <button type="button" class="bd-lightbox__nav bd-lightbox__nav--next" aria-label="다음">›</button>
      <div class="bd-lightbox__counter"><span id="bdCounter">1 / 1</span></div>
    </div>

    <script th:src="@{/js/bbs-like-report.js}" th:attr="nonce=${cspNonce}" defer></script>
    <script th:src="@{/js/bbs-photo-lightbox.js}" th:attr="nonce=${cspNonce}" defer></script>

  </section>
</body>
</html>
