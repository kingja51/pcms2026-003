<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{__${layoutPath ?: 'front/layouts/EMPTY/empty'}__}"
      lang="ko">
<head>
  <title th:text="${master.bbsName}">보도자료</title>
</head>
<body>
  <section layout:fragment="content">

    <header class="mb-6">
      <h1 class="text-heading-lg font-bold text-fg-strong" th:text="${master.bbsName}">보도자료</h1>
    </header>

    <!-- 게시판 상단 안내 hero  -->

    <th:block th:if="${master.description != null and !#strings.isEmpty(master.description)}">
      <div class="mb-6 rounded-xlarge border border-line bg-surface-subtle p-6">
        <h2 class="text-heading-sm font-bold text-fg-strong mb-1.5" th:text="${master.bbsName}">보도자료</h2>
        <div class="text-body-sm text-fg-subtle" th:utext="${master.description}"></div>
      </div>
    </th:block>

    <div th:if="${message}" role="status" aria-live="polite"
         class="krds-alert krds-alert-success mb-4">
      <span class="text-success-icon font-bold shrink-0" aria-hidden="true">✓</span>
      <p th:text="${message}">완료되었습니다.</p>
    </div>
    <div th:if="${error}" role="alert" aria-live="polite"
         class="krds-alert krds-alert-danger mb-4">
      <span class="text-danger-icon font-bold shrink-0" aria-hidden="true">✕</span>
      <p th:text="${error}">오류가 발생했습니다.</p>
    </div>

    <!-- 카테고리 -->
    <nav th:if="${categories != null and !#lists.isEmpty(categories)}"
         aria-label="카테고리" class="mb-4 flex items-center gap-2 flex-wrap">
      <a th:href="@{/bbs/{sc}/{bc}(sc=${siteCode}, bc=${bbsCode})}"
         th:classappend="${search?.categoryId == null or search?.categoryId == ''} ? ' border-primary-50 text-primary-50 bg-primary-5 font-bold' : ' border-line text-fg-subtle hover:bg-surface-subtle'"
         class="krds-tag">전체</a>
      <a th:each="c : ${categories}"
         th:href="@{/bbs/{sc}/{bc}(sc=${siteCode}, bc=${bbsCode}, categoryId=${c.categoryId})}"
         th:classappend="${search?.categoryId == c.categoryId} ? ' border-primary-50 text-primary-50 bg-primary-5 font-bold' : ' border-line text-fg-subtle hover:bg-surface-subtle'"
         class="krds-tag"
         th:text="${c.categoryName}">분류</a>
    </nav>

    <!-- 검색 -->
    <form th:action="@{/bbs/{sc}/{bc}(sc=${siteCode}, bc=${bbsCode})}" method="get"
          role="search" aria-label="보도자료 검색"
          class="program-search">
      <input type="hidden" name="categoryId" th:value="${search?.categoryId}"/>
      <div class="program-search__field program-search__field--grow">
        <label for="keyword" class="program-search__label">검색어</label>
        <input id="keyword" name="keyword" type="text"
               th:value="${search?.keyword}" maxlength="100"
               placeholder="검색어를 입력해 주세요"
               class="krds-input"/>
      </div>
      <div class="program-search__field">
        <label for="searchType" class="program-search__label">구분</label>
        <select id="searchType" name="searchType" class="krds-input">
          <option value=""        th:selected="${search?.searchType == null or search?.searchType == ''}">전체</option>
          <option value="TITLE"   th:selected="${search?.searchType == 'TITLE'}">제목</option>
          <option value="WRITER"  th:selected="${search?.searchType == 'WRITER'}">작성자</option>
        </select>
      </div>
      <div class="program-search__actions">
        <button type="submit" class="krds-btn krds-btn-primary">검색</button>
        <a th:href="@{/bbs/{sc}/{bc}(sc=${siteCode}, bc=${bbsCode})}"
           class="krds-btn krds-btn-tertiary">초기화</a>
      </div>
    </form>

    <!-- 합계 + 글쓰기 -->
    <div class="flex items-center justify-between mb-2 mt-6">
      <p class="text-body-sm text-fg">
        총 게시물 <strong class="text-primary-60" th:text="${page.totalElements}">0</strong>,
        페이지 <strong class="text-primary-60" th:text="${page.page}">1</strong> / <span th:text="${page.totalPages}">1</span>
      </p>
      <a th:if="${canWrite}"
         th:href="@{/bbs/{sc}/{bc}/write(sc=${siteCode}, bc=${bbsCode})}"
         class="krds-btn krds-btn-primary">+ 글쓰기</a>
    </div>

    <!-- 보도자료 row 목록 -->
    <div class="border-t-2 border-line-strong">

      <th:block th:each="row : ${page.content}">
        <article class="flex gap-6 py-6 border-b border-line transition-colors hover:bg-surface-subtle">
          <div class="flex-1 min-w-0 flex flex-col gap-2">
            <div class="flex items-center gap-2 flex-wrap">
              <span th:if="${row.noticeYn == 'Y'}" class="krds-badge bg-danger-surface text-danger-fg">공지</span>
              <span th:if="${row.secretYn == 'Y'}" class="krds-badge bg-surface-subtle text-fg-subtle">🔒 비밀</span>
              <span th:if="${row.categoryName != null and !#strings.isEmpty(row.categoryName)}"
                    class="krds-badge bg-primary-5 text-primary-50" th:text="${row.categoryName}">카테고리</span>
              <span th:if="${row.pressName != null and !#strings.isEmpty(row.pressName)}"
                    class="krds-badge bg-info-surface text-info-fg" th:text="'📰 ' + ${row.pressName}">언론사</span>
            </div>

            <a th:href="@{/bbs/{sc}/{bc}/{aid}(sc=${siteCode}, bc=${bbsCode}, aid=${row.articleId})}"
               class="text-body-lg font-bold text-fg-strong leading-normal line-clamp-2 hover:text-primary-60"
               th:text="${row.title}">제목</a>

            <p th:if="${row.content != null and !#strings.isEmpty(row.content)}"
               class="text-body-sm text-fg-subtle line-clamp-2"
               th:text="${#strings.abbreviate(#strings.replace(#strings.replace(row.content, '<br>', ' '), '\n', ' '), 180)}">
              본문 미리보기
            </p>

            <div class="mt-auto flex items-center gap-4 flex-wrap text-body-xs text-fg-subtle">
              <span title="작성자" class="inline-flex items-center gap-1">
                <svg xmlns="http://www.w3.org/2000/svg" class="size-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/></svg>
                <span th:text="${row.writerName}">작성자</span>
              </span>
              <span title="조회" class="inline-flex items-center gap-1">
                <svg xmlns="http://www.w3.org/2000/svg" class="size-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5s8.577 3.01 9.964 7.183c.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5s-8.577-3.01-9.964-7.178z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                <span th:text="${row.viewCount}">0</span>
              </span>
              <span title="게시일" class="inline-flex items-center gap-1">
                <svg xmlns="http://www.w3.org/2000/svg" class="size-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7"><path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5"/></svg>
                <span th:text="${row.publishedAt != null ? #temporals.format(row.publishedAt, 'yyyy-MM-dd') : @fmt.d(row.createdAt)}">2026-04-27</span>
              </span>
              <span title="댓글" th:if="${row.commentCount > 0}" class="inline-flex items-center gap-1">
                <svg xmlns="http://www.w3.org/2000/svg" class="size-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12.76c0 1.6 1.123 2.994 2.707 3.227 1.068.157 2.148.279 3.238.364.466.037.893.281 1.153.671L12 21l2.652-3.978c.26-.39.687-.634 1.153-.67 1.09-.086 2.17-.208 3.238-.365 1.584-.233 2.707-1.626 2.707-3.228V6.741c0-1.602-1.123-2.995-2.707-3.228A48.394 48.394 0 0012 3c-2.392 0-4.744.175-7.043.513C3.373 3.746 2.25 5.14 2.25 6.741v6.018z"/></svg>
                <span th:text="${row.commentCount}">0</span>
              </span>
              <span title="좋아요" th:if="${row.likeCount > 0}" class="inline-flex items-center gap-1">
                <svg xmlns="http://www.w3.org/2000/svg" class="size-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M11.645 20.91l-.007-.003-.022-.012a15.247 15.247 0 01-.383-.218 25.18 25.18 0 01-4.244-3.17C4.688 15.36 2.25 12.174 2.25 8.25 2.25 5.322 4.714 3 7.688 3A5.5 5.5 0 0112 5.052 5.5 5.5 0 0116.313 3c2.973 0 5.437 2.322 5.437 5.25 0 3.925-2.438 7.111-4.739 9.256a25.175 25.175 0 01-4.244 3.17 15.247 15.247 0 01-.383.219l-.022.012-.007.004-.003.001a.752.752 0 01-.704 0l-.003-.001z"/></svg>
                <span th:text="${row.likeCount}">0</span>
              </span>
            </div>
          </div>

          <a th:if="${row.coverFileId != null and !#strings.isEmpty(row.coverFileId)}"
             th:href="@{/bbs/{sc}/{bc}/{aid}(sc=${siteCode}, bc=${bbsCode}, aid=${row.articleId})}"
             data-thumb
             class="block w-40 h-[110px] shrink-0 overflow-hidden rounded-large bg-surface-subtle">
            <img th:src="@{/fileDown/{fid}/thumb(fid=${row.coverFileId})}"
                 th:alt="${row.title}" loading="lazy"
                 data-hide-on-error="[data-thumb]"
                 class="block w-full h-full object-cover"/>
          </a>
        </article>
      </th:block>

      <div th:if="${#lists.isEmpty(page.content)}"
           class="py-16 text-center text-fg-subtle">아직 등록된 보도자료가 없습니다.</div>
    </div>

    <!-- 페이지 네비 -->
    <nav aria-label="페이지" th:if="${page.totalPages > 1}" class="mt-8">
      <ul class="flex items-center justify-center gap-1 text-body-sm">
        <li th:each="p : ${#numbers.sequence(1, page.totalPages)}">
          <a th:href="@{/bbs/{sc}/{bc}(sc=${siteCode}, bc=${bbsCode},
                       page=${p}, pageSize=${page.pageSize},
                       categoryId=${search?.categoryId},
                       keyword=${search?.keyword}, searchType=${search?.searchType})}"
             th:text="${p}"
             th:class="${p == page.page}
                       ? 'inline-flex items-center justify-center size-10 rounded-medium bg-primary-50 text-white'
                       : 'inline-flex items-center justify-center size-10 rounded-medium border border-line bg-surface text-fg hover:bg-surface-subtle'">1</a>
        </li>
      </ul>
    </nav>

  </section>
</body>
</html>
