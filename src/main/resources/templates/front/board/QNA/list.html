<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{__${layoutPath ?: 'front/layouts/EMPTY/empty'}__}"
      lang="ko">
<head>
  <title th:text="${master.bbsName}">Q&amp;A</title>
</head>
<body>
  <section layout:fragment="content">

    <header class="mb-6">
      <h1 class="text-heading-lg font-bold text-fg-strong" th:text="${master.bbsName}">Q&amp;A</h1>
    </header>

    <!-- 게시판 상단 안내 hero  -->
    <div class="mb-6 flex items-start gap-4 rounded-xlarge border border-info-border bg-info-surface p-6">
      <div class="flex size-12 shrink-0 items-center justify-center rounded-large bg-info-icon text-heading-sm font-bold text-fg-on" aria-hidden="true">?</div>
      <div>
        <h2 class="mb-1 text-heading-xs font-bold text-fg-strong" th:text="${master.bbsName}">Q&amp;A</h2>
        <p class="text-body-sm text-fg-subtle"
           th:if="${master.description != null and !#strings.isEmpty(master.description)}"
           th:text="${master.description}">궁금한 점을 질문해 주세요. 운영자가 답변드립니다.</p>
        <p class="text-body-sm text-fg-subtle"
           th:if="${master.description == null or #strings.isEmpty(master.description)}">
          궁금한 점을 질문해 주세요. 비밀글로 작성하시면 작성자와 운영자만 본문을 볼 수 있습니다.
        </p>
      </div>
    </div>

    <div th:if="${message}" role="status" aria-live="polite" class="krds-alert krds-alert-success mb-4">
      <span class="shrink-0 font-bold text-success-icon" aria-hidden="true">✓</span>
      <p th:text="${message}"></p>
    </div>
    <div th:if="${error}" role="alert" aria-live="polite" class="krds-alert krds-alert-danger mb-4">
      <span class="shrink-0 font-bold text-danger-icon" aria-hidden="true">✕</span>
      <p th:text="${error}"></p>
    </div>

    <!-- 카테고리 -->
    <nav th:if="${categories != null and !#lists.isEmpty(categories)}"
         aria-label="카테고리" class="mb-4 flex items-center gap-2 flex-wrap">
      <a th:href="@{/bbs/{sc}/{bc}(sc=${siteCode}, bc=${bbsCode})}"
         th:classappend="${search?.categoryId == null or search?.categoryId == ''} ? ' border-primary-50 text-primary-50 bg-primary-5 font-bold' : ' border-line text-fg-subtle hover:bg-surface-subtle'"
         class="krds-tag">전체</a>
      <a th:each="c : ${categories}"
         th:href="@{/bbs/{sc}/{bc}(sc=${siteCode}, bc=${bbsCode}, categoryId=${c.categoryId})}"
         th:classappend="${search?.categoryId == c.categoryId} ? ' border-primary-50 text-primary-50 bg-primary-5 font-bold' : ' border-line text-fg-subtle hover:bg-surface-subtle'"
         class="krds-tag"
         th:text="${c.categoryName}">분류</a>
    </nav>

    <!-- 검색 -->
    <form th:action="@{/bbs/{sc}/{bc}(sc=${siteCode}, bc=${bbsCode})}" method="get"
          role="search" aria-label="질문 검색"
          class="program-search">
      <input type="hidden" name="categoryId" th:value="${search?.categoryId}"/>
      <div class="program-search__field program-search__field--grow">
        <label for="keyword" class="program-search__label">검색어</label>
        <input id="keyword" name="keyword" type="text"
               th:value="${search?.keyword}" maxlength="100"
               placeholder="질문 제목 또는 작성자로 검색"
               class="krds-input"/>
      </div>
      <div class="program-search__field">
        <label for="searchType" class="program-search__label">구분</label>
        <select id="searchType" name="searchType" class="krds-input">
          <option value=""        th:selected="${search?.searchType == null or search?.searchType == ''}">전체</option>
          <option value="TITLE"   th:selected="${search?.searchType == 'TITLE'}">제목</option>
          <option value="WRITER"  th:selected="${search?.searchType == 'WRITER'}">작성자</option>
        </select>
      </div>
      <div class="program-search__actions">
        <button type="submit" class="krds-btn krds-btn-primary">검색</button>
        <a th:href="@{/bbs/{sc}/{bc}(sc=${siteCode}, bc=${bbsCode})}"
           class="krds-btn krds-btn-tertiary">초기화</a>
      </div>
    </form>

    <!-- 합계 + 글쓰기 -->
    <div class="flex items-center justify-between mb-2 mt-4">
      <p class="text-body-sm text-fg">
        총 <strong class="font-bold text-primary-60" th:text="${page.totalElements}">0</strong>건의 질문
      </p>
      <a th:href="@{/bbs/{sc}/{bc}/write(sc=${siteCode}, bc=${bbsCode})}"
         class="krds-btn krds-btn-primary">+ 질문 등록</a>
    </div>

    <!-- 질문 목록 -->
    <div class="border-t-2 border-line-strong bg-surface rounded-b-large">
      <th:block th:each="row : ${page.content}">
        <article th:class="${row.secretYn == 'Y'}
                           ? 'flex items-start gap-4 px-5 py-4 border-b border-line bg-surface-subtle transition-colors'
                           : 'flex items-start gap-4 px-5 py-4 border-b border-line hover:bg-surface-subtle transition-colors'">

          <div th:class="${row.secretYn == 'Y'}
                         ? 'flex size-10 shrink-0 items-center justify-center rounded-max bg-fg-subtle text-body-md font-bold text-fg-on'
                         : 'flex size-10 shrink-0 items-center justify-center rounded-max bg-primary-50 text-body-md font-bold text-fg-on'"
               aria-hidden="true"
               th:text="${row.secretYn == 'Y'} ? '🔒' : 'Q'">Q</div>

          <div class="flex-1 min-w-0 flex flex-col gap-1">
            <div class="flex items-center gap-1.5 flex-wrap">
              <span th:if="${row.noticeYn == 'Y'}" class="krds-badge bg-danger-surface text-danger-fg">공지</span>
              <span th:if="${row.categoryName != null and !#strings.isEmpty(row.categoryName)}"
                    class="krds-badge bg-primary-5 text-primary-50" th:text="${row.categoryName}">분류</span>
            </div>

            <a th:href="@{/bbs/{sc}/{bc}/{aid}(sc=${siteCode}, bc=${bbsCode}, aid=${row.articleId})}"
               class="text-body-md font-bold text-fg-strong hover:text-primary-60 line-clamp-2" th:text="${row.title}">질문 제목</a>

            <p th:if="${row.secretYn != 'Y' and row.content != null and !#strings.isEmpty(row.content)}"
               class="text-body-xs text-fg-subtle line-clamp-1"
               th:text="${#strings.abbreviate(#strings.replace(#strings.replace(row.content, '<br>', ' '), '\n', ' '), 120)}">질문 내용</p>
            <p th:if="${row.secretYn == 'Y'}" class="text-body-xs text-fg-subtle italic">🔒 비밀글입니다 — 작성자 또는 운영자만 본문을 볼 수 있습니다.</p>

            <div class="mt-0.5 flex flex-wrap gap-3 text-body-xs text-fg-disabled">
              <span title="작성일" class="inline-flex items-center gap-1" th:text="${@fmt.d(row.createdAt)}">2026-04-27</span>
              <span title="조회" class="inline-flex items-center gap-1">👁 <span th:text="${row.viewCount}">0</span></span>
            </div>
          </div>

          <!-- 우측 답변 상태 -->
          <div class="shrink-0 text-center min-w-20">
            <span th:if="${row.commentCount > 0}" class="krds-badge bg-success-surface text-success-fg">
              ✓ 답변완료
            </span>
            <span th:if="${row.commentCount == 0}" class="krds-badge bg-warning-surface text-warning-fg">
              ⏳ 답변대기
            </span>
            <span class="block mt-1 text-body-xs text-fg-subtle" th:if="${row.commentCount > 0}">
              <strong class="text-body-sm font-bold text-fg-strong tabular-nums" th:text="${row.commentCount}">0</strong>개 답변
            </span>
          </div>
        </article>
      </th:block>

      <div th:if="${#lists.isEmpty(page.content)}"
           class="py-16 text-center text-body-sm text-fg-subtle">아직 등록된 질문이 없습니다.</div>
    </div>

    <!-- 페이지 네비 -->
    <nav aria-label="페이지" th:if="${page.totalPages > 1}" class="mt-8">
      <ul class="flex items-center justify-center gap-1 text-body-sm">
        <li th:each="p : ${#numbers.sequence(1, page.totalPages)}">
          <a th:href="@{/bbs/{sc}/{bc}(sc=${siteCode}, bc=${bbsCode},
                       page=${p}, pageSize=${page.pageSize},
                       categoryId=${search?.categoryId},
                       keyword=${search?.keyword}, searchType=${search?.searchType})}"
             th:text="${p}"
             th:class="${p == page.page}
                       ? 'inline-flex items-center justify-center size-10 rounded-medium bg-primary-50 text-white'
                       : 'inline-flex items-center justify-center size-10 rounded-medium border border-line bg-surface text-fg hover:bg-surface-subtle'">1</a>
        </li>
      </ul>
    </nav>

  </section>
</body>
</html>
