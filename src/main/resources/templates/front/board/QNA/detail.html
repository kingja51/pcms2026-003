<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{__${layoutPath ?: 'front/layouts/EMPTY/empty'}__}"
      lang="ko">
<head>
  <title th:text="${article.title} + ' — ' + ${master.bbsName}">Q&amp;A</title>
</head>
<body>
  <section layout:fragment="content" 
           th:with="canManage=${master.bbsMasterId == article.bbsMasterId}">

    <nav aria-label="상위 경로" class="text-body-sm text-fg-subtle mb-4 flex items-center gap-2">
      <a th:href="@{/}" class="hover:underline">🏠 홈</a>
      <span class="text-fg-disabled" aria-hidden="true">›</span>
      <a th:href="@{/bbs/{sc}/{bc}(sc=${siteCode}, bc=${bbsCode})}" class="hover:underline"
         th:text="${master.bbsName}">Q&amp;A</a>
      <span class="text-fg-disabled" aria-hidden="true">›</span>
      <span class="text-fg" aria-current="page">상세</span>
    </nav>

    <div th:if="${message}" role="status" aria-live="polite" class="krds-alert krds-alert-success mb-4">
      <span class="shrink-0 font-bold text-success-icon" aria-hidden="true">✓</span>
      <p th:text="${message}"></p>
    </div>
    <div th:if="${error}" role="alert" aria-live="polite" class="krds-alert krds-alert-danger mb-4">
      <span class="shrink-0 font-bold text-danger-icon" aria-hidden="true">✕</span>
      <p th:text="${error}"></p>
    </div>

    <!-- 질문 카드 -->
    <article class="rounded-large border border-line bg-surface shadow-e1 overflow-hidden">
      <div class="flex items-start gap-4 p-6 border-b border-line"
           th:classappend="${article.secretYn == 'Y' and !canSeeBody} ? ' bg-surface-subtle' : ' bg-primary-5'">
        <div th:class="${article.secretYn == 'Y' and !canSeeBody}
                       ? 'flex size-12 shrink-0 items-center justify-center rounded-max bg-fg-subtle text-heading-xs font-bold text-fg-on'
                       : 'flex size-12 shrink-0 items-center justify-center rounded-max bg-primary-50 text-heading-xs font-bold text-fg-on'"
             aria-hidden="true"
             th:text="${article.secretYn == 'Y' and !canSeeBody} ? '🔒' : 'Q'">Q</div>
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2 flex-wrap mb-2">
            <span th:if="${article.noticeYn == 'Y'}" class="krds-badge bg-danger-surface text-danger-fg">공지</span>
            <span th:if="${article.secretYn == 'Y'}" class="krds-badge bg-surface-subtle text-fg-subtle">🔒 비밀</span>
            <span th:if="${article.categoryName != null and !#strings.isEmpty(article.categoryName)}"
                  class="krds-badge bg-primary-5 text-primary-50" th:text="${article.categoryName}">카테고리</span>
          </div>
          <h1 class="text-heading-md font-bold text-fg-strong mb-2" th:text="${article.title}">질문 제목</h1>
          <div class="flex items-center gap-3 flex-wrap text-body-xs text-fg-subtle">
            <span class="inline-flex items-center gap-1">✍ <span th:text="${article.writerName}">작성자</span></span>
            <span class="inline-flex items-center gap-1" th:text="${@fmt.dt(article.createdAt)}">2026-04-27</span>
            <span class="inline-flex items-center gap-1">👁 <span th:text="${article.viewCount}">0</span></span>
          </div>
        </div>
      </div>

      <!-- 비밀글 차단 시 본문 안내 -->
      <div th:unless="${canSeeBody}" class="px-6 py-8 text-center text-body-sm text-fg-subtle">
        🔒 비밀글입니다. 작성자 또는 운영자만 본문을 볼 수 있습니다.
      </div>

      <!-- 본문 -->
      <th:block th:if="${canSeeBody}">
        <div class="px-6 py-3 text-body-md text-fg whitespace-pre-wrap break-keep [&_img]:max-w-full [&_img]:h-auto [&_img]:rounded-medium [&_img]:my-3"><th:block
            th:replace="~{fragments/bbs-content :: render(content=${article.content}, htmlYn=${master.htmlYn})}"></th:block></div>

        <!-- 첨부파일 다운로드 — 공용 조각(공지 포맷 표준). 카드 내부라 여백만 mx-6/mb-6 유지 -->
        <div class="mx-6 mb-6">
          <th:block th:replace="~{fragments/bbs-attachments :: box(files=${existingFiles})}"/>
        </div>
      </th:block>
    </article>

    <th:block th:if="${canSeeBody}">

      <!-- 좋아요 / 신고 -->
      <div class="flex items-center justify-end mt-4">
        <th:block th:replace="~{fragments/bbs-like-report :: actions(
            type='ARTICLE',
            id=${article.articleId},
            likeCount=${article.likeCount},
            liked=${articleLikedByMe})}"/>
      </div>

      <!-- 답변 상태 배너 -->
      <th:block th:with="hasAnswer=${not #lists.isEmpty(comments)}">
        <div th:class="${hasAnswer}
                       ? 'mt-8 mb-4 flex items-center gap-3 rounded-large border border-success-border bg-success-surface px-6 py-4 text-body-sm font-bold text-success-fg'
                       : 'mt-8 mb-4 flex items-center gap-3 rounded-large border border-warning-border bg-warning-surface px-6 py-4 text-body-sm font-bold text-warning-fg'">
          <div th:class="${hasAnswer}
                         ? 'flex size-8 shrink-0 items-center justify-center rounded-max bg-success-icon font-bold text-fg-on'
                         : 'flex size-8 shrink-0 items-center justify-center rounded-max bg-warning-icon font-bold text-fg-on'"
               aria-hidden="true" th:text="${hasAnswer} ? '✓' : '⏳'">✓</div>
          <span th:if="${hasAnswer}" th:text="'운영자 답변이 등록되었습니다 — 총 ' + ${article.commentCount} + '건'">답변 등록됨</span>
          <span th:unless="${hasAnswer}">아직 답변이 등록되지 않았습니다. 운영자가 확인 후 답변드립니다.</span>
        </div>
      </th:block>

      <!-- 답변 목록 -->
      <th:block xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
                th:if="${master.commentYn == 'Y'}">

        <div th:each="cm : ${comments}"
             class="rounded-large border border-success-border bg-success-surface overflow-hidden mb-3"
             th:with="
               isCommentOwner=${#authentication != null
                                 and #authentication.principal instanceof T(com.gonet.primary.system.login.dto.CustomUserDetails)
                                 and #authentication.principal.userId != null
                                 and (#authentication.principal.userId == cm.writerUserId
                                   or #authentication.principal.userId == cm.createdBy)},
               isAdminUser=${#authentication != null
                              and #authentication.principal instanceof T(com.gonet.primary.system.login.dto.CustomUserDetails)
                              and (#authentication.principal.userType == 'ADMIN'
                                or #authentication.principal.userType == 'EMPLOYEE')},
               canEditComment=${isCommentOwner or isAdminUser},
               canDeleteComment=${isCommentOwner or isAdminUser}">
          <div class="flex items-start gap-4 px-6 pt-5">
            <div class="flex size-10 shrink-0 items-center justify-center rounded-max bg-success-icon font-bold text-fg-on" aria-hidden="true">A</div>
            <div class="flex-1 min-w-0 text-body-xs text-success-fg">
              <strong class="block text-body-sm font-bold text-fg-strong mb-0.5">
                <span th:text="${cm.writerName}">운영자</span>
                <span th:if="${cm.writerUserType == 'ADMIN' or cm.writerUserType == 'EMPLOYEE'}"
                      class="krds-badge bg-success-icon text-fg-on ml-1">운영자</span>
              </strong>
              <span th:text="${@fmt.dt(cm.createdAt)}">2026-04-27</span>
              <span th:if="${cm.secretYn == 'Y'}" class="krds-badge bg-surface-subtle text-fg-subtle ml-1">🔒 비밀 답변</span>
              <span th:if="${cm.status == 'HIDDEN'}" class="krds-badge bg-surface-subtle text-fg-subtle ml-1">숨김</span>
              <span th:if="${cm.status == 'REPORTED'}" class="krds-badge bg-surface-subtle text-fg-subtle ml-1">신고됨</span>
            </div>

            <!-- 답변 작성자/운영자만 노출되는 수정/삭제 버튼 -->
            <div th:if="${canManage and (canEditComment or canDeleteComment)}" class="flex items-center gap-1 shrink-0">
              <details th:if="${canEditComment}" class="relative">
                <summary class="list-none cursor-pointer krds-btn krds-btn-sm krds-btn-tertiary bg-surface">✏ 수정</summary>
                <form th:action="@{/bbs/{sc}/{bc}/{aid}/comments/{cid}(sc=${siteCode}, bc=${bbsCode}, aid=${article.articleId}, cid=${cm.commentId})}"
                      method="post"
                      class="absolute right-0 mt-1 p-3 w-80 bg-surface border border-line rounded-large shadow-e3 z-10">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                  <textarea name="content" required rows="4" maxlength="4000"
                            th:text="${cm.content}"
                            class="krds-input text-body-sm"></textarea>
                  <label class="mt-2 inline-flex items-center gap-1.5 text-body-xs text-fg">
                    <input type="checkbox" name="secretYn" value="Y"
                           th:checked="${cm.secretYn == 'Y'}"
                           class="size-5 accent-primary-50"/>
                    🔒 비밀 답변
                  </label>
                  <button type="submit" class="krds-btn krds-btn-sm krds-btn-primary mt-2 w-full">저장</button>
                </form>
              </details>
              <form th:if="${canDeleteComment}"
                    th:action="@{/bbs/{sc}/{bc}/{aid}/comments/{cid}/delete(sc=${siteCode}, bc=${bbsCode}, aid=${article.articleId}, cid=${cm.commentId})}"
                    method="post"
                    data-confirm="모든 데이타가 삭제 됩니다. 삭제 하시겠습니까?"
                    class="inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="krds-btn krds-btn-sm bg-danger-50 text-white hover:bg-danger-60">🗑 삭제</button>
              </form>
            </div>
          </div>
          <div class="px-6 pb-6 pl-20 text-body-sm text-fg whitespace-pre-wrap break-keep">
            <p th:if="${cm.status == 'PUBLISHED'}" th:text="${cm.content}">답변 내용</p>
            <p th:unless="${cm.status == 'PUBLISHED'}" class="text-fg-disabled italic">관리자에 의해 가려진 답변입니다.</p>
          </div>
          <th:block th:replace="~{fragments/bbs-like-report :: commentActions(cm=${cm}, commentLikedIds=${commentLikedIds})}"/>
        </div>

        <!-- 답변 작성 폼 (운영자/작성자) -->
        <form sec:authorize="isAuthenticated()"
              th:action="@{/bbs/{sc}/{bc}/{aid}/comments(sc=${siteCode}, bc=${bbsCode}, aid=${article.articleId})}"
              method="post" th:object="${commentForm}"
              class="rounded-large border border-line bg-surface p-5 mt-4">
          <div class="flex items-center gap-2 text-body-sm font-bold text-fg-strong mb-2.5">
            <div class="flex size-8 shrink-0 items-center justify-center rounded-max bg-success-icon text-body-sm font-bold text-fg-on" aria-hidden="true">A</div>
            <span>답변 작성</span>
          </div>
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <textarea th:field="*{content}" required rows="4" maxlength="4000"
                    placeholder="답변 내용을 입력하세요"
                    class="krds-input text-body-sm"></textarea>
          <div class="mt-2 flex items-center justify-between gap-3">
            <label class="inline-flex items-center gap-1.5 text-body-sm text-fg">
              <input type="checkbox" name="secretYn" value="Y"
                     th:checked="${commentForm.secretYn == 'Y'}"
                     class="size-5 accent-primary-50"/>
              🔒 비밀 답변 (작성자·운영자만 본문 조회)
            </label>
            <button type="submit" class="krds-btn krds-btn-primary">답변 등록</button>
          </div>
        </form>

        <div sec:authorize="!isAuthenticated()"
             class="rounded-large border border-line bg-surface p-5 mt-4 text-center text-body-sm text-fg-subtle">
          <a th:href="@{/member/login}" class="krds-link">로그인</a> 후 답변을 등록할 수 있습니다.
        </div>
      </th:block>

    </th:block>

    <!-- 액션 -->
    <!-- 이전글/다음글 -->
    <th:block th:replace="~{fragments/bbs-prev-next :: nav(prev=${prevArticle}, next=${nextArticle})}"/>

    <div class="flex items-center justify-between gap-2 pt-6 mt-6 border-t border-line">
      <a th:href="@{/bbs/{sc}/{bc}(sc=${siteCode}, bc=${bbsCode})}"
         class="krds-btn krds-btn-tertiary">목록</a>
      <div class="flex items-center gap-2" th:if="${canManage and (canEdit or canDelete)}">
        <a th:if="${canEdit}"
           th:href="@{/bbs/{sc}/{bc}/{aid}/edit(sc=${siteCode}, bc=${bbsCode}, aid=${article.articleId})}"
           class="krds-btn krds-btn-primary">수정</a>
        <form th:if="${canDelete}"
              th:action="@{/bbs/{sc}/{bc}/{aid}/delete(sc=${siteCode}, bc=${bbsCode}, aid=${article.articleId})}"
              method="post"
              data-confirm="모든 데이타가 삭제 됩니다. 삭제 하시겠습니까?"
              class="inline">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button type="submit" class="krds-btn bg-danger-50 text-white hover:bg-danger-60">삭제</button>
        </form>
      </div>
    </div>

    <script th:src="@{/js/bbs-like-report.js}" th:attr="nonce=${cspNonce}" defer></script>
  </section>
</body>
</html>
