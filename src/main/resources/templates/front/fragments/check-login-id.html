<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<body>

<!--
  아이디 중복확인 결과 fragment — htmx 응답용.
  status: INVALID / AVAILABLE / TAKEN / NO_SITE
-->
<div th:fragment="result" th:switch="${status}"
     class="mt-1 text-xs"
     data-check-login-id-result>
  <span th:case="'INVALID'" class="text-amber-700">
    아이디 형식을 먼저 맞춰 주세요 (소문자 시작, 소문자·숫자·_, 8자 이상).
  </span>
  <span th:case="'AVAILABLE'" class="text-emerald-700 font-medium"
        th:attr="data-login-id=${loginId}">
    ✓ 사용 가능한 아이디입니다.
  </span>
  <span th:case="'TAKEN'" class="text-red-700 font-medium">
    ✗ 이미 사용 중인 아이디입니다.
  </span>
  <span th:case="'NO_SITE'" class="text-amber-700">
    사이트 정보가 확인되지 않습니다. 가입 시작 화면에서 사이트를 선택해 주세요.
  </span>
</div>

</body>
</html>
