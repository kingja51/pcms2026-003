<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{__${layoutPath ?: 'front/layouts/EMPTY/empty'}__}"
      lang="ko">
<head><title>응답 완료</title></head>
<body>
  <section layout:fragment="content">

    <div class="program-page-narrow text-center">
      <div class="inline-flex items-center justify-center size-16 rounded-max bg-success-surface text-success-icon mb-4">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
             stroke="currentColor" stroke-width="2" class="size-8" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M5 13l4 4L19 7"/>
        </svg>
      </div>
      <h1 class="text-heading-md font-bold text-fg-strong">응답이 제출되었습니다</h1>
      <p class="mt-2 text-body-sm text-fg-subtle">소중한 의견 감사합니다.</p>

      <p th:if="${survey}" class="mt-4 text-body-sm text-fg">
        <strong th:text="${survey.surveyTitle}">제목</strong>
      </p>

      <div class="mt-6 flex items-center justify-center gap-2">
        <a th:href="@{/survey/{sc}(sc=${siteCode})}"
           class="krds-btn krds-btn-tertiary">설문 목록</a>
        <a th:href="@{/}"
           class="krds-btn krds-btn-primary">홈</a>
      </div>
    </div>

  </section>
</body>
</html>
