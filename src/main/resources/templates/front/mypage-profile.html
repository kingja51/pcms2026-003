<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{__${layoutPath ?: 'front/layouts/EMPTY/empty'}__}"
      lang="ko">
<head>
  <title>개인정보 수정</title>
</head>
<body>
  <section layout:fragment="content" class="max-w-2xl mx-auto">

    <nav aria-label="상위 경로" class="text-sm text-slate-500 mb-2">
      <a th:href="@{/member/mypage}" class="hover:underline">마이페이지</a>
      <span class="mx-1">/</span>
      <span>개인정보 수정</span>
    </nav>

    <h1 class="text-2xl font-bold text-slate-900 mb-6">개인정보 수정</h1>

    <div th:if="${error}" role="alert"
         class="mb-4 rounded border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800"
         th:text="${error}"></div>
    <div th:if="${errors}" role="alert"
         class="mb-4 rounded border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800">
      <ul class="list-disc pl-5">
        <li th:each="e : ${errors}" th:text="${e.defaultMessage}">error</li>
      </ul>
    </div>

    <form th:action="@{/member/mypage/profile}" method="post" th:object="${form}"
          class="bg-white border border-slate-200 rounded-lg p-6 space-y-5">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">로그인 ID</label>
          <input type="text" readonly th:value="${member.loginId}"
                 class="block w-full rounded border border-slate-200 bg-slate-50 px-3 py-2 text-sm font-mono text-slate-600"/>
        </div>

        <div>
          <label for="nickname" class="block text-sm font-medium text-slate-700 mb-1">닉네임</label>
          <input id="nickname" type="text" th:field="*{nickname}" maxlength="100"
                 class="block w-full rounded border border-slate-300 px-3 py-2 text-sm focus:border-blue-500 focus:ring-2 focus:ring-blue-200 focus:outline-none"/>
        </div>

        <div>
          <label for="memberName" class="block text-sm font-medium text-slate-700 mb-1">
            이름 <span class="text-red-600">*</span>
          </label>
          <input id="memberName" type="text" th:field="*{memberName}" required maxlength="100"
                 class="block w-full rounded border border-slate-300 px-3 py-2 text-sm focus:border-blue-500 focus:ring-2 focus:ring-blue-200 focus:outline-none"/>
        </div>

        <div>
          <label for="email" class="block text-sm font-medium text-slate-700 mb-1">
            이메일 <span class="text-red-600">*</span>
          </label>
          <input id="email" type="email" th:field="*{email}" required maxlength="255"
                 class="block w-full rounded border border-slate-300 px-3 py-2 text-sm focus:border-blue-500 focus:ring-2 focus:ring-blue-200 focus:outline-none"/>
        </div>

        <div>
          <label for="phone" class="block text-sm font-medium text-slate-700 mb-1">전화번호</label>
          <input id="phone" type="tel" th:field="*{phone}" maxlength="20" placeholder="010-1234-5678"
                 class="block w-full rounded border border-slate-300 px-3 py-2 text-sm focus:border-blue-500 focus:ring-2 focus:ring-blue-200 focus:outline-none"/>
        </div>

        <div>
          <label for="addressZipcode" class="block text-sm font-medium text-slate-700 mb-1">우편번호</label>
          <input id="addressZipcode" type="text" th:field="*{addressZipcode}" maxlength="10"
                 class="block w-full rounded border border-slate-300 px-3 py-2 text-sm focus:border-blue-500 focus:ring-2 focus:ring-blue-200 focus:outline-none"/>
        </div>

        <div class="md:col-span-2">
          <label for="address" class="block text-sm font-medium text-slate-700 mb-1">주소</label>
          <input id="address" type="text" th:field="*{address}" maxlength="1024"
                 class="block w-full rounded border border-slate-300 px-3 py-2 text-sm focus:border-blue-500 focus:ring-2 focus:ring-blue-200 focus:outline-none"/>
        </div>

        <div class="md:col-span-2">
          <label for="addressDetail" class="block text-sm font-medium text-slate-700 mb-1">상세 주소</label>
          <input id="addressDetail" type="text" th:field="*{addressDetail}" maxlength="1024"
                 class="block w-full rounded border border-slate-300 px-3 py-2 text-sm focus:border-blue-500 focus:ring-2 focus:ring-blue-200 focus:outline-none"/>
        </div>
      </div>

      <fieldset class="border border-slate-200 rounded p-4 space-y-2 text-sm">
        <legend class="px-2 text-sm font-medium text-slate-700">수신 동의</legend>
        <label class="flex items-center gap-2">
          <input type="checkbox" th:field="*{marketingAgreeYn}" value="Y" class="accent-blue-600"/>
          <span>마케팅 정보 수신</span>
        </label>
        <label class="flex items-center gap-2">
          <input type="checkbox" th:field="*{smsAgreeYn}" value="Y" class="accent-blue-600"/>
          <span>SMS 수신</span>
        </label>
        <label class="flex items-center gap-2">
          <input type="checkbox" th:field="*{emailAgreeYn}" value="Y" class="accent-blue-600"/>
          <span>이메일 수신</span>
        </label>
        <p class="text-xs text-slate-500 mt-1">수신 동의 변경은 동의 이력(<code>tb_member_consent</code>)에 기록됩니다.</p>
      </fieldset>

      <div class="flex items-center justify-end gap-2 pt-4 border-t border-slate-200">
        <a th:href="@{/member/mypage}"
           class="inline-flex items-center px-4 py-2 rounded border border-slate-300 bg-white text-slate-700 text-sm hover:bg-slate-50">
          취소
        </a>
        <button type="submit"
                class="inline-flex items-center px-4 py-2 rounded bg-blue-600 text-white text-sm font-medium hover:bg-blue-700">
          저장
        </button>
      </div>
    </form>

  </section>
</body>
</html>
