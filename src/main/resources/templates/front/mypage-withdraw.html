<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{__${layoutPath ?: 'front/layouts/EMPTY/empty'}__}"
      lang="ko">
<head>
  <title>회원 탈퇴</title>
</head>
<body>
  <section layout:fragment="content" class="max-w-xl mx-auto">

    <nav aria-label="상위 경로" class="text-sm text-slate-500 mb-2">
      <a th:href="@{/member/mypage}" class="hover:underline">마이페이지</a>
      <span class="mx-1">/</span>
      <span>회원 탈퇴</span>
    </nav>

    <h1 class="text-2xl font-bold text-slate-900 mb-1">회원 탈퇴</h1>
    <p class="text-sm text-slate-500 mb-6">
      탈퇴를 진행하려면 사유를 기재하고 동의 체크 후 실행해 주세요.
      본인 확인 인증 유효 시간:
      <strong th:text="${reauthRemaining}">0</strong>초 남음.
    </p>

    <div th:if="${message}" role="status"
         class="mb-4 rounded border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-800"
         th:text="${message}"></div>
    <div th:if="${error}" role="alert"
         class="mb-4 rounded border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800"
         th:text="${error}"></div>

    <section class="bg-white border border-slate-200 rounded-lg p-6 shadow-sm mb-4">
      <h2 class="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-3">탈퇴 전 안내</h2>
      <ul class="list-disc pl-5 text-sm text-slate-700 space-y-1">
        <li>계정은 즉시 비활성화되며, 로그인 불가 상태가 됩니다.</li>
        <li>보유 중인 포인트·쿠폰·작성 글 등은 복구되지 않습니다.</li>
        <li>법정 보관 기간(최대 5년) 동안 탈퇴 기록(해시만)이 보관됩니다. 자유 텍스트 사유는 감사 로그에만 저장됩니다.</li>
        <li>동일 이메일/아이디로 재가입하려면 보관 기간 경과 후에 가능합니다.</li>
      </ul>
    </section>

    <form th:action="@{/member/mypage/withdraw}" th:object="${withdrawForm}" method="post"
          data-confirm="정말 탈퇴하시겠습니까? 이 작업은 되돌릴 수 없습니다."
          class="bg-white border border-red-200 rounded-lg p-6 shadow-sm space-y-4">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

      <div>
        <label for="withdrawReason" class="block text-sm font-medium text-slate-700 mb-1">
          탈퇴 사유 <span class="text-red-600">*</span>
          <span class="text-xs text-slate-500 font-normal">(5자 이상 500자 이내)</span>
        </label>
        <textarea id="withdrawReason" th:field="*{withdrawReason}"
                  rows="4" minlength="5" maxlength="500" required
                  placeholder="서비스 개선을 위해 탈퇴 사유를 5자 이상 작성해 주세요."
                  class="block w-full rounded border border-slate-300 px-3 py-2 text-sm focus:border-red-500 focus:ring-2 focus:ring-red-200 focus:outline-none"
                  th:classappend="${#fields.hasErrors('withdrawReason')} ? ' border-red-500' : ''"></textarea>
        <p th:if="${#fields.hasErrors('withdrawReason')}"
           class="mt-1 text-xs text-red-600"
           th:errors="*{withdrawReason}">탈퇴 사유 오류</p>
      </div>

      <label class="flex items-center gap-2 text-sm text-slate-700">
        <input id="confirmCheck" type="checkbox" required class="accent-red-600"/>
        위 안내 사항을 확인했으며, 탈퇴에 동의합니다.
      </label>

      <div class="flex items-center justify-end gap-2 pt-4 border-t border-slate-100">
        <a th:href="@{/member/mypage}"
           class="inline-flex items-center px-4 py-2 rounded border border-slate-300 bg-white text-slate-700 text-sm hover:bg-slate-50">
          취소
        </a>
        <button type="submit"
                class="inline-flex items-center px-4 py-2 rounded bg-red-600 text-white text-sm font-semibold hover:bg-red-700">
          탈퇴 실행
        </button>
      </div>
    </form>

  </section>
</body>
</html>
