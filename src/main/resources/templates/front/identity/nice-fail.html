<!DOCTYPE html>
<!--
  NICE CheckPlus 안심본인인증 — 실패 콜백 결과 (팝업 창 전용)

  · NICE 가 ERR_URL 로 보낸 결과 — 실패만 들어오므로 안내 + [닫기] 버튼만 노출
  · layout:decorate 미사용 — 팝업이라 헤더/푸터 불필요
-->
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8"/>
  <title>본인인증 실패</title>
  <link th:href="@{/css/output.css}" rel="stylesheet" />
  <script th:nonce="${cspNonce}">
    document.addEventListener('DOMContentLoaded', function () {
      var btn = document.getElementById('niceCloseBtn');
      if (btn) btn.addEventListener('click', function () { window.close(); });
    });
  </script>
</head>
<body class="min-h-screen flex items-center justify-center bg-slate-50 text-slate-800 antialiased">

  <div class="max-w-md w-full mx-4 bg-white border border-red-200 rounded-lg shadow-sm p-6">
    <h1 class="text-lg font-bold text-red-700 mb-2">본인인증 실패</h1>
    <p class="text-sm text-slate-600 mb-4">
      본인인증 처리에 실패했습니다. 창을 닫고 다시 시도해 주세요.
    </p>

    <div th:if="${result.message}" role="alert" aria-live="polite"
         class="mb-4 rounded border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-800">
      <p th:text="${result.message}">사유</p>
    </div>

    <p class="text-xs text-slate-500 mb-4" th:if="${result.returnCode != 0}">
      SDK 응답 코드: <span th:text="${result.returnCode}">0</span>
    </p>

    <button type="button" id="niceCloseBtn"
            class="w-full px-4 py-2 rounded-md bg-slate-900 text-white text-sm font-semibold">
      닫기
    </button>
  </div>

</body>
</html>
