<!DOCTYPE html>
<!--
  휴면 해제 — 인증번호 입력 (수단 B 2단계)

  ⚠️ 열거 차단: 이 화면에 도달했다는 사실이 "계정이 존재한다" 를 뜻하면 안 된다.
     그래서 발송 요청은 계정 유무와 무관하게 **항상** 이 화면으로 온다.
     안내 문구도 "일치하는 계정이 있다면" 이라는 조건형을 유지한다 —
     "메일을 보냈습니다" 로 바꾸면 그 자체가 존재 신호가 된다.

  loginId·email 은 이전 단계에서 flash 로 넘어온다. 직접 이 URL 로 들어온 경우를
  대비해 입력란은 항상 노출하되 값이 있으면 채워 둔다.
-->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{__${layoutPath ?: 'front/layouts/EMPTY/empty'}__}"
      lang="ko">
<head>
  <title>인증번호 입력</title>
</head>
<body>
  <section layout:fragment="content" class="max-w-md mx-auto">

    <div class="bg-surface border border-line rounded-large p-6 md:p-8">

      <div class="mb-6">
        <h1 class="text-heading-md text-fg-strong">인증번호 입력</h1>
        <p class="mt-2 text-body-sm text-fg-subtle">
          메일로 받은 6자리 숫자를 입력해 주세요. 유효시간은 5분입니다.
        </p>
      </div>

      <div th:if="${infoMessage}" role="status"
           class="mb-6 px-4 py-3 rounded border border-line bg-surface-alt text-body-sm text-fg"
           th:text="${infoMessage}">안내</div>

      <div th:if="${errorMessage}" role="alert"
           class="mb-6 px-4 py-3 rounded border border-line bg-surface-alt text-body-sm text-fg"
           th:text="${errorMessage}">오류</div>

      <form method="post" th:action="@{/member/dormant/restore/otp}">

        <label for="loginId" class="block text-label-md text-fg mb-1">아이디</label>
        <input type="text" id="loginId" name="loginId" required autocomplete="username"
               th:value="${loginId}"
               class="w-full px-3 py-2 rounded border border-line bg-surface text-fg mb-3"/>

        <label for="email" class="block text-label-md text-fg mb-1">가입 이메일</label>
        <input type="email" id="email" name="email" required autocomplete="email"
               th:value="${email}"
               class="w-full px-3 py-2 rounded border border-line bg-surface text-fg mb-3"/>

        <label for="code" class="block text-label-md text-fg mb-1">인증번호 6자리</label>
        <!--
          inputmode=numeric + pattern — 모바일에서 숫자 키패드가 뜨게 한다.
          autocomplete="one-time-code" 는 iOS/Android 가 메일의 코드를 자동 채움한다.
          maxlength 는 오입력 방지용이며 서버가 다시 검증한다.
        -->
        <input type="text" id="code" name="code" required
               inputmode="numeric" pattern="[0-9]{6}" maxlength="6"
               autocomplete="one-time-code"
               class="w-full px-3 py-2 rounded border border-line bg-surface text-fg tracking-widest"/>

        <button type="submit"
                class="mt-4 w-full px-4 py-2 rounded bg-brand-50 text-fg-on text-label-md font-medium hover:bg-brand-60">
          확인하고 휴면 해제
        </button>
      </form>

      <p class="mt-4 text-label-sm text-fg-muted">
        메일이 오지 않으면 스팸함을 확인해 주세요. 재발송은 1분 뒤부터 가능합니다.
      </p>

      <div class="mt-6 pt-4 border-t border-line flex gap-4">
        <a th:href="@{/member/dormant/restore}"
           class="text-label-md text-fg-subtle underline underline-offset-2 hover:text-brand-50">다시 요청하기</a>
        <a th:href="@{/member/login}"
           class="text-label-md text-fg-subtle underline underline-offset-2 hover:text-brand-50">로그인으로 돌아가기</a>
      </div>
    </div>
  </section>
</body>
</html>
