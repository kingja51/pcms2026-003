<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{__${layoutPath ?: 'front/layouts/EMPTY/empty'}__}"
      lang="ko">
<head>
  <title>휴면 계정 복원</title>
</head>
<body>
  <section layout:fragment="content" class="max-w-md mx-auto">

    <div class="bg-white border border-slate-200 rounded-lg shadow-sm p-6 md:p-8">
      <div class="mb-6">
        <h1 class="text-2xl font-bold text-slate-900">휴면 계정 복원</h1>
        <p class="text-sm text-slate-500 mt-1">
          1년 이상 접속이 없어 휴면 상태가 된 계정을 복원합니다.
          <strong>이름 · 이메일 · 비밀번호</strong> 세 가지를 모두 정확히 입력해야 복원됩니다.
        </p>
      </div>

      <div th:if="${message}" role="status"
           class="mb-4 rounded border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-800"
           th:text="${message}"></div>
      <div th:if="${error}" role="alert"
           class="mb-4 rounded border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800"
           th:text="${error}"></div>
      <div th:if="${errors}" role="alert"
           class="mb-4 rounded border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800">
        <ul class="list-disc pl-5">
          <li th:each="e : ${errors}" th:text="${e.defaultMessage}">error</li>
        </ul>
      </div>

      <form th:action="@{/member/dormant/restore}" th:object="${form}" method="post"
            autocomplete="off" class="space-y-4">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <th:block th:replace="~{fragments/site-context :: hiddenSiteCode}"/>

        <div>
          <label for="loginId" class="block text-sm font-medium text-slate-700 mb-1">
            아이디 <span class="text-red-600">*</span>
          </label>
          <input id="loginId" type="text" th:field="*{loginId}"
                 required minlength="8" maxlength="50" pattern="^[a-z][a-z0-9_]+$"
                 autocomplete="username"
                 class="block w-full rounded border border-slate-300 px-3 py-2 text-sm focus:border-blue-500 focus:ring-2 focus:ring-blue-200 focus:outline-none"/>
        </div>

        <div>
          <label for="memberName" class="block text-sm font-medium text-slate-700 mb-1">
            이름 <span class="text-red-600">*</span>
          </label>
          <input id="memberName" type="text" th:field="*{memberName}"
                 required maxlength="100" autocomplete="name"
                 class="block w-full rounded border border-slate-300 px-3 py-2 text-sm focus:border-blue-500 focus:ring-2 focus:ring-blue-200 focus:outline-none"/>
        </div>

        <div>
          <label for="email" class="block text-sm font-medium text-slate-700 mb-1">
            이메일 <span class="text-red-600">*</span>
          </label>
          <input id="email" type="email" th:field="*{email}"
                 required maxlength="255" autocomplete="email"
                 class="block w-full rounded border border-slate-300 px-3 py-2 text-sm focus:border-blue-500 focus:ring-2 focus:ring-blue-200 focus:outline-none"/>
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-slate-700 mb-1">
            비밀번호 <span class="text-red-600">*</span>
          </label>
          <input id="password" type="password" th:field="*{password}"
                 required maxlength="100" autocomplete="current-password"
                 class="block w-full rounded border border-slate-300 px-3 py-2 text-sm focus:border-blue-500 focus:ring-2 focus:ring-blue-200 focus:outline-none"/>
          <p class="text-xs text-slate-500 mt-1">휴면 전환 이전에 사용하던 비밀번호입니다.</p>
        </div>

        <button type="submit"
                class="w-full rounded bg-blue-600 px-4 py-2 text-sm font-semibold text-white
                       hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-200 transition-colors">
          복원하기
        </button>
      </form>

      <p class="mt-6 text-center text-xs text-slate-500">
        이미 활성 계정인가요?
        <a th:href="@{/member/login}" class="text-blue-600 hover:underline font-medium">로그인</a>
      </p>
      <p class="mt-2 text-center text-xs text-slate-400">
        비밀번호가 기억나지 않으면
        <a th:href="@{/member/find-password}" class="hover:underline">비밀번호 찾기</a>
        를 이용하세요.
      </p>
    </div>

  </section>
</body>
</html>
