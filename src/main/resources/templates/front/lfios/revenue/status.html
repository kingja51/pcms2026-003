<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{__${layoutPath ?: 'front/layouts/EMPTY/empty'}__}"
      lang="ko">
<head><title>세입현황</title></head>
<body>
<section layout:fragment="content" 
         th:with="thisYear=${T(java.time.Year).now().value}">

  <header class="mb-4">
    <h1 class="text-2xl font-bold text-slate-900 mb-1">세입현황</h1>
    <p class="text-sm text-slate-500">기준일 <strong th:text="${ymd}">-</strong></p>
  </header>

  <form method="get" th:action="@{|/lfios/${siteCode}/revenue/status|}"
        class="bg-white border border-slate-200 rounded p-3 mb-4 grid grid-cols-2 md:grid-cols-5 gap-2 text-sm">
    <select name="fisYear" class="border rounded px-2 py-1" title="회계년도">
      <option th:each="y : ${#numbers.sequence(2015, thisYear)}" th:value="${y}"
              th:text="${y} + '년'" th:selected="${#strings.toString(y) == search.fisYear}"></option>
    </select>
    <select name="fisFgCd" class="border rounded px-2 py-1" title="회계구분">
      <option value="">회계구분(전체)</option>
      <option value="1" th:selected="${search.fisFgCd == '1'}">일반회계</option>
      <option value="2" th:selected="${search.fisFgCd == '2'}">특별회계</option>
    </select>
    <select name="revCd" class="border rounded px-2 py-1" title="세입코드">
      <option value="">세입코드(전체)</option>
      <option th:each="rc : ${revcds}" th:value="${rc.revCd}"
              th:text="${rc.revCdNm} + ' [' + ${rc.revCd} + ']'"
              th:selected="${rc.revCd == search.revCd}"></option>
    </select>
    <input type="text" name="sdate" th:value="${search.sdate}" placeholder="검색일(YYYYMMDD)" class="border rounded px-2 py-1"/>
    <button class="bg-slate-900 text-white rounded px-3 py-1 font-semibold">검색</button>
  </form>

  <div class="flex items-center justify-between mb-2">
    <span class="text-xs text-slate-500">(단위 : 원)</span>
    <a th:href="@{|/lfios/${siteCode}/revenue/status/excel|(fisYear=${search.fisYear},
                  fisFgCd=${search.fisFgCd}, revCd=${search.revCd}, sdate=${search.sdate})}"
       class="inline-flex items-center gap-1 px-3 py-1 rounded border border-emerald-600 bg-white text-emerald-700 text-sm font-semibold hover:bg-emerald-50">
      ⬇ 엑셀 다운로드
    </a>
  </div>

  <div class="overflow-x-auto bg-white rounded border border-slate-200"
       th:with="totalAccum=${#aggregates.sum(rows.![accumAmt])},
                totalInc=${#aggregates.sum(rows.![dayIncAmt])},
                totalResto=${#aggregates.sum(rows.![dayExcRestoAmt])},
                totalRv=${#aggregates.sum(rows.![dayAcctRvAmt])}">
    <table class="min-w-full text-sm">
      <thead class="bg-slate-50">
        <tr class="text-slate-600">
          <th class="px-3 py-2">회계구분명</th>
          <th class="px-3 py-2">세입과목</th>
          <th class="px-3 py-2">기준일</th>
          <th class="px-3 py-2 text-right">전일누계(A)</th>
          <th class="px-3 py-2 text-right">수입액</th>
          <th class="px-3 py-2 text-right">과오납반환액</th>
          <th class="px-3 py-2 text-right">과목경정액</th>
          <th class="px-3 py-2 text-right">금일누계(A+B)</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="r : ${rows}" class="border-t border-slate-100 hover:bg-slate-50">
          <td class="px-3 py-2 text-center"
              th:text="${r.fisFgCd == '1' ? '일반회계' : (r.fisFgCd == '2' ? '특별회계' : (r.fisFgCd == '3' ? '공기업회계' : (r.fisFgCd == '4' ? '기금' : r.fisFgCd)))}"></td>
          <td class="px-3 py-2 text-center" th:text="${r.revCd}"></td>
          <td class="px-3 py-2 text-center text-xs text-slate-500" th:text="${r.ymd}"></td>
          <td class="px-3 py-2 text-right" th:insert="~{front/lfios/fragments :: num(${r.accumAmt})}">0</td>
          <td class="px-3 py-2 text-right" th:insert="~{front/lfios/fragments :: num(${r.dayIncAmt})}">0</td>
          <td class="px-3 py-2 text-right" th:insert="~{front/lfios/fragments :: num(${r.dayExcRestoAmt})}">0</td>
          <td class="px-3 py-2 text-right" th:insert="~{front/lfios/fragments :: num(${r.dayAcctRvAmt})}">0</td>
          <td class="px-3 py-2 text-right"
              th:text="${#numbers.formatInteger((r.accumAmt ?: 0) + (r.dayIncAmt ?: 0) + (r.dayExcRestoAmt ?: 0) + (r.dayAcctRvAmt ?: 0), 1, 'COMMA')}"></td>
        </tr>
        <tr th:if="${rows.isEmpty()}">
          <td colspan="8" class="px-3 py-12 text-center text-slate-400">자료가 존재하지 않습니다.</td>
        </tr>
      </tbody>
      <tfoot th:unless="${rows.isEmpty()}">
        <tr class="bg-slate-100 font-semibold border-t-2 border-slate-300">
          <td class="px-3 py-2 text-center" colspan="3">합계</td>
          <td class="px-3 py-2 text-right" th:text="${#numbers.formatInteger(totalAccum, 1, 'COMMA')}"></td>
          <td class="px-3 py-2 text-right" th:text="${#numbers.formatInteger(totalInc, 1, 'COMMA')}"></td>
          <td class="px-3 py-2 text-right" th:text="${#numbers.formatInteger(totalResto, 1, 'COMMA')}"></td>
          <td class="px-3 py-2 text-right" th:text="${#numbers.formatInteger(totalRv, 1, 'COMMA')}"></td>
          <td class="px-3 py-2 text-right"
              th:text="${#numbers.formatInteger(totalAccum + totalInc + totalResto + totalRv, 1, 'COMMA')}"></td>
        </tr>
      </tfoot>
    </table>
  </div>
</section>
</body>
</html>
