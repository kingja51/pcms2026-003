<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{__${layoutPath ?: 'front/layouts/EMPTY/empty'}__}"
      lang="ko">
<head><title>개찰결과 / 낙찰정보</title></head>
<body>
<section layout:fragment="content">

  <header class="mb-6">
    <h1 class="text-2xl font-bold text-fg-strong mb-1">개찰결과 · 낙찰정보</h1>
    <p class="text-sm text-slate-500">조달청 나라장터의 개찰 및 낙찰 결과 정보입니다.</p>
  </header>

  <form method="get" th:action="@{|/g2b/opening/${siteCode}|}"
        class="bg-surface border border-slate-200 rounded p-3 mb-4 grid grid-cols-1 md:grid-cols-5 gap-2 text-sm">
    <select name="bsnsDiv" class="border rounded px-2 py-1">
      <option value="">업종 (전체)</option>
      <option value="T" th:selected="${search.bsnsDiv == 'T'}">물품</option>
      <option value="S" th:selected="${search.bsnsDiv == 'S'}">용역</option>
      <option value="C" th:selected="${search.bsnsDiv == 'C'}">공사</option>
    </select>
    <input type="date" name="fromDate" th:value="${search.fromDate}" class="border rounded px-2 py-1"/>
    <input type="date" name="toDate"   th:value="${search.toDate}"   class="border rounded px-2 py-1"/>
    <input type="text" name="keyword" th:value="${search.keyword}"
           placeholder="공고/기관/낙찰사" class="border rounded px-2 py-1"/>
    <button class="bg-gray-90 text-fg-on rounded px-3 py-1 font-semibold">검색</button>
  </form>

  <div class="text-xs text-slate-500 mb-2">총 <strong th:text="${page.totalElements}">0</strong>건</div>

  <div class="overflow-x-auto bg-surface rounded border border-slate-200">
    <table class="min-w-full text-sm">
      <thead class="bg-surface-subtle">
        <tr class="text-left text-fg-subtle">
          <th class="px-3 py-2">업종</th>
          <th class="px-3 py-2">공고명</th>
          <th class="px-3 py-2">낙찰사</th>
          <th class="px-3 py-2 text-right">낙찰금액</th>
          <th class="px-3 py-2 text-right">낙찰률</th>
          <th class="px-3 py-2">개찰일시</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="r : ${page.content}" class="border-t border-slate-100 hover:bg-surface-subtle">
          <td class="px-3 py-2" th:text="${@bsns.label(r.bsnsDiv)}"></td>
          <td class="px-3 py-2">
            <a th:href="@{|/g2b/opening/${siteCode}/${r.id}|}"
               class="text-indigo-700 hover:underline" th:text="${r.bidNtceNm}"></a>
          </td>
          <td class="px-3 py-2" th:text="${r.sucsfCorpNm}"></td>
          <td class="px-3 py-2 text-right" th:text="${r.sucsfbidAmt != null ? #numbers.formatInteger(r.sucsfbidAmt, 0, 'COMMA') : '-'}"></td>
          <td class="px-3 py-2 text-right" th:text="${r.sucsfbidRate != null ? #numbers.formatDecimal(r.sucsfbidRate, 0, 2) + '%' : '-'}"></td>
          <td class="px-3 py-2 text-xs text-slate-500"
              th:text="${r.opengDt != null ? #temporals.format(r.opengDt, 'yyyy-MM-dd HH:mm') : ''}"></td>
        </tr>
        <tr th:if="${page.content.isEmpty()}">
          <td colspan="7" class="px-3 py-12 text-center text-slate-400">데이터가 없습니다.</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- 페이지 네비 — front/board/NOTICE/list.html 패턴 정합 -->
  <nav aria-label="페이지" th:if="${page.totalPages > 1}" class="mt-8">
    <ul class="flex items-center justify-center gap-1 text-sm">
      <li th:each="p : ${#numbers.sequence(1, page.totalPages)}">
        <a th:href="@{|/g2b/opening/${siteCode}|(page=${p}, pageSize=${page.pageSize},
                     bsnsDiv=${search?.bsnsDiv},
                     fromDate=${search?.fromDate}, toDate=${search?.toDate},
                     keyword=${search?.keyword})}"
           th:text="${p}"
           th:class="${p == page.page}
                     ? 'inline-flex items-center justify-center min-w-[2rem] px-2 py-1 rounded bg-gray-90 text-fg-on'
                     : 'inline-flex items-center justify-center min-w-[2rem] px-2 py-1 rounded border border-slate-300 bg-surface text-fg hover:bg-surface-subtle'">1</a>
      </li>
    </ul>
  </nav>
</section>
</body>
</html>
