<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{__${layoutPath ?: 'front/layouts/EMPTY/empty'}__}"
      lang="ko">
<head>
  <title>회원가입 — 약관 동의</title>
</head>
<body>
  <section layout:fragment="content">

    <ol class="flex items-center justify-between text-xs text-slate-500 mb-8">
      <li class="flex-1 text-center">STEP 1 · 유형 선택</li>
      <li class="flex-1 text-center text-blue-700 font-semibold">STEP 2 · 약관 동의</li>
      <li class="flex-1 text-center">STEP 3 · 본인인증</li>
      <li class="flex-1 text-center">STEP 4 · 정보 입력</li>
      <li class="flex-1 text-center">STEP 5 · 가입 완료</li>
    </ol>

    <h1 class="text-2xl font-bold text-slate-900 mb-1 text-center">
      <span th:if="${userType == 'CHILD'}">소아/청소년</span>
      <span th:unless="${userType == 'CHILD'}">일반</span>
      가입 — 약관 동의
    </h1>
    <p class="text-sm text-slate-500 mb-8 text-center">필수 약관에 동의해 주세요.</p>

    <div th:if="${error}" role="alert"
         class="mb-4 rounded border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800"
         th:text="${error}"></div>

    <form th:action="@{/member/join/agree}" method="post"
          class="bg-white border border-slate-200 rounded-lg p-6 shadow-sm space-y-3">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <input type="hidden" name="userType" th:value="${userType}"/>
      <th:block th:replace="~{fragments/site-context :: hiddenSiteCode}"/>

      <label class="flex items-start gap-2 p-3 rounded border border-slate-200 bg-slate-50">
        <input type="checkbox" id="agreeAll" class="accent-blue-600 mt-1"/>
        <span class="text-sm">
          <strong class="text-slate-900">서비스 전체 약관에 동의합니다.</strong>
          <span class="block text-xs text-slate-500 mt-1">아래 개별 항목에 일괄 체크 표시됩니다.</span>
        </span>
      </label>

      <div class="space-y-2">
        <label class="flex items-start gap-2 p-3 rounded border border-slate-200 bg-white">
          <input type="checkbox" name="termsAgreeYn" value="Y" class="agree-required accent-blue-600 mt-1"/>
          <span class="text-sm">(필수) 서비스 이용약관</span>
        </label>
        <label class="flex items-start gap-2 p-3 rounded border border-slate-200 bg-white">
          <input type="checkbox" name="privacyAgreeYn" value="Y" class="agree-required accent-blue-600 mt-1"/>
          <span class="text-sm">(필수) 홈페이지 가입을 위한 개인정보 수집·이용 동의서</span>
        </label>
        <label class="flex items-start gap-2 p-3 rounded border border-slate-200 bg-white">
          <input type="checkbox" name="marketingAgreeYn" value="Y" class="agree-optional accent-blue-600 mt-1"/>
          <span class="text-sm text-slate-600">(선택) 마케팅 정보 수신 동의</span>
        </label>
        <label class="flex items-start gap-2 p-3 rounded border border-slate-200 bg-white">
          <input type="checkbox" name="smsAgreeYn" value="Y" class="agree-optional accent-blue-600 mt-1"/>
          <span class="text-sm text-slate-600">(선택) SMS 수신 동의</span>
        </label>
        <label class="flex items-start gap-2 p-3 rounded border border-slate-200 bg-white">
          <input type="checkbox" name="emailAgreeYn" value="Y" class="agree-optional accent-blue-600 mt-1"/>
          <span class="text-sm text-slate-600">(선택) 이메일 수신 동의</span>
        </label>
      </div>

      <div class="flex items-center justify-end gap-2 pt-4 border-t border-slate-100">
        <a th:href="@{/member/join}"
           class="inline-flex items-center px-4 py-2 rounded border border-slate-300 bg-white text-slate-700 text-sm hover:bg-slate-50">
          가입취소
        </a>
        <button type="submit" id="btnNext" disabled
                class="inline-flex items-center px-4 py-2 rounded bg-blue-600 text-white text-sm font-semibold
                       hover:bg-blue-700 disabled:bg-slate-300 disabled:cursor-not-allowed">
          다음단계 &rsaquo;
        </button>
      </div>
    </form>

    <script th:inline="javascript" th:attr="nonce=${cspNonce}">
      (function () {
        const chkAll  = document.getElementById('agreeAll');
        const btnNext = document.getElementById('btnNext');
        const required = document.querySelectorAll('.agree-required');
        const optional = document.querySelectorAll('.agree-optional');

        function recompute() {
          const allRequired = Array.from(required).every(c => c.checked);
          btnNext.disabled = !allRequired;
          const allTotal = allRequired && Array.from(optional).every(c => c.checked);
          chkAll.checked = allTotal;
        }
        chkAll.addEventListener('change', () => {
          required.forEach(c => c.checked = chkAll.checked);
          optional.forEach(c => c.checked = chkAll.checked);
          recompute();
        });
        required.forEach(c => c.addEventListener('change', recompute));
        optional.forEach(c => c.addEventListener('change', recompute));
      })();
    </script>

  </section>
</body>
</html>
