<!DOCTYPE html>
<!--
  airbnb 디자인 시스템 전용 레이아웃 (front/layouts/AIRBNB/AIRBNB)
    · 출처: docs/design-md/DESIGN-airbnb.md
    · Rausch #ff385c (primary), Ink Black #222 (text), Hairline Gray #ddd (border)
    · Airbnb Cereal VF 는 system-ui fallback 으로 대체 (문서 §3 Font Substitutes)
    · 본 레이아웃은 tb_template.layout_path = 'front/layouts/AIRBNB/AIRBNB' (template_code 대문자) 와 1:1 매칭
    · 디렉토리 규약:
      - 레이아웃(template_code 기준): /templates/front/layouts/{TEMPLATE_CODE}/{TEMPLATE_CODE}.html
      - 콘텐츠(site_code 기준):       /templates/{site_code}/{slug}.html
    · airbnb 사이트의 15개 콘텐츠는 /templates/airbnb/ 하위에 존재하며 본 레이아웃을 decorate
-->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ko"
      class="h-full">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <!-- CSRF — JS(file-picker 등) 가 fetch/XHR 헤더로 사용 -->
  <meta name="_csrf"        th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
  <title layout:title-pattern="$CONTENT_TITLE · $LAYOUT_TITLE"
         th:text="${siteContext?.site?.siteName} ?: ${siteCode}">airbnb</title>

  <!-- 외부 웹폰트 대신 system-ui 스택 — CSP 정책상 외부 CSS/font 차단되므로 로컬 폰트로 대체 -->
  <link th:href="@{/css/output.css}" rel="stylesheet" />

  <!-- 레이아웃 전용 CSS — /static/tmpl/css/{TEMPLATE_CODE}/ 규약 (2026-04-23) -->
  <link rel="stylesheet" th:href="@{/tmpl/css/AIRBNB/airbnb.css}"/>
  <!-- 검색 자동완성 드롭다운 (공통) -->
  <link rel="stylesheet" th:href="@{/css/search-autocomplete.css}"/>
  <!-- 사용자 프로그램(board/schedule/...) 페이지 공통 폭 컨테이너 -->
  <link rel="stylesheet" th:href="@{/css/program-page.css}"/>

  <!-- 사이트별 <head> 삽입 (tb_site.head_meta) — 관리자 작성 HTML 을 그대로 렌더 -->
  <th:block th:if="${!#strings.isEmpty(siteContext?.site?.headMeta)}"
            th:utext="${siteContext.site.headMeta}"/>
</head>
<body class="pb-20 md:pb-0">

<a class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-50 focus:px-3 focus:py-2 focus:bg-white focus:ring-2 focus:ring-slate-900 focus:rounded"
   th:href="@{#main}">본문으로 건너뛰기</a>

<!-- ══════════════ 헤더 / 탑 내비 ══════════════ -->
<header role="banner" class="border-b hairline sticky top-0 bg-white z-30">
  <div class="max-w-[1760px] mx-auto px-6 py-4 flex items-center justify-between gap-6">
    <a th:href="@{/{sc}(sc=${siteCode})}" class="brand-wordmark flex items-center gap-2"
       th:with="siteName=${siteContext?.site?.siteName} ?: ${siteCode}">
      <img th:src="@{/tmpl/img/logos/{sc}_logo.svg(sc=${siteCode})}"
           width="28" height="28" th:alt="${siteName}"
           data-hide-on-error=""/>
      <span th:text="${siteName}">사이트</span>
    </a>

    <!-- Tri-tab (데스크톱) -->
    <nav aria-label="카테고리" class="hidden md:block relative">
      <div class="tri-tab" role="tablist">
        <button role="tab" aria-selected="true" type="button">
          <span class="icon3d" aria-hidden="true">🏠</span>
          <span>Homes</span>
        </button>
        <button role="tab" aria-selected="false" type="button" class="relative">
          <span class="icon3d" aria-hidden="true">🎈</span>
          <span>Experiences</span>
          <span class="pill-new">NEW</span>
        </button>
        <button role="tab" aria-selected="false" type="button" class="relative">
          <span class="icon3d" aria-hidden="true">🛎️</span>
          <span>Services</span>
          <span class="pill-new">NEW</span>
        </button>
      </div>
    </nav>

    <!-- 통합 검색바 (데스크톱) — pill 형태 -->
    <form role="search" th:action="@{/search}" method="get" data-search-autocomplete
          class="ab-search hidden md:flex items-center gap-2 flex-1 max-w-md mx-2 px-4 py-2 rounded-full border border-[var(--hairline)] bg-white hover:shadow-md transition focus-within:shadow-md focus-within:border-[var(--rausch)]">
      <input type="hidden" name="siteCode" th:value="${siteCode}"/>
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
           viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
           class="text-slate-500 shrink-0" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/>
        <path d="m21 21-4.3-4.3"/>
      </svg>
      <input type="search" name="keyword" required
             th:placeholder="${siteContext?.site?.siteName != null and !#strings.isEmpty(siteContext.site.siteName)} ? (siteContext.site.siteName + ' 에서 검색') : '검색어를 입력하세요'"
             aria-label="통합 검색"
             class="flex-1 min-w-0 bg-transparent border-0 outline-0 text-sm placeholder-slate-400"/>
      <button type="submit"
              class="shrink-0 inline-flex items-center justify-center w-8 h-8 rounded-full bg-[var(--rausch)] text-white text-xs font-bold hover:opacity-90"
              aria-label="검색">
        →
      </button>
    </form>

    <div class="flex items-center gap-2">
      <!-- 알림 종 — 인증 사용자만 노출. 30초 폴링은 notification-bell.js -->
      <th:block th:replace="~{fragments/notification-bell :: bell(href='/notification')}"/>
      <!-- 회원 인증 위젯 — 로그인 상태 분기 -->
      <div sec:authorize="isAuthenticated()" class="hidden md:flex items-center gap-1 text-sm">
        <a th:href="@{/member/mypage(siteCode=${siteCode})}"
           class="font-medium ink hover:text-[var(--rausch)] px-3 py-2 rounded-full hover:bg-[var(--cloud)]"
           title="마이페이지">
          <span sec:authentication="name">회원</span>
        </a>
        <form th:action="@{/member/logout(siteCode=${siteCode})}" method="post" class="inline">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <input type="hidden" name="siteCode" th:value="${siteContext?.site?.siteCode}"/>
          <button type="submit"
                  class="font-medium ash hover:ink px-3 py-2 rounded-full hover:bg-[var(--cloud)]">로그아웃</button>
        </form>
      </div>
      <div sec:authorize="!isAuthenticated()" class="hidden md:flex items-center gap-1 text-sm">
        <a th:href="@{/member/login(siteCode=${siteCode})}"
           class="font-medium ash hover:ink px-3 py-2 rounded-full hover:bg-[var(--cloud)]">로그인</a>
        <a th:href="@{/member/join(siteCode=${siteCode})}"
           class="font-medium ink px-3 py-2 rounded-full border border-[var(--hairline)] hover:bg-[var(--cloud)]">회원가입</a>
      </div>

      <!-- ─ 현재 날씨 위젯 — htmx 가 /weather/widget fragment 비동기 로드 ─
           hx-trigger="load, every 600s" — 페이지 로드 즉시 + 10분마다 자동 갱신.
           서버는 fragments/weather-widget :: badge 를 그대로 outerHTML 로 swap.
           데이터 없거나 통신 실패 시 빈 span 으로 자연스럽게 placeholder 가 비워짐. -->
      <div th:hx-get="@{|/weather/widget?siteCode=${siteCode}|}"
           hx-trigger="load, every 600s"
           hx-swap="outerHTML"
           class="hidden md:inline-flex"
           aria-live="polite"></div>
      <button class="btn-circle" aria-label="언어">🌐</button>
      <a th:href="@{/{sc}/sitemap(sc=${siteCode})}" class="btn-circle" aria-label="사이트맵">☰</a>
    </div>
  </div>

  <!-- 통합 검색바 (모바일) — 헤더 2행 풀폭 -->
  <div class="md:hidden border-t hairline px-4 py-2 bg-white">
    <form role="search" th:action="@{/search}" method="get" data-search-autocomplete
          class="ab-search flex items-center gap-2 px-3 py-2 rounded-full border border-[var(--hairline)] bg-white focus-within:border-[var(--rausch)]">
      <input type="hidden" name="siteCode" th:value="${siteCode}"/>
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
           viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
           class="text-slate-500 shrink-0" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/>
        <path d="m21 21-4.3-4.3"/>
      </svg>
      <input type="search" name="keyword" required
             placeholder="검색어를 입력하세요"
             aria-label="통합 검색"
             class="flex-1 min-w-0 bg-transparent border-0 outline-0 text-sm placeholder-slate-400"/>
      <button type="submit"
              class="shrink-0 inline-flex items-center justify-center w-7 h-7 rounded-full bg-[var(--rausch)] text-white text-xs font-bold"
              aria-label="검색">→</button>
    </form>
  </div>

  <!-- ══════ 2차 내비 — siteContext.menuTree 기반 동적 렌더 ══════
       admin 에서 메뉴 순서/명칭/추가/삭제 시 SiteContextChangedEvent 로 캐시 evict → 즉시 반영.
       URL 규칙:
         · CONTENT  : /{siteCode}/{linkSlug}   (tb_content.slug, Mapper LEFT JOIN)
         · URL 타입 : linkUrl 그대로
         · FOLDER   : href='#' (드롭다운 트리거 전용)
       active: 현재 uri 가 menu URL 과 일치하거나, 그 URL prefix 로 시작.
  -->
  <nav class="pnav" aria-label="주 메뉴"
       th:with="uri=${currentUri} ?: '', sc=${siteContext?.site?.siteCode} ?: ${siteCode}">
    <ul class="toplevel" th:if="${siteContext?.menuTree != null}">
      <th:block th:each="m : ${siteContext.menuTree}">
        <!-- 링크는 항상 m.linkUrl 그대로. 비어 있으면 '#'. CONTENT/BOARD 합성 안 함. -->
        <li th:with="mUrl=${#strings.isEmpty(m.linkUrl) ? '#' : m.linkUrl}"
            th:attr="data-active=${uri == mUrl or (mUrl != '#' and #strings.startsWith(uri, mUrl))}">
          <a th:href="${mUrl == '#'}
                       ? '#'
                       : @{${mUrl}}">
            <span th:text="${m.menuName}">메뉴</span>
            <span th:if="${!#lists.isEmpty(m.children)}" class="caret" aria-hidden="true">▾</span>
          </a>
          <ul th:if="${!#lists.isEmpty(m.children)}" class="sub">
            <th:block th:each="c : ${m.children}">
              <li th:with="cUrl=${#strings.isEmpty(c.linkUrl) ? '#' : c.linkUrl}">
                <a th:href="${cUrl == '#'}
                             ? '#'
                             : @{${cUrl}}"
                   th:text="${c.menuName}">하위</a>
              </li>
            </th:block>
          </ul>
        </li>
      </th:block>
    </ul>
  </nav>
</header>

<!-- ══════════════ 공통 breadcrumb — siteCode + menuId 가 있을 때만 자동 노출 ══════════════ -->
<div class="max-w-[1760px] mx-auto px-6 pt-4">
  <th:block th:replace="~{fragments/breadcrumb :: trail(leafName=null)}"/>
</div>

<!-- ══════════════ 본문 ══════════════ -->
<main id="main" role="main">
  <section layout:fragment="content" class="max-w-[1760px] mx-auto section-pad">
    <!-- 자식 페이지가 주입 -->
  </section>
</main>

<!-- ══════════════ 모바일 하단 탭 ══════════════ -->
<nav class="mbtab" aria-label="하단 메뉴">
  <a href="#" class="active"><span aria-hidden="true">🔍</span><span>Explore</span></a>
  <a href="#"><span aria-hidden="true">❤️</span><span>Wishlists</span></a>
  <a href="#"><span aria-hidden="true">👤</span><span>Log in</span></a>
</nav>

<!-- 페이지 좋아요/신고 — 컨텐츠가 있는 페이지에서만 노출.
     사용 규약: Controller 가 model 에 contentId / contentLikeCount / contentLikedByMe 를
     주입하면 자동 활성. 미주입 시 fragment 자체가 렌더되지 않음.
     JS(bbs-like-report.js) 가 sourceUrl 을 자동으로 첨부해 어떤 페이지에서 눌렀는지 추적.
     메타/시스템 경로(랜딩·사이트맵·로그인 등) 는 추가로 contains 검사로 비노출. -->
<section th:if="${!#strings.isEmpty(contentId)
                 and !#strings.endsWith(currentUri ?: '', '/home')
                 and !#strings.endsWith(currentUri ?: '', '/sitemap')
                 and !#strings.startsWith(currentUri ?: '', '/member/')}"
         class="mt-16 border-t hairline" style="background: var(--cloud);">
  <div class="max-w-[1760px] mx-auto px-6 py-10 flex justify-center">
    <th:block th:replace="~{fragments/bbs-like-report :: actions(
        type='CONTENT',
        id=${contentId},
        likeCount=${contentLikeCount ?: 0},
        liked=${contentLikedByMe ?: false})}"/>
  </div>
</section>

<!-- ══════════════ 푸터 (건양대 표준 공용 — fragments/site-footer) ══════════════ -->
<th:block th:replace="~{fragments/site-footer :: render}"/>

<th:block th:replace="~{fragments/popup-overlay :: render(popups=${activePopups})}"/>
<link rel="stylesheet" th:href="@{/css/popup-overlay.css}"/>
<link rel="stylesheet" th:href="@{/css/banner-slot.css}"/>
<script th:src="@{/js/popup-overlay.js}" th:attr="nonce=${cspNonce}"></script>

<!-- 좋아요/신고 핸들러 — contentId 가 있는 페이지에서만 fragment 가 렌더됨. JS 는 항상 로드해도 무관(no-op). -->
<script th:src="@{/js/bbs-like-report.js}" th:attr="nonce=${cspNonce}"></script>

<!-- 파일 뷰어 팝업 — [data-viewer-popup] 속성 가진 앵커를 팝업창으로 연다. 게시판 첨부 등. -->
<script th:src="@{/js/file-viewer-popup.js}" th:attr="nonce=${cspNonce}"></script>

<!-- htmx — 회원가입 폼의 중복확인 등 부분 갱신 필요한 페이지에서 사용 -->
<script th:src="@{/js/htmx.min.js}" th:attr="nonce=${cspNonce}"></script>

<!-- 검색 자동완성 — 추천검색어 + 인기검색어 prefix 매칭 -->
<script th:src="@{/js/search-autocomplete.js}" th:attr="nonce=${cspNonce}" defer></script>

<!-- 알림 종 폴링 — 인증 사용자만 -->
<script th:src="@{/js/notification-bell.js}" th:attr="nonce=${cspNonce}" sec:authorize="isAuthenticated()" defer></script>

</body>
</html>
