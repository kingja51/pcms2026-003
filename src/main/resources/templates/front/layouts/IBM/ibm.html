<!DOCTYPE html>
<!--
  IBM 사이트 데모 전용 레이아웃 — IBM Carbon Design System
    · tb_template.layout_path = 'front/layouts/IBM/ibm' 와 1:1 매칭
    · 디자인: DESIGN-ibm.md (Carbon) — 색/타이포/컴포넌트는 /tmpl/css/IBM/ibm.css 의 .cds-* 클래스
    · 규약: 인라인 style/이벤트핸들러 금지(CSP nonce + 외부 .js), raw hex 마크업 금지(전부 var()·.cds-*),
            htmx + 순수 JS, 접근성(대비·aria·포커스링), IBM Plex self-host — 전 사이트 공통 엔지니어링 규약
    · 콘텐츠(site_code 기준): /templates/ibm/{slug}.html 이 본 레이아웃을 decorate
-->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ko"
      class="h-full">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="_csrf"        th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
  <title layout:title-pattern="$CONTENT_TITLE — $LAYOUT_TITLE"
         th:text="${siteContext?.site?.siteName} ?: ${siteCode}">IBM</title>

  <link th:href="@{/css/output.css}" rel="stylesheet" />
  <!-- Carbon 사이트 전용 CSS (self-host IBM Plex + --cds-* 토큰 + .cds-* 컴포넌트) -->
  <link rel="stylesheet" th:href="@{/tmpl/css/IBM/ibm.css}"/>
  <link rel="stylesheet" th:href="@{/css/search-autocomplete.css}"/>
  <link rel="stylesheet" th:href="@{/css/program-page.css}"/>

  <!-- 사이트별 <head> 삽입 (tb_site.head_meta) — 관리자 작성 HTML -->
  <th:block th:if="${!#strings.isEmpty(siteContext?.site?.headMeta)}"
            th:utext="${siteContext.site.headMeta}"/>
  <!-- 고대비 모드 FOUC-free 복원 (nonce 인라인 — CSP 허용). 토글은 app.js. -->
  <script th:attr="nonce=${cspNonce}">
    try { if (localStorage.getItem('pcms-hc') === '1') document.documentElement.classList.add('hc'); } catch (e) {}
  </script>
</head>
<body class="cds h-full flex flex-col">

<a class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-50 focus:px-3 focus:py-2 cds-btn cds-btn--primary"
   th:href="@{#main}">본문으로 건너뛰기</a>

<!-- ══════ 마스트헤드 (다크 nav, 48px) ══════ -->
<header role="banner" class="cds-masthead sticky top-0 z-30">
  <div class="max-w-[1584px] mx-auto flex items-center gap-6 h-12 px-4"
       th:with="sc=${siteContext?.site?.siteCode} ?: ${siteCode},
                siteName=${siteContext?.site?.siteName} ?: ${siteCode}">
    <a th:href="@{/{sc}(sc=${siteCode})}" class="cds-masthead__logo cds-body-short-bold inline-flex items-center gap-2">
      <span class="cds-mono cds-masthead__logo-mark" th:text="${siteName}">IBM</span>
    </a>

    <!-- 주 메뉴 — siteContext.menuTree 데이터 드리븐. 2단계 하위메뉴는 호버/포커스 드롭다운. -->
    <nav aria-label="주 메뉴" class="hidden md:flex items-stretch h-12"
         th:with="uri=${currentUri} ?: ''">
      <th:block th:if="${siteContext?.menuTree != null}" th:each="m : ${siteContext.menuTree}">
        <div class="cds-nav-item h-12">
          <a th:with="mUrl=${#strings.isEmpty(m.linkUrl) ? '#' : m.linkUrl}"
             th:href="${mUrl == '#'} ? '#' : @{${mUrl}}"
             class="cds-masthead__link inline-flex items-center px-4 cds-body-short"
             th:attr="data-active=${uri == mUrl or (mUrl != '#' and #strings.startsWith(uri, mUrl))},
                      aria-haspopup=${!#lists.isEmpty(m.children)} ? 'true' : null"
             th:text="${m.menuName}">메뉴</a>
          <!-- 하위(2단계) 메뉴 — 있을 때만 -->
          <div th:if="${m.children != null and !#lists.isEmpty(m.children)}"
               class="cds-submenu" role="menu" th:aria-label="${m.menuName}">
            <a th:each="c : ${m.children}"
               th:with="cUrl=${#strings.isEmpty(c.linkUrl) ? '#' : c.linkUrl}"
               th:href="${cUrl == '#'} ? '#' : @{${cUrl}}"
               class="cds-submenu__link" role="menuitem"
               th:text="${c.menuName}">하위 메뉴</a>
          </div>
        </div>
      </th:block>
    </nav>

    <div class="ml-auto flex items-center gap-1 h-12">
      <!-- 통합 검색 -->
      <form role="search" th:action="@{/search}" method="get" data-search-autocomplete
            class="hidden md:flex items-center h-12">
        <input type="hidden" name="siteCode" th:value="${siteCode}"/>
        <label for="cdsSearch" class="sr-only">통합 검색</label>
        <input id="cdsSearch" type="search" name="keyword" required
               class="cds-input cds-mono cds-search-input"
               placeholder="Search"/>
      </form>

      <!-- 알림 종 — 인증 사용자만 -->
      <th:block th:replace="~{fragments/notification-bell :: bell(href='/notification')}"/>

      <!-- 현재 날씨 — htmx 비동기 로드 -->
      <div th:hx-get="@{|/weather/widget?siteCode=${siteCode}|}"
           hx-trigger="load, every 600s" hx-swap="outerHTML"
           class="hidden lg:inline-flex items-center px-2" aria-live="polite"></div>

      <span sec:authorize="isAuthenticated()" class="hidden md:inline-flex items-center h-12">
        <a th:href="@{/member/mypage(siteCode=${siteCode})}"
           class="cds-masthead__link inline-flex items-center px-4 cds-body-short"
           title="마이페이지"><span sec:authentication="name">회원</span></a>
        <form th:action="@{/member/logout(siteCode=${siteCode})}" method="post" class="inline-flex items-center h-12">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <input type="hidden" name="siteCode" th:value="${siteCode}"/>
          <button type="submit" class="cds-masthead__link px-4 cds-body-short bg-transparent">로그아웃</button>
        </form>
      </span>
      <span sec:authorize="!isAuthenticated()" class="hidden md:inline-flex items-center h-12">
        <a th:href="@{/member/login(siteCode=${siteCode})}"
           class="cds-masthead__link inline-flex items-center px-4 cds-body-short">로그인</a>
        <a th:href="@{/member/join(siteCode=${siteCode})}"
           class="cds-masthead__link inline-flex items-center px-4 cds-body-short">회원가입</a>
      </span>

      <button type="button" data-action="toggle-contrast" aria-pressed="false"
              class="cds-masthead__icon w-12 h-12 bg-transparent" title="고대비 모드 전환">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/></svg>
        <span class="sr-only">고대비 모드 전환</span>
      </button>

      <a th:href="@{/{sc}/sitemap(sc=${siteCode})}"
         class="cds-masthead__icon w-12 h-12" aria-label="사이트맵">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </a>
    </div>
  </div>
</header>

<!-- ══════ breadcrumb — siteCode + menuId 있을 때만 ══════ -->
<div class="max-w-[1584px] mx-auto px-4 pt-4">
  <th:block th:replace="~{fragments/breadcrumb :: trail(leafName=null)}"/>
</div>

<!-- ══════ 본문 ══════ -->
<main id="main" role="main" class="flex-1">
  <section layout:fragment="content">
  
  
  
    <!-- 자식 페이지 주입 -->
	
	
	
  </section>
</main>

<!-- ══════ 좋아요/신고 (contentId 있는 콘텐츠 페이지에서만) ══════ -->
<section th:if="${!#strings.isEmpty(contentId)
                 and !#strings.endsWith(currentUri ?: '', '/home')
                 and !#strings.endsWith(currentUri ?: '', '/sitemap')
                 and !#strings.startsWith(currentUri ?: '', '/member/')}"
         class="cds-band cds-band--layer">
  <div class="cds-band__inner flex justify-center">
    <th:block th:replace="~{fragments/bbs-like-report :: actions(
        type='CONTENT', id=${contentId},
        likeCount=${contentLikeCount ?: 0}, liked=${contentLikedByMe ?: false})}"/>
  </div>
</section>

<!-- ══════ 푸터 (건양대 표준 공용 — fragments/site-footer) ══════ -->
<th:block th:replace="~{fragments/site-footer :: render}"/>

<th:block th:replace="~{fragments/popup-overlay :: render(popups=${activePopups})}"/>
<link rel="stylesheet" th:href="@{/css/popup-overlay.css}"/>
<link rel="stylesheet" th:href="@{/css/banner-slot.css}"/>
<script th:src="@{/js/popup-overlay.js}" th:attr="nonce=${cspNonce}"></script>
<script th:src="@{/js/bbs-like-report.js}" th:attr="nonce=${cspNonce}"></script>
<script th:src="@{/js/file-viewer-popup.js}" th:attr="nonce=${cspNonce}"></script>
<script th:src="@{/js/htmx.min.js}" th:attr="nonce=${cspNonce}"></script>
<script th:src="@{/js/app.js}" th:attr="nonce=${cspNonce}"></script>
<script th:src="@{/js/search-autocomplete.js}" th:attr="nonce=${cspNonce}" defer></script>
<script th:src="@{/js/notification-bell.js}" th:attr="nonce=${cspNonce}" sec:authorize="isAuthenticated()" defer></script>

<!-- 페이지별 추가 스크립트 슬롯 -->
<th:block layout:fragment="scripts"></th:block>
</body>
</html>
