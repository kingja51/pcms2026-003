<!DOCTYPE html>
<!--
  KRDS 템플릿 13종 공용 레이아웃 (2026-07-06, 신규 3종 2026-07-07)
    · tb_template.layout_path = 'front/layouts/KRDS/krds' — KRDS-* 13종 행이 전부 이 파일을 공유
    · 템플릿별 차이는 CSS 1장: siteContext.template.templateCode → /tmpl/css/krds/{code}.css (아래 tmplCssMap)
    · 테마: <html th:classappend="${themeClass}"> — 템플릿 CSS의 .theme-* 가 --brand-* 램프 스왑
      (tb_site.theme 컬럼 단일 경로(관리자 사이트 관리) — SiteContextModelAdvice. ?theme= 프리뷰는 2026-07-07 제거)
    · 템플릿 프리뷰: ?tmpl=KRDS-UNIV-GREEN (세션 sticky, ?tmpl=off 해제 — AbstractSiteUsrController)
    · 규약: 인라인 style/핸들러 금지(CSP nonce + 외부 .js), raw hex 금지(.tpl-*+시맨틱 토큰),
            htmx + 순수 JS, 네이티브 요소 우선, self-host — 전 사이트 공통 엔지니어링 규약
    · 콘텐츠(site_code 기준): /templates/{siteCode}/{slug}.html 이 본 레이아웃을 decorate
-->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ko"
      class="h-full"
      th:classappend="${themeClass}">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="_csrf"        th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
  <title layout:title-pattern="$CONTENT_TITLE — $LAYOUT_TITLE"
         th:text="${siteContext?.site?.siteName} ?: ${siteCode}">KRDS</title>

  <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23256ef4'/%3E%3Ctext x='50%25' y='55%25' text-anchor='middle' dominant-baseline='middle' font-family='sans-serif' font-size='16' font-weight='700' fill='%23fff'%3EK%3C/text%3E%3C/svg%3E"/>
  <link th:href="@{/css/output.css}" rel="stylesheet"/>
  <!-- 템플릿 시각 계층 — template_code → css 파일 매핑 (미등록 코드는 gov-standard 폴백) -->
  <link rel="stylesheet"
        th:with="tmplCssMap=${ {'KRDS-GOV-STD':'gov-standard','KRDS-GOV-NAVY':'gov-navy','KRDS-PUB-TEAL':'public-teal','KRDS-POL-SLATE':'policy-slate','KRDS-UNIV-BLUE':'univ-blue','KRDS-UNIV-GREEN':'univ-green','KRDS-UNIV-MAROON':'univ-maroon','KRDS-RES-INDIGO':'research-indigo','KRDS-MED-CYAN':'medical-cyan','KRDS-A11Y-HC':'a11y-contrast','KRDS-FIN-VIOLET':'fin-violet','KRDS-CULT-TERRA':'culture-terra','KRDS-DIG-GRAPHITE':'digital-graphite'} }"
        th:href="@{'/tmpl/css/krds/' + (${tmplCssMap[siteContext?.template?.templateCode]} ?: 'gov-standard') + '.css'}"/>
  <link rel="stylesheet" th:href="@{/css/search-autocomplete.css}"/>
  <link rel="stylesheet" th:href="@{/css/program-page.css}"/>
  <link rel="stylesheet" th:href="@{/css/banner-carousel.css}"/><!-- 캐러셀+서브 비주얼(pcms-subhero) -->

  <!-- 사이트별 <head> 삽입 (tb_site.head_meta) — 관리자 작성 HTML -->
  <th:block th:if="${!#strings.isEmpty(siteContext?.site?.headMeta)}"
            th:utext="${siteContext.site.headMeta}"/>
  <!-- 고대비 모드 FOUC-free 복원 (nonce 인라인 — CSP 허용). 토글은 app.js. -->
  <script th:attr="nonce=${cspNonce}">
    try { if (localStorage.getItem('pcms-hc') === '1') document.documentElement.classList.add('hc'); } catch (e) {}
  </script>
</head>
<body class="h-full flex flex-col bg-bg text-fg">

<a class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-50 focus:px-3 focus:py-2 tpl-btn tpl-btn-primary"
   th:href="@{#main}">본문으로 건너뛰기</a>

<!-- ══════ 마스트헤드 (크롬 밴드 — 템플릿 CSS의 --tpl-chrome) ══════ -->
<header role="banner">
  <div class="tpl-masthead">
    <div class="max-w-content mx-auto flex items-center gap-4 min-h-11 px-4"
         th:with="siteName=${siteContext?.site?.siteName} ?: ${siteCode}">
      <a th:href="@{/{sc}(sc=${siteCode})}" class="tpl-masthead__link text-heading-sm" th:text="${siteName}">사이트명</a>

      <div class="ml-auto flex items-center">
        <!-- 현재 날씨 — htmx 비동기 로드 -->
        <div th:hx-get="@{|/weather/widget?siteCode=${siteCode}|}"
             hx-trigger="load, every 600s" hx-swap="outerHTML"
             class="hidden lg:inline-flex items-center px-2" aria-live="polite"></div>

        <!-- 알림 종 — 인증 사용자만 -->
        <th:block th:replace="~{fragments/notification-bell :: bell(href='/notification')}"/>

        <span sec:authorize="isAuthenticated()" class="hidden md:inline-flex items-center">
          <a th:href="@{/member/mypage(siteCode=${siteCode})}" class="tpl-masthead__link" title="마이페이지">
            <span sec:authentication="name">회원</span></a>
          <form th:action="@{/member/logout(siteCode=${siteCode})}" method="post" class="inline-flex items-center">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="hidden" name="siteCode" th:value="${siteCode}"/>
            <button type="submit" class="tpl-masthead__link bg-transparent border-0 cursor-pointer">로그아웃</button>
          </form>
        </span>
        <span sec:authorize="!isAuthenticated()" class="hidden md:inline-flex items-center">
          <a th:href="@{/member/login(siteCode=${siteCode})}" class="tpl-masthead__link">로그인</a>
          <a th:href="@{/member/join(siteCode=${siteCode})}" class="tpl-masthead__link">회원가입</a>
        </span>

        <button type="button" data-action="toggle-contrast" aria-pressed="false"
                class="tpl-masthead__icon" title="고대비 모드 전환">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/></svg>
          <span class="sr-only">고대비 모드 전환</span>
        </button>

        <a th:href="@{/{sc}/sitemap(sc=${siteCode})}" class="tpl-masthead__icon" aria-label="사이트맵">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </a>
      </div>
    </div>
  </div>

  <!-- ══════ 주 메뉴 밴드 (surface — tpl-nav-link 활성표시 = 색+보더 병행) ══════ -->
  <div class="bg-surface border-b border-line">
    <div class="max-w-content mx-auto flex items-center gap-2 px-4">
      <nav aria-label="주 메뉴" class="hidden md:flex items-stretch flex-wrap"
           th:with="uri=${currentUri} ?: ''">
        <th:block th:if="${siteContext?.menuTree != null}" th:each="m : ${siteContext.menuTree}">
          <div class="tpl-nav-item">
            <a th:with="mUrl=${#strings.isEmpty(m.linkUrl) ? '#' : m.linkUrl}"
               th:href="${mUrl == '#'} ? '#' : @{${mUrl}}"
               class="tpl-nav-link inline-flex items-center px-4 min-h-12 text-body-md"
               th:attr="data-active=${uri == mUrl or (mUrl != '#' and #strings.startsWith(uri, mUrl))},
                        aria-haspopup=${!#lists.isEmpty(m.children)} ? 'true' : null"
               th:text="${m.menuName}">메뉴</a>
            <!-- 하위(2·3단계) 메뉴 — 있을 때만. 3단계는 들여쓴 보조 링크로 같은 패널에 렌더
                 (2026-07-07: 2단계 제한 → 3단계까지 확장. 4단계 이하는 사이트맵에서만 노출) -->
            <div th:if="${m.children != null and !#lists.isEmpty(m.children)}"
                 class="tpl-submenu" role="menu" th:aria-label="${m.menuName}">
              <th:block th:each="c : ${m.children}">
                <a th:with="cUrl=${#strings.isEmpty(c.linkUrl) ? '#' : c.linkUrl}"
                   th:href="${cUrl == '#'} ? '#' : @{${cUrl}}"
                   class="tpl-submenu__link" role="menuitem"
                   th:text="${c.menuName}">하위 메뉴</a>
                <a th:if="${c.children != null}" th:each="g : ${c.children}"
                   th:with="gUrl=${#strings.isEmpty(g.linkUrl) ? '#' : g.linkUrl}"
                   th:href="${gUrl == '#'} ? '#' : @{${gUrl}}"
                   class="tpl-submenu__link tpl-submenu__link--sub" role="menuitem"
                   th:text="${g.menuName}">3차 메뉴</a>
              </th:block>
            </div>
          </div>
        </th:block>
      </nav>

      <!-- 통합 검색 -->
      <form role="search" th:action="@{/search}" method="get" data-search-autocomplete
            class="hidden md:flex items-center ml-auto py-2">
        <input type="hidden" name="siteCode" th:value="${siteCode}"/>
        <label for="krdsSearch" class="sr-only">통합 검색</label>
        <input id="krdsSearch" type="search" name="keyword" required
               class="krds-input max-w-56" placeholder="검색어 입력"/>
      </form>
    </div>
  </div>

  <!-- ══════ 서브페이지 상단 비주얼(SUB_HERO) — 클라이언트 렌더 슬롯. 순서: 메뉴 밴드 → 비주얼
       → breadcrumb. sub-hero.js 가 GET /api/v1/sites/{sc}/banners?location=SUB_HERO 를 호출해
       첫 이미지 배너를 그려 넣는다. 홈(/{sc}/home)은 캐러셀 담당이라 슬롯 자체를 미출력,
       배너 없으면 빈 슬롯 유지(각 페이지 자체 헤더가 폴백). ══════ -->
  <div data-sub-hero hidden
       th:if="${siteCode != null and !#strings.endsWith((currentUri ?: ''), '/home')}"
       th:attr="data-site=${siteCode}"></div>

  <!-- ══════ breadcrumb 밴드 — 서브 페이지(menuId 해석 성공)에서만 노출 ══════ -->
  <th:block th:replace="~{fragments/breadcrumb :: band(leafName=null)}"/>
</header>

<!-- ══════ 본문 ══════ -->
<main id="main" role="main" class="flex-1">
  <div class="max-w-content mx-auto px-4 py-12">
    <div class="bg-surface border border-line rounded-large p-8 md:p-12">
      <section layout:fragment="content">


        <!-- 자식 페이지 주입 -->



      </section>
    </div>
  </div>
</main>

<!-- ══════ 좋아요/신고 (contentId 있는 콘텐츠 페이지에서만) ══════ -->
<section th:if="${!#strings.isEmpty(contentId)
                 and !#strings.endsWith(currentUri ?: '', '/home')
                 and !#strings.endsWith(currentUri ?: '', '/sitemap')
                 and !#strings.startsWith(currentUri ?: '', '/member/')}"
         class="bg-surface-subtle border-t border-line py-6">
  <div class="max-w-content mx-auto px-4 flex justify-center">
    <th:block th:replace="~{fragments/bbs-like-report :: actions(
        type='CONTENT', id=${contentId},
        likeCount=${contentLikeCount ?: 0}, liked=${contentLikedByMe ?: false})}"/>
  </div>
</section>

<!-- ══════ 푸터 (건양대 표준 공용 — fragments/site-footer) ══════ -->
<th:block th:replace="~{fragments/site-footer :: render}"/>

<th:block th:replace="~{fragments/popup-overlay :: render(popups=${activePopups})}"/>
<link rel="stylesheet" th:href="@{/css/popup-overlay.css}"/>
<link rel="stylesheet" th:href="@{/css/banner-slot.css}"/>
<script th:src="@{/js/popup-overlay.js}" th:attr="nonce=${cspNonce}"></script>
<script th:src="@{/js/bbs-like-report.js}" th:attr="nonce=${cspNonce}"></script>
<script th:src="@{/js/file-viewer-popup.js}" th:attr="nonce=${cspNonce}"></script>
<script th:src="@{/js/htmx.min.js}" th:attr="nonce=${cspNonce}"></script>
<script th:src="@{/js/app.js}" th:attr="nonce=${cspNonce}"></script>
<script th:src="@{/js/search-autocomplete.js}" th:attr="nonce=${cspNonce}" defer></script>
<script th:src="@{/js/sub-hero.js}" th:attr="nonce=${cspNonce}" defer></script>
<script th:src="@{/js/notification-bell.js}" th:attr="nonce=${cspNonce}" sec:authorize="isAuthenticated()" defer></script>

<!-- 페이지별 추가 스크립트 슬롯 -->
<th:block layout:fragment="scripts"></th:block>
</body>
</html>
