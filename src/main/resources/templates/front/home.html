<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{__${layoutPath ?: 'front/layouts/EMPTY/empty'}__}"
      lang="ko">
<head>
  <title>홈</title>
</head>
<body>
  <section layout:fragment="content">

    <!-- 히어로 -->
    <div class="text-center py-10">
      <h1 class="text-3xl md:text-4xl font-bold text-slate-900 tracking-tight">
        <span th:text="${siteContext?.site?.siteName} ?: ${@project.nameKo}">홈</span> 에 오신 것을 환영합니다
      </h1>
      <p class="mt-3 text-slate-500">
        전자정부 호환 · 다중 사이트 · 역할계층 기반 CMS
      </p>
    </div>

    <!-- 로그인 상태 카드 -->
    <div sec:authorize="isAuthenticated()"
         class="bg-white border border-slate-200 rounded-lg p-6 shadow-sm">
      <div class="flex items-start justify-between gap-4 flex-wrap">
        <div>
          <p class="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-1">로그인됨</p>
          <p class="text-lg text-slate-900">
            <strong sec:authentication="name" class="font-semibold">user</strong>
            <span class="text-slate-500 font-normal">님</span>
          </p>
        </div>
        <div class="flex items-center gap-2" th:if="${userType == 'ADMIN' or userType == 'EMPLOYEE'}">
          <a th:href="@{/admin}"
             class="inline-flex items-center px-4 py-2 rounded bg-blue-600 text-white text-sm font-medium hover:bg-blue-700 transition-colors">
            관리자 대시보드 →
          </a>
        </div>
      </div>
    </div>

    <!-- 비로그인 카드 -->
    <div sec:authorize="isAnonymous()"
         class="bg-white border border-slate-200 rounded-lg p-6 shadow-sm">
      <p class="text-slate-700">
        서비스를 이용하시려면
        <a th:href="@{/member/login}" class="text-blue-600 hover:underline font-medium">로그인</a>
        또는
        <a th:href="@{/member/join}" class="text-blue-600 hover:underline font-medium">회원가입</a>
        해 주세요.
      </p>
    </div>

    <!-- 사이트 디렉터리 — 사이트명 + 홈/사이트맵 링크만 간단히 나열 (HomeUsrController 주입) -->
    <div class="mt-10" th:if="${sites != null and !#lists.isEmpty(sites)}">
      <div class="flex items-baseline justify-between gap-2">
        <h2 class="text-heading-sm font-bold text-fg">사이트 디렉터리</h2>
        <span class="text-label-sm text-fg-subtle">
          총 <span th:text="${#lists.size(sites)}">0</span>개 사이트
        </span>
      </div>

      <label class="sr-only" for="site-filter">사이트명 검색</label>
      <input id="site-filter" type="search" data-site-filter autocomplete="off"
             class="krds-input mt-4 w-full" placeholder="사이트명 검색"/>

      <ul class="mt-4 grid gap-x-8 sm:grid-cols-2" data-site-list>
        <li th:each="s : ${sites}" data-site-row
            th:attr="data-site-name=${s.siteName + ' ' + s.siteCode}"
            class="flex items-center justify-between gap-3 border-b border-line py-2">
          <a th:href="@{|/${s.siteCode}/home|}" class="krds-link text-body-sm font-medium truncate"
             th:text="${s.siteName}">사이트명</a>
          <span class="flex shrink-0 items-center gap-1">
            <a th:href="@{|/${s.siteCode}/home|}" class="krds-btn krds-btn-sm krds-btn-tertiary">홈</a>
            <a th:href="@{|/${s.siteCode}/sitemap|}" class="krds-btn krds-btn-sm krds-btn-tertiary">사이트맵</a>
          </span>
        </li>
      </ul>
      <p data-site-empty hidden class="mt-4 text-body-sm text-fg-subtle">검색 결과가 없습니다.</p>

      <script th:src="@{/js/site-directory-filter.js}" th:attr="nonce=${cspNonce}" defer></script>
    </div>

  </section>
</body>
</html>
