<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- ══════════════════════════════════════════════════════════════════════
     공용 사이트 푸터 (전 사용자 레이아웃 공통)

     001 의 푸터는 특정 대학의 주소·전화·담당자·저작권·로고가 하드코딩돼 있었다.
     003 은 멀티사이트 CMS 이므로 기관 정보를 코드에 박지 않는다 —
     값은 tb_site 에서 오고, 데모 사이트의 시각 표현은 P8 에서 다룬다.

     값 출처:
       siteContext.site.*  P4 사이트 도메인이 주입. 없으면(관리자 화면 등) 해당 블록 생략
       @project.nameKo     application.yml 의 gopcms.project.name-ko

     스타일은 KRDS 시맨틱 토큰만 쓴다 — raw hex·Tailwind 기본색 금지.
     사용: <th:block th:replace="~{fragments/site-footer :: render}"/>
     ══════════════════════════════════════════════════════════════════════ -->
<th:block th:fragment="render">
  <footer role="contentinfo" class="mt-auto bg-surface-alt border-t border-line">
    <div class="max-w-content mx-auto px-4 py-8 flex flex-col gap-4">

      <!-- 기관 정보 — 사이트 컨텍스트가 있을 때만. 빈 값이면 항목 자체를 렌더하지 않는다 -->
      <div th:if="${siteContext != null and siteContext.site != null}"
           class="flex flex-col gap-1 text-body-sm text-fg-subtle">
        <p th:if="${!#strings.isEmpty(siteContext.site.address)}"
           th:text="${siteContext.site.address}">주소</p>
        <p class="flex flex-wrap gap-x-4 gap-y-1">
          <span th:if="${!#strings.isEmpty(siteContext.site.tel)}">
            <strong class="text-fg">TEL</strong> <span th:text="${siteContext.site.tel}">-</span>
          </span>
          <span th:if="${!#strings.isEmpty(siteContext.site.fax)}">
            <strong class="text-fg">FAX</strong> <span th:text="${siteContext.site.fax}">-</span>
          </span>
        </p>
      </div>

      <!-- 정책 링크 — P4 에서 tb_menu 기반으로 대체할 수 있다 -->
      <nav aria-label="정책 링크" class="flex flex-wrap gap-x-4 gap-y-2 text-label-sm">
        <a class="text-fg-subtle hover:text-brand-50 underline underline-offset-2"
           th:href="@{/policy/privacy}">개인정보처리방침</a>
        <a class="text-fg-subtle hover:text-brand-50 underline underline-offset-2"
           th:href="@{/policy/terms}">이용약관</a>
      </nav>

      <p class="text-label-sm text-fg-muted"
         th:text="|© ${#calendars.year(#calendars.createNow())} ${@project.nameKo}. ALL RIGHTS RESERVED.|">
        © 2026 PCMS. ALL RIGHTS RESERVED.
      </p>
    </div>
  </footer>
</th:block>
</body>
</html>
