<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ko">
<!--
  공통 fragment — 좋아요 / 신고 버튼.

  정책:
    · 인증 사용자(MEMBER 이상) 만 좋아요 토글 / 신고 모달 노출.
    · 비인증 사용자는 "로그인하고 좋아요" / "로그인하고 신고" 링크로 표시 →
      클릭 시 /member/login?returnUrl={현재 페이지} 로 이동, 로그인 후 원 페이지 복귀.
      → "모달 작성 → API 401 → 로그인 → 폼 데이터 손실" 회귀 방지.

  사용법:
    <th:block th:replace="~{fragments/bbs-like-report :: actions(
        type='ARTICLE',
        id=${article.articleId},
        likeCount=${article.likeCount},
        liked=${articleLikedByMe})}"/>
-->
<body>

<th:block th:fragment="commentActions(cm, commentLikedIds)">
  <div th:if="${cm.status == 'PUBLISHED'}" class="mt-2">
    <th:block th:replace="~{fragments/bbs-like-report :: actions(
        type='COMMENT',
        id=${cm.commentId},
        likeCount=${cm.likeCount},
        liked=${commentLikedIds != null and commentLikedIds[cm.commentId]})}"/>
  </div>
</th:block>

<th:block th:fragment="actions(type, id, likeCount, liked)">
  <div class="inline-flex items-center gap-2"
       th:attr="data-bbs-target=${type}, data-bbs-id=${id}">

    <!-- ── 인증 사용자 ── -->
    <th:block sec:authorize="isAuthenticated()">
      <!-- 좋아요 버튼 -->
      <button type="button"
              class="bbs-like-btn inline-flex items-center gap-1 px-3 py-1.5 rounded-medium border border-line text-body-sm hover:bg-surface-subtle transition-colors"
              th:classappend="${liked} ? 'bg-danger-surface border-danger-border text-danger-fg'"
              th:data-liked="${liked}"
              aria-label="좋아요 토글">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
             class="size-4" fill="currentColor" aria-hidden="true">
          <path d="M11.645 20.91l-.007-.003-.022-.012a15.247 15.247 0 01-.383-.218 25.18 25.18 0 01-4.244-3.17C4.688 15.36 2.25 12.174 2.25 8.25 2.25 5.322 4.714 3 7.688 3A5.5 5.5 0 0112 5.052 5.5 5.5 0 0116.313 3c2.973 0 5.437 2.322 5.437 5.25 0 3.925-2.438 7.111-4.739 9.256a25.175 25.175 0 01-4.244 3.17 15.247 15.247 0 01-.383.219l-.022.012-.007.004-.003.001a.752.752 0 01-.704 0l-.003-.001z"/>
        </svg>
        <span class="bbs-like-count" th:text="${likeCount}">0</span>
      </button>

      <!-- 신고 버튼 (disclosure) -->
      <details class="relative">
        <summary class="list-none cursor-pointer inline-flex items-center gap-1 px-3 py-1.5 rounded-medium border border-line text-body-sm text-fg-subtle hover:bg-surface-subtle transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
               stroke="currentColor" stroke-width="1.8" class="size-4" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M3 3v18M3 4.5h13.5l-1.5 4.5 1.5 4.5H3"/>
          </svg>
          신고
        </summary>
        <form class="bbs-report-form absolute right-0 mt-2 w-72 bg-surface border border-line rounded-large shadow-e2 p-3 z-10">
          <p class="text-body-xs text-fg-subtle mb-2">부적절한 콘텐츠를 신고합니다. 1인 1회만 가능합니다.</p>
          <label class="block text-body-xs text-fg-subtle mb-1">사유</label>
          <select name="reasonCode" required
                  class="krds-input mb-2">
            <option th:each="o : ${@code.options('BBS_REPORT_REASON')}"
                    th:value="${o.code}"
                    th:text="${o.codeName}">스팸/광고</option>
          </select>
          <label class="block text-body-xs text-fg-subtle mb-1">추가 설명 (선택)</label>
          <textarea name="reasonText" rows="2" maxlength="1000"
                    class="krds-input mb-2"
                    placeholder="구체적인 신고 사유"></textarea>
          <div class="flex justify-end gap-1">
            <button type="submit"
                    class="krds-btn krds-btn-sm bg-danger-50 text-white hover:bg-danger-60">
              신고 접수
            </button>
          </div>
        </form>
      </details>
    </th:block>

    <!-- ── 비인증 사용자 — 로그인 페이지로 선이동 ── -->
    <th:block sec:authorize="!isAuthenticated()">
      <a th:href="@{/member/login(returnUrl=${currentUri ?: '/'})}"
         class="inline-flex items-center gap-1 px-3 py-1.5 rounded-medium border border-line text-body-sm text-fg-subtle hover:bg-surface-subtle transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
             class="size-4" fill="currentColor" aria-hidden="true">
          <path d="M11.645 20.91l-.007-.003-.022-.012a15.247 15.247 0 01-.383-.218 25.18 25.18 0 01-4.244-3.17C4.688 15.36 2.25 12.174 2.25 8.25 2.25 5.322 4.714 3 7.688 3A5.5 5.5 0 0112 5.052 5.5 5.5 0 0116.313 3c2.973 0 5.437 2.322 5.437 5.25 0 3.925-2.438 7.111-4.739 9.256a25.175 25.175 0 01-4.244 3.17 15.247 15.247 0 01-.383.219l-.022.012-.007.004-.003.001a.752.752 0 01-.704 0l-.003-.001z"/>
        </svg>
        <span class="bbs-like-count" th:text="${likeCount}">0</span>
        <span class="ml-1 text-body-xs text-fg-disabled">로그인 후 좋아요</span>
      </a>
      <a th:href="@{/member/login(returnUrl=${currentUri ?: '/'})}"
         class="inline-flex items-center gap-1 px-3 py-1.5 rounded-medium border border-line text-body-sm text-fg-subtle hover:bg-surface-subtle transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
             stroke="currentColor" stroke-width="1.8" class="size-4" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M3 3v18M3 4.5h13.5l-1.5 4.5 1.5 4.5H3"/>
        </svg>
        로그인 후 신고
      </a>
    </th:block>
  </div>
</th:block>

</body>
</html>
