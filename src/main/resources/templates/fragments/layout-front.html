<!DOCTYPE html>
<!--
  사용자(프런트) 공통 레이아웃 — KRDS × Tailwind v4 (Design.md 기준).

  자식 페이지:
    <html xmlns:th="http://www.thymeleaf.org"
          xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
          layout:decorate="~{fragments/layout-front}">
      <head><title>페이지 제목</title></head>
      <body>
        <section layout:fragment="content">...</section>
        <th:block layout:fragment="scripts">...</th:block>  (선택)
      </body>
    </html>

  테마: <html> 의 theme-* 클래스로 --brand-* 스왑 (Design.md §9).
  현재는 모델 변수 themeClass 훅만 제공 — tb_site 테마 컬럼 연동은 P6(데모)에서.
  SiteContext.template.layoutPath 기반 동적 layout 치환은 ViewResolver
  레벨에서 재설계 예정 (decorate chain 내 동적 th:replace 는 재귀 유발).
-->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ko"
      class="h-full bg-bg"
      th:classappend="${themeClass}">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="htmx-config" content='{"includeIndicatorStyles":false}'/>
  <!-- CSRF — app.js 가 htmx:configRequest 헤더로, file-picker 등이 fetch 헤더로 사용 -->
  <meta name="_csrf"        th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
  <title layout:title-pattern="$CONTENT_TITLE | $LAYOUT_TITLE"
         th:text="${siteContext?.site?.siteName} ?: ${@project.nameKo}">홈</title>
  <meta name="description" th:if="${siteContext}" th:content="${siteContext.site.siteName}"/>
  <link th:href="@{/css/output.css}" rel="stylesheet" />
  <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23256ef4'/%3E%3Ctext x='50%25' y='55%25' text-anchor='middle' dominant-baseline='middle' font-family='sans-serif' font-size='16' font-weight='700' fill='%23fff'%3EG%3C/text%3E%3C/svg%3E"/>
  <!-- 고대비 모드 FOUC-free 복원 (nonce 인라인 — CSP 허용). 토글은 app.js. -->
  <script th:attr="nonce=${cspNonce}">
    try { if (localStorage.getItem('pcms-hc') === '1') document.documentElement.classList.add('hc'); } catch (e) {}
  </script>
</head>
<body class="h-full flex flex-col bg-bg text-fg antialiased">
  <a class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-50 focus:px-3 focus:py-2 focus:bg-surface focus:outline-2 focus:outline-brand-50 focus:rounded-medium"
     th:href="@{#main}">본문으로 건너뛰기</a>

  <header role="banner" class="bg-surface border-b border-line">
    <div class="max-w-content mx-auto px-4 py-3 flex items-center gap-4 flex-wrap">
      <a th:href="@{/}" class="flex items-center gap-2 text-body-lg font-bold text-fg-strong hover:text-brand-60">
        <span class="inline-flex items-center justify-center size-7 rounded-medium bg-brand-50 text-fg-on text-body-sm font-bold">G</span>
        <span th:text="${siteContext?.site?.siteName} ?: ${@project.nameKo}">홈</span>
      </a>

      <nav aria-label="주 메뉴" th:if="${siteContext}" class="ml-auto"
           th:with="sc=${siteContext.site.siteCode}">
        <ul class="flex items-center gap-1 text-body-sm">
          <th:block th:each="m : ${siteContext.menuTree}">
            <li th:unless="${m.requiresAuth and not #authorization.expression('isAuthenticated()')}"
                th:with="mUrl=${#strings.isEmpty(m.linkSlug)
                                ? (m.linkUrl ?: '#')
                                : '/' + sc + '/' + m.linkSlug}">
              <a class="px-3 py-1.5 rounded-medium text-fg hover:bg-surface-subtle hover:text-fg-strong"
                 th:href="${mUrl}"
                 th:text="${m.menuName}">메뉴</a>
            </li>
          </th:block>
        </ul>
      </nav>

      <div class="flex items-center gap-3 text-body-sm"
           th:classappend="${siteContext} ? 'border-l border-line pl-4' : 'ml-auto'">
        <button type="button" data-action="toggle-contrast" aria-pressed="false"
                class="krds-btn krds-btn-sm krds-btn-tertiary" title="고대비 모드 전환">
          <span aria-hidden="true">◐</span>
          <span class="sr-only">고대비 모드 전환</span>
        </button>
        <span sec:authorize="isAuthenticated()" class="flex items-center gap-3">
          <span class="leading-tight text-right">
            <a th:href="@{/member/mypage}"
               class="font-medium text-fg-strong hover:text-brand-60 hover:underline block"
               title="마이페이지">
              <span sec:authentication="name">user</span>
            </a>
            <span th:with="llog=${#authentication?.principal?.lastLoginAt}"
                  class="block text-body-xs text-fg-subtle"
                  th:text="${llog != null} ? '최근 ' + ${#temporals.format(llog,'yyyy-MM-dd HH:mm')} : '첫 로그인'">
              최근 2026-04-21 10:00
            </span>
          </span>
          <form th:action="@{/member/logout}" method="post" class="inline">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="hidden" name="siteCode" th:value="${siteContext?.site?.siteCode}"/>
            <button type="submit" class="krds-btn krds-btn-sm krds-btn-tertiary">로그아웃</button>
          </form>
        </span>
        <span sec:authorize="isAnonymous()" class="flex items-center gap-2">
          <a th:href="@{/member/login}" class="krds-btn krds-btn-sm krds-btn-text">로그인</a>
          <a th:href="@{/member/join}" class="krds-btn krds-btn-sm krds-btn-primary">회원가입</a>
        </span>
      </div>
    </div>
  </header>

  <main id="main" role="main" class="flex-1">

    <div class="max-w-content mx-auto px-4 py-12">
      <div class="bg-surface border border-line rounded-large p-8 md:p-12">
        <section layout:fragment="content">



          <p class="text-fg-subtle">기본 콘텐츠 영역</p>




        </section>
      </div>
    </div>
  </main>

  <!-- 푸터 (건양대 표준 공용 — fragments/site-footer) -->
  <th:block th:replace="~{fragments/site-footer :: render}"/>

  <script th:src="@{/js/htmx.min.js}" th:attr="nonce=${cspNonce}"></script>
  <script th:src="@{/js/app.js}" th:attr="nonce=${cspNonce}"></script>
  <!-- 페이지별 추가 스크립트 슬롯 -->
  <th:block layout:fragment="scripts"></th:block>
</body>
</html>
