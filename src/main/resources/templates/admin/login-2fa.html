<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="ko" class="h-full bg-surface-subtle">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="'2단계 인증 | ' + ${@project.nameKo}">2단계 인증</title>
  <link th:href="@{/css/output.css}" rel="stylesheet" />
  <!-- 고대비 모드 FOUC-free 복원 (nonce 인라인 — CSP 허용). layout-admin 과 동일 스니펫 -->
  <script th:attr="nonce=${cspNonce}">
    try { if (localStorage.getItem('pcms-hc') === '1') document.documentElement.classList.add('hc'); } catch (e) {}
  </script>
</head>
<body class="h-full flex items-center justify-center px-4">
  <main role="main" class="w-full max-w-md">

    <div class="bg-surface border border-line rounded-large shadow-sm p-6 md:p-8">
      <div class="mb-6 flex items-center gap-3">
        <span class="inline-flex items-center justify-center w-10 h-10 rounded bg-gray-90 text-fg-on font-bold text-lg">G</span>
        <div>
          <h1 class="text-xl font-bold text-fg-strong">2단계 인증</h1>
          <p class="text-xs text-fg-subtle mt-0.5">
            로그인 <strong class="text-fg-strong" th:text="${loginId}">admin01</strong>
          </p>
        </div>
      </div>

      <p class="text-sm text-fg-subtle mb-4">
        등록된 Authenticator 앱에서 6자리 코드를 입력하세요.
      </p>

      <div th:if="${error}" role="alert"
           class="mb-4 rounded border border-danger-border bg-danger-surface px-4 py-3 text-sm text-danger-fg"
           th:text="${error}"></div>

      <form th:action="@{/admin/login/2fa}" method="post" class="space-y-4">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div>
          <label for="code" class="block text-sm font-medium text-fg mb-1">인증 코드</label>
          <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code"
                 pattern="\d{6}" maxlength="6" required autofocus
                 class="block w-full rounded border border-line px-3 py-2 text-lg font-mono tracking-widest focus:border-brand-50 focus:ring-2 focus:ring-brand-20 focus:outline-none"
                 placeholder="000000"/>
        </div>
        <button type="submit"
                class="w-full inline-flex items-center justify-center px-4 py-2 rounded bg-gray-90 text-fg-on text-sm font-medium hover:bg-gray-70">
          인증
        </button>
      </form>

      <p class="mt-4 text-xs text-fg-subtle text-center">
        인증기를 분실하셨다면 다른 관리자에게 2FA 초기화를 요청하세요.
      </p>
    </div>

  </main>
</body>
</html>
