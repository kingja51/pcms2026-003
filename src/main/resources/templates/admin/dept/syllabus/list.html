<!DOCTYPE html>
<!-- 관리자 수업계획서 관리 — 전체 학과. STAFF 전용(/admin/dept/syllabus). layout-admin decorate. -->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout-admin}"
      lang="ko">
<head>
  <title>수업계획서 관리</title>
</head>
<body>
  <section layout:fragment="content">

    <nav aria-label="상위 경로" class="text-sm text-fg-subtle mb-2">
      <a th:href="@{/admin}" class="hover:underline">대시보드</a> <span class="mx-1">/</span>
      <span>수업계획서</span>
    </nav>

    <div class="flex items-center justify-between gap-4 flex-wrap mb-6">
      <div>
        <h1 class="text-heading-lg font-bold text-fg-strong">수업계획서 관리</h1>
        <p class="text-sm text-fg-subtle mt-1">총 <strong th:text="${syllabusList != null ? #lists.size(syllabusList) : 0}">0</strong> 건 · 학과별 수업계획서(STAFF 전용)</p>
      </div>
      <a th:href="@{/admin/dept/syllabus/new}"
         class="inline-flex items-center px-3 py-1.5 rounded bg-brand-50 text-fg-on text-sm font-medium hover:bg-brand-60">+ 새 수업계획서</a>
    </div>

    <form method="get" class="bg-surface border border-line rounded-large p-4 mb-4">
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-[180px_120px_120px_1fr_auto] gap-3 items-end">
        <div>
          <label class="block text-xs font-medium text-fg-subtle mb-1">학과 선택</label>
          <select name="siteCode" class="block w-full rounded border border-line px-3 py-2 text-sm">
            <option value="">전체 학과</option>
            <option th:each="d : ${depts}" th:value="${d.siteCode}" th:text="${d.deptName} + ' (' + ${d.siteCode} + ')'"
                    th:selected="${d.siteCode == siteCode}">학과</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium text-fg-subtle mb-1">학년도</label>
          <select name="year" class="block w-full rounded border border-line px-3 py-2 text-sm">
            <option value="">전체</option>
            <option th:each="y : ${years}" th:value="${y}" th:text="${y} + '년'" th:selected="${y == year}">2026</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium text-fg-subtle mb-1">학기</label>
          <select name="semester" class="block w-full rounded border border-line px-3 py-2 text-sm">
            <option value="">전체</option>
            <option value="1학기" th:selected="${semester == '1학기'}">1학기</option>
            <option value="2학기" th:selected="${semester == '2학기'}">2학기</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium text-fg-subtle mb-1">검색어 (교과목명/과목코드/담당교수)</label>
          <input name="keyword" type="text" th:value="${keyword}" maxlength="100" class="block w-full rounded border border-line px-3 py-2 text-sm"/>
        </div>
        <div class="flex gap-2">
          <button type="submit" class="inline-flex items-center px-4 py-2 rounded bg-brand-50 text-fg-on text-sm font-medium hover:bg-brand-60">검색</button>
          <a th:href="@{/admin/dept/syllabus}" class="inline-flex items-center px-4 py-2 rounded border border-line text-fg text-sm hover:bg-surface-subtle">초기화</a>
        </div>
      </div>
    </form>

    <div class="bg-surface border border-line rounded-large overflow-x-auto">
      <table class="min-w-full divide-y divide-line text-sm">
        <thead class="bg-surface-subtle text-fg-subtle">
          <tr>
            <th class="px-4 py-3 text-left font-medium whitespace-nowrap">학과</th>
            <th class="px-4 py-3 text-left font-medium whitespace-nowrap">년도·학기</th>
            <th class="px-4 py-3 text-left font-medium">교과목명 · 코드</th>
            <th class="px-4 py-3 text-left font-medium whitespace-nowrap">담당교수</th>
            <th class="px-4 py-3 text-left font-medium whitespace-nowrap">개설학과</th>
            <th class="px-4 py-3 text-left font-medium whitespace-nowrap">파일</th>
            <th class="px-4 py-3 text-right font-medium whitespace-nowrap">관리</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-divider">
          <tr th:each="s : ${syllabusList}" class="hover:bg-surface-subtle align-top">
            <td class="px-4 py-3 whitespace-nowrap font-mono text-fg-subtle" th:text="${s.siteCode}">me</td>
            <td class="px-4 py-3 whitespace-nowrap font-mono">
              <span th:text="${s.year}">2026</span> <span th:text="${s.semester}">2학기</span>
            </td>
            <td class="px-4 py-3">
              <span class="font-medium text-fg-strong" th:text="${s.courseName}">교과목명</span>
              <span class="text-fg-disabled font-mono text-xs" th:if="${s.courseCode}" th:text="'[' + ${s.courseCode} + ']'">[코드]</span>
            </td>
            <td class="px-4 py-3 whitespace-nowrap" th:text="${s.professor}">담당교수</td>
            <td class="px-4 py-3 whitespace-nowrap text-fg-subtle" th:text="${s.deptName}">개설학과</td>
            <td class="px-4 py-3 whitespace-nowrap">
              <a th:if="${!#strings.isEmpty(s.fileGroupId)}"
                 th:href="@{/api/v1/file/group/{gid}/download(gid=${s.fileGroupId})}"
                 class="text-brand-60 hover:underline">다운로드</a>
              <span th:unless="${!#strings.isEmpty(s.fileGroupId)}" class="text-fg-disabled">-</span>
            </td>
            <td class="px-4 py-3 whitespace-nowrap text-right">
              <a th:href="@{/admin/dept/syllabus/{id}/edit(id=${s.syllabusId})}" class="inline-flex items-center justify-center w-7 h-7 rounded border border-line bg-surface align-middle text-brand-60 hover:bg-surface-subtle mr-1" title="수정"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="align-middle" aria-hidden="true"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg><span class="sr-only">수정</span></a>
              <form th:action="@{/admin/dept/syllabus/{id}/delete(id=${s.syllabusId})}" method="post" class="inline-block align-middle"
                    data-confirm="이 수업계획서를 삭제하시겠습니까?">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="inline-flex items-center justify-center w-7 h-7 rounded border border-line bg-surface align-middle text-danger-fg hover:bg-danger-surface" title="삭제"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="align-middle" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg><span class="sr-only">삭제</span></button>
              </form>
            </td>
          </tr>
          <tr th:if="${syllabusList == null or #lists.isEmpty(syllabusList)}">
            <td colspan="7" class="px-4 py-10 text-center text-fg-subtle">등록된 수업계획서가 없습니다.</td>
          </tr>
        </tbody>
      </table>
    </div>

  </section>
</body>
</html>
