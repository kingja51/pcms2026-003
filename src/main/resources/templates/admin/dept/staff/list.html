<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout-admin}" lang="ko">
<head><title>직원 관리</title></head>
<body>
  <section layout:fragment="content">
    <nav aria-label="상위 경로" class="text-sm text-fg-subtle mb-2">
      <a th:href="@{/admin}" class="hover:underline">대시보드</a> <span class="mx-1">/</span> <span>직원</span>
    </nav>
    <div class="flex items-center justify-between gap-4 flex-wrap mb-6">
      <div><h1 class="text-heading-lg font-bold text-fg-strong">직원 관리</h1>
        <p class="text-sm text-fg-subtle mt-1">총 <strong th:text="${list != null ? #lists.size(list) : 0}">0</strong> 명</p></div>
      <a th:href="@{/admin/dept/staff/new}" class="inline-flex items-center px-3 py-1.5 rounded bg-brand-50 text-fg-on text-sm font-medium hover:bg-brand-60">+ 새 직원</a>
    </div>
    <form method="get" class="bg-surface border border-line rounded-large p-4 mb-4">
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-[200px_170px_1fr_auto] gap-3 items-end">
        <div>
          <label class="block text-xs font-medium text-fg-subtle mb-1">학과 선택</label>
          <select name="siteCode" class="block w-full rounded border border-line px-3 py-2 text-sm">
            <option value="">전체 학과</option>
            <option th:each="d : ${depts}" th:value="${d.siteCode}" th:text="${d.deptName} + ' (' + ${d.siteCode} + ')'"
                    th:selected="${d.siteCode == siteCode}">학과</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium text-fg-subtle mb-1">직책</label>
          <select name="position" class="block w-full rounded border border-line px-3 py-2 text-sm">
            <option value="">전체</option>
            <option th:each="o : ${@code.options('STAFF_POSITION')}" th:value="${o.code}" th:text="${o.codeName}"
                    th:selected="${o.code == position}">직책</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium text-fg-subtle mb-1">검색어 (이름/직책/담당업무)</label>
          <input name="keyword" type="text" th:value="${keyword}" maxlength="100" class="block w-full rounded border border-line px-3 py-2 text-sm"/>
        </div>
        <div class="flex gap-2">
          <button type="submit" class="inline-flex items-center px-4 py-2 rounded bg-brand-50 text-fg-on text-sm font-medium hover:bg-brand-60">검색</button>
          <a th:href="@{/admin/dept/staff}" class="inline-flex items-center px-4 py-2 rounded border border-line text-fg text-sm hover:bg-surface-subtle">초기화</a>
        </div>
      </div>
    </form>
    <div class="bg-surface border border-line rounded-large overflow-x-auto">
      <table class="min-w-full divide-y divide-line text-sm">
        <thead class="bg-surface-subtle text-fg-subtle"><tr>
          <th class="px-4 py-3 text-left font-medium">사이트</th>
          <th class="px-4 py-3 text-left font-medium">직책</th>
          <th class="px-4 py-3 text-left font-medium">담당업무</th>
          <th class="px-4 py-3 text-left font-medium">연락처</th>
          <th class="px-4 py-3 text-left font-medium">사무실</th>
          <th class="px-4 py-3 text-right font-medium">관리</th>
        </tr></thead>
        <tbody class="divide-y divide-divider">
          <tr th:each="s : ${list}" class="hover:bg-surface-subtle align-top">
            <td class="px-4 py-3 whitespace-nowrap font-mono text-fg-subtle" th:text="${s.siteCode}">me</td>
            <td class="px-4 py-3 whitespace-nowrap font-medium text-fg-strong" th:text="${s.name} ?: ${s.position}">직책</td>
            <td class="px-4 py-3 text-fg-subtle" th:text="${s.duty}">담당업무</td>
            <td class="px-4 py-3 whitespace-nowrap font-mono text-fg-subtle" th:text="${s.phone}">연락처</td>
            <td class="px-4 py-3 whitespace-nowrap text-fg-subtle" th:text="${s.office}">사무실</td>
            <td class="px-4 py-3 whitespace-nowrap text-right">
              <a th:href="@{/admin/dept/staff/{id}/edit(id=${s.staffId})}" class="inline-flex items-center justify-center w-7 h-7 rounded border border-line bg-surface align-middle text-brand-60 hover:bg-surface-subtle mr-1" title="수정"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="align-middle" aria-hidden="true"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg><span class="sr-only">수정</span></a>
              <form th:action="@{/admin/dept/staff/{id}/delete(id=${s.staffId})}" method="post" class="inline-block align-middle" data-confirm="삭제하시겠습니까?">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="inline-flex items-center justify-center w-7 h-7 rounded border border-line bg-surface align-middle text-danger-fg hover:bg-danger-surface" title="삭제"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="align-middle" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg><span class="sr-only">삭제</span></button></form>
            </td>
          </tr>
          <tr th:if="${list == null or #lists.isEmpty(list)}"><td colspan="6" class="px-4 py-10 text-center text-fg-subtle">등록된 직원이 없습니다.</td></tr>
        </tbody>
      </table>
    </div>
  </section>
</body>
</html>
