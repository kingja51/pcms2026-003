<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout-admin}" lang="ko">
<head><title>학과 마스터 관리</title></head>
<body>
  <section layout:fragment="content">
    <nav aria-label="상위 경로" class="text-sm text-fg-subtle mb-2">
      <a th:href="@{/admin}" class="hover:underline">대시보드</a> <span class="mx-1">/</span> <span>학과 마스터</span>
    </nav>
    <div class="flex items-center justify-between gap-4 flex-wrap mb-6">
      <div>
        <h1 class="text-heading-lg font-bold text-fg-strong">학과 마스터</h1>
        <p class="text-sm text-fg-subtle mt-1">총 <strong th:text="${list != null ? #lists.size(list) : 0}">0</strong> 개 학과</p>
      </div>
      <a th:href="@{/admin/dept/master/new}" class="inline-flex items-center px-3 py-1.5 rounded bg-brand-50 text-fg-on text-sm font-medium hover:bg-brand-60">+ 새 학과</a>
    </div>
    <form method="get" class="bg-surface border border-line rounded-large p-3 mb-4">
      <div class="flex items-center gap-2 flex-wrap">
        <select name="college" aria-label="단과대학" class="rounded border border-line px-3 py-2 text-sm w-48 shrink-0">
          <option value="">전체 단과대학</option>
          <option th:each="c : ${colleges}" th:value="${c.deptName}"
                  th:text="${(c.campus != null ? c.campus + ' · ' : '') + c.deptName}"
                  th:selected="${c.deptName == college}">단과대학</option>
        </select>
        <select name="siteCode" aria-label="학과(사이트) 선택" class="rounded border border-line px-3 py-2 text-sm w-44 shrink-0">
          <option value="">전체 학과</option>
          <option th:each="d : ${depts}" th:value="${d.siteCode}" th:text="${d.deptName} + ' (' + ${d.siteCode} + ')'"
                  th:selected="${d.siteCode == siteCode}">학과</option>
        </select>
        <input name="keyword" type="text" th:value="${keyword}" maxlength="100"
               placeholder="학과명 / 코드 / 단과대학 / 캠퍼스"
               aria-label="검색어"
               class="rounded border border-line px-3 py-2 text-sm flex-1 min-w-52"/>
        <button type="submit" class="inline-flex items-center px-4 py-2 rounded bg-brand-50 text-fg-on text-sm font-medium hover:bg-brand-60 shrink-0">검색</button>
        <a th:href="@{/admin/dept/master}" class="inline-flex items-center px-4 py-2 rounded border border-line text-fg text-sm hover:bg-surface-subtle shrink-0">초기화</a>
      </div>
    </form>
    <div class="bg-surface border border-line rounded-large overflow-x-auto">
      <table class="min-w-full divide-y divide-line text-sm">
        <thead class="bg-surface-subtle text-fg-subtle">
          <tr>
            <th class="px-4 py-3 text-left font-medium whitespace-nowrap">유형</th>
            <th class="px-4 py-3 text-left font-medium whitespace-nowrap">사이트</th>
            <th class="px-4 py-3 text-left font-medium whitespace-nowrap">학과코드</th>
            <th class="px-4 py-3 text-left font-medium">학과명</th>
            <th class="px-4 py-3 text-left font-medium whitespace-nowrap">캠퍼스</th>
            <th class="px-4 py-3 text-left font-medium whitespace-nowrap">단과대학</th>
            <th class="px-4 py-3 text-right font-medium whitespace-nowrap">관리</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-divider">
          <tr th:each="d : ${list}"
              th:classappend="${d.nodeType == 'CAMPUS'} ? 'bg-surface-subtler' : (${d.nodeType == 'COLLEGE'} ? 'bg-surface-subtle' : 'hover:bg-surface-subtle')">
            <td class="px-4 py-3 whitespace-nowrap">
              <span class="inline-block px-2 py-0.5 rounded text-xs font-mono"
                    th:classappend="${d.nodeType == 'CAMPUS'} ? 'bg-secondary-10 text-secondary-70' : (${d.nodeType == 'COLLEGE'} ? 'bg-information-10 text-info-fg' : (${d.nodeType == 'MAJOR'} ? 'bg-warning-10 text-warning-fg' : 'bg-surface-subtler text-fg-subtle'))"
                    th:text="${d.nodeType}">DEPT</span>
            </td>
            <td class="px-4 py-3 whitespace-nowrap font-mono text-fg-subtle" th:text="${d.siteCode}">me</td>
            <td class="px-4 py-3 whitespace-nowrap font-mono" th:text="${d.deptCode}">ME</td>
            <td class="px-4 py-3">
              <span th:style="'padding-left:' + ${(d.depth != null ? d.depth - 1 : 0) * 20} + 'px'" class="inline-flex items-baseline gap-1">
                <span class="text-gray-30 select-none" th:if="${d.depth != null and d.depth > 1}" aria-hidden="true">└</span>
                <a th:href="@{/admin/dept/master/{id}(id=${d.deptId})}"
                   th:classappend="${d.nodeType == 'CAMPUS'} ? 'font-bold text-fg-strong' : (${d.nodeType == 'COLLEGE'} ? 'font-semibold text-fg-strong' : 'font-medium text-fg-strong')"
                   class="hover:text-brand-60 hover:underline" th:text="${d.deptName}">학과명</a>
                <span class="text-fg-disabled text-xs" th:if="${d.deptNameEn}" th:text="${d.deptNameEn}">EN</span>
              </span>
            </td>
            <td class="px-4 py-3 whitespace-nowrap text-fg-subtle" th:text="${d.campus}">캠퍼스</td>
            <td class="px-4 py-3 whitespace-nowrap text-fg-subtle" th:text="${d.college}">단과대학</td>
            <td class="px-4 py-3 whitespace-nowrap text-right">
              <a th:href="@{/admin/dept/master/{id}(id=${d.deptId})}" class="inline-flex items-center justify-center w-7 h-7 rounded border border-line bg-surface align-middle text-fg-subtle hover:bg-surface-subtle mr-1" title="상세"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="align-middle" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg><span class="sr-only">상세</span></a>
              <a th:href="@{/admin/dept/master/{id}/edit(id=${d.deptId})}" class="inline-flex items-center justify-center w-7 h-7 rounded border border-line bg-surface align-middle text-brand-60 hover:bg-surface-subtle mr-1" title="수정"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="align-middle" aria-hidden="true"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg><span class="sr-only">수정</span></a>
              <form th:action="@{/admin/dept/master/{id}/delete(id=${d.deptId})}" method="post" class="inline-block align-middle" data-confirm="삭제하시겠습니까?">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="inline-flex items-center justify-center w-7 h-7 rounded border border-line bg-surface align-middle text-danger-fg hover:bg-danger-surface" title="삭제"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="align-middle" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg><span class="sr-only">삭제</span></button>
              </form>
            </td>
          </tr>
          <tr th:if="${list == null or #lists.isEmpty(list)}"><td colspan="7" class="px-4 py-10 text-center text-fg-subtle">등록된 학과가 없습니다.</td></tr>
        </tbody>
      </table>
    </div>
  </section>
</body>
</html>
