<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout-admin}"
      lang="ko">
<head>
  <title>개인정보 수정</title>
</head>
<body>
  <section layout:fragment="content" class="max-w-2xl mx-auto">

    <nav aria-label="상위 경로" class="text-sm text-fg-subtle mb-2">
      <a th:href="@{/admin/dashboard}" class="hover:underline">대시보드</a>
      <span class="mx-1">/</span>
      <a th:href="@{/admin/mypage}" class="hover:underline">마이페이지</a>
      <span class="mx-1">/</span>
      <span>개인정보 수정</span>
    </nav>

    <h1 class="text-heading-lg font-bold text-fg-strong mb-1">개인정보 수정</h1>
    <p class="text-sm text-fg-subtle mb-6">
      로그인 ID는 변경할 수 없습니다. 이메일·전화 등 PII 는 암호화되어 저장됩니다.
    </p>

    <div th:if="${error}" role="alert"
         class="mb-4 rounded border border-danger-border bg-danger-surface px-4 py-3 text-sm text-danger-fg"
         th:text="${error}"></div>

    <form th:action="@{/admin/mypage/profile}" th:object="${form}" method="post"
          class="bg-surface border border-line rounded-large p-6 shadow-sm space-y-4">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div class="sm:col-span-2">
          <label class="block text-sm font-medium text-fg mb-1">로그인 ID</label>
          <input type="text" disabled th:value="${admin.loginId}"
                 class="block w-full rounded border border-divider bg-surface-subtle px-3 py-2 text-sm text-fg-subtle"/>
        </div>

        <div>
          <label for="adminName" class="block text-sm font-medium text-fg mb-1">
            이름 <span class="text-danger-fg">*</span>
          </label>
          <input id="adminName" type="text" th:field="*{adminName}" required maxlength="100"
                 class="block w-full rounded border border-line px-3 py-2 text-sm focus:border-brand-50 focus:ring-2 focus:ring-brand-20 focus:outline-none"
                 th:classappend="${#fields.hasErrors('adminName')} ? ' border-danger-50' : ''"/>
          <p th:if="${#fields.hasErrors('adminName')}" class="mt-1 text-xs text-danger-fg"
             th:errors="*{adminName}">이름 오류</p>
        </div>

        <div>
          <label for="email" class="block text-sm font-medium text-fg mb-1">
            이메일 <span class="text-danger-fg">*</span>
          </label>
          <input id="email" type="email" th:field="*{email}" required maxlength="255"
                 class="block w-full rounded border border-line px-3 py-2 text-sm focus:border-brand-50 focus:ring-2 focus:ring-brand-20 focus:outline-none"
                 th:classappend="${#fields.hasErrors('email')} ? ' border-danger-50' : ''"/>
          <p th:if="${#fields.hasErrors('email')}" class="mt-1 text-xs text-danger-fg"
             th:errors="*{email}">이메일 오류</p>
        </div>

        <div>
          <label for="phone" class="block text-sm font-medium text-fg mb-1">전화</label>
          <input id="phone" type="tel" th:field="*{phone}" maxlength="20"
                 placeholder="010-1234-5678"
                 class="block w-full rounded border border-line px-3 py-2 text-sm focus:border-brand-50 focus:ring-2 focus:ring-brand-20 focus:outline-none"
                 th:classappend="${#fields.hasErrors('phone')} ? ' border-danger-50' : ''"/>
          <p th:if="${#fields.hasErrors('phone')}" class="mt-1 text-xs text-danger-fg"
             th:errors="*{phone}">전화 오류</p>
        </div>

        <div class="md:col-span-2">
          <label for="departmentId" class="block text-sm font-medium text-fg mb-1">부서</label>
          <select id="departmentId" th:field="*{departmentId}"
                  class="block w-full rounded border border-line px-3 py-2 text-sm focus:border-brand-50 focus:ring-2 focus:ring-brand-20 focus:outline-none">
            <option value="">(미지정)</option>
            <option th:each="o : ${departmentOptions}"
                    th:value="${o.departmentId}"
                    th:text="${o.indentedName}">부서명</option>
          </select>
        </div>
      </div>

      <div class="flex items-center gap-2 pt-2">
        <button type="submit"
                class="inline-flex items-center px-4 py-2 rounded bg-brand-50 text-fg-on text-sm font-semibold hover:bg-brand-60">
          저장
        </button>
        <a th:href="@{/admin/mypage}"
           class="inline-flex items-center px-4 py-2 rounded border border-line bg-surface text-fg text-sm hover:bg-surface-subtle">
          취소
        </a>
      </div>
    </form>

  </section>
</body>
</html>
