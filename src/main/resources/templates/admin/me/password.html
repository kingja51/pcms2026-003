<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout-admin}"
      lang="ko">
<head>
  <title>비밀번호 변경</title>
</head>
<body>
  <section layout:fragment="content" class="max-w-xl mx-auto">

    <nav aria-label="상위 경로" class="text-sm text-fg-subtle mb-2">
      <a th:href="@{/admin/dashboard}" class="hover:underline">대시보드</a>
      <span class="mx-1">/</span>
      <a th:href="@{/admin/mypage}" class="hover:underline">마이페이지</a>
      <span class="mx-1">/</span>
      <span>비밀번호 변경</span>
    </nav>

    <h1 class="text-heading-lg font-bold text-fg-strong mb-1">비밀번호 변경</h1>
    <p class="text-sm text-fg-subtle mb-6">
      현재 비밀번호를 확인한 후 새 비밀번호로 변경합니다.
      새 비밀번호는 8자 이상(3종 조합) 또는 10자 이상(2종 조합).
    </p>

    <div th:if="${error}" role="alert"
         class="mb-4 rounded border border-danger-border bg-danger-surface px-4 py-3 text-sm text-danger-fg"
         th:text="${error}"></div>

    <form id="adminPasswordForm" th:action="@{/admin/mypage/password}" th:object="${form}" method="post"
          autocomplete="off"
          class="bg-surface border border-line rounded-large p-6 shadow-sm space-y-4"
          data-validate-password-policy novalidate>
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <th:block th:replace="~{fragments/captcha-v3 :: widget(action='admin_password_change', formId='adminPasswordForm')}"/>

      <div>
        <label for="currentPassword" class="block text-sm font-medium text-fg mb-1">
          현재 비밀번호 <span class="text-danger-fg">*</span>
        </label>
        <input id="currentPassword" type="password" th:field="*{currentPassword}" required
               autocomplete="current-password"
               class="block w-full rounded border border-line px-3 py-2 text-sm focus:border-brand-50 focus:ring-2 focus:ring-brand-20 focus:outline-none"
               th:classappend="${#fields.hasErrors('currentPassword')} ? ' border-danger-50' : ''"/>
        <p th:if="${#fields.hasErrors('currentPassword')}" class="mt-1 text-xs text-danger-fg"
           th:errors="*{currentPassword}">필수 입력</p>
      </div>

      <div>
        <label for="newPassword" class="block text-sm font-medium text-fg mb-1">
          새 비밀번호 <span class="text-danger-fg">*</span>
        </label>
        <input id="newPassword" type="password" th:field="*{newPassword}" required
               minlength="8" maxlength="100" autocomplete="new-password"
               aria-describedby="newPasswordErr newPasswordHelp"
               class="block w-full rounded border border-line px-3 py-2 text-sm focus:border-brand-50 focus:ring-2 focus:ring-brand-20 focus:outline-none"
               th:classappend="${#fields.hasErrors('newPassword')} ? ' border-danger-50' : ''"/>
        <p id="newPasswordHelp" class="mt-1 text-xs text-fg-subtle">
          8자 이상(영문 대/소문자·숫자·특수기호 중 3종) 또는 10자 이상(2종 이상) 조합
        </p>
        <p id="newPasswordErr" data-err="newPassword" class="hidden mt-1 text-xs text-danger-fg" role="alert"></p>
        <p th:if="${#fields.hasErrors('newPassword')}" class="mt-1 text-xs text-danger-fg"
           th:errors="*{newPassword}">비밀번호 오류</p>
      </div>

      <div>
        <label for="newPasswordConfirm" class="block text-sm font-medium text-fg mb-1">
          새 비밀번호 확인 <span class="text-danger-fg">*</span>
        </label>
        <input id="newPasswordConfirm" type="password" th:field="*{newPasswordConfirm}" required
               minlength="8" maxlength="100" autocomplete="new-password"
               aria-describedby="newPasswordConfirmErr"
               class="block w-full rounded border border-line px-3 py-2 text-sm focus:border-brand-50 focus:ring-2 focus:ring-brand-20 focus:outline-none"
               th:classappend="${#fields.hasErrors('newPasswordConfirm') or #fields.hasErrors('newPasswordMatched')} ? ' border-danger-50' : ''"/>
        <p id="newPasswordConfirmErr" data-err="newPasswordConfirm" class="hidden mt-1 text-xs text-danger-fg" role="alert"></p>
        <p th:if="${#fields.hasErrors('newPasswordConfirm')}" class="mt-1 text-xs text-danger-fg"
           th:errors="*{newPasswordConfirm}">확인 오류</p>
        <p th:if="${#fields.hasErrors('newPasswordMatched')}" class="mt-1 text-xs text-danger-fg"
           th:errors="*{newPasswordMatched}">일치 오류</p>
      </div>

      <div class="flex items-center gap-2 pt-2">
        <button type="submit"
                class="inline-flex items-center px-4 py-2 rounded bg-brand-50 text-fg-on text-sm font-semibold hover:bg-brand-60">
          비밀번호 변경
        </button>
        <a th:href="@{/admin/mypage}"
           class="inline-flex items-center px-4 py-2 rounded border border-line bg-surface text-fg text-sm hover:bg-surface-subtle">
          취소
        </a>
      </div>
    </form>

    <script th:src="@{/js/login-validate.js}" th:attr="nonce=${cspNonce}"></script>

  </section>
</body>
</html>
