<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout-admin}"
      lang="ko">
<head>
  <title>마이페이지</title>
</head>
<body>
  <section layout:fragment="content">

    <nav aria-label="상위 경로" class="text-sm text-fg-subtle mb-2">
      <a th:href="@{/admin/dashboard}" class="hover:underline">대시보드</a>
      <span class="mx-1">/</span>
      <span>마이페이지</span>
    </nav>

    <div class="flex items-start justify-between gap-4 flex-wrap mb-6">
      <div>
        <h1 class="text-heading-lg font-bold text-fg-strong">마이페이지</h1>
        <p class="text-sm text-fg-subtle mt-1">개인정보 / 비밀번호 / 2FA / 탈퇴 관리</p>
      </div>
      <nav class="flex items-center gap-2">
        <a th:href="@{/admin/mypage/profile}"
           class="inline-flex items-center px-3 py-1.5 rounded bg-brand-50 text-fg-on text-sm font-medium hover:bg-brand-60">
          개인정보 수정
        </a>
        <a th:href="@{/admin/mypage/password}"
           class="inline-flex items-center px-3 py-1.5 rounded border border-line bg-surface text-fg text-sm hover:bg-surface-subtle">
          비밀번호 변경
        </a>
        <a th:href="@{/admin/me/2fa/setup}"
           class="inline-flex items-center px-3 py-1.5 rounded border border-line bg-surface text-fg text-sm hover:bg-surface-subtle">
          2FA 설정
        </a>
      </nav>
    </div>

    <div th:if="${message}" role="status" aria-live="polite"
         class="mb-4 rounded border border-success-border bg-success-surface px-4 py-3 text-sm text-success-fg"
         th:text="${message}"></div>
    <div th:if="${error}" role="alert" aria-live="polite"
         class="mb-4 rounded border border-danger-border bg-danger-surface px-4 py-3 text-sm text-danger-fg"
         th:text="${error}"></div>

    <section class="bg-surface border border-line rounded-large p-6 shadow-sm mb-4">
      <h2 class="text-xs font-semibold text-fg-subtle uppercase tracking-wide mb-4">내 정보</h2>
      <dl class="grid grid-cols-1 sm:grid-cols-2 gap-x-6 gap-y-3 text-sm">
        <div>
          <dt class="text-fg-subtle">로그인 ID</dt>
          <dd class="font-mono text-fg-strong" th:text="${@mask.loginId(admin.loginId)}">ad***01</dd>
        </div>
        <div>
          <dt class="text-fg-subtle">이름 (마스킹)</dt>
          <dd class="text-fg-strong" th:text="${@mask.name(admin.adminName)}">***</dd>
        </div>
        <div>
          <dt class="text-fg-subtle">이메일 (마스킹)</dt>
          <dd class="font-mono text-fg" th:text="${@mask.email(admin.email)}">***</dd>
        </div>
        <div>
          <dt class="text-fg-subtle">전화 (마스킹)</dt>
          <dd class="font-mono text-fg" th:text="${@mask.phone(admin.phone)}">-</dd>
        </div>
        <div>
          <dt class="text-fg-subtle">부서</dt>
          <dd class="text-fg-strong" th:text="${admin.departmentName} ?: '-'">-</dd>
        </div>
        <div>
          <dt class="text-fg-subtle">상태</dt>
          <dd>
            <span th:with="st=${admin.status}"
                  th:class="${st == 'ACTIVE'} ? 'inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-success-surface text-success-fg'
                           : 'inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-warning-surface text-warning-fg'"
                  th:text="${st}">ACTIVE</span>
          </dd>
        </div>
        <div>
          <dt class="text-fg-subtle">2FA</dt>
          <dd>
            <span th:with="tf=${admin.twoFactorEnabledYn}"
                  th:class="${tf == 'Y'} ? 'inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-success-surface text-success-fg'
                           : 'inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-surface-subtler text-fg-subtle'"
                  th:text="${tf == 'Y'} ? '활성' : '비활성'">비활성</span>
          </dd>
        </div>
        <div>
          <dt class="text-fg-subtle">최종 로그인</dt>
          <dd class="font-mono text-xs text-fg" th:text="${@fmt.dt(admin.lastLoginAt)}">-</dd>
        </div>
        <div>
          <dt class="text-fg-subtle">최종 로그인 IP</dt>
          <dd class="font-mono text-xs text-fg" th:text="${admin.lastLoginIp} ?: '-'">-</dd>
        </div>
      </dl>
    </section>

    <section class="bg-surface border border-danger-border rounded-large p-6 shadow-sm">
      <h2 class="text-xs font-semibold text-danger-fg uppercase tracking-wide mb-4">탈퇴</h2>
      <p class="text-sm text-fg mb-3">
        탈퇴 시 관리자 계정은 즉시 비활성화되며, 감사 보관 기간(3년) 동안 이력만 보관됩니다.
        이 작업은 되돌릴 수 없습니다.
      </p>
      <form th:action="@{/admin/mypage/withdraw}" th:object="${withdrawForm}" method="post"
            data-confirm="정말 관리자 계정을 탈퇴하시겠습니까? 이 작업은 되돌릴 수 없습니다."
            class="space-y-3">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div>
          <label for="withdrawReason" class="block text-sm font-medium text-fg mb-1">
            탈퇴 사유 <span class="text-danger-fg">*</span>
            <span class="text-xs text-fg-subtle font-normal">(10자 이상 500자 이내)</span>
          </label>
          <textarea id="withdrawReason" th:field="*{withdrawReason}"
                    rows="3" minlength="10" maxlength="500" required
                    placeholder="감사 기록 및 사유 확인을 위해 10자 이상 작성해 주세요."
                    class="block w-full rounded border border-line px-3 py-2 text-sm focus:border-danger-50 focus:ring-1 focus:ring-danger-50"
                    th:classappend="${#fields.hasErrors('withdrawReason')} ? ' border-danger-50' : ''"></textarea>
          <p th:if="${#fields.hasErrors('withdrawReason')}"
             class="mt-1 text-xs text-danger-fg"
             th:errors="*{withdrawReason}">탈퇴 사유 오류</p>
        </div>
        <button type="submit"
                class="inline-flex items-center px-3 py-1.5 rounded border border-danger-border bg-surface text-danger-fg text-sm font-medium hover:bg-danger-surface">
          관리자 탈퇴
        </button>
      </form>
    </section>

  </section>
</body>
</html>
