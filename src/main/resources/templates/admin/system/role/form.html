<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout-admin}"
      lang="ko">
<head>
  <title th:text="${mode == 'edit'} ? '역할 수정' : '역할 등록'">역할 폼</title>
</head>
<body>
  <section layout:fragment="content" class="max-w-2xl mx-auto">

    <nav aria-label="상위 경로" class="text-sm text-fg-subtle mb-2">
      <a th:href="@{/admin/system/role}" class="hover:underline">역할</a>
      <span class="mx-1">/</span>
      <span th:text="${mode == 'edit'} ? '수정' : '새 역할'">새 역할</span>
    </nav>

    <h1 class="text-heading-lg font-bold text-fg-strong mb-6"
        th:text="${mode == 'edit'} ? '역할 수정' : '역할 등록'">역할 폼</h1>

    <div th:if="${error}" role="alert"
         class="mb-4 rounded border border-danger-border bg-danger-surface px-4 py-3 text-sm text-danger-fg"
         th:text="${error}"></div>
    <div th:if="${errors}" role="alert"
         class="mb-4 rounded border border-danger-border bg-danger-surface px-4 py-3 text-sm text-danger-fg">
      <ul class="list-disc pl-5">
        <li th:each="e : ${errors}" th:text="${e.defaultMessage}">error</li>
      </ul>
    </div>

    <form th:action="${mode == 'edit'}
                     ? @{/admin/system/role/{id}(id=${form.roleId})}
                     : @{/admin/system/role}"
          method="post"
          th:object="${form}"
          class="bg-surface border border-line rounded-large p-6 space-y-5">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <input type="hidden" th:field="*{roleId}"/>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
        <div>
          <label for="roleCode" class="block text-sm font-medium text-fg mb-1">
            역할 코드 <span class="text-danger-fg">*</span>
          </label>
          <input id="roleCode" type="text" th:field="*{roleCode}"
                 maxlength="50" required
                 pattern="^[A-Z][A-Z0-9_]+$"
                 class="block w-full rounded border border-line px-3 py-2 text-sm font-mono focus:border-brand-50 focus:ring-2 focus:ring-brand-20 focus:outline-none"/>
          <p class="text-xs text-fg-subtle mt-1">예: <code>ROLE_EDITOR</code> (대문자/숫자/_, ROLE_ prefix 권장).</p>
        </div>

        <div>
          <label for="roleName" class="block text-sm font-medium text-fg mb-1">
            역할 이름 <span class="text-danger-fg">*</span>
          </label>
          <input id="roleName" type="text" th:field="*{roleName}" maxlength="100" required
                 class="block w-full rounded border border-line px-3 py-2 text-sm focus:border-brand-50 focus:ring-2 focus:ring-brand-20 focus:outline-none"/>
        </div>

        <div>
          <label for="parentRoleId" class="block text-sm font-medium text-fg mb-1">상위 역할</label>
          <select id="parentRoleId" th:field="*{parentRoleId}"
                  class="block w-full rounded border border-line px-3 py-2 text-sm focus:border-brand-50 focus:ring-2 focus:ring-brand-20 focus:outline-none">
            <option value="">(최상위)</option>
            <option th:each="p : ${parents}"
                    th:if="${p.roleId != form.roleId}"
                    th:value="${p.roleId}"
                    th:text="|${p.roleCode} · ${p.roleName}|"></option>
          </select>
          <p class="text-xs text-fg-subtle mt-1">
            변경 시 closure table (<code>tb_role_hierarchy</code>) 이 자동 재계산됩니다.
          </p>
        </div>

        <div>
          <label for="siteId" class="block text-sm font-medium text-fg mb-1">사이트</label>
          <input id="siteId" type="text" th:field="*{siteId}" maxlength="36"
                 placeholder="(전역 역할은 비워두기)"
                 class="block w-full rounded border border-line px-3 py-2 text-sm font-mono focus:border-brand-50 focus:ring-2 focus:ring-brand-20 focus:outline-none"/>
        </div>

        <div>
          <label for="sortOrder" class="block text-sm font-medium text-fg mb-1">정렬</label>
          <input id="sortOrder" type="number" th:field="*{sortOrder}" min="0" max="99999"
                 class="block w-full rounded border border-line px-3 py-2 text-sm focus:border-brand-50 focus:ring-2 focus:ring-brand-20 focus:outline-none"/>
        </div>

        <div>
          <label for="useYn" class="block text-sm font-medium text-fg mb-1">사용 여부</label>
          <select id="useYn" th:field="*{useYn}"
                  class="block w-full rounded border border-line px-3 py-2 text-sm focus:border-brand-50 focus:ring-2 focus:ring-brand-20 focus:outline-none">
            <option value="Y">사용</option>
            <option value="N">미사용</option>
          </select>
        </div>

        <div class="md:col-span-2">
          <label for="description" class="block text-sm font-medium text-fg mb-1">설명</label>
          <textarea id="description" th:field="*{description}" rows="3" maxlength="500"
                    class="block w-full rounded border border-line px-3 py-2 text-sm focus:border-brand-50 focus:ring-2 focus:ring-brand-20 focus:outline-none"></textarea>
        </div>
      </div>

      <div class="flex items-center justify-end gap-2 pt-4 border-t border-line">
        <a th:href="${mode == 'edit'}
                   ? @{/admin/system/role/{id}(id=${form.roleId})}
                   : @{/admin/system/role}"
           class="inline-flex items-center px-4 py-2 rounded border border-line bg-surface text-fg text-sm hover:bg-surface-subtle">
          취소
        </a>
        <button type="submit"
                class="inline-flex items-center px-4 py-2 rounded bg-brand-50 text-fg-on text-sm font-medium hover:bg-brand-60">
          저장
        </button>
      </div>
    </form>

  </section>
</body>
</html>
