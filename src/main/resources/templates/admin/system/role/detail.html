<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout-admin}"
      lang="ko">
<head>
  <title th:text="|역할 상세 - ${role.roleCode}|">역할 상세</title>
</head>
<body>
  <section layout:fragment="content">

    <nav aria-label="상위 경로" class="text-sm text-fg-subtle mb-2">
      <a th:href="@{/admin/system/role}" class="hover:underline">역할</a>
      <span class="mx-1">/</span>
      <span class="font-mono" th:text="${role.roleCode}">CODE</span>
    </nav>

    <div class="flex items-start justify-between gap-4 flex-wrap mb-6">
      <div>
        <h1 class="text-heading-lg font-bold text-fg-strong" th:text="${role.roleName}">역할 이름</h1>
        <p class="text-xs text-fg-subtle font-mono mt-1" th:text="${role.roleId}">uuid</p>
      </div>
      <nav aria-label="역할 작업" class="flex items-center gap-2">
        <a th:href="@{/admin/system/role/new(parentRoleId=${role.roleId})}"
           class="inline-flex items-center px-3 py-1.5 rounded border border-line bg-surface text-fg text-sm hover:bg-surface-subtle">
          + 하위 역할
        </a>
        <a th:href="@{/admin/system/role/{id}/edit(id=${role.roleId})}"
           class="inline-flex items-center px-3 py-1.5 rounded bg-brand-50 text-fg-on text-sm font-medium hover:bg-brand-60">
          수정
        </a>
        <form th:action="@{/admin/system/role/{id}(id=${role.roleId})}"
              method="post"
              data-confirm="이 역할을 삭제하시겠습니까? (하위 역할 및 배정 관리자 있는 경우 차단됩니다)"
              class="inline">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <input type="hidden" name="_method" value="delete"/>
          <button type="submit"
                  class="inline-flex items-center px-3 py-1.5 rounded border border-danger-border bg-surface text-danger-fg text-sm font-medium hover:bg-danger-surface">
            삭제
          </button>
        </form>
        <button type="button"
                data-history-back
                th:attr="data-history-back-fallback=@{/admin/system/role}"
                class="inline-flex items-center px-3 py-1.5 rounded border border-line bg-surface text-fg text-sm hover:bg-surface-subtle">
          뒤로가기
        </button>
        <a th:href="@{/admin/system/role}"
           class="inline-flex items-center px-3 py-1.5 rounded border border-line bg-surface text-fg text-sm hover:bg-surface-subtle">
          목록
        </a>
      </nav>
    </div>

    <div th:if="${message}" role="status" aria-live="polite"
         class="mb-4 rounded border border-success-border bg-success-surface px-4 py-3 text-sm text-success-fg"
         th:text="${message}"></div>
    <div th:if="${error}" role="alert" aria-live="polite"
         class="mb-4 rounded border border-danger-border bg-danger-surface px-4 py-3 text-sm text-danger-fg"
         th:text="${error}"></div>

    <section aria-labelledby="info-heading"
             class="bg-surface border border-line rounded-large p-6">
      <h2 id="info-heading"
          class="text-xs font-semibold text-fg-subtle uppercase tracking-wide mb-4">기본 정보</h2>
      <dl class="grid grid-cols-1 sm:grid-cols-2 gap-x-6 gap-y-3 text-sm">
        <div>
          <dt class="text-fg-subtle">코드</dt>
          <dd class="font-mono text-fg-strong" th:text="${role.roleCode}">CODE</dd>
        </div>
        <div>
          <dt class="text-fg-subtle">이름</dt>
          <dd class="font-medium text-fg-strong" th:text="${role.roleName}">이름</dd>
        </div>
        <div>
          <dt class="text-fg-subtle">상위 역할</dt>
          <dd class="text-fg">
            <span th:if="${role.parentRoleId}" class="font-mono text-xs"
                  th:text="|${role.parentRoleCode} · ${role.parentRoleName}|">parent</span>
            <span th:unless="${role.parentRoleId}" class="text-fg-disabled">(최상위)</span>
          </dd>
        </div>
        <div>
          <dt class="text-fg-subtle">사이트</dt>
          <dd class="font-mono text-xs text-fg" th:text="${role.siteId} ?: '(전역)'">-</dd>
        </div>
        <div>
          <dt class="text-fg-subtle">직계 자식 수</dt>
          <dd class="text-fg-strong" th:text="${role.childCount}">0</dd>
        </div>
        <div>
          <dt class="text-fg-subtle">정렬</dt>
          <dd class="text-fg-strong" th:text="${role.sortOrder}">0</dd>
        </div>
        <div>
          <dt class="text-fg-subtle">사용 여부</dt>
          <dd>
            <span th:if="${role.useYn == 'Y'}"
                  class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-success-surface text-success-fg">사용</span>
            <span th:unless="${role.useYn == 'Y'}"
                  class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-surface-subtler text-fg-subtle">미사용</span>
          </dd>
        </div>
        <div class="sm:col-span-2">
          <dt class="text-fg-subtle mb-1">설명</dt>
          <dd class="text-fg whitespace-pre-wrap" th:text="${role.description} ?: '-'">-</dd>
        </div>
        <div>
          <dt class="text-fg-subtle">등록자 / 일시</dt>
          <dd class="text-fg">
            <span class="font-mono" th:text="${role.createdBy}">SYSTEM</span>
            <span class="text-fg-disabled mx-1">/</span>
            <span class="font-mono text-xs" th:text="${@fmt.dt(role.createdAt)}">-</span>
          </dd>
        </div>
        <div>
          <dt class="text-fg-subtle">수정자 / 일시</dt>
          <dd class="text-fg">
            <span class="font-mono" th:text="${role.updatedBy} ?: '-'">-</span>
            <span class="text-fg-disabled mx-1">/</span>
            <span class="font-mono text-xs" th:text="${@fmt.dt(role.updatedAt)}">-</span>
          </dd>
        </div>
      </dl>
    </section>

  </section>
</body>
</html>
