<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout-admin}"
      lang="ko">
<head>
  <title th:text="${mode == 'edit'} ? '코드 수정' : '코드 등록'">코드 폼</title>
</head>
<body>
  <section layout:fragment="content" class="max-w-2xl mx-auto">

    <nav aria-label="상위 경로" class="text-sm text-fg-subtle mb-2">
      <a th:href="@{/admin/system/code}" class="hover:underline">공통코드</a>
      <span class="mx-1">/</span>
      <a th:href="@{/admin/system/code/{id}(id=${group.codeGroupId})}"
         class="hover:underline font-mono" th:text="${group.groupCode}">CODE</a>
      <span class="mx-1">/</span>
      <a th:href="@{/admin/system/code/{id}/items(id=${group.codeGroupId})}"
         class="hover:underline">코드</a>
      <span class="mx-1">/</span>
      <span th:text="${mode == 'edit'} ? '수정' : '새 코드'">새 코드</span>
    </nav>

    <h1 class="text-heading-lg font-bold text-fg-strong mb-6"
        th:text="${mode == 'edit'} ? '코드 수정' : '코드 등록'">폼</h1>

    <div th:if="${error}" role="alert"
         class="mb-4 rounded border border-danger-border bg-danger-surface px-4 py-3 text-sm text-danger-fg"
         th:text="${error}"></div>
    <div th:if="${errors}" role="alert"
         class="mb-4 rounded border border-danger-border bg-danger-surface px-4 py-3 text-sm text-danger-fg">
      <ul class="list-disc pl-5">
        <li th:each="e : ${errors}" th:text="${e.defaultMessage}">error</li>
      </ul>
    </div>

    <form th:action="${mode == 'edit'}
                     ? @{/admin/system/code/{gid}/items/{id}(gid=${group.codeGroupId}, id=${form.codeId})}
                     : @{/admin/system/code/{gid}/items(gid=${group.codeGroupId})}"
          method="post"
          th:object="${form}"
          class="bg-surface border border-line rounded-large p-6 space-y-5">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <input type="hidden" th:field="*{codeId}"/>
      <input type="hidden" th:field="*{codeGroupId}"/>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
        <div>
          <label class="block text-sm font-medium text-fg mb-1">소속 그룹</label>
          <input type="text" readonly th:value="|${group.groupCode} · ${group.groupName}|"
                 class="block w-full rounded border border-line bg-surface-subtle px-3 py-2 text-sm font-mono text-fg-subtle"/>
        </div>

        <div>
          <label for="sortOrder" class="block text-sm font-medium text-fg mb-1">정렬</label>
          <input id="sortOrder" type="number" th:field="*{sortOrder}" min="0" max="99999"
                 class="block w-full rounded border border-line px-3 py-2 text-sm focus:border-brand-50 focus:ring-2 focus:ring-brand-20 focus:outline-none"/>
        </div>

        <div>
          <label for="code" class="block text-sm font-medium text-fg mb-1">
            코드 <span class="text-danger-fg">*</span>
          </label>
          <input id="code" type="text" th:field="*{code}"
                 maxlength="50" required pattern="^[A-Z0-9][A-Z0-9_]*$"
                 class="block w-full rounded border border-line px-3 py-2 text-sm font-mono focus:border-brand-50 focus:ring-2 focus:ring-brand-20 focus:outline-none"/>
          <p class="text-xs text-fg-subtle mt-1">대문자/숫자/_. 예: <code>ACTIVE</code></p>
        </div>

        <div>
          <label for="codeName" class="block text-sm font-medium text-fg mb-1">
            코드명 <span class="text-danger-fg">*</span>
          </label>
          <input id="codeName" type="text" th:field="*{codeName}" maxlength="100" required
                 class="block w-full rounded border border-line px-3 py-2 text-sm focus:border-brand-50 focus:ring-2 focus:ring-brand-20 focus:outline-none"/>
        </div>

        <div class="md:col-span-2">
          <label for="codeValue" class="block text-sm font-medium text-fg mb-1">부가값</label>
          <input id="codeValue" type="text" th:field="*{codeValue}" maxlength="500"
                 placeholder="색상 hex / 아이콘 클래스 / 외부 식별자 등 (선택)"
                 class="block w-full rounded border border-line px-3 py-2 text-sm focus:border-brand-50 focus:ring-2 focus:ring-brand-20 focus:outline-none"/>
        </div>

        <div>
          <label for="useYn" class="block text-sm font-medium text-fg mb-1">사용 여부</label>
          <select id="useYn" th:field="*{useYn}"
                  class="block w-full rounded border border-line px-3 py-2 text-sm focus:border-brand-50 focus:ring-2 focus:ring-brand-20 focus:outline-none">
            <option value="Y">사용</option>
            <option value="N">미사용</option>
          </select>
        </div>
      </div>

      <div class="flex items-center justify-end gap-2 pt-4 border-t border-line">
        <a th:href="@{/admin/system/code/{id}/items(id=${group.codeGroupId})}"
           class="inline-flex items-center px-4 py-2 rounded border border-line bg-surface text-fg text-sm hover:bg-surface-subtle">
          취소
        </a>
        <button type="submit"
                class="inline-flex items-center px-4 py-2 rounded bg-brand-50 text-fg-on text-sm font-medium hover:bg-brand-60">
          저장
        </button>
      </div>
    </form>

  </section>
</body>
</html>
