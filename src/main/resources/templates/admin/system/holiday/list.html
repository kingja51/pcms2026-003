<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout-admin}"
      lang="ko">
<head>
  <title>공휴일 관리</title>
</head>
<body>
  <section layout:fragment="content">

    <nav aria-label="상위 경로" class="text-sm text-fg-subtle mb-2">
      <a th:href="@{/admin}" class="hover:underline">대시보드</a> <span class="mx-1">/</span>
      <span>공휴일</span>
    </nav>

    <div class="flex items-center justify-between gap-4 flex-wrap mb-6">
      <div>
        <h1 class="text-heading-lg font-bold text-fg-strong">공휴일 관리</h1>
        <p class="text-sm text-fg-subtle mt-1">총 <strong th:text="${page.totalElements}">0</strong> 건</p>
      </div>
      <a th:href="@{/admin/system/holiday/new}"
         class="inline-flex items-center px-3 py-1.5 rounded bg-brand-50 text-fg-on text-sm font-medium hover:bg-brand-60">+ 새 공휴일</a>
    </div>

    <div th:if="${message}" class="mb-4 rounded border border-success-border bg-success-surface px-4 py-3 text-sm text-success-fg" th:text="${message}"></div>
    <div th:if="${error}"   class="mb-4 rounded border border-danger-border bg-danger-surface px-4 py-3 text-sm text-danger-fg"            th:text="${error}"></div>

    <form th:action="@{/admin/system/holiday}" method="get" class="bg-surface border border-line rounded-large p-4 mb-4">
      <div class="grid grid-cols-1 md:grid-cols-[1fr_120px_160px_auto] gap-3 items-end">
        <div>
          <label class="block text-xs font-medium text-fg-subtle mb-1">검색어 (명칭)</label>
          <input name="keyword" type="text" th:value="${search?.keyword}" maxlength="100"
                 class="block w-full rounded border border-line px-3 py-2 text-sm"/>
        </div>
        <div th:with="currentYear=${T(java.time.Year).now().value}">
          <label class="block text-xs font-medium text-fg-subtle mb-1">연도</label>
          <select name="year" class="block rounded border border-line px-3 py-2 text-sm font-mono">
            <option value="">전체</option>
            <option th:each="y : ${#numbers.sequence(currentYear, 2020)}"
                    th:value="${y}"
                    th:text="${y}"
                    th:selected="${search?.year != null and search.year == y}">2026</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium text-fg-subtle mb-1">유형</label>
          <select name="holidayType" class="block w-full rounded border border-line px-3 py-2 text-sm">
            <option value="">전체</option>
            <option value="PUBLIC"   th:selected="${search?.holidayType == 'PUBLIC'}">법정공휴일</option>
            <option value="COMPANY"  th:selected="${search?.holidayType == 'COMPANY'}">회사휴무</option>
            <option value="MEMORIAL" th:selected="${search?.holidayType == 'MEMORIAL'}">기념일</option>
            <option value="OTHER"    th:selected="${search?.holidayType == 'OTHER'}">기타</option>
          </select>
        </div>
        <div class="flex gap-2">
          <button type="submit" class="px-4 py-2 rounded bg-gray-90 text-fg-on text-sm font-medium">검색</button>
          <a th:href="@{/admin/system/holiday}" class="px-4 py-2 rounded border border-line bg-surface text-fg text-sm">초기화</a>
        </div>
      </div>
    </form>

    <div class="bg-surface border border-line rounded-large overflow-hidden">
      <table class="min-w-full divide-y divide-line text-sm">
        <thead class="bg-surface-subtle">
          <tr class="text-left text-xs font-semibold text-fg-subtle uppercase tracking-wide">
            <th class="px-4 py-3">연도</th>
            <th class="px-4 py-3">날짜</th>
            <th class="px-4 py-3">명칭</th>
            <th class="px-4 py-3">유형</th>
            <th class="px-4 py-3">사용</th>
            <th class="px-4 py-3 text-right">작업</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-divider">
          <tr th:each="row : ${page.content}" class="hover:bg-surface-subtle">
            <td class="px-4 py-2.5 font-mono text-xs text-fg" th:text="${row.year}">2026</td>
            <td class="px-4 py-2.5 font-mono text-xs" th:text="${row.holidayDate}">2026-01-01</td>
            <td class="px-4 py-2.5">
              <a th:href="@{/admin/system/holiday/{id}(id=${row.holidayId})}" class="text-brand-60 hover:underline font-medium" th:text="${row.holidayName}">신정</a>
            </td>
            <td class="px-4 py-2.5"><span class="inline-flex px-2 py-0.5 rounded text-xs bg-surface-subtler" th:text="${row.holidayType}">PUBLIC</span></td>
            <td class="px-4 py-2.5">
              <span th:if="${row.useYn == 'Y'}"  class="inline-flex px-2 py-0.5 rounded text-xs bg-success-surface text-success-fg">사용중</span>
              <span th:unless="${row.useYn == 'Y'}" class="inline-flex px-2 py-0.5 rounded text-xs bg-surface-subtler text-fg-subtle">중지</span>
            </td>
            <td class="px-4 py-2.5 whitespace-nowrap text-right">
              <a th:href="@{/admin/system/holiday/{id}/edit(id=${row.holidayId})}"
                 class="inline-flex items-center justify-center w-7 h-7 rounded border border-line bg-surface align-middle text-brand-60 hover:bg-surface-subtle mr-1" title="수정"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="align-middle" aria-hidden="true"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg><span class="sr-only">수정</span></a>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(page.content)}">
            <td colspan="6" class="px-4 py-10 text-center text-fg-subtle">선택한 연도에 등록된 공휴일이 없습니다.</td>
          </tr>
        </tbody>
      </table>
    </div>

    <nav th:if="${page.totalPages > 1}" class="mt-4">
      <ul class="flex items-center justify-center gap-1 text-sm">
        <li th:each="p : ${#numbers.sequence(1, page.totalPages)}">
          <a th:href="@{/admin/system/holiday(page=${p}, pageSize=${page.pageSize},
                       keyword=${search.keyword},
                       holidayType=${search.holidayType}, year=${search.year})}"
             th:text="${p}"
             th:class="${p == page.page} ? 'inline-flex justify-center min-w-[2rem] px-2 py-1 rounded bg-gray-90 text-fg-on' : 'inline-flex justify-center min-w-[2rem] px-2 py-1 rounded border border-line bg-surface text-fg'">1</a>
        </li>
      </ul>
    </nav>

  </section>
</body>
</html>
