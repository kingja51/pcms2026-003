<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout-admin}"
      lang="ko">
<head><title>공휴일 등록·수정</title></head>
<body>
  <section layout:fragment="content">

    <nav class="text-sm text-fg-subtle mb-2">
      <a th:href="@{/admin}" class="hover:underline">대시보드</a> /
      <a th:href="@{/admin/system/holiday}" class="hover:underline">공휴일</a> /
      <span th:text="${mode == 'create' ? '등록' : '수정'}">등록</span>
    </nav>

    <h1 class="text-heading-lg font-bold text-fg-strong mb-6"
        th:text="${mode == 'create' ? '공휴일 등록' : '공휴일 수정'}">공휴일 등록</h1>

    <div th:if="${error}" class="mb-4 rounded border border-danger-border bg-danger-surface px-4 py-3 text-sm text-danger-fg" th:text="${error}"></div>

    <form th:object="${form}" method="post"
          th:action="${mode == 'create'} ? @{/admin/system/holiday} : @{/admin/system/holiday/{id}(id=${form.holidayId})}"
          class="space-y-5 bg-surface border border-line rounded-large p-6">

      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <input type="hidden" th:if="${mode == 'edit'}" th:field="*{holidayId}"/>

      <p class="text-xs text-fg-subtle">
        공휴일은 모든 사이트가 공유하는 전역 마스터입니다. 등록 시 연도는 날짜에서 자동 추출됩니다.
      </p>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-xs font-medium text-fg-subtle mb-1">날짜 <span class="text-danger-fg">*</span></label>
          <input type="date" th:field="*{holidayDate}" required class="block w-full rounded border border-line px-3 py-2 text-sm"/>
        </div>
        <div>
          <label class="block text-xs font-medium text-fg-subtle mb-1">명칭 <span class="text-danger-fg">*</span></label>
          <input type="text" th:field="*{holidayName}" required maxlength="100" class="block w-full rounded border border-line px-3 py-2 text-sm"/>
        </div>
        <div>
          <label class="block text-xs font-medium text-fg-subtle mb-1">유형 <span class="text-danger-fg">*</span></label>
          <select th:field="*{holidayType}" required class="block w-full rounded border border-line px-3 py-2 text-sm">
            <option value="PUBLIC">법정공휴일</option>
            <option value="COMPANY">회사휴무</option>
            <option value="MEMORIAL">기념일</option>
            <option value="OTHER">기타</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block text-xs font-medium text-fg-subtle mb-1">설명</label>
        <textarea th:field="*{description}" rows="3" maxlength="500" class="block w-full rounded border border-line px-3 py-2 text-sm"></textarea>
      </div>

      <div>
        <label class="inline-flex items-center gap-2 text-sm">
          <input type="checkbox" name="useYn" value="Y" th:checked="${form.useYn == 'Y'}" class="rounded border-line"/>
          사용함
        </label>
      </div>

      <div class="flex justify-end gap-2 pt-4 border-t border-line">
        <a th:href="@{/admin/system/holiday}" class="px-4 py-2 rounded border border-line bg-surface text-fg text-sm">취소</a>
        <button type="submit" class="px-4 py-2 rounded bg-brand-50 text-fg-on text-sm font-medium"
                th:text="${mode == 'create' ? '등록' : '수정'}">등록</button>
      </div>
    </form>

  </section>
</body>
</html>
