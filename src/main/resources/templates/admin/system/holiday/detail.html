<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout-admin}"
      lang="ko">
<head><title>공휴일 상세</title></head>
<body>
  <section layout:fragment="content">

    <nav class="text-sm text-fg-subtle mb-2">
      <a th:href="@{/admin}" class="hover:underline">대시보드</a> /
      <a th:href="@{/admin/system/holiday}" class="hover:underline">공휴일</a> /
      <span th:text="${holiday.holidayName}">제목</span>
    </nav>

    <div class="flex items-center justify-between gap-4 flex-wrap mb-6">
      <div>
        <h1 class="text-heading-lg font-bold text-fg-strong" th:text="${holiday.holidayName}">제목</h1>
        <p class="text-sm text-fg-subtle mt-1">
          <span class="font-mono" th:text="${holiday.year}">2026</span> ·
          <span class="font-mono" th:text="${holiday.holidayDate}">2026-01-01</span>
        </p>
      </div>
      <div class="flex items-center gap-2">
        <a th:href="@{/admin/system/holiday}"
           class="px-3 py-1.5 rounded border border-line bg-surface text-fg text-sm hover:bg-surface-subtle">목록</a>
        <a th:href="@{/admin/system/holiday/{id}/edit(id=${holiday.holidayId})}"
           class="px-3 py-1.5 rounded bg-brand-50 text-fg-on text-sm font-medium">수정</a>

        <form th:action="@{/admin/system/holiday/{id}/use(id=${holiday.holidayId})}" method="post" class="inline">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <input type="hidden" name="active" th:value="${holiday.useYn == 'Y' ? 'false' : 'true'}"/>
          <button type="submit"
                  th:class="${holiday.useYn == 'Y'} ? 'px-3 py-1.5 rounded border border-warning-border bg-warning-surface text-warning-fg text-sm' : 'px-3 py-1.5 rounded border border-success-border bg-success-surface text-success-fg text-sm'"
                  th:text="${holiday.useYn == 'Y' ? '사용중지' : '사용 재개'}">사용중지</button>
        </form>

        <form th:action="@{/admin/system/holiday/{id}/delete(id=${holiday.holidayId})}" method="post" class="inline"
              data-confirm="모든 데이타가 삭제 됩니다. 삭제 하시겠습니까?">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button type="submit" class="px-3 py-1.5 rounded border border-danger-border bg-danger-surface text-danger-fg text-sm">삭제</button>
        </form>
      </div>
    </div>

    <div th:if="${message}" class="mb-4 rounded border border-success-border bg-success-surface px-4 py-3 text-sm text-success-fg" th:text="${message}"></div>
    <div th:if="${error}"   class="mb-4 rounded border border-danger-border bg-danger-surface px-4 py-3 text-sm text-danger-fg"            th:text="${error}"></div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
      <div class="lg:col-span-2 bg-surface border border-line rounded-large p-5">
        <h2 class="text-base font-semibold text-fg-strong mb-3">기본 정보</h2>
        <dl class="grid grid-cols-[120px_1fr] gap-y-2 text-sm">
          <dt class="text-fg-subtle">유형</dt>
          <dd><span class="inline-flex px-2 py-0.5 rounded text-xs bg-surface-subtler" th:text="${holiday.holidayType}">PUBLIC</span></dd>
          <dt class="text-fg-subtle">사용</dt>
          <dd>
            <span th:if="${holiday.useYn == 'Y'}"  class="inline-flex px-2 py-0.5 rounded text-xs bg-success-surface text-success-fg">사용중</span>
            <span th:unless="${holiday.useYn == 'Y'}" class="inline-flex px-2 py-0.5 rounded text-xs bg-surface-subtler text-fg-subtle">중지</span>
          </dd>
          <dt class="text-fg-subtle">설명</dt>
          <dd th:text="${holiday.description ?: '-'}">-</dd>
        </dl>
      </div>
      <div class="bg-surface border border-line rounded-large p-5">
        <h2 class="text-base font-semibold text-fg-strong mb-3">감사 정보</h2>
        <dl class="grid grid-cols-[80px_1fr] gap-y-2 text-sm">
          <dt class="text-fg-subtle">생성</dt>     <dd class="font-mono text-xs" th:text="${@fmt.dt(holiday.createdAt)}">-</dd>
          <dt class="text-fg-subtle">생성자</dt>   <dd class="font-mono text-xs break-all" th:text="${holiday.createdBy ?: '-'}">-</dd>
          <dt class="text-fg-subtle">수정</dt>     <dd class="font-mono text-xs" th:text="${@fmt.dt(holiday.updatedAt)}">-</dd>
          <dt class="text-fg-subtle">수정자</dt>   <dd class="font-mono text-xs break-all" th:text="${holiday.updatedBy ?: '-'}">-</dd>
        </dl>
      </div>
    </div>

  </section>
</body>
</html>
