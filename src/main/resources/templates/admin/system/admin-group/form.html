<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout-admin}"
      lang="ko">
<head>
  <title th:text="${mode == 'edit'} ? '그룹 수정' : '그룹 등록'">그룹 폼</title>
</head>
<body>
  <section layout:fragment="content">

    <nav aria-label="상위 경로" class="text-sm text-fg-subtle mb-2">
      <a th:href="@{/admin/system/admin-group}" class="hover:underline">관리자 그룹</a>
      <span class="mx-1">/</span>
      <span th:text="${mode == 'edit'} ? '수정' : '새 그룹'">새 그룹</span>
    </nav>

    <h1 class="text-heading-lg font-bold text-fg-strong mb-6"
        th:text="${mode == 'edit'} ? '그룹 수정' : '그룹 등록'">그룹 폼</h1>

    <div th:if="${error}" role="alert"
         class="mb-4 rounded border border-danger-border bg-danger-surface px-4 py-3 text-sm text-danger-fg"
         th:text="${error}"></div>
    <div th:if="${errors}" role="alert"
         class="mb-4 rounded border border-danger-border bg-danger-surface px-4 py-3 text-sm text-danger-fg">
      <ul class="list-disc pl-5">
        <li th:each="e : ${errors}" th:text="${e.defaultMessage}">error</li>
      </ul>
    </div>

    <form th:action="${mode == 'edit'}
                     ? @{/admin/system/admin-group/{id}(id=${form.adminGroupId})}
                     : @{/admin/system/admin-group}"
          method="post"
          th:object="${form}"
          class="bg-surface border border-line rounded-large p-6 space-y-5">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <input type="hidden" th:field="*{adminGroupId}"/>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
        <div>
          <label for="groupCode" class="block text-sm font-medium text-fg mb-1">
            그룹 코드 <span class="text-danger-fg">*</span>
          </label>
          <input id="groupCode" type="text" th:field="*{groupCode}"
                 maxlength="30" required
                 pattern="^[A-Z][A-Z0-9_]+$"
                 class="block w-full rounded border border-line px-3 py-2 text-sm font-mono focus:border-brand-50 focus:ring-2 focus:ring-brand-20 focus:outline-none"/>
          <p class="text-xs text-fg-subtle mt-1">대문자/숫자/언더스코어. 예: <code>OPS_ADMIN</code></p>
        </div>

        <div>
          <label for="groupName" class="block text-sm font-medium text-fg mb-1">
            그룹 이름 <span class="text-danger-fg">*</span>
          </label>
          <input id="groupName" type="text" th:field="*{groupName}" maxlength="100" required
                 class="block w-full rounded border border-line px-3 py-2 text-sm focus:border-brand-50 focus:ring-2 focus:ring-brand-20 focus:outline-none"/>
        </div>

        <div>
          <label for="defaultRoleId" class="block text-sm font-medium text-fg mb-1">기본 역할 ID</label>
          <input id="defaultRoleId" type="text" th:field="*{defaultRoleId}" maxlength="36"
                 placeholder="신규 가입 관리자에게 자동 부여 (선택)"
                 class="block w-full rounded border border-line px-3 py-2 text-sm font-mono focus:border-brand-50 focus:ring-2 focus:ring-brand-20 focus:outline-none"/>
        </div>

        <div>
          <label for="twoFactorRequired" class="block text-sm font-medium text-fg mb-1">2FA 강제</label>
          <select id="twoFactorRequired" th:field="*{twoFactorRequired}"
                  class="block w-full rounded border border-line px-3 py-2 text-sm focus:border-brand-50 focus:ring-2 focus:ring-brand-20 focus:outline-none">
            <option value="Y">강제 (권장)</option>
            <option value="N">선택</option>
          </select>
        </div>

        <div>
          <label for="useYn" class="block text-sm font-medium text-fg mb-1">사용 여부</label>
          <select id="useYn" th:field="*{useYn}"
                  class="block w-full rounded border border-line px-3 py-2 text-sm focus:border-brand-50 focus:ring-2 focus:ring-brand-20 focus:outline-none">
            <option value="Y">사용</option>
            <option value="N">미사용</option>
          </select>
        </div>

        <div>
          <label for="allowedTimeFrom" class="block text-sm font-medium text-fg mb-1">
            로그인 허용 시작
          </label>
          <input id="allowedTimeFrom" type="time" th:field="*{allowedTimeFrom}"
                 class="block w-full rounded border border-line px-3 py-2 text-sm focus:border-brand-50 focus:ring-2 focus:ring-brand-20 focus:outline-none"/>
        </div>

        <div>
          <label for="allowedTimeTo" class="block text-sm font-medium text-fg mb-1">
            로그인 허용 종료
          </label>
          <input id="allowedTimeTo" type="time" th:field="*{allowedTimeTo}"
                 class="block w-full rounded border border-line px-3 py-2 text-sm focus:border-brand-50 focus:ring-2 focus:ring-brand-20 focus:outline-none"/>
          <p class="text-xs text-fg-subtle mt-1">비어 있으면 시간 제약 없음.</p>
        </div>

        <div class="md:col-span-2">
          <label for="ipWhitelist" class="block text-sm font-medium text-fg mb-1">
            IP 화이트리스트 (CIDR CSV)
          </label>
          <input id="ipWhitelist" type="text" th:field="*{ipWhitelist}" maxlength="2000"
                 placeholder="10.0.0.0/8, 192.168.1.0/24"
                 class="block w-full rounded border border-line px-3 py-2 text-sm font-mono focus:border-brand-50 focus:ring-2 focus:ring-brand-20 focus:outline-none"/>
          <p class="text-xs text-fg-subtle mt-1">개인 관리자 레코드가 비어 있을 때 상속됩니다.</p>
        </div>

        <div class="md:col-span-2">
          <label for="passwordPolicyId" class="block text-sm font-medium text-fg mb-1">
            비밀번호 정책 ID
          </label>
          <input id="passwordPolicyId" type="text" th:field="*{passwordPolicyId}" maxlength="36"
                 placeholder="tb_password_policy 참조 (선택)"
                 class="block w-full rounded border border-line px-3 py-2 text-sm font-mono focus:border-brand-50 focus:ring-2 focus:ring-brand-20 focus:outline-none"/>
        </div>

        <div class="md:col-span-2">
          <label for="description" class="block text-sm font-medium text-fg mb-1">설명</label>
          <textarea id="description" th:field="*{description}" rows="3" maxlength="500"
                    class="block w-full rounded border border-line px-3 py-2 text-sm focus:border-brand-50 focus:ring-2 focus:ring-brand-20 focus:outline-none"></textarea>
        </div>
      </div>

      <div class="flex items-center justify-end gap-2 pt-4 border-t border-line">
        <a th:href="${mode == 'edit'}
                   ? @{/admin/system/admin-group/{id}(id=${form.adminGroupId})}
                   : @{/admin/system/admin-group}"
           class="inline-flex items-center px-4 py-2 rounded border border-line bg-surface text-fg text-sm hover:bg-surface-subtle">
          취소
        </a>
        <button type="submit"
                class="inline-flex items-center px-4 py-2 rounded bg-brand-50 text-fg-on text-sm font-medium hover:bg-brand-60">
          저장
        </button>
      </div>
    </form>

  </section>
</body>
</html>
