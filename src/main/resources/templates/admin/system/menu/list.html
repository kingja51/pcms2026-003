<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout-admin}"
      lang="ko">
<head>
  <title th:text="|${site.siteName} - 메뉴 관리|">메뉴 관리</title>
</head>
<body>
  <section layout:fragment="content">

    <nav aria-label="상위 경로" class="text-sm text-fg-subtle mb-2">
      <a th:href="@{/admin/system/site}" class="hover:underline">사이트 목록</a>
      <span class="mx-1">/</span>
      <a th:href="@{/admin/system/site/{id}(id=${site.siteId})}"
         class="hover:underline font-mono" th:text="${site.siteCode}">SITE</a>
      <span class="mx-1">/</span>
      <span>메뉴</span>
    </nav>

    <div class="flex items-center justify-between gap-4 flex-wrap mb-6">
      <h1 class="text-heading-lg font-bold text-fg-strong" th:text="|${site.siteName} · 메뉴 관리|">메뉴 관리</h1>
      <div class="flex items-center gap-2">
        <a th:href="@{/admin/system/site/{id}/menu/new(id=${site.siteId})}"
           class="inline-flex items-center px-3 py-1.5 rounded bg-brand-50 text-fg-on text-sm font-medium hover:bg-brand-60">+ 새 메뉴</a>
        <details class="relative">
          <summary class="list-none inline-flex items-center px-3 py-1.5 rounded border border-line bg-surface text-fg text-sm hover:bg-surface-subtle cursor-pointer">
            엑셀 다운로드
          </summary>
          <div class="absolute right-0 mt-1 p-4 w-80 bg-surface border border-line rounded-large shadow-lg z-10">
            <form th:action="@{/admin/system/site/{id}/menu/excel(id=${site.siteId})}"
                  method="post" class="space-y-2">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
              <input type="hidden" name="keyword"  th:value="${search?.keyword}"/>
              <input type="hidden" name="useYn"    th:value="${search?.useYn}"/>
              <input type="hidden" name="menuType" th:value="${search?.menuType}"/>
              <label for="menu-dl-reason" class="block text-xs font-medium text-fg">
                다운로드 사유 <span class="text-danger-fg">*</span> (10자 이상)
              </label>
              <textarea id="menu-dl-reason" name="downloadReason" required
                        minlength="10" maxlength="500" rows="3"
                        placeholder="예: 사이트 IA 리뷰용 메뉴 트리 추출"
                        class="block w-full rounded border border-line px-2 py-1.5 text-sm focus:border-brand-50 focus:ring-2 focus:ring-brand-20 focus:outline-none"></textarea>
              <button type="submit"
                      class="w-full inline-flex items-center justify-center px-3 py-1.5 rounded bg-brand-50 text-fg-on text-sm font-medium hover:bg-brand-60">
                다운로드
              </button>
              <p class="text-[11px] text-fg-subtle">사유는 감사로그(<code>log_audit</code>) 에 기록됩니다.</p>
            </form>
          </div>
        </details>
        <a th:href="@{/admin/system/site/{id}(id=${site.siteId})}"
           class="inline-flex items-center px-3 py-1.5 rounded border border-line bg-surface text-fg text-sm hover:bg-surface-subtle">사이트 상세로</a>
      </div>
    </div>

    <div th:if="${message}" role="status" aria-live="polite"
         class="mb-4 rounded border border-success-border bg-success-surface px-4 py-3 text-sm text-success-fg" th:text="${message}"></div>
    <div th:if="${error}" role="alert" aria-live="polite"
         class="mb-4 rounded border border-danger-border bg-danger-surface px-4 py-3 text-sm text-danger-fg" th:text="${error}"></div>

    <!-- 검색 -->
    <form th:action="@{/admin/system/site/{id}/menu(id=${site.siteId})}"
          method="get" role="search" aria-label="메뉴 검색"
          class="bg-surface border border-line rounded-large p-4 mb-4">
      <div class="grid grid-cols-1 md:grid-cols-[1fr_auto_auto_auto] gap-3 items-end">
        <div>
          <label for="keyword" class="block text-xs font-medium text-fg-subtle mb-1">검색어</label>
          <input id="keyword" name="keyword" type="text"
                 th:value="${search?.keyword}" maxlength="100" placeholder="메뉴명/링크URL"
                 class="block w-full rounded border border-line px-3 py-2 text-sm focus:border-brand-50 focus:ring-2 focus:ring-brand-20 focus:outline-none"/>
        </div>
        <div>
          <label for="menuType" class="block text-xs font-medium text-fg-subtle mb-1">타입</label>
          <select id="menuType" name="menuType"
                  class="block w-full rounded border border-line px-3 py-2 text-sm focus:border-brand-50 focus:ring-2 focus:ring-brand-20 focus:outline-none">
            <option value="" th:selected="${search?.menuType == null or search?.menuType == ''}">전체</option>
            <option value="CONTENT" th:selected="${search?.menuType == 'CONTENT'}">CONTENT</option>
            <option value="BOARD" th:selected="${search?.menuType == 'BOARD'}">BOARD</option>
            <option value="URL" th:selected="${search?.menuType == 'URL'}">URL</option>
            <option value="FOLDER" th:selected="${search?.menuType == 'FOLDER'}">FOLDER</option>
          </select>
        </div>
        <div>
          <label for="useYn" class="block text-xs font-medium text-fg-subtle mb-1">사용</label>
          <select id="useYn" name="useYn"
                  class="block w-full rounded border border-line px-3 py-2 text-sm focus:border-brand-50 focus:ring-2 focus:ring-brand-20 focus:outline-none">
            <option value="" th:selected="${search?.useYn == null or search?.useYn == ''}">전체</option>
            <option value="Y" th:selected="${search?.useYn == 'Y'}">사용</option>
            <option value="N" th:selected="${search?.useYn == 'N'}">미사용</option>
          </select>
        </div>
        <div class="flex items-center gap-2">
          <button type="submit"
                  class="inline-flex items-center px-4 py-2 rounded bg-gray-90 text-fg-on text-sm font-medium hover:bg-gray-70">검색</button>
          <a th:href="@{/admin/system/site/{id}/menu(id=${site.siteId})}"
             class="inline-flex items-center px-4 py-2 rounded border border-line bg-surface text-fg text-sm hover:bg-surface-subtle">초기화</a>
        </div>
      </div>
    </form>

    <!-- 검색결과 (flat) -->
    <div th:if="${hasKeyword}" class="bg-surface border border-line rounded-large overflow-hidden">
      <div class="px-4 py-2 border-b border-line bg-surface-subtle text-xs text-fg-subtle">
        검색 결과 <strong class="text-fg-strong" th:text="${#lists.size(rows)}">0</strong> 건
      </div>
      <table class="min-w-full divide-y divide-line text-sm">
        <caption class="sr-only">메뉴 검색 결과</caption>
        <thead class="bg-surface-subtle">
          <tr class="text-left text-xs font-semibold text-fg-subtle uppercase tracking-wide">
            <th scope="col" class="px-4 py-3">메뉴명</th>
            <th scope="col" class="px-4 py-3">타입</th>
            <th scope="col" class="px-4 py-3">상위</th>
            <th scope="col" class="px-4 py-3">깊이</th>
            <th scope="col" class="px-4 py-3">링크</th>
            <th scope="col" class="px-4 py-3">사용</th>
            <th scope="col" class="px-4 py-3 text-right">작업</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-divider">
          <tr th:each="r : ${rows}" class="hover:bg-surface-subtle">
            <td class="px-4 py-2.5">
              <a th:href="@{/admin/system/site/{sid}/menu/{mid}(sid=${site.siteId}, mid=${r.menuId})}"
                 class="text-brand-60 hover:underline font-medium" th:text="${r.menuName}">이름</a>
            </td>
            <td class="px-4 py-2.5">
              <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-surface-subtler text-fg"
                    th:text="${r.menuType}">CONTENT</span>
            </td>
            <td class="px-4 py-2.5 text-fg" th:text="${r.parentMenuName} ?: '(루트)'">(루트)</td>
            <td class="px-4 py-2.5 font-mono text-fg-subtle" th:text="${r.depth}">1</td>
            <td class="px-4 py-2.5 font-mono text-xs text-fg-subtle"
                th:text="${r.linkUrl} ?: ${r.linkTargetId} ?: '-'">-</td>
            <td class="px-4 py-2.5">
              <span th:if="${r.useYn == 'Y'}" class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-success-surface text-success-fg">사용</span>
              <span th:unless="${r.useYn == 'Y'}" class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-surface-subtler text-fg-subtle">미사용</span>
            </td>
            <td class="px-4 py-2.5 whitespace-nowrap text-right">
              <a th:href="@{/admin/system/site/{sid}/menu/{mid}/edit(sid=${site.siteId}, mid=${r.menuId})}"
                 class="inline-flex items-center justify-center w-7 h-7 rounded border border-line bg-surface align-middle text-brand-60 hover:bg-surface-subtle mr-1" title="수정"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="align-middle" aria-hidden="true"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg><span class="sr-only">수정</span></a>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(rows)}">
            <td colspan="7" class="px-4 py-10 text-center text-fg-subtle">검색 결과가 없습니다.</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- 트리 렌더링 — 재귀 노드는 별도 fragment 파일(_tree-node.html) 사용 -->
    <div th:unless="${hasKeyword}" class="bg-surface border border-line rounded-large p-4">
      <p th:if="${#lists.isEmpty(tree)}" class="text-center text-fg-subtle py-8">등록된 메뉴가 없습니다.</p>

      <ul th:unless="${#lists.isEmpty(tree)}" role="tree" class="space-y-1">
        <th:block th:each="n : ${tree}">
          <li th:replace="~{admin/system/menu/_tree-node::menuItem(${n})}"></li>
        </th:block>
      </ul>
    </div>

  </section>

</body>
</html>
