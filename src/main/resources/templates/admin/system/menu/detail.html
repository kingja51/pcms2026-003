<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout-admin}"
      lang="ko">
<head>
  <title th:text="|메뉴 - ${menu.menuName}|">메뉴 상세</title>
</head>
<body>
  <section layout:fragment="content">

    <nav aria-label="상위 경로" class="text-sm text-fg-subtle mb-2">
      <a th:href="@{/admin/system/site}" class="hover:underline">사이트 목록</a>
      <span class="mx-1">/</span>
      <a th:href="@{/admin/system/site/{id}(id=${site.siteId})}"
         class="hover:underline font-mono" th:text="${site.siteCode}">SITE</a>
      <span class="mx-1">/</span>
      <a th:href="@{/admin/system/site/{id}/menu(id=${site.siteId})}" class="hover:underline">메뉴</a>
      <span class="mx-1">/</span>
      <span th:text="${menu.menuName}">이름</span>
    </nav>

    <div class="flex items-start justify-between gap-4 flex-wrap mb-6">
      <div>
        <h1 class="text-heading-lg font-bold text-fg-strong" th:text="${menu.menuName}">메뉴</h1>
        <p class="text-xs text-fg-subtle font-mono mt-1" th:text="${menu.menuId}">uuid</p>
      </div>
      <nav aria-label="메뉴 작업" class="flex items-center gap-2 flex-wrap">
        <a th:href="@{/admin/system/site/{sid}/menu/{mid}/edit(sid=${site.siteId}, mid=${menu.menuId})}"
           class="inline-flex items-center px-3 py-1.5 rounded bg-brand-50 text-fg-on text-sm font-medium hover:bg-brand-60">수정</a>
        <a th:href="@{/admin/system/site/{sid}/menu/new(sid=${site.siteId}, parentMenuId=${menu.menuId})}"
           class="inline-flex items-center px-3 py-1.5 rounded border border-line bg-surface text-fg text-sm hover:bg-surface-subtle">+ 하위 메뉴</a>

        <form th:action="@{/admin/system/site/{sid}/menu/{mid}/move(sid=${site.siteId}, mid=${menu.menuId})}"
              method="post" class="inline">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <input type="hidden" name="direction" value="up"/>
          <button type="submit"
                  class="inline-flex items-center px-3 py-1.5 rounded border border-line bg-surface text-fg text-sm hover:bg-surface-subtle">▲ 위로</button>
        </form>
        <form th:action="@{/admin/system/site/{sid}/menu/{mid}/move(sid=${site.siteId}, mid=${menu.menuId})}"
              method="post" class="inline">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <input type="hidden" name="direction" value="down"/>
          <button type="submit"
                  class="inline-flex items-center px-3 py-1.5 rounded border border-line bg-surface text-fg text-sm hover:bg-surface-subtle">▼ 아래로</button>
        </form>

        <form th:action="@{/admin/system/site/{sid}/menu/{mid}(sid=${site.siteId}, mid=${menu.menuId})}"
              method="post"
              data-confirm="이 메뉴를 삭제하시겠습니까? (하위 메뉴가 있으면 삭제 불가)"
              data-confirm="모든 데이타가 삭제 됩니다. 삭제 하시겠습니까?"
              class="inline">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <input type="hidden" name="_method" value="delete"/>
          <button type="submit"
                  class="inline-flex items-center px-3 py-1.5 rounded border border-danger-border bg-surface text-danger-fg text-sm font-medium hover:bg-danger-surface">삭제</button>
        </form>

        <button type="button"
                data-history-back
                th:attr="data-history-back-fallback=@{/admin/system/site/{id}/menu(id=${site.siteId})}"
                class="inline-flex items-center px-3 py-1.5 rounded border border-line bg-surface text-fg text-sm hover:bg-surface-subtle">뒤로가기</button>
        <a th:href="@{/admin/system/site/{id}/menu(id=${site.siteId})}"
           class="inline-flex items-center px-3 py-1.5 rounded border border-line bg-surface text-fg text-sm hover:bg-surface-subtle">목록</a>
      </nav>
    </div>

    <div th:if="${message}" role="status" aria-live="polite"
         class="mb-4 rounded border border-success-border bg-success-surface px-4 py-3 text-sm text-success-fg"
         th:text="${message}"></div>
    <div th:if="${error}" role="alert" aria-live="polite"
         class="mb-4 rounded border border-danger-border bg-danger-surface px-4 py-3 text-sm text-danger-fg"
         th:text="${error}"></div>

    <section aria-labelledby="info-heading" class="bg-surface border border-line rounded-large p-6">
      <h2 id="info-heading"
          class="text-xs font-semibold text-fg-subtle uppercase tracking-wide mb-4">기본 정보</h2>

      <dl class="grid grid-cols-1 sm:grid-cols-2 gap-x-6 gap-y-3 text-sm">
        <div>
          <dt class="text-fg-subtle">사이트</dt>
          <dd class="text-fg-strong" th:text="|${site.siteName} (${site.siteCode})|">사이트</dd>
        </div>
        <div>
          <dt class="text-fg-subtle">상위 메뉴</dt>
          <dd class="text-fg-strong" th:text="${menu.parentMenuName} ?: '(루트)'">(루트)</dd>
        </div>
        <div>
          <dt class="text-fg-subtle">메뉴명</dt>
          <dd class="font-medium text-fg-strong" th:text="${menu.menuName}">이름</dd>
        </div>
        <div>
          <dt class="text-fg-subtle">타입</dt>
          <dd>
            <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-surface-subtler text-fg"
                  th:text="${menu.menuType}">CONTENT</span>
          </dd>
        </div>
        <div>
          <dt class="text-fg-subtle">연결 대상 ID</dt>
          <dd class="font-mono text-xs text-fg" th:text="${menu.linkTargetId} ?: '-'">-</dd>
        </div>

        <div>
          <dt class="text-fg-subtle">링크 URL</dt>
          <dd class="font-mono text-xs text-fg break-all">
            <a th:href="${menu.linkUrl ?: '#'}"
               th:text="${menu.linkUrl ?: '-'}"
               class="text-brand-60 hover:underline">
              -
            </a>
          </dd>
        </div>

        <div>
          <dt class="text-fg-subtle">정렬 순서</dt>
          <dd class="font-mono text-fg-strong" th:text="${menu.sortOrder}">10</dd>
        </div>
        <div>
          <dt class="text-fg-subtle">깊이</dt>
          <dd class="font-mono text-fg-strong" th:text="${menu.depth}">1</dd>
        </div>
        <div>
          <dt class="text-fg-subtle">인증 필요</dt>
          <dd>
            <span th:if="${menu.authRequiredYn == 'Y'}"
                  class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-warning-surface text-warning-fg">Y 로그인 필요</span>
            <span th:unless="${menu.authRequiredYn == 'Y'}"
                  class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-surface-subtler text-fg-subtle">N 공개</span>
          </dd>
        </div>
        <div>
          <dt class="text-fg-subtle">사용 여부</dt>
          <dd>
            <span th:if="${menu.useYn == 'Y'}"
                  class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-success-surface text-success-fg">사용</span>
            <span th:unless="${menu.useYn == 'Y'}"
                  class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-surface-subtler text-fg-subtle">미사용</span>
          </dd>
        </div>
        <div>
          <dt class="text-fg-subtle">등록자 / 일시</dt>
          <dd class="text-fg">
            <span class="font-mono" th:text="${menu.createdBy}">SYSTEM</span>
            <span class="text-fg-disabled mx-1">/</span>
            <span class="font-mono text-xs" th:text="${@fmt.dt(menu.createdAt)}">-</span>
          </dd>
        </div>
        <div>
          <dt class="text-fg-subtle">수정자 / 일시</dt>
          <dd class="text-fg">
            <span class="font-mono" th:text="${menu.updatedBy} ?: '-'">-</span>
            <span class="text-fg-disabled mx-1">/</span>
            <span class="font-mono text-xs" th:text="${@fmt.dt(menu.updatedAt)}">-</span>
          </dd>
        </div>
      </dl>
    </section>

  </section>
</body>
</html>
