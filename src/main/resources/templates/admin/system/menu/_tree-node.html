<!DOCTYPE html>
<!--
  메뉴 트리 노드 재귀 fragment.
  list.html 에서 th:replace="~{admin/system/menu/_tree-node::menuItem(${n})}" 로 호출.

  fragment 정의를 호출 측 템플릿(list.html)에 두면 두 가지 버그가 발생한다:
    1) layout:fragment 안에 두면 fragment element 자체가 content 로 일반 렌더 →
       node 변수가 undefined 라 NPE
    2) layout:fragment 밖에 두더라도 layout-dialect decorate 시 ~{::menuItem}
       selector 가 현재 template 컨텍스트에서 모호해짐
  따라서 fragment-only 파일로 분리한다.
-->
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<body>

  <li th:fragment="menuItem(node)" role="treeitem"
      class="rounded hover:bg-surface-subtle px-2 py-1">
    <div class="flex items-center gap-2 text-sm flex-wrap">
      <span class="inline-flex items-center px-1.5 py-0.5 rounded text-xs font-mono bg-surface-subtler text-fg"
            th:text="${node.menuType}">TYPE</span>

      <a th:href="@{/admin/system/site/{sid}/menu/{mid}(sid=${node.siteId}, mid=${node.menuId})}"
         class="text-brand-60 hover:underline font-medium"
         th:text="${node.menuName}">메뉴명</a>

      <span th:if="${node.useYn == 'N'}"
            class="inline-flex items-center px-1.5 py-0.5 rounded text-xs bg-surface-subtler text-fg-subtle">미사용</span>

      <span class="ml-auto flex items-center gap-1">
        <form th:action="@{/admin/system/site/{sid}/menu/{mid}/move(sid=${node.siteId}, mid=${node.menuId})}"
              method="post" class="inline">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <input type="hidden" name="direction" value="up"/>
          <button type="submit" aria-label="위로 이동"
                  class="px-1.5 py-0.5 rounded border border-line text-fg-subtle hover:bg-surface-subtler hover:text-fg-strong text-xs">▲</button>
        </form>
        <form th:action="@{/admin/system/site/{sid}/menu/{mid}/move(sid=${node.siteId}, mid=${node.menuId})}"
              method="post" class="inline">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <input type="hidden" name="direction" value="down"/>
          <button type="submit" aria-label="아래로 이동"
                  class="px-1.5 py-0.5 rounded border border-line text-fg-subtle hover:bg-surface-subtler hover:text-fg-strong text-xs">▼</button>
        </form>
        <a th:href="@{/admin/system/site/{sid}/menu/new(sid=${node.siteId}, parentMenuId=${node.menuId})}"
           class="ml-1 px-2 py-0.5 rounded border border-line text-fg-subtle hover:bg-surface-subtler text-xs">+ 하위</a>
      </span>
    </div>

    <ul th:if="${!#lists.isEmpty(node.children)}"
        role="group" class="ml-4 mt-1 border-l border-line pl-3 space-y-1">
      <th:block th:each="c : ${node.children}">
        <li th:replace="~{admin/system/menu/_tree-node::menuItem(${c})}"></li>
      </th:block>
    </ul>
  </li>

</body>
</html>
