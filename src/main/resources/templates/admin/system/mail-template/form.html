<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout-admin}"
      lang="ko">
<head>
  <title th:text="${mode == 'edit'} ? '메일 템플릿 편집' : '메일 템플릿 등록'">메일 템플릿 폼</title>
</head>
<body>
  <section layout:fragment="content" class="max-w-6xl mx-auto">

    <nav aria-label="상위 경로" class="text-sm text-fg-subtle mb-2">
      <a th:href="@{/admin/system/mail-template}" class="hover:underline">메일 템플릿</a>
      <span class="mx-1">/</span>
      <span th:if="${mode == 'edit'}" class="font-mono" th:text="${form.templateCode}">CODE</span>
      <span th:unless="${mode == 'edit'}">새 템플릿</span>
    </nav>

    <div class="flex items-start justify-between gap-4 flex-wrap mb-6">
      <div>
        <h1 class="text-heading-lg font-bold text-fg-strong"
            th:text="${mode == 'edit'} ? '메일 템플릿 편집' : '메일 템플릿 등록'">폼</h1>
        <p th:if="${mode == 'edit' and template != null}"
           class="text-xs text-fg-subtle font-mono mt-1" th:text="${template.mailTemplateId}">uuid</p>
      </div>
      <nav th:if="${mode == 'edit'}" class="flex items-center gap-2">
        <form th:action="@{/admin/system/mail-template/{id}/send-test(id=${form.mailTemplateId})}"
              method="post"
              data-confirm="이 템플릿으로 발신자 주소에 테스트 메일을 전송하시겠습니까?"
              class="inline">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button type="submit"
                  class="inline-flex items-center px-3 py-1.5 rounded border border-success-border bg-success-surface text-success-fg text-sm font-medium hover:bg-success-10">
            테스트 발송
          </button>
        </form>
        <form th:action="@{/admin/system/mail-template/{id}(id=${form.mailTemplateId})}"
              method="post"
              data-confirm="이 템플릿을 삭제하시겠습니까?"
              class="inline">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <input type="hidden" name="_method" value="delete"/>
          <button type="submit"
                  class="inline-flex items-center px-3 py-1.5 rounded border border-danger-border bg-surface text-danger-fg text-sm font-medium hover:bg-danger-surface">
            삭제
          </button>
        </form>
      </nav>
    </div>

    <div th:if="${message}" role="status" aria-live="polite"
         class="mb-4 rounded border border-success-border bg-success-surface px-4 py-3 text-sm text-success-fg"
         th:text="${message}"></div>
    <div th:if="${error}" role="alert"
         class="mb-4 rounded border border-danger-border bg-danger-surface px-4 py-3 text-sm text-danger-fg"
         th:text="${error}"></div>
    <div th:if="${errors}" role="alert"
         class="mb-4 rounded border border-danger-border bg-danger-surface px-4 py-3 text-sm text-danger-fg">
      <ul class="list-disc pl-5">
        <li th:each="e : ${errors}" th:text="${e.defaultMessage}">error</li>
      </ul>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">

      <!-- 편집 폼 -->
      <form id="tpl-form"
            th:action="${mode == 'edit'}
                       ? @{/admin/system/mail-template/{id}(id=${form.mailTemplateId})}
                       : @{/admin/system/mail-template}"
            method="post"
            th:object="${form}"
            class="bg-surface border border-line rounded-large p-6 space-y-4">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="hidden" th:field="*{mailTemplateId}"/>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label for="templateCode" class="block text-sm font-medium text-fg mb-1">
              템플릿 코드 <span class="text-danger-fg">*</span>
            </label>
            <input id="templateCode" type="text" th:field="*{templateCode}"
                   maxlength="50" required pattern="^[A-Z][A-Z0-9_]+$"
                   th:readonly="${mode == 'edit'}"
                   class="block w-full rounded border border-line px-3 py-2 text-sm font-mono focus:border-brand-50 focus:ring-2 focus:ring-brand-20 focus:outline-none read-only:bg-surface-subtler"/>
            <p class="text-xs text-fg-subtle mt-1">코드 참조용. 등록 후 변경 불가.</p>
          </div>
          <div>
            <label for="templateName" class="block text-sm font-medium text-fg mb-1">
              이름 <span class="text-danger-fg">*</span>
            </label>
            <input id="templateName" type="text" th:field="*{templateName}" maxlength="100" required
                   class="block w-full rounded border border-line px-3 py-2 text-sm focus:border-brand-50 focus:ring-2 focus:ring-brand-20 focus:outline-none"/>
          </div>
          <div class="md:col-span-2">
            <label for="subject" class="block text-sm font-medium text-fg mb-1">
              제목 <span class="text-danger-fg">*</span>
            </label>
            <input id="subject" type="text" th:field="*{subject}" maxlength="500" required
                   class="block w-full rounded border border-line px-3 py-2 text-sm focus:border-brand-50 focus:ring-2 focus:ring-brand-20 focus:outline-none"/>
            <p class="text-xs text-fg-subtle mt-1">
              Thymeleaf 표현식 사용 가능. 예:
              <code>[<span th:text="${@project.nameKo}">관리자</span>] {{memberName}} 님 환영합니다</code>
            </p>
          </div>
          <div>
            <label for="senderEmail" class="block text-sm font-medium text-fg mb-1">발신자 이메일</label>
            <input id="senderEmail" type="email" th:field="*{senderEmail}" maxlength="255"
                   placeholder="비워두면 시스템 기본(application.yml)"
                   class="block w-full rounded border border-line px-3 py-2 text-sm focus:border-brand-50 focus:ring-2 focus:ring-brand-20 focus:outline-none"/>
          </div>
          <div>
            <label for="senderName" class="block text-sm font-medium text-fg mb-1">발신자 표시명</label>
            <input id="senderName" type="text" th:field="*{senderName}" maxlength="100"
                   th:placeholder="|${@project.nameKo} 운영팀|"
                   class="block w-full rounded border border-line px-3 py-2 text-sm focus:border-brand-50 focus:ring-2 focus:ring-brand-20 focus:outline-none"/>
          </div>
          <div>
            <label for="useYn" class="block text-sm font-medium text-fg mb-1">사용 여부</label>
            <select id="useYn" th:field="*{useYn}"
                    class="block w-full rounded border border-line px-3 py-2 text-sm focus:border-brand-50 focus:ring-2 focus:ring-brand-20 focus:outline-none">
              <option value="Y">사용</option>
              <option value="N">미사용</option>
            </select>
          </div>
          <div>
            <label for="variablesHint" class="block text-sm font-medium text-fg mb-1">사용 가능 변수 (참고)</label>
            <input id="variablesHint" type="text" th:field="*{variablesHint}" maxlength="2000"
                   placeholder="memberName, loginId, siteName, ..."
                   class="block w-full rounded border border-line px-3 py-2 text-sm font-mono focus:border-brand-50 focus:ring-2 focus:ring-brand-20 focus:outline-none"/>
          </div>
          <div class="md:col-span-2">
            <label for="description" class="block text-sm font-medium text-fg mb-1">설명</label>
            <textarea id="description" th:field="*{description}" rows="2" maxlength="1000"
                      class="block w-full rounded border border-line px-3 py-2 text-sm focus:border-brand-50 focus:ring-2 focus:ring-brand-20 focus:outline-none"></textarea>
          </div>
          <div class="md:col-span-2">
            <label for="bodyHtml" class="block text-sm font-medium text-fg mb-1">
              본문 HTML <span class="text-danger-fg">*</span>
            </label>
            <textarea id="bodyHtml" th:field="*{bodyHtml}" rows="18" required spellcheck="false"
                      class="block w-full rounded border border-line px-3 py-2 text-xs font-mono focus:border-brand-50 focus:ring-2 focus:ring-brand-20 focus:outline-none"
                      style="line-height:1.5;"></textarea>
            <p class="text-xs text-fg-subtle mt-1">
              Thymeleaf 문법: <code>&lt;span th:text="${memberName}"&gt;&lt;/span&gt;</code>,
              <code>th:if</code>, <code>th:each</code> 등.
            </p>
          </div>
        </div>

        <div class="flex items-center justify-end gap-2 pt-4 border-t border-line">
          <button type="button" data-action="preview-mail"
                  class="inline-flex items-center px-4 py-2 rounded border border-line bg-surface text-fg text-sm hover:bg-surface-subtle">
            미리보기 새로고침
          </button>
          <a th:href="@{/admin/system/mail-template}"
             class="inline-flex items-center px-4 py-2 rounded border border-line bg-surface text-fg text-sm hover:bg-surface-subtle">
            취소
          </a>
          <button type="submit"
                  class="inline-flex items-center px-4 py-2 rounded bg-brand-50 text-fg-on text-sm font-medium hover:bg-brand-60">
            저장
          </button>
        </div>
      </form>

      <!-- 미리보기 (iframe) -->
      <div class="bg-surface border border-line rounded-large overflow-hidden flex flex-col">
        <div class="px-4 py-2 border-b border-line bg-surface-subtle flex items-center justify-between">
          <div class="text-xs font-semibold text-fg-subtle uppercase tracking-wide">미리보기 (샘플 변수 적용)</div>
          <div class="text-xs text-fg-subtle">저장 없이 렌더링만 확인</div>
        </div>
        <div class="px-4 py-2 border-b border-line bg-surface">
          <div class="text-xs text-fg-subtle">제목</div>
          <div id="previewSubject" class="text-sm font-medium text-fg-strong truncate">—</div>
        </div>
        <iframe id="previewFrame" sandbox="allow-same-origin"
                class="w-full" style="min-height:700px;border:0;" title="메일 본문 미리보기"></iframe>
      </div>

    </div>

    <!-- 미리보기 폼 (숨김 — previewMail() 에서 사용) -->
    <form id="previewForm" th:action="@{/admin/system/mail-template/preview}" method="post" target="_previewTarget" style="display:none;">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <input type="hidden" name="templateCode" id="pv-templateCode"/>
      <input type="hidden" name="subject"      id="pv-subject"/>
      <textarea name="bodyHtml"                id="pv-bodyHtml"></textarea>
    </form>

    <script th:attr="nonce=${cspNonce}">
      function previewMail() {
        // 편집 폼 현재 값을 미리보기 폼에 복사
        document.getElementById('pv-templateCode').value = document.getElementById('templateCode').value || '';
        document.getElementById('pv-subject').value      = document.getElementById('subject').value || '';
        document.getElementById('pv-bodyHtml').value     = document.getElementById('bodyHtml').value || '';

        // fetch 로 POST → 응답 HTML 을 iframe srcdoc 으로 주입
        const fd = new FormData(document.getElementById('previewForm'));
        fetch(document.getElementById('previewForm').action, {
          method: 'POST',
          body: fd,
          credentials: 'same-origin',
          headers: { 'Accept': 'text/html' }
        })
        .then(r => r.ok ? r.text() : Promise.reject(new Error('preview failed: ' + r.status)))
        .then(html => {
          // 서버가 반환한 preview.html 에서 subject/body 를 추출 (data-* 속성)
          const parser = new DOMParser();
          const doc = parser.parseFromString(html, 'text/html');
          const subj = doc.querySelector('meta[name="preview-subject"]')?.getAttribute('content') || '';
          const body = doc.querySelector('template#preview-body')?.innerHTML || html;
          document.getElementById('previewSubject').textContent = subj || '(제목 없음)';
          document.getElementById('previewFrame').srcdoc = body;
        })
        .catch(err => {
          document.getElementById('previewFrame').srcdoc =
            '<pre style="color:#b91c1c;font-family:ui-monospace,monospace;padding:12px;">미리보기 오류: ' + err.message + '</pre>';
        });
      }
      // 폼 로드 시 자동 1회 미리보기
      document.addEventListener('DOMContentLoaded', previewMail);
      // "미리보기 새로고침" 버튼 — 인라인 onclick 대체(CSP: 'unsafe-inline' 없음)
      document.addEventListener('click', function (ev) {
        if (ev.target.closest('[data-action="preview-mail"]')) previewMail();
      });
      // 본문·제목 변경 시 디바운스 미리보기
      let tmr;
      function schedule() { clearTimeout(tmr); tmr = setTimeout(previewMail, 600); }
      document.getElementById('subject').addEventListener('input', schedule);
      document.getElementById('bodyHtml').addEventListener('input', schedule);
    </script>

  </section>
</body>
</html>
