<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout-admin}"
      lang="ko">
<head><title>민원 마스터 상세</title></head>
<body>
<section layout:fragment="content">

  <nav aria-label="상위 경로" class="text-sm text-fg-subtle mb-2">
    <a th:href="@{/admin}" class="hover:underline">대시보드</a>
    <span class="mx-1">/</span>
    <a th:href="@{/admin/system/complaint}" class="hover:underline">민원</a>
    <span class="mx-1">/</span>
    <span th:text="${master.masterName}">상세</span>
  </nav>

  <div th:if="${message}" role="status"
       class="mb-4 rounded border border-success-border bg-success-surface px-4 py-3 text-sm text-success-fg" th:text="${message}"></div>
  <div th:if="${error}" role="alert"
       class="mb-4 rounded border border-danger-border bg-danger-surface px-4 py-3 text-sm text-danger-fg" th:text="${error}"></div>

  <div class="flex items-start justify-between gap-4 flex-wrap mb-6">
    <div>
      <h1 class="text-heading-lg font-bold text-fg-strong" th:text="${master.masterName}">이름</h1>
      <p class="text-sm text-fg-subtle mt-1 font-mono" th:text="${master.masterCode}">CODE</p>
    </div>
    <div class="flex items-center gap-2">
      <a th:href="@{/admin/system/complaint/{id}/article(id=${master.complaintMasterId})}"
         class="inline-flex items-center px-3 py-1.5 rounded bg-gray-70 text-fg-on text-sm font-medium hover:bg-gray-90">접수 민원 →</a>
      <a th:href="@{/admin/system/complaint/{id}/edit(id=${master.complaintMasterId})}"
         class="inline-flex items-center px-3 py-1.5 rounded border border-line bg-surface text-sm text-fg hover:bg-surface-subtle">수정</a>
    </div>
  </div>

  <!-- 기본 정보 -->
  <div class="bg-surface border border-line rounded-large p-6 mb-6 grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
    <div><span class="text-fg-subtle block text-xs mb-0.5">사이트</span>
         <span th:text="${master.siteCode} + ' · ' + ${master.siteName}">-</span></div>
    <div><span class="text-fg-subtle block text-xs mb-0.5">마스터 코드</span>
         <span class="font-mono" th:text="${master.masterCode}">-</span></div>
    <div class="md:col-span-2">
      <span class="text-fg-subtle block text-xs mb-0.5">설명</span>
      <span th:text="${master.description ?: '-'}">-</span>
    </div>
    <div><span class="text-fg-subtle block text-xs mb-0.5">목록 노출</span>
         <span th:text="${master.showInList == 'Y' ? '순번·제목·날짜만' : '전체 공개'}">-</span></div>
    <div><span class="text-fg-subtle block text-xs mb-0.5">첨부파일</span>
         <span th:if="${master.fileYn == 'Y'}"
               th:text="'허용 (최대 ' + ${master.fileCountMax} + '개, ' + ${master.fileSizeMax / 1024 / 1024} + 'MB)'">-</span>
         <span th:unless="${master.fileYn == 'Y'}">미허용</span></div>
    <div><span class="text-fg-subtle block text-xs mb-0.5">답변 필수</span>
         <span th:text="${master.answerRequiredYn == 'Y' ? '필수' : '선택'}">-</span></div>
    <div><span class="text-fg-subtle block text-xs mb-0.5">답변 기한</span>
         <span th:text="${master.answerDeadlineDays != null ? master.answerDeadlineDays + '일' : '기한 없음'}">-</span></div>
    <div><span class="text-fg-subtle block text-xs mb-0.5">작성 인증</span>
         <span th:text="(${master.allowMemberYn == 'Y'} ? '회원 ' : '') +
                        (${master.allowOauth2Yn == 'Y'} ? 'OAuth2 ' : '') +
                        (${master.allowNiceYn == 'Y'} ? 'NICE' : '')">-</span></div>
    <div><span class="text-fg-subtle block text-xs mb-0.5">CAPTCHA</span>
         <span th:if="${master.captchaYn == 'Y'}"
               class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-info-surface text-info-fg">reCAPTCHA v3</span>
         <span th:unless="${master.captchaYn == 'Y'}"
               class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-surface-subtler text-fg-subtle">미사용</span></div>
    <div><span class="text-fg-subtle block text-xs mb-0.5">사용</span>
         <span th:if="${master.useYn == 'Y'}"
               class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-success-surface text-success-fg">사용중</span>
         <span th:unless="${master.useYn == 'Y'}"
               class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-surface-subtler text-fg-subtle">중지</span></div>
  </div>

  <!-- 카테고리 -->
  <div class="bg-surface border border-line rounded-large p-6 mb-6">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-base font-semibold text-fg-strong">카테고리</h2>
      <a th:href="@{/admin/system/complaint/{id}/category/new(id=${master.complaintMasterId})}"
         class="inline-flex items-center px-3 py-1 rounded bg-brand-50 text-fg-on text-xs font-medium hover:bg-brand-60">+ 추가</a>
    </div>

    <div th:if="${#lists.isEmpty(categories)}" class="text-sm text-fg-subtle">등록된 카테고리가 없습니다.</div>

    <table th:unless="${#lists.isEmpty(categories)}" class="min-w-full divide-y divide-line text-sm">
      <thead class="bg-surface-subtle">
        <tr class="text-left text-xs font-semibold text-fg-subtle uppercase tracking-wide">
          <th scope="col" class="px-4 py-2">코드</th>
          <th scope="col" class="px-4 py-2">이름</th>
          <th scope="col" class="px-4 py-2">순서</th>
          <th scope="col" class="px-4 py-2">사용</th>
          <th scope="col" class="px-4 py-2 text-right">작업</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-divider">
        <tr th:each="cat : ${categories}" class="hover:bg-surface-subtle">
          <td class="px-4 py-2 font-mono text-xs text-fg-subtle" th:text="${cat.categoryCode}">-</td>
          <td class="px-4 py-2" th:text="${cat.categoryName}">-</td>
          <td class="px-4 py-2 text-fg-subtle" th:text="${cat.sortOrder}">0</td>
          <td class="px-4 py-2">
            <span th:if="${cat.useYn == 'Y'}"
                  class="inline-flex items-center px-2 py-0.5 rounded text-xs bg-success-surface text-success-fg">사용</span>
            <span th:unless="${cat.useYn == 'Y'}"
                  class="inline-flex items-center px-2 py-0.5 rounded text-xs bg-surface-subtler text-fg-subtle">중지</span>
          </td>
          <td class="px-4 py-2 text-right flex items-center justify-end gap-1">
            <a th:href="@{/admin/system/complaint/{mid}/category/{cid}/edit(mid=${master.complaintMasterId},cid=${cat.categoryId})}"
               class="inline-flex items-center px-2 py-0.5 rounded border border-line bg-surface text-xs text-fg hover:bg-surface-subtle">수정</a>
            <form th:action="@{/admin/system/complaint/{mid}/category/{cid}/use(mid=${master.complaintMasterId},cid=${cat.categoryId})}"
                  method="post" class="inline">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
              <input type="hidden" name="active" th:value="${cat.useYn != 'Y'}"/>
              <button type="submit"
                      class="inline-flex items-center px-2 py-0.5 rounded border border-line bg-surface text-xs text-fg hover:bg-surface-subtle"
                      th:text="${cat.useYn == 'Y' ? '중지' : '활성'}">중지</button>
            </form>
            <form th:action="@{/admin/system/complaint/{mid}/category/{cid}/delete(mid=${master.complaintMasterId},cid=${cat.categoryId})}"
                  method="post" class="inline"
                  data-confirm="삭제하시겠습니까?">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
              <button type="submit"
                      class="inline-flex items-center px-2 py-0.5 rounded border border-danger-border bg-surface text-xs text-danger-fg hover:bg-danger-surface">삭제</button>
            </form>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- 사용 중지 / 삭제 -->
  <div class="bg-surface border border-line rounded-large p-6 space-y-3">
    <h2 class="text-base font-semibold text-fg-strong">관리</h2>
    <div class="flex flex-wrap gap-3">
      <form th:action="@{/admin/system/complaint/{id}/use(id=${master.complaintMasterId})}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="hidden" name="active" th:value="${master.useYn != 'Y'}"/>
        <button type="submit"
                class="inline-flex items-center px-4 py-2 rounded border border-line bg-surface text-sm text-fg hover:bg-surface-subtle"
                th:text="${master.useYn == 'Y' ? '사용중지' : '사용 재개'}">사용중지</button>
      </form>
      <form th:action="@{/admin/system/complaint/{id}/delete(id=${master.complaintMasterId})}" method="post"
            data-confirm="삭제하시겠습니까? 접수된 민원 데이터가 있을 경우 삭제가 제한됩니다.">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit"
                class="inline-flex items-center px-4 py-2 rounded border border-danger-border bg-surface text-sm text-danger-fg hover:bg-danger-surface">삭제</button>
      </form>
    </div>
  </div>

</section>
</body>
</html>
