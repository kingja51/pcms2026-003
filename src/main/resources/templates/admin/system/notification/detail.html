<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout-admin}"
      lang="ko">
<head><title>알림 상세</title></head>
<body>
<section layout:fragment="content">

  <nav aria-label="상위 경로" class="text-sm text-fg-subtle mb-2">
    <a th:href="@{/admin}" class="hover:underline">대시보드</a>
    <span class="mx-1">/</span>
    <a th:href="@{/admin/notification}" class="hover:underline">알림 관리</a>
    <span class="mx-1">/</span>
    <span>상세</span>
  </nav>

  <div class="flex items-center justify-between gap-4 flex-wrap mb-6">
    <h1 class="text-heading-lg font-bold text-fg-strong">알림 상세</h1>
    <div class="flex gap-2">
      <a th:href="@{/admin/notification/pref/{uid}(uid=${notification.recipientUserId})}"
         class="px-3 py-1.5 rounded border border-line bg-surface text-fg text-sm hover:bg-surface-subtle">수신자 설정</a>
      <form th:action="@{/admin/notification/{id}/delete(id=${notification.notificationId})}"
            method="post" data-confirm="이 알림을 삭제하시겠습니까?">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit"
                class="px-3 py-1.5 rounded border border-danger-border bg-surface text-danger-fg text-sm hover:bg-danger-surface">삭제</button>
      </form>
    </div>
  </div>

  <div th:if="${message}" class="mb-4 rounded border border-success-border bg-success-surface px-4 py-3 text-sm text-success-fg" th:text="${message}"></div>
  <div th:if="${error}"   class="mb-4 rounded border border-danger-border bg-danger-surface px-4 py-3 text-sm text-danger-fg"            th:text="${error}"></div>

  <div class="bg-surface border border-line rounded-large divide-y divide-divider">

    <!-- 알림 내용 -->
    <div class="px-6 py-4">
      <h2 class="text-xs font-semibold text-fg-subtle uppercase tracking-wide mb-4">알림 정보</h2>
      <dl class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-3 text-sm">
        <div>
          <dt class="text-xs text-fg-subtle mb-0.5">알림 ID</dt>
          <dd class="font-mono text-fg text-xs" th:text="${notification.notificationId}">-</dd>
        </div>
        <div>
          <dt class="text-xs text-fg-subtle mb-0.5">타입</dt>
          <dd>
            <span class="inline-block px-2 py-0.5 rounded text-xs font-medium bg-surface-subtler text-fg"
                  th:text="${notification.typeEnum().label()}">타입</span>
          </dd>
        </div>
        <div class="md:col-span-2">
          <dt class="text-xs text-fg-subtle mb-0.5">제목</dt>
          <dd class="font-medium text-fg-strong" th:text="${notification.title}">-</dd>
        </div>
        <div class="md:col-span-2">
          <dt class="text-xs text-fg-subtle mb-0.5">본문</dt>
          <dd class="text-fg whitespace-pre-wrap" th:text="${notification.body ?: '(없음)'}">-</dd>
        </div>
        <div>
          <dt class="text-xs text-fg-subtle mb-0.5">링크 URL</dt>
          <dd>
            <a th:if="${notification.linkUrl != null}"
               th:href="${notification.linkUrl}" th:text="${notification.linkUrl}"
               class="text-brand-60 hover:underline text-xs break-all">-</a>
            <span th:unless="${notification.linkUrl != null}" class="text-fg-disabled text-xs">(없음)</span>
          </dd>
        </div>
        <div>
          <dt class="text-xs text-fg-subtle mb-0.5">관련 엔티티</dt>
          <dd class="text-fg text-xs font-mono"
              th:text="${notification.relatedEntity != null ? notification.relatedEntity + ' / ' + notification.relatedId : '(없음)'}">-</dd>
        </div>
      </dl>
    </div>

    <!-- 수신 상태 -->
    <div class="px-6 py-4">
      <h2 class="text-xs font-semibold text-fg-subtle uppercase tracking-wide mb-4">수신 상태</h2>
      <dl class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-3 text-sm">
        <div>
          <dt class="text-xs text-fg-subtle mb-0.5">수신자</dt>
          <dd class="text-fg font-mono text-xs"
              th:text="${notification.recipientLoginId ?: notification.recipientUserId}">-</dd>
        </div>
        <div>
          <dt class="text-xs text-fg-subtle mb-0.5">읽음 여부</dt>
          <dd>
            <span th:if="${notification.read}"
                  class="inline-block px-2 py-0.5 rounded text-xs bg-surface-subtler text-fg-subtle">읽음</span>
            <span th:unless="${notification.read}"
                  class="inline-block px-2 py-0.5 rounded text-xs bg-warning-10 text-warning-fg">미읽음</span>
          </dd>
        </div>
        <div>
          <dt class="text-xs text-fg-subtle mb-0.5">읽은 시각</dt>
          <dd class="text-fg font-mono text-xs"
              th:text="${notification.readAt != null ? #temporals.format(notification.readAt, 'yyyy-MM-dd HH:mm:ss') : '(미읽음)'}">-</dd>
        </div>
      </dl>
    </div>

    <!-- 감사 정보 -->
    <div class="px-6 py-4">
      <h2 class="text-xs font-semibold text-fg-subtle uppercase tracking-wide mb-4">감사 정보</h2>
      <dl class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-3 text-sm">
        <div>
          <dt class="text-xs text-fg-subtle mb-0.5">생성일시</dt>
          <dd class="text-fg font-mono text-xs"
              th:text="${#temporals.format(notification.createdAt, 'yyyy-MM-dd HH:mm:ss')}">-</dd>
        </div>
        <div>
          <dt class="text-xs text-fg-subtle mb-0.5">생성자</dt>
          <dd class="text-fg font-mono text-xs" th:text="${notification.createdBy}">-</dd>
        </div>
      </dl>
    </div>
  </div>

  <div class="mt-4">
    <a th:href="@{/admin/notification}" class="text-sm text-fg-subtle hover:underline">← 목록으로</a>
  </div>

</section>
</body>
</html>
