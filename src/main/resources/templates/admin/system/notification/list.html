<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout-admin}"
      lang="ko">
<head><title>알림 관리</title></head>
<body>
<section layout:fragment="content">

  <nav aria-label="상위 경로" class="text-sm text-fg-subtle mb-2">
    <a th:href="@{/admin}" class="hover:underline">대시보드</a>
    <span class="mx-1">/</span>
    <span>알림 관리</span>
  </nav>

  <div class="flex items-center justify-between gap-4 flex-wrap mb-6">
    <div>
      <h1 class="text-heading-lg font-bold text-fg-strong">알림 관리</h1>
      <p class="text-sm text-fg-subtle mt-1">전체 <strong class="text-fg-strong" th:text="${page.totalElements}">0</strong> 건</p>
    </div>
    <div class="flex gap-2">
      <a th:href="@{/admin/notification/retention}"
         class="px-3 py-1.5 rounded border border-line bg-surface text-fg text-sm hover:bg-surface-subtle">보존 정책</a>
    </div>
  </div>

  <div th:if="${message}" class="mb-4 rounded border border-success-border bg-success-surface px-4 py-3 text-sm text-success-fg" th:text="${message}"></div>
  <div th:if="${error}"   class="mb-4 rounded border border-danger-border bg-danger-surface px-4 py-3 text-sm text-danger-fg"            th:text="${error}"></div>

  <!-- 수동 발송 -->
  <details class="mb-4 bg-surface border border-line rounded-large">
    <summary class="px-4 py-3 cursor-pointer text-sm font-medium text-fg hover:bg-surface-subtle rounded-large select-none">
      수동 발송 (관리자 공지)
    </summary>
    <form th:action="@{/admin/notification/send}" method="post"
          th:object="${sendForm}"
          class="px-4 pb-4 pt-2 grid grid-cols-1 md:grid-cols-2 gap-3">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <div class="md:col-span-2">
        <label class="block text-xs font-medium text-fg-subtle mb-1">수신자 user_seq (쉼표 구분, 복수 가능)</label>
        <input type="text" th:field="*{recipientUserIdsCsv}" placeholder="uuid1,uuid2,..."
               class="block w-full rounded border border-line px-3 py-2 text-sm"/>
        <span th:if="${#fields.hasErrors('recipientUserIdsCsv')}" class="text-xs text-danger-fg mt-0.5 block"
              th:errors="*{recipientUserIdsCsv}"></span>
      </div>
      <div>
        <label class="block text-xs font-medium text-fg-subtle mb-1">알림 타입</label>
        <select th:field="*{notificationType}" class="block w-full rounded border border-line px-3 py-2 text-sm">
          <option th:each="t : ${types}" th:value="${t.name()}" th:text="${t.label()}">SYSTEM</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-medium text-fg-subtle mb-1">링크 URL (선택)</label>
        <input type="text" th:field="*{linkUrl}" placeholder="/admin/..."
               class="block w-full rounded border border-line px-3 py-2 text-sm"/>
      </div>
      <div class="md:col-span-2">
        <label class="block text-xs font-medium text-fg-subtle mb-1">제목</label>
        <input type="text" th:field="*{title}" placeholder="알림 제목"
               class="block w-full rounded border border-line px-3 py-2 text-sm"/>
        <span th:if="${#fields.hasErrors('title')}" class="text-xs text-danger-fg mt-0.5 block"
              th:errors="*{title}"></span>
      </div>
      <div class="md:col-span-2">
        <label class="block text-xs font-medium text-fg-subtle mb-1">본문 (선택)</label>
        <textarea th:field="*{body}" rows="3" placeholder="알림 본문"
                  class="block w-full rounded border border-line px-3 py-2 text-sm"></textarea>
      </div>
      <div class="md:col-span-2 flex justify-end">
        <button type="submit"
                class="px-4 py-2 rounded bg-brand-50 text-fg-on text-sm font-medium hover:bg-brand-60">발송</button>
      </div>
    </form>
  </details>

  <!-- 필터 -->
  <form method="get" th:action="@{/admin/notification}"
        class="bg-surface border border-line rounded-large p-4 mb-4 flex flex-wrap gap-3 items-end">
    <div>
      <label class="block text-xs text-fg-subtle mb-1">알림 타입</label>
      <select name="notificationType" class="border border-line rounded px-2 py-1 text-sm">
        <option value="">전체</option>
        <option th:each="t : ${types}" th:value="${t.name()}"
                th:text="${t.label()}"
                th:selected="${search.notificationType == t.name()}">타입</option>
      </select>
    </div>
    <div>
      <label class="block text-xs text-fg-subtle mb-1">읽음 여부</label>
      <select name="readYn" class="border border-line rounded px-2 py-1 text-sm">
        <option value="">전체</option>
        <option value="N" th:selected="${search.readYn == 'N'}">미읽음</option>
        <option value="Y" th:selected="${search.readYn == 'Y'}">읽음</option>
      </select>
    </div>
    <div class="flex-1 min-w-[200px]">
      <label class="block text-xs text-fg-subtle mb-1">검색 (제목)</label>
      <input type="text" name="keyword" th:value="${search.keyword}" placeholder="알림 제목"
             class="w-full border border-line rounded px-2 py-1 text-sm"/>
    </div>
    <button type="submit" class="px-3 py-1.5 bg-gray-90 text-fg-on text-sm rounded">검색</button>
    <a th:href="@{/admin/notification}" class="px-3 py-1.5 border border-line bg-surface text-fg text-sm rounded">초기화</a>
  </form>

  <!-- 목록 -->
  <div class="bg-surface border border-line rounded-large overflow-x-auto">
    <table class="w-full text-sm">
      <thead class="bg-surface-subtle text-fg-subtle">
        <tr>
          <th class="text-left px-3 py-2">타입</th>
          <th class="text-left px-3 py-2">제목</th>
          <th class="text-left px-3 py-2">수신자</th>
          <th class="text-left px-3 py-2">읽음</th>
          <th class="text-left px-3 py-2">생성일</th>
          <th class="px-3 py-2"></th>
        </tr>
      </thead>
      <tbody>
        <tr th:if="${#lists.isEmpty(page.content)}">
          <td colspan="6" class="text-center text-fg-disabled py-8">알림이 없습니다.</td>
        </tr>
        <tr th:each="n : ${page.content}" class="border-t border-divider hover:bg-surface-subtle">
          <td class="px-3 py-2">
            <span class="inline-block px-2 py-0.5 rounded text-xs font-medium bg-surface-subtler text-fg"
                  th:text="${n.typeEnum().label()}">타입</span>
          </td>
          <td class="px-3 py-2 max-w-xs truncate">
            <a th:href="@{/admin/notification/{id}(id=${n.notificationId})}"
               class="text-brand-60 hover:underline" th:text="${n.title}">제목</a>
          </td>
          <td class="px-3 py-2 text-fg font-mono text-xs"
              th:text="${n.recipientLoginId ?: n.recipientUserId}">수신자</td>
          <td class="px-3 py-2">
            <span th:if="${n.read}"   class="inline-block px-2 py-0.5 rounded text-xs bg-surface-subtler text-fg-subtle">읽음</span>
            <span th:unless="${n.read}" class="inline-block px-2 py-0.5 rounded text-xs bg-warning-10 text-warning-fg">미읽음</span>
          </td>
          <td class="px-3 py-2 text-fg-subtle text-xs"
              th:text="${#temporals.format(n.createdAt, 'yyyy-MM-dd HH:mm')}">date</td>
          <td class="px-3 py-2 whitespace-nowrap text-right">
            <a th:href="@{/admin/notification/{id}(id=${n.notificationId})}"
               class="text-brand-60 hover:underline text-sm">상세 →</a>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- 페이징 -->
  <div class="mt-4 flex items-center justify-center gap-1 text-sm" th:if="${page.totalPages > 1}">
    <a th:if="${page.hasPrevious()}"
       th:href="@{/admin/notification(page=${page.page - 1}, notificationType=${search.notificationType}, readYn=${search.readYn}, keyword=${search.keyword})}"
       class="px-2 py-1 border border-line rounded">이전</a>
    <span class="px-2 py-1" th:text="${page.page} + '/' + ${page.totalPages}">1/1</span>
    <a th:if="${page.hasNext()}"
       th:href="@{/admin/notification(page=${page.page + 1}, notificationType=${search.notificationType}, readYn=${search.readYn}, keyword=${search.keyword})}"
       class="px-2 py-1 border border-line rounded">다음</a>
  </div>

</section>
</body>
</html>
