<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout-admin}"
      lang="ko">
<head>
  <title th:text="'카테고리 — ' + ${master.bbsName}">카테고리</title>
</head>
<body>
  <section layout:fragment="content">

    <nav aria-label="상위 경로" class="text-sm text-fg-subtle mb-2">
      <a th:href="@{/admin}" class="hover:underline">대시보드</a>
      <span class="mx-1">/</span>
      <a th:href="@{/admin/system/board}" class="hover:underline">게시판</a>
      <span class="mx-1">/</span>
      <a th:href="@{/admin/system/board/{id}(id=${master.bbsMasterId})}"
         class="hover:underline" th:text="${master.bbsName}">이름</a>
      <span class="mx-1">/</span>
      <span>카테고리</span>
    </nav>

    <div class="flex items-start justify-between gap-4 flex-wrap mb-6">
      <div>
        <h1 class="text-heading-lg font-bold text-fg-strong">카테고리 관리</h1>
        <p class="mt-1 text-sm text-fg-subtle">
          <span th:text="${master.bbsName}">게시판</span> 안의 글을 분류하는 서브 카테고리입니다.
        </p>
      </div>
      <a th:href="@{/admin/system/board/{id}/category/new(id=${master.bbsMasterId})}"
         class="inline-flex items-center px-3 py-1.5 rounded bg-brand-50 text-fg-on text-sm font-medium hover:bg-brand-60">+ 새 카테고리</a>
    </div>

    <div th:if="${message}"
         class="mb-4 p-3 rounded bg-success-surface border border-success-border text-success-fg text-sm"
         th:text="${message}">완료</div>
    <div th:if="${error}"
         class="mb-4 p-3 rounded bg-danger-surface border border-danger-border text-danger-fg text-sm"
         th:text="${error}">오류</div>

    <div class="bg-surface border border-line rounded-large overflow-hidden">
      <table class="w-full text-sm">
        <thead class="bg-surface-subtle text-fg-subtle text-xs uppercase tracking-wider">
        <tr>
          <th class="px-4 py-2 text-left w-16">순서</th>
          <th class="px-4 py-2 text-left">코드</th>
          <th class="px-4 py-2 text-left">이름</th>
          <th class="px-4 py-2 text-right w-24">글 수</th>
          <th class="px-4 py-2 text-center w-24">사용</th>
          <th class="px-4 py-2 text-right w-56">관리</th>
        </tr>
        </thead>
        <tbody class="divide-y divide-divider">
        <tr th:if="${#lists.isEmpty(categories)}">
          <td colspan="6" class="px-4 py-12 text-center text-fg-subtle">
            등록된 카테고리가 없습니다.
          </td>
        </tr>
        <tr th:each="c : ${categories}" class="hover:bg-surface-subtle">
          <td class="px-4 py-2 text-fg" th:text="${c.sortOrder}">0</td>
          <td class="px-4 py-2">
            <code class="font-mono text-xs bg-surface-subtler px-1.5 py-0.5 rounded border border-line"
                  th:text="${c.categoryCode}">code</code>
          </td>
          <td class="px-4 py-2 text-fg-strong font-medium" th:text="${c.categoryName}">이름</td>
          <td class="px-4 py-2 text-right text-fg-subtle" th:text="${c.articleCount} ?: 0">0</td>
          <td class="px-4 py-2 text-center">
            <span th:if="${c.useYn == 'Y'}"
                  class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-success-surface text-success-fg">사용중</span>
            <span th:unless="${c.useYn == 'Y'}"
                  class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-surface-subtler text-fg-subtle">중지</span>
          </td>
          <td class="px-4 py-2 whitespace-nowrap text-right">
            <a th:href="@{/admin/system/board/{bid}/category/{cid}/edit(bid=${master.bbsMasterId},cid=${c.categoryId})}"
               class="inline-flex items-center justify-center w-7 h-7 rounded border border-line bg-surface align-middle text-brand-60 hover:bg-surface-subtle mr-1" title="수정"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="align-middle" aria-hidden="true"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg><span class="sr-only">수정</span></a>
            <form th:action="@{/admin/system/board/{bid}/category/{cid}/use(bid=${master.bbsMasterId},cid=${c.categoryId})}"
                  method="post" class="inline-block align-middle">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
              <input type="hidden" name="active" th:value="${c.useYn == 'Y' ? 'false' : 'true'}"/>
              <button type="submit"
                      class="inline-flex items-center px-2 py-1 rounded border border-line bg-surface text-fg text-xs hover:bg-surface-subtle"
                      th:text="${c.useYn == 'Y'} ? '중지' : '재사용'">중지</button>
            </form>
            <form th:action="@{/admin/system/board/{bid}/category/{cid}/delete(bid=${master.bbsMasterId},cid=${c.categoryId})}"
                  method="post" class="inline-block align-middle"
                  data-confirm="모든 데이타가 삭제 됩니다. 삭제 하시겠습니까?">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
              <button type="submit"
                      class="inline-flex items-center justify-center w-7 h-7 rounded border border-line bg-surface align-middle text-danger-fg hover:bg-danger-surface" title="삭제"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="align-middle" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg><span class="sr-only">삭제</span></button>
            </form>
          </td>
        </tr>
        </tbody>
      </table>
    </div>

  </section>
</body>
</html>
