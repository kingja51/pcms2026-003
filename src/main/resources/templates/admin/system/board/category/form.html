<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout-admin}"
      lang="ko">
<head>
  <title th:text="${mode == 'new'} ? '카테고리 등록' : '카테고리 수정'">카테고리</title>
</head>
<body>
  <section layout:fragment="content">

    <nav aria-label="상위 경로" class="text-sm text-fg-subtle mb-2">
      <a th:href="@{/admin}" class="hover:underline">대시보드</a>
      <span class="mx-1">/</span>
      <a th:href="@{/admin/system/board}" class="hover:underline">게시판</a>
      <span class="mx-1">/</span>
      <a th:href="@{/admin/system/board/{id}(id=${master.bbsMasterId})}"
         class="hover:underline" th:text="${master.bbsName}">이름</a>
      <span class="mx-1">/</span>
      <a th:href="@{/admin/system/board/{id}/category(id=${master.bbsMasterId})}"
         class="hover:underline">카테고리</a>
      <span class="mx-1">/</span>
      <span th:text="${mode == 'new'} ? '등록' : '수정'">등록</span>
    </nav>

    <h1 class="text-heading-lg font-bold text-fg-strong mb-6"
        th:text="${mode == 'new'} ? '카테고리 등록' : '카테고리 수정'">카테고리</h1>

    <div th:if="${error}"
         class="mb-4 p-3 rounded bg-danger-surface border border-danger-border text-danger-fg text-sm"
         th:text="${error}">오류</div>

    <form th:action="${mode == 'new'}
                       ? @{/admin/system/board/{bid}/category/new(bid=${master.bbsMasterId})}
                       : @{/admin/system/board/{bid}/category/{cid}/edit(bid=${master.bbsMasterId},cid=${form.categoryId})}"
          th:object="${form}" method="post"
          class="bg-surface border border-line rounded-large p-6 space-y-5 max-w-xl">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <input type="hidden" th:field="*{bbsMasterId}"/>
      <input type="hidden" th:field="*{categoryId}" th:if="${mode != 'new'}"/>

      <div>
        <label class="block text-sm font-medium text-fg mb-1">게시판</label>
        <input type="text" readonly
               class="w-full px-3 py-2 rounded border border-line bg-surface-subtle text-fg text-sm"
               th:value="|${master.bbsName} (${master.bbsCode})|"/>
      </div>

      <div>
        <label class="block text-sm font-medium text-fg mb-1">
          카테고리 코드 <span class="text-danger-fg">*</span>
        </label>
        <input type="text" th:field="*{categoryCode}"
               maxlength="50" placeholder="chat, qna, info ..."
               class="w-full px-3 py-2 rounded border border-line text-sm focus:outline-none focus:ring-2 focus:ring-brand-50"/>
        <p class="mt-1 text-xs text-fg-subtle">영문/숫자/_/- 만 허용. 게시판 내에서 유일.</p>
        <p th:if="${#fields.hasErrors('categoryCode')}"
           class="mt-1 text-xs text-danger-fg" th:errors="*{categoryCode}">오류</p>
      </div>

      <div>
        <label class="block text-sm font-medium text-fg mb-1">
          카테고리 명 <span class="text-danger-fg">*</span>
        </label>
        <input type="text" th:field="*{categoryName}"
               maxlength="100" placeholder="잡담, 질문, 정보공유 ..."
               class="w-full px-3 py-2 rounded border border-line text-sm focus:outline-none focus:ring-2 focus:ring-brand-50"/>
        <p th:if="${#fields.hasErrors('categoryName')}"
           class="mt-1 text-xs text-danger-fg" th:errors="*{categoryName}">오류</p>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-fg mb-1">정렬 순서</label>
          <input type="number" th:field="*{sortOrder}" min="0" step="1"
                 class="w-full px-3 py-2 rounded border border-line text-sm focus:outline-none focus:ring-2 focus:ring-brand-50"/>
          <p class="mt-1 text-xs text-fg-subtle">작은 값이 먼저 노출됩니다.</p>
        </div>
        <div>
          <label class="block text-sm font-medium text-fg mb-1">사용 여부</label>
          <select th:field="*{useYn}"
                  class="w-full px-3 py-2 rounded border border-line text-sm focus:outline-none focus:ring-2 focus:ring-brand-50">
            <option value="Y">사용</option>
            <option value="N">중지</option>
          </select>
        </div>
      </div>

      <div class="flex items-center justify-end gap-2 pt-4 border-t border-divider">
        <a th:href="@{/admin/system/board/{bid}/category(bid=${master.bbsMasterId})}"
           class="inline-flex items-center px-4 py-2 rounded border border-line bg-surface text-fg text-sm hover:bg-surface-subtle">취소</a>
        <button type="submit"
                class="inline-flex items-center px-4 py-2 rounded bg-brand-50 text-fg-on text-sm font-medium hover:bg-brand-60"
                th:text="${mode == 'new'} ? '등록' : '저장'">등록</button>
      </div>
    </form>

  </section>
</body>
</html>
