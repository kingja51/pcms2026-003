<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout-admin}"
      lang="ko">
<head>
  <title>게시판 관리</title>
</head>
<body>
  <section layout:fragment="content">

    <nav aria-label="상위 경로" class="text-sm text-fg-subtle mb-2">
      <a th:href="@{/admin}" class="hover:underline">대시보드</a>
      <span class="mx-1">/</span>
      <span>게시판</span>
    </nav>

    <div class="flex items-center justify-between gap-4 flex-wrap mb-6">
      <div>
        <h1 class="text-heading-lg font-bold text-fg-strong">게시판 관리</h1>
        <p class="text-sm text-fg-subtle mt-1">총
          <strong class="text-fg-strong" th:text="${page.totalElements}">0</strong> 건
          <span class="mx-1 text-gray-30">·</span>
          작성글 합계
          <strong class="text-fg-strong"
                  th:with="sum=${#aggregates.sum(page.content.![articleCount])}"
                  th:text="${#numbers.formatInteger(sum ?: 0, 0, 'COMMA')}">0</strong>
          <span class="text-fg-disabled text-xs">(현재 페이지)</span>
        </p>
      </div>
      <div class="flex items-center gap-2">
        <a th:href="@{/admin/system/board/new}"
           class="inline-flex items-center px-3 py-1.5 rounded bg-brand-50 text-fg-on text-sm font-medium hover:bg-brand-60">+ 새 게시판</a>
        <details class="relative">
          <summary class="list-none inline-flex items-center px-3 py-1.5 rounded border border-line bg-surface text-fg text-sm hover:bg-surface-subtle cursor-pointer">
            엑셀 다운로드
          </summary>
          <div class="absolute right-0 mt-1 p-4 w-80 bg-surface border border-line rounded-large shadow-lg z-10">
            <form th:action="@{/admin/system/board/excel}" method="post" class="space-y-2">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
              <input type="hidden" name="siteId"  th:value="${search?.siteId}"/>
              <input type="hidden" name="bbsType" th:value="${search?.bbsType}"/>
              <input type="hidden" name="useYn"   th:value="${search?.useYn}"/>
              <input type="hidden" name="keyword" th:value="${search?.keyword}"/>
              <label for="bd-dl-reason" class="block text-xs font-medium text-fg">
                다운로드 사유 <span class="text-danger-fg">*</span> (10자 이상)
              </label>
              <textarea id="bd-dl-reason" name="downloadReason" required
                        minlength="10" maxlength="500" rows="3"
                        placeholder="예: 게시판 운영 현황 점검"
                        class="block w-full rounded border border-line px-2 py-1.5 text-sm focus:border-brand-50 focus:ring-2 focus:ring-brand-20 focus:outline-none"></textarea>
              <button type="submit"
                      class="w-full inline-flex items-center justify-center px-3 py-1.5 rounded bg-brand-50 text-fg-on text-sm font-medium hover:bg-brand-60">
                다운로드
              </button>
              <p class="text-[11px] text-fg-subtle">사유는 감사로그(<code>log_audit</code>) 에 기록됩니다.</p>
            </form>
          </div>
        </details>
      </div>
    </div>

    <div th:if="${message}" role="status" aria-live="polite"
         class="mb-4 rounded border border-success-border bg-success-surface px-4 py-3 text-sm text-success-fg" th:text="${message}"></div>
    <div th:if="${error}" role="alert" aria-live="polite"
         class="mb-4 rounded border border-danger-border bg-danger-surface px-4 py-3 text-sm text-danger-fg" th:text="${error}"></div>

    <form th:action="@{/admin/system/board}" method="get"
          role="search" aria-label="게시판 검색"
          class="bg-surface border border-line rounded-large p-4 mb-4">
      <div class="grid grid-cols-1 md:grid-cols-[1fr_180px_160px_140px_auto_auto] gap-3 items-end">
        <div>
          <label for="keyword" class="block text-xs font-medium text-fg-subtle mb-1">검색어</label>
          <input id="keyword" name="keyword" type="text"
                 th:value="${search?.keyword}" maxlength="100" placeholder="이름/코드"
                 class="block w-full rounded border border-line px-3 py-2 text-sm focus:border-brand-50 focus:ring-2 focus:ring-brand-20 focus:outline-none"/>
        </div>
        <div>
          <label for="siteId" class="block text-xs font-medium text-fg-subtle mb-1">사이트</label>
          <select id="siteId" name="siteId"
                  class="block w-full rounded border border-line px-3 py-2 text-sm">
            <option value="" th:selected="${search?.siteId == null or search?.siteId == ''}">전체</option>
            <option th:each="s : ${sites}" th:value="${s.siteId}"
                    th:text="${s.siteCode} + ' · ' + ${s.siteName}"
                    th:selected="${search?.siteId == s.siteId}">site</option>
          </select>
        </div>
        <div>
          <label for="bbsType" class="block text-xs font-medium text-fg-subtle mb-1">타입</label>
          <select id="bbsType" name="bbsType"
                  class="block w-full rounded border border-line px-3 py-2 text-sm">
            <option value="" th:selected="${search?.bbsType == null or search?.bbsType == '' or search?.bbsType == 'ALL'}">전체</option>
            <option th:each="t : ${bbsTypes}" th:value="${t.name()}"
                    th:text="${t.label} + ' (' + ${t.name()} + ')'"
                    th:selected="${search?.bbsType == t.name()}">FREE</option>
          </select>
        </div>
        <div>
          <label for="useYn" class="block text-xs font-medium text-fg-subtle mb-1">사용</label>
          <select id="useYn" name="useYn"
                  class="block w-full rounded border border-line px-3 py-2 text-sm">
            <option value="" th:selected="${search?.useYn == null or search?.useYn == '' or search?.useYn == 'ALL'}">전체</option>
            <option value="Y" th:selected="${search?.useYn == 'Y'}">사용중</option>
            <option value="N" th:selected="${search?.useYn == 'N'}">사용중지</option>
          </select>
        </div>
        <div class="flex items-center gap-2">
          <button type="submit"
                  class="inline-flex items-center px-4 py-2 rounded bg-gray-90 text-fg-on text-sm font-medium hover:bg-gray-70">검색</button>
          <a th:href="@{/admin/system/board}"
             class="inline-flex items-center px-4 py-2 rounded border border-line bg-surface text-fg text-sm hover:bg-surface-subtle">초기화</a>
        </div>
      </div>
    </form>

    <div class="bg-surface border border-line rounded-large overflow-hidden">
      <table class="min-w-full divide-y divide-line text-sm">
        <caption class="sr-only">게시판 목록</caption>
        <thead class="bg-surface-subtle">
          <tr class="text-left text-xs font-semibold text-fg-subtle uppercase tracking-wide">
            <th scope="col" class="px-4 py-3">이름</th>
            <th scope="col" class="px-4 py-3">코드</th>
            <th scope="col" class="px-4 py-3">사이트</th>
            <th scope="col" class="px-4 py-3">타입</th>
            <th scope="col" class="px-4 py-3 text-right">글수</th>
            <th scope="col" class="px-4 py-3">댓글/파일</th>
            <th scope="col" class="px-4 py-3">권한 R/W</th>
            <th scope="col" class="px-4 py-3">사용</th>
            <th scope="col" class="px-4 py-3">수정일시</th>
            <th scope="col" class="px-4 py-3 text-right">작업</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-divider">
          <tr th:each="row : ${page.content}" class="hover:bg-surface-subtle">
            <td class="px-4 py-2.5">
              <a th:href="@{/admin/system/board/{id}(id=${row.bbsMasterId})}"
                 class="text-brand-60 hover:underline font-medium" th:text="${row.bbsName}">이름</a>
              <span th:if="${row.aggregator}"
                    class="ml-1 inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-medium bg-secondary-5 text-secondary-70 border border-secondary-10"
                    title="통합 게시판 (전체글 보기)">통합</span>
            </td>
            <td class="px-4 py-2.5">
              <code class="font-mono text-xs bg-surface-subtle text-fg px-1.5 py-0.5 rounded border border-line"
                    th:text="${row.bbsCode}">code</code>
            </td>
            <td class="px-4 py-2.5 text-fg" th:text="${row.siteCode}">site</td>
            <td class="px-4 py-2.5">
              <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-surface-subtler text-fg"
                    th:text="${row.bbsType}">FREE</span>
            </td>
            <td class="px-4 py-2.5 whitespace-nowrap text-right">
              <a th:href="@{/admin/system/board/{id}/article(id=${row.bbsMasterId})}"
                 class="font-mono text-xs text-brand-60 hover:underline"
                 th:text="${#numbers.formatInteger(row.articleCount, 0, 'COMMA')}">0</a>
            </td>
            <td class="px-4 py-2.5 text-fg">
              <span th:text="${row.commentYn == 'Y' ? '댓글✓' : '댓글✗'}" class="mr-1">-</span>
              <span th:text="${row.fileYn == 'Y' ? '파일✓' : '파일✗'}">-</span>
            </td>
            <td class="px-4 py-2.5 text-xs text-fg">
              <span th:text="${row.readAuth}">ALL</span> /
              <span th:text="${row.writeAuth}">MEMBER</span>
            </td>
            <td class="px-4 py-2.5">
              <span th:if="${row.useYn == 'Y'}"
                    class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-success-surface text-success-fg">사용중</span>
              <span th:unless="${row.useYn == 'Y'}"
                    class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-surface-subtler text-fg-subtle">중지</span>
            </td>
            <td class="px-4 py-2.5 text-fg-subtle font-mono text-xs" th:text="${@fmt.dt(row.updatedAt)}">-</td>
            <td class="px-4 py-2.5 whitespace-nowrap text-right">
              <a th:href="@{/admin/system/board/{id}/edit(id=${row.bbsMasterId})}"
                 class="inline-flex items-center justify-center w-7 h-7 rounded border border-line bg-surface align-middle text-brand-60 hover:bg-surface-subtle mr-1" title="수정"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="align-middle" aria-hidden="true"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg><span class="sr-only">수정</span></a>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(page.content)}">
            <td colspan="10" class="px-4 py-10 text-center text-fg-subtle">등록된 게시판이 없습니다.</td>
          </tr>
        </tbody>
      </table>
    </div>

    <nav aria-label="페이지" th:if="${page.totalPages > 1}" class="mt-4">
      <ul class="flex items-center justify-center gap-1 text-sm">
        <li th:each="p : ${#numbers.sequence(1, page.totalPages)}">
          <a th:href="@{/admin/system/board(page=${p}, pageSize=${page.pageSize},
                       keyword=${search.keyword}, siteId=${search.siteId},
                       bbsType=${search.bbsType}, useYn=${search.useYn})}"
             th:text="${p}"
             th:class="${p == page.page}
                       ? 'inline-flex items-center justify-center min-w-[2rem] px-2 py-1 rounded bg-gray-90 text-fg-on'
                       : 'inline-flex items-center justify-center min-w-[2rem] px-2 py-1 rounded border border-line bg-surface text-fg hover:bg-surface-subtle'">1</a>
        </li>
      </ul>
    </nav>

  </section>
</body>
</html>
