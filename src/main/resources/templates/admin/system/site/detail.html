<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout-admin}"
      lang="ko">
<head>
  <title th:text="|사이트 상세 - ${site.siteName}|">사이트 상세</title>
</head>
<body>
  <section layout:fragment="content">

    <nav aria-label="상위 경로" class="text-sm text-fg-subtle mb-2">
      <a th:href="@{/admin/system/site}" class="hover:underline">사이트 목록</a>
      <span class="mx-1">/</span>
      <span class="font-mono" th:text="${site.siteCode}">CODE</span>
    </nav>

    <div class="flex items-start justify-between gap-4 flex-wrap mb-6">
      <div>
        <h1 class="text-heading-lg font-bold text-fg-strong" th:text="${site.siteName}">사이트</h1>
        <p class="text-xs text-fg-subtle font-mono mt-1" th:text="${site.siteId}">uuid</p>
      </div>
      <nav aria-label="사이트 작업" class="flex items-center gap-2">
        <a th:href="@{/admin/system/site/{id}/edit(id=${site.siteId})}"
           class="inline-flex items-center px-3 py-1.5 rounded bg-brand-50 text-fg-on text-sm font-medium hover:bg-brand-60">
          수정
        </a>
        <form th:action="@{/admin/system/site/{id}(id=${site.siteId})}"
              method="post"
              data-confirm="이 사이트를 삭제하시겠습니까? (소프트 삭제)"
              class="inline">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <input type="hidden" name="_method" value="delete"/>
          <button type="submit"
                  class="inline-flex items-center px-3 py-1.5 rounded border border-danger-border bg-surface text-danger-fg text-sm font-medium hover:bg-danger-surface">
            삭제
          </button>
        </form>
        <button type="button"
                data-history-back
                th:attr="data-history-back-fallback=@{/admin/system/site}"
                class="inline-flex items-center px-3 py-1.5 rounded border border-line bg-surface text-fg text-sm hover:bg-surface-subtle">
          뒤로가기
        </button>
        <a th:href="@{/admin/system/site}"
           class="inline-flex items-center px-3 py-1.5 rounded border border-line bg-surface text-fg text-sm hover:bg-surface-subtle">
          목록
        </a>
      </nav>
    </div>

    <!-- flash messages -->
    <div th:if="${message}" role="status" aria-live="polite"
         class="mb-4 rounded border border-success-border bg-success-surface px-4 py-3 text-sm text-success-fg"
         th:text="${message}"></div>
    <div th:if="${error}" role="alert" aria-live="polite"
         class="mb-4 rounded border border-danger-border bg-danger-surface px-4 py-3 text-sm text-danger-fg"
         th:text="${error}"></div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

      <!-- 기본 정보 -->
      <section aria-labelledby="info-heading"
               class="bg-surface border border-line rounded-large p-6 md:col-span-2">
        <h2 id="info-heading"
            class="text-xs font-semibold text-fg-subtle uppercase tracking-wide mb-4">기본 정보</h2>
        <dl class="grid grid-cols-1 sm:grid-cols-2 gap-x-6 gap-y-3 text-sm">
          <div>
            <dt class="text-fg-subtle">코드</dt>
            <dd class="font-mono text-fg-strong" th:text="${site.siteCode}">CODE</dd>
          </div>
          <div>
            <dt class="text-fg-subtle">이름</dt>
            <dd class="font-medium text-fg-strong" th:text="${site.siteName}">이름</dd>
          </div>
          <div>
            <dt class="text-fg-subtle">도메인</dt>
            <dd class="font-mono text-xs text-fg" th:text="${site.domain} ?: '-'">-</dd>
          </div>
          <div>
            <dt class="text-fg-subtle">링크</dt>
            <dd>
              <a class="font-medium text-brand-60 hover:underline"
                 th:href="${site.domain != null}
                ? @{|https://${site.domain}/${site.siteCode}|}
                : @{|http://127.0.0.1:8080/${site.siteCode}|}"
                 target="_blank"
                 rel="noopener noreferrer"
                 th:text="${site.domain != null}
                ? @{|https://${site.domain}/${site.siteCode}|}
                : @{|http://127.0.0.1:8080/${site.siteCode}|}">
                링크
              </a>
            </dd>
          </div>
          <div>
            <dt class="text-fg-subtle">기본 언어</dt>
            <dd class="text-fg-strong" th:text="${site.defaultLang}">ko</dd>
          </div>
          <div>
            <dt class="text-fg-subtle">테마</dt>
            <dd class="font-mono text-fg-strong"
                th:text="${#strings.isEmpty(site.theme)} ? '- (템플릿 기본)' : ${site.theme}">-</dd>
          </div>
          <div>
            <dt class="text-fg-subtle">사용 여부</dt>
            <dd>
              <span th:if="${site.useYn == 'Y'}"
                    class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-success-surface text-success-fg">사용</span>
              <span th:unless="${site.useYn == 'Y'}"
                    class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-surface-subtler text-fg-subtle">미사용</span>
            </dd>
          </div>
          <div class="sm:col-span-2">
            <dt class="text-fg-subtle mb-1">설명</dt>
            <dd class="text-fg whitespace-pre-wrap" th:text="${site.description} ?: '-'">-</dd>
          </div>
          <div>
            <dt class="text-fg-subtle">등록자 / 일시</dt>
            <dd class="text-fg">
              <span class="font-mono" th:text="${site.createdBy}">SYSTEM</span>
              <span class="text-fg-disabled mx-1">/</span>
              <span class="font-mono text-xs" th:text="${@fmt.dt(site.createdAt)}">-</span>
            </dd>
          </div>
          <div>
            <dt class="text-fg-subtle">수정자 / 일시</dt>
            <dd class="text-fg">
              <span class="font-mono" th:text="${site.updatedBy} ?: '-'">-</span>
              <span class="text-fg-disabled mx-1">/</span>
              <span class="font-mono text-xs" th:text="${@fmt.dt(site.updatedAt)}">-</span>
            </dd>
          </div>
        </dl>
      </section>

      <!--
        템플릿 선택 — 사이트 생성 후 이 화면에서 기본 템플릿을 선택하면
        SiteService.changeDefaultTemplate() → tb_site.default_template_id 업데이트 +
        SiteContextChangedEvent(TEMPLATE_CHANGED) 발행 → 캐시 무효화 → 다음 요청부터 새 레이아웃 반영.
      -->
      <section aria-labelledby="template-heading"
               class="bg-surface border border-line rounded-large p-6 md:col-span-2">
        <div class="flex items-center justify-between gap-4 flex-wrap mb-4">
          <h2 id="template-heading"
              class="text-xs font-semibold text-fg-subtle uppercase tracking-wide">기본 템플릿</h2>
          <div class="flex items-center gap-2 text-sm">
            <a th:href="@{/admin/system/template}"
               class="text-brand-60 hover:underline">템플릿 관리 →</a>
            <span class="text-fg-disabled">|</span>
            <a th:href="@{/admin/system/site/{id}/menu(id=${site.siteId})}"
               class="text-brand-60 hover:underline">메뉴 관리 →</a>
          </div>
        </div>

        <p class="text-sm text-fg mb-4">
          현재 :
          <strong class="text-fg-strong" th:text="${site.defaultTemplateName} ?: '(미지정)'">미지정</strong>
        </p>

        <div th:if="${#lists.isEmpty(templates)}"
             class="rounded border border-warning-border bg-warning-surface px-4 py-3 text-sm text-warning-fg">
          등록된 활성 템플릿이 없습니다.
          <a th:href="@{/admin/system/template/new}"
             class="ml-1 text-warning-fg font-medium hover:underline">새 템플릿 추가 →</a>
        </div>

        <form th:unless="${#lists.isEmpty(templates)}"
              th:action="@{/admin/system/site/{id}/default-template(id=${site.siteId})}"
              method="post" class="space-y-3">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

          <label class="flex items-center gap-2 text-sm">
            <input type="radio" name="templateId" value=""
                   th:checked="${site.defaultTemplateId == null}"
                   class="accent-brand-50"/>
            <span class="text-fg">(선택 안 함)</span>
          </label>

          <label th:each="t : ${templates}"
                 class="flex items-start gap-2 text-sm p-3 rounded border border-line hover:bg-surface-subtle cursor-pointer">
            <input type="radio" name="templateId" class="accent-brand-50 mt-0.5"
                   th:value="${t.templateId}"
                   th:checked="${t.templateId == site.defaultTemplateId}"/>
            <span>
              <strong class="text-fg-strong" th:text="${t.templateName}">템플릿명</strong>
              <small class="block mt-0.5 text-xs text-fg-subtle font-mono"
                     th:text="|(${t.templateCode}) - ${t.layoutPath}|">(CODE) - path</small>
            </span>
          </label>

          <button type="submit"
                  class="inline-flex items-center px-4 py-2 rounded bg-brand-50 text-fg-on text-sm font-medium hover:bg-brand-60">
            기본 템플릿 적용
          </button>
        </form>
      </section>

    </div>
  </section>
</body>
</html>
