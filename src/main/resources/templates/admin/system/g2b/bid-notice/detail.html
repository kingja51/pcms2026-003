<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout-admin}"
      lang="ko">
<head><title>입찰공고 상세</title></head>
<body>
<section layout:fragment="content">
  <nav class="text-sm text-fg-subtle mb-2">
    <a th:href="@{/admin}" class="hover:underline">대시보드</a>
    <span class="mx-1">/</span>
    <a th:href="@{/admin/system/g2b/bid-notice}" class="hover:underline">입찰공고</a>
    <span class="mx-1">/</span><span th:text="${row.bidNtceNo + '-' + row.bidNtceOrd}"></span>
  </nav>

  <h1 class="text-heading-lg font-bold text-fg-strong mb-1" th:text="${row.bidNtceNm}">공고명</h1>
  <p class="text-sm text-fg-subtle mb-4">
    <span th:text="${row.bidNtceNo + '-' + row.bidNtceOrd}"></span>
    <span class="mx-2">·</span>
    <span th:text="${@bsns.label(row.bsnsDiv)}"></span>
    <span th:if="${row.reNtceYn == 'Y'}" class="ml-2 inline-block px-2 py-0.5 rounded bg-warning-10 text-warning-fg text-xs">재공고</span>
  </p>

  <div class="bg-surface border border-line rounded p-4 mb-4">
    <dl class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-2 text-sm">
      <div><dt class="text-fg-subtle">공고기관</dt><dd th:text="${row.ntceInsttCd + ' ' + row.ntceInsttNm}"></dd></div>
      <div><dt class="text-fg-subtle">수요기관</dt><dd th:text="${row.dminsttCd + ' ' + row.dminsttNm}"></dd></div>
      <div><dt class="text-fg-subtle">입찰방식</dt><dd th:text="${row.bidMethdNm}"></dd></div>
      <div><dt class="text-fg-subtle">계약체결방법</dt><dd th:text="${row.cntrctCnclsMthdNm}"></dd></div>
      <div><dt class="text-fg-subtle">공고일시</dt><dd th:text="${row.bidNtceDt != null ? #temporals.format(row.bidNtceDt, 'yyyy-MM-dd HH:mm') : ''}"></dd></div>
      <div><dt class="text-fg-subtle">입찰개시</dt><dd th:text="${row.bidBgnDt != null ? #temporals.format(row.bidBgnDt, 'yyyy-MM-dd HH:mm') : ''}"></dd></div>
      <div><dt class="text-fg-subtle">입찰마감</dt><dd th:text="${row.bidClseDt != null ? #temporals.format(row.bidClseDt, 'yyyy-MM-dd HH:mm') : ''}"></dd></div>
      <div><dt class="text-fg-subtle">개찰일시</dt><dd th:text="${row.opengDt != null ? #temporals.format(row.opengDt, 'yyyy-MM-dd HH:mm') : ''}"></dd></div>
      <div class="md:col-span-2"><dt class="text-fg-subtle">개찰장소</dt><dd th:text="${row.opengPlce}"></dd></div>
      <div><dt class="text-fg-subtle">추정가격</dt><dd th:text="${row.presmptPrce != null ? #numbers.formatInteger(row.presmptPrce, 0, 'COMMA') + ' 원' : '-'}"></dd></div>
      <div><dt class="text-fg-subtle">배정예산</dt><dd th:text="${row.asignBdgtAmt != null ? #numbers.formatInteger(row.asignBdgtAmt, 0, 'COMMA') + ' 원' : '-'}"></dd></div>
      <div class="md:col-span-2">
        <dt class="text-fg-subtle">나라장터 공고 URL</dt>
        <dd>
          <a th:if="${row.bidNtceUrl}" th:href="${row.bidNtceUrl}" target="_blank"
             rel="noopener noreferrer" class="text-brand-70 hover:underline break-all"
             th:text="${row.bidNtceUrl}"></a>
          <span th:unless="${row.bidNtceUrl}" class="text-fg-disabled">-</span>
        </dd>
      </div>
    </dl>
  </div>

  <details class="bg-surface border border-line rounded p-4">
    <summary class="cursor-pointer text-sm font-semibold text-fg">원본 JSON</summary>
    <pre class="mt-2 text-xs bg-surface-subtle p-3 rounded overflow-x-auto" th:text="${row.rawJson}"></pre>
  </details>

  <div class="mt-4 text-xs text-fg-subtle">
    수집 일시: <span th:text="${#temporals.format(row.createdAt, 'yyyy-MM-dd HH:mm:ss')}"></span>
  </div>
</section>
</body>
</html>
