<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout-admin}"
      lang="ko">
<head><title>G2B 수집 이력</title></head>
<body>
<section layout:fragment="content">

  <nav class="text-sm text-fg-subtle mb-2">
    <a th:href="@{/admin}" class="hover:underline">대시보드</a>
    <span class="mx-1">/</span><span>조달청 연동</span>
    <span class="mx-1">/</span><span>수집 이력</span>
  </nav>

  <div class="flex items-start justify-between gap-4 flex-wrap mb-4">
    <div>
      <h1 class="text-heading-lg font-bold text-fg-strong mb-1">G2B 수집 이력</h1>
      <p class="text-sm text-fg-subtle">조달청 OpenAPI 1회 호출당 1행. 페이지네이션 단위로 적재됨.</p>
    </div>
    <details class="bg-surface border border-line rounded">
      <summary class="cursor-pointer px-3 py-1.5 text-sm font-semibold text-fg hover:bg-surface-subtle">📥 엑셀 다운로드</summary>
      <form method="post" th:action="@{/admin/system/g2b/collect-log/excel}" class="p-3 grid grid-cols-1 gap-2 text-sm w-80">
        <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}"/>
        <input type="hidden" name="apiKind"  th:value="${search.apiKind}"/>
        <input type="hidden" name="bsnsDiv"  th:value="${search.bsnsDiv}"/>
        <input type="hidden" name="status"   th:value="${search.status}"/>
        <input type="hidden" name="fromDate" th:value="${search.fromDate}"/>
        <input type="hidden" name="toDate"   th:value="${search.toDate}"/>
        <label class="block">
          <span class="text-xs text-fg-subtle">다운로드 사유 (10자 이상, 감사로그 기록)</span>
          <textarea name="downloadReason" rows="3" required minlength="10" maxlength="500"
                    class="w-full border rounded px-2 py-1" placeholder="예: 수집 실패 원인 분석"></textarea>
        </label>
        <button class="bg-gray-90 text-fg-on rounded px-3 py-1.5 font-semibold">다운로드</button>
        <p class="text-xs text-fg-subtle">현재 검색 조건이 적용된 전체 결과 (페이징 미적용).</p>
      </form>
    </details>
    <details class="bg-surface border border-line rounded">
      <summary class="cursor-pointer px-3 py-1.5 text-sm font-semibold text-fg hover:bg-surface-subtle">⚡ 지금 수집</summary>
      <form method="post" th:action="@{/admin/system/g2b/collect}" class="p-3 grid grid-cols-1 gap-2 text-sm w-64">
        <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}"/>
        <label class="block">
          <span class="text-xs text-fg-subtle">API</span>
          <select name="kind" class="w-full border rounded px-2 py-1">
            <option value="ALL">전체</option>
            <option value="ORDER_PLAN">발주계획</option>
            <option value="BID_NOTICE">입찰공고</option>
            <option value="OPENING">개찰결과</option>
          </select>
        </label>
        <label class="block">
          <span class="text-xs text-fg-subtle">업종</span>
          <select name="div" class="w-full border rounded px-2 py-1">
            <option value="ALL">전체</option>
            <option value="T">물품</option>
            <option value="S">용역</option>
            <option value="C">공사</option>
          </select>
        </label>
        <label class="block">
          <span class="text-xs text-fg-subtle">기간(일, 1~30)</span>
          <input type="number" name="days" value="17" min="1" max="30" class="w-full border rounded px-2 py-1"/>
        </label>
        <label class="block">
          <span class="text-xs text-fg-subtle">수요기관코드(비우면 화이트리스트 전체)</span>
          <input type="text" name="dminsttCd" placeholder="예: 4490000" class="w-full border rounded px-2 py-1"/>
        </label>
        <button class="bg-gray-90 text-fg-on rounded px-3 py-1.5 font-semibold">수집 실행</button>
        <p class="text-xs text-fg-subtle">실행은 동기 처리 — API 응답까지 대기합니다.</p>
      </form>
    </details>
  </div>

  <div th:if="${message}" class="mb-4 rounded border border-success-border bg-success-surface px-3 py-2 text-sm text-success-fg" th:text="${message}"></div>
  <div th:if="${error}"   class="mb-4 rounded border border-danger-border    bg-danger-surface    px-3 py-2 text-sm text-danger-fg"    th:text="${error}"></div>

  <form method="get" th:action="@{/admin/system/g2b/collect-log}"
        class="bg-surface border border-line rounded p-3 mb-4 grid grid-cols-1 md:grid-cols-6 gap-2 text-sm">
    <select name="apiKind" class="border rounded px-2 py-1">
      <option value="">API 종류 (전체)</option>
      <option value="ORDER_PLAN" th:selected="${search.apiKind == 'ORDER_PLAN'}">발주계획</option>
      <option value="BID_NOTICE" th:selected="${search.apiKind == 'BID_NOTICE'}">입찰공고</option>
      <option value="OPENING"    th:selected="${search.apiKind == 'OPENING'}">개찰결과</option>
    </select>
    <select name="bsnsDiv" class="border rounded px-2 py-1">
      <option value="">업종 (전체)</option>
      <option value="T" th:selected="${search.bsnsDiv == 'T'}">물품</option>
      <option value="S" th:selected="${search.bsnsDiv == 'S'}">용역</option>
      <option value="C" th:selected="${search.bsnsDiv == 'C'}">공사</option>
    </select>
    <select name="status" class="border rounded px-2 py-1">
      <option value="">상태 (전체)</option>
      <option value="SUCCESS" th:selected="${search.status == 'SUCCESS'}">SUCCESS</option>
      <option value="FAIL"    th:selected="${search.status == 'FAIL'}">FAIL</option>
    </select>
    <input type="date" name="fromDate" th:value="${search.fromDate}" class="border rounded px-2 py-1"/>
    <input type="date" name="toDate"   th:value="${search.toDate}"   class="border rounded px-2 py-1"/>
    <button class="bg-gray-90 text-fg-on rounded px-3 py-1 font-semibold">검색</button>
  </form>

  <div class="text-xs text-fg-subtle mb-2">총 <strong th:text="${page.totalElements}">0</strong>건</div>

  <div class="overflow-x-auto bg-surface rounded border border-line">
    <table class="min-w-full text-sm">
      <thead class="bg-surface-subtle">
        <tr class="text-left text-fg-subtle">
          <th class="px-3 py-2">ID</th>
          <th class="px-3 py-2">API</th>
          <th class="px-3 py-2">업종</th>
          <th class="px-3 py-2">기관</th>
          <th class="px-3 py-2 whitespace-nowrap text-right">페이지</th>
          <th class="px-3 py-2 whitespace-nowrap text-right">전체/응답/적재</th>
          <th class="px-3 py-2 whitespace-nowrap text-right">소요(ms)</th>
          <th class="px-3 py-2">상태</th>
          <th class="px-3 py-2">시각</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="r : ${page.content}" class="border-t border-divider hover:bg-surface-subtle">
          <td class="px-3 py-2">
            <a th:href="@{|/admin/system/g2b/collect-log/${r.id}|}"
               class="text-secondary-70 hover:underline" th:text="${r.id}"></a>
          </td>
          <td class="px-3 py-2" th:text="${r.apiKind}"></td>
          <td class="px-3 py-2" th:text="${@bsns.label(r.bsnsDiv)}"></td>
          <td class="px-3 py-2 text-xs" th:text="${r.dminsttCd}"></td>
          <td class="px-3 py-2 text-right" th:text="${r.pageNo + ' (' + r.numOfRows + ')'}"></td>
          <td class="px-3 py-2 text-right text-xs"
              th:text="${(r.totalCount ?: '-') + ' / ' + (r.fetchedCount ?: '-') + ' / ' + (r.upsertedCount ?: '-')}"></td>
          <td class="px-3 py-2 text-right" th:text="${r.elapsedMs}"></td>
          <td class="px-3 py-2">
            <span th:if="${r.status == 'SUCCESS'}" class="inline-block px-2 py-0.5 rounded bg-success-10 text-success-fg text-xs font-semibold">SUCCESS</span>
            <span th:if="${r.status == 'FAIL'}"    class="inline-block px-2 py-0.5 rounded bg-danger-10 text-danger-fg text-xs font-semibold">FAIL</span>
          </td>
          <td class="px-3 py-2 text-xs text-fg-subtle"
              th:text="${#temporals.format(r.createdAt, 'yyyy-MM-dd HH:mm:ss')}"></td>
        </tr>
        <tr th:if="${page.content.isEmpty()}">
          <td colspan="9" class="px-3 py-12 text-center text-fg-disabled">데이터가 없습니다.</td>
        </tr>
      </tbody>
    </table>
  </div>

  <nav th:if="${page.totalPages > 1}" class="mt-4 flex items-center justify-center gap-2 text-sm">
    <a th:if="${page.hasPrevious()}"
       th:href="@{/admin/system/g2b/collect-log(page=${page.page - 1}, pageSize=${page.pageSize},
                   apiKind=${search.apiKind}, bsnsDiv=${search.bsnsDiv}, status=${search.status},
                   fromDate=${search.fromDate}, toDate=${search.toDate})}"
       class="px-3 py-1 rounded border border-line bg-surface hover:bg-surface-subtle">‹ 이전</a>
    <span class="text-fg-subtle"><strong th:text="${page.page}">1</strong> / <span th:text="${page.totalPages}">1</span></span>
    <a th:if="${page.hasNext()}"
       th:href="@{/admin/system/g2b/collect-log(page=${page.page + 1}, pageSize=${page.pageSize},
                   apiKind=${search.apiKind}, bsnsDiv=${search.bsnsDiv}, status=${search.status},
                   fromDate=${search.fromDate}, toDate=${search.toDate})}"
       class="px-3 py-1 rounded border border-line bg-surface hover:bg-surface-subtle">다음 ›</a>
  </nav>
</section>
</body>
</html>
