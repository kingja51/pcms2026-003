<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout-admin}"
      lang="ko">
<head>
  <title>관리자</title>
</head>
<body>
  <section layout:fragment="content">

    <div class="flex items-center justify-between gap-4 flex-wrap mb-6">
      <div>
        <h1 class="text-heading-lg font-bold text-fg-strong">관리자</h1>
        <p class="text-sm text-fg-subtle mt-1">총
          <strong class="text-fg-strong" th:text="${page.totalElements}">0</strong> 건
        </p>
      </div>
      <div class="flex items-center gap-2">
        <a th:href="@{/admin/system/admin/new}"
           class="inline-flex items-center px-3 py-1.5 rounded bg-brand-50 text-fg-on text-sm font-medium hover:bg-brand-60 transition-colors">
          + 새 관리자
        </a>
        <details class="relative">
          <summary class="list-none inline-flex items-center px-3 py-1.5 rounded border border-line bg-surface text-fg text-sm hover:bg-surface-subtle cursor-pointer">
            엑셀 다운로드
          </summary>
          <div class="absolute right-0 mt-1 p-4 w-80 bg-surface border border-line rounded-large shadow-lg z-10">
            <form th:action="@{/admin/system/admin/excel}" method="post" class="space-y-2">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
              <input type="hidden" name="keyword"      th:value="${search?.keyword}"/>
              <input type="hidden" name="status"       th:value="${search?.status}"/>
              <input type="hidden" name="adminGroupId" th:value="${search?.adminGroupId}"/>
              <label for="admin-dl-reason" class="block text-xs font-medium text-fg">
                다운로드 사유 <span class="text-danger-fg">*</span> (10자 이상)
              </label>
              <textarea id="admin-dl-reason" name="downloadReason" required
                        minlength="10" maxlength="500" rows="3"
                        placeholder="예: 관리자 계정 분기 감사 보고용"
                        class="block w-full rounded border border-line px-2 py-1.5 text-sm focus:border-brand-50 focus:ring-2 focus:ring-brand-20 focus:outline-none"></textarea>
              <button type="submit"
                      class="w-full inline-flex items-center justify-center px-3 py-1.5 rounded bg-brand-50 text-fg-on text-sm font-medium hover:bg-brand-60">
                다운로드
              </button>
              <p class="text-[11px] text-fg-subtle">PII 포함 파일 — 사유가 <code>log_audit</code> 에 기록됩니다.</p>
            </form>
          </div>
        </details>
      </div>
    </div>

    <div th:if="${message}" role="status" aria-live="polite"
         class="mb-4 rounded border border-success-border bg-success-surface px-4 py-3 text-sm text-success-fg"
         th:text="${message}"></div>
    <div th:if="${error}" role="alert" aria-live="polite"
         class="mb-4 rounded border border-danger-border bg-danger-surface px-4 py-3 text-sm text-danger-fg"
         th:text="${error}"></div>

    <!-- 검색 카드 -->
    <form th:action="@{/admin/system/admin}" method="get" role="search" aria-label="관리자 검색"
          class="bg-surface border border-line rounded-large p-4 mb-4">
      <div class="grid grid-cols-1 md:grid-cols-[1fr_1fr_1fr_auto] gap-3 items-end">
        <div>
          <label for="keyword" class="block text-xs font-medium text-fg-subtle mb-1">검색어</label>
          <input id="keyword" name="keyword" type="text"
                 th:value="${search?.keyword}" maxlength="100" placeholder="로그인ID / 부서"
                 class="block w-full rounded border border-line px-3 py-2 text-sm focus:border-brand-50 focus:ring-2 focus:ring-brand-20 focus:outline-none"/>
        </div>
        <div>
          <label for="adminGroupId" class="block text-xs font-medium text-fg-subtle mb-1">그룹</label>
          <select id="adminGroupId" name="adminGroupId"
                  class="block w-full rounded border border-line px-3 py-2 text-sm focus:border-brand-50 focus:ring-2 focus:ring-brand-20 focus:outline-none">
            <option value="" th:selected="${search?.adminGroupId == null or search?.adminGroupId == ''}">전체</option>
            <option th:each="g : ${groups}"
                    th:value="${g.adminGroupId}"
                    th:text="|${g.groupName} (${g.groupCode})|"
                    th:selected="${g.adminGroupId == search?.adminGroupId}"></option>
          </select>
        </div>
        <div>
          <label for="status" class="block text-xs font-medium text-fg-subtle mb-1">상태</label>
          <select id="status" name="status"
                  class="block w-full rounded border border-line px-3 py-2 text-sm focus:border-brand-50 focus:ring-2 focus:ring-brand-20 focus:outline-none">
            <option value="" th:selected="${search?.status == null or search?.status == ''}">전체</option>
            <option th:each="o : ${@code.options('ADMIN_STATUS')}"
                    th:value="${o.code}"
                    th:text="|${o.codeName} (${o.code})|"
                    th:selected="${search?.status == o.code}">활성 (ACTIVE)</option>
          </select>
        </div>
        <div class="flex items-center gap-2">
          <button type="submit"
                  class="inline-flex items-center px-4 py-2 rounded bg-gray-90 text-fg-on text-sm font-medium hover:bg-gray-70">
            검색
          </button>
          <a th:href="@{/admin/system/admin}"
             class="inline-flex items-center px-4 py-2 rounded border border-line bg-surface text-fg text-sm hover:bg-surface-subtle">
            초기화
          </a>
        </div>
      </div>
    </form>

    <!-- 테이블 카드 -->
    <div class="bg-surface border border-line rounded-large overflow-hidden">
      <table class="min-w-full divide-y divide-line text-sm">
        <caption class="sr-only">관리자 목록</caption>
        <thead class="bg-surface-subtle">
          <tr class="text-left text-xs font-semibold text-fg-subtle uppercase tracking-wide">
            <th scope="col" class="px-4 py-3">로그인ID</th>
            <th scope="col" class="px-4 py-3">이름 (마스킹)</th>
            <th scope="col" class="px-4 py-3">이메일 (마스킹)</th>
            <th scope="col" class="px-4 py-3">그룹</th>
            <th scope="col" class="px-4 py-3">부서</th>
            <th scope="col" class="px-4 py-3">상태</th>
            <th scope="col" class="px-4 py-3">2FA</th>
            <th scope="col" class="px-4 py-3">등록일시</th>
            <th scope="col" class="px-4 py-3 text-right">작업</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-divider">
          <tr th:each="row : ${page.content}" class="hover:bg-surface-subtle">
            <td class="px-4 py-2.5">
              <a th:href="@{/admin/system/admin/{id}(id=${row.adminId})}"
                 class="text-brand-60 hover:underline font-medium"
                 th:text="${row.loginId}">loginId</a>
            </td>
            <td class="px-4 py-2.5 text-fg-strong" th:text="${@mask.name(row.adminName)}">***</td>
            <td class="px-4 py-2.5 text-fg font-mono text-xs"
                th:text="${@mask.email(row.email)}">***</td>
            <td class="px-4 py-2.5 text-fg" th:text="${row.adminGroupName} ?: '-'">-</td>
            <td class="px-4 py-2.5 text-fg-subtle text-xs"
                th:text="${row.departmentName} ?: '-'">-</td>
            <td class="px-4 py-2.5">
              <span th:with="st=${row.status}"
                    th:class="${st == 'ACTIVE'} ? 'inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-success-surface text-success-fg'
                             : (${st == 'LOCKED'}   ? 'inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-warning-surface text-warning-fg'
                             : (${st == 'INACTIVE'} ? 'inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-surface-subtler text-fg-subtle'
                             : 'inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-danger-surface text-danger-fg'))"
                    th:text="${@code.label('ADMIN_STATUS', st)}">활성</span>
            </td>
            <td class="px-4 py-2.5 text-xs">
              <span th:if="${row.twoFactorEnabledYn == 'Y'}"
                    class="inline-flex items-center px-2 py-0.5 rounded font-medium bg-secondary-5 text-secondary-70">ON</span>
              <span th:unless="${row.twoFactorEnabledYn == 'Y'}"
                    class="inline-flex items-center px-2 py-0.5 rounded font-medium bg-surface-subtler text-fg-subtle">OFF</span>
            </td>
            <td class="px-4 py-2.5 text-fg-subtle font-mono text-xs" th:text="${@fmt.dt(row.createdAt)}">-</td>
            <td class="px-4 py-2.5 whitespace-nowrap text-right">
              <a th:href="@{/admin/system/admin/{id}/edit(id=${row.adminId})}"
                 class="inline-flex items-center px-2.5 py-1 rounded border border-line bg-surface text-xs text-fg hover:bg-surface-subtle">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="align-middle" aria-hidden="true"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
<span class="sr-only">수정</span>
              </a>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(page.content)}">
            <td colspan="9" class="px-4 py-10 text-center text-fg-subtle">등록된 관리자가 없습니다.</td>
          </tr>
        </tbody>
      </table>
    </div>

    <nav aria-label="페이지" th:if="${page.totalPages > 1}" class="mt-4">
      <ul class="flex items-center justify-center gap-1 text-sm">
        <li th:each="p : ${#numbers.sequence(1, page.totalPages)}">
          <a th:href="@{/admin/system/admin(page=${p}, pageSize=${page.pageSize},
                                            keyword=${search.keyword}, status=${search.status},
                                            adminGroupId=${search.adminGroupId})}"
             th:text="${p}"
             th:class="${p == page.page}
                       ? 'inline-flex items-center justify-center min-w-[2rem] px-2 py-1 rounded bg-gray-90 text-fg-on'
                       : 'inline-flex items-center justify-center min-w-[2rem] px-2 py-1 rounded border border-line bg-surface text-fg hover:bg-surface-subtle'">1</a>
        </li>
      </ul>
    </nav>

  </section>
</body>
</html>
