<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout-admin}"
      lang="ko">
<head>
  <title th:text="${mode == 'edit'} ? '허용 IP 수정' : '허용 IP 등록'">허용 IP 폼</title>
</head>
<body>
  <section layout:fragment="content" class="max-w-2xl mx-auto">

    <nav aria-label="상위 경로" class="text-sm text-fg-subtle mb-2">
      <a th:href="@{/admin/system/admin}" class="hover:underline">관리자</a>
      <span class="mx-1">/</span>
      <a th:href="@{/admin/system/admin/{id}(id=${admin.adminId})}"
         class="hover:underline font-mono" th:text="${admin.loginId}">loginId</a>
      <span class="mx-1">/</span>
      <a th:href="@{/admin/system/admin/{id}/allow-ip(id=${admin.adminId})}"
         class="hover:underline">허용 IP</a>
      <span class="mx-1">/</span>
      <span th:text="${mode == 'edit'} ? '수정' : '새 IP'">새 IP</span>
    </nav>

    <h1 class="text-heading-lg font-bold text-fg-strong mb-6"
        th:text="${mode == 'edit'} ? '허용 IP 수정' : '허용 IP 등록'">허용 IP 폼</h1>

    <div th:if="${error}" role="alert"
         class="mb-4 rounded border border-danger-border bg-danger-surface px-4 py-3 text-sm text-danger-fg"
         th:text="${error}"></div>
    <div th:if="${errors}" role="alert"
         class="mb-4 rounded border border-danger-border bg-danger-surface px-4 py-3 text-sm text-danger-fg">
      <ul class="list-disc pl-5">
        <li th:each="e : ${errors}" th:text="${e.defaultMessage}">error</li>
      </ul>
    </div>

    <form th:action="${mode == 'edit'}
                     ? @{/admin/system/admin/{aid}/allow-ip/{id}(aid=${admin.adminId}, id=${form.ipId})}
                     : @{/admin/system/admin/{aid}/allow-ip(aid=${admin.adminId})}"
          method="post"
          th:object="${form}"
          class="bg-surface border border-line rounded-large p-6 space-y-5">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <input type="hidden" th:field="*{ipId}"/>
      <input type="hidden" th:field="*{adminId}"/>

      <div>
        <label for="ipType" class="block text-sm font-medium text-fg mb-1">
          유형 <span class="text-danger-fg">*</span>
        </label>
        <select id="ipType" th:field="*{ipType}" required
                class="block w-full rounded border border-line px-3 py-2 text-sm focus:border-brand-50 focus:ring-2 focus:ring-brand-20 focus:outline-none">
          <option value="SINGLE">SINGLE — 단일 IPv4 (예: 192.168.0.1)</option>
          <option value="RANGE">RANGE — IP 범위 (예: 10.0.0.1 ~ 10.0.0.10)</option>
          <option value="CIDR">CIDR — 네트워크 표기 (예: 10.0.0.0/8)</option>
        </select>
        <p class="text-xs text-fg-subtle mt-1">유형에 따라 아래 입력란이 다릅니다.</p>
      </div>

      <div>
        <label for="ipAddress" class="block text-sm font-medium text-fg mb-1">
          IP 주소 / CIDR
        </label>
        <input id="ipAddress" type="text" th:field="*{ipAddress}" maxlength="50"
               placeholder="SINGLE: 192.168.0.1 / CIDR: 10.0.0.0/8"
               class="block w-full rounded border border-line px-3 py-2 text-sm font-mono focus:border-brand-50 focus:ring-2 focus:ring-brand-20 focus:outline-none"/>
        <p class="text-xs text-fg-subtle mt-1">SINGLE / CIDR 일 때 사용. RANGE 일 때는 비워두세요.</p>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
        <div>
          <label for="ipStart" class="block text-sm font-medium text-fg mb-1">
            시작 IP (RANGE)
          </label>
          <input id="ipStart" type="text" th:field="*{ipStart}" maxlength="50"
                 placeholder="10.0.0.1"
                 class="block w-full rounded border border-line px-3 py-2 text-sm font-mono focus:border-brand-50 focus:ring-2 focus:ring-brand-20 focus:outline-none"/>
        </div>
        <div>
          <label for="ipEnd" class="block text-sm font-medium text-fg mb-1">
            종료 IP (RANGE)
          </label>
          <input id="ipEnd" type="text" th:field="*{ipEnd}" maxlength="50"
                 placeholder="10.0.0.10"
                 class="block w-full rounded border border-line px-3 py-2 text-sm font-mono focus:border-brand-50 focus:ring-2 focus:ring-brand-20 focus:outline-none"/>
        </div>
      </div>

      <div>
        <label for="description" class="block text-sm font-medium text-fg mb-1">설명</label>
        <input id="description" type="text" th:field="*{description}" maxlength="200"
               placeholder="예: 본사 사무실 / VPN / 출장지 임시"
               class="block w-full rounded border border-line px-3 py-2 text-sm focus:border-brand-50 focus:ring-2 focus:ring-brand-20 focus:outline-none"/>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
        <div>
          <label for="expiresAt" class="block text-sm font-medium text-fg mb-1">만료 일시 (선택)</label>
          <input id="expiresAt" type="datetime-local" th:field="*{expiresAt}"
                 class="block w-full rounded border border-line px-3 py-2 text-sm focus:border-brand-50 focus:ring-2 focus:ring-brand-20 focus:outline-none"/>
          <p class="text-xs text-fg-subtle mt-1">비워두면 영구. 임시 출장 IP 등에 활용.</p>
        </div>
        <div>
          <label for="useYn" class="block text-sm font-medium text-fg mb-1">사용 여부</label>
          <select id="useYn" th:field="*{useYn}"
                  class="block w-full rounded border border-line px-3 py-2 text-sm focus:border-brand-50 focus:ring-2 focus:ring-brand-20 focus:outline-none">
            <option value="Y">사용</option>
            <option value="N">미사용</option>
          </select>
        </div>
      </div>

      <div class="flex items-center justify-end gap-2 pt-4 border-t border-line">
        <a th:href="@{/admin/system/admin/{id}/allow-ip(id=${admin.adminId})}"
           class="inline-flex items-center px-4 py-2 rounded border border-line bg-surface text-fg text-sm hover:bg-surface-subtle">
          취소
        </a>
        <button type="submit"
                class="inline-flex items-center px-4 py-2 rounded bg-brand-50 text-fg-on text-sm font-medium hover:bg-brand-60">
          저장
        </button>
      </div>
    </form>

  </section>
</body>
</html>
