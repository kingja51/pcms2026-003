<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout-admin}"
      lang="ko">
<head><title>설문조사 관리</title></head>
<body>
  <section layout:fragment="content">

    <nav class="text-sm text-fg-subtle mb-2">
      <a th:href="@{/admin}" class="hover:underline">대시보드</a> / <span>설문조사</span>
    </nav>

    <div class="flex items-center justify-between gap-4 flex-wrap mb-6">
      <div>
        <h1 class="text-heading-lg font-bold text-fg-strong">설문조사 관리</h1>
        <p class="text-sm text-fg-subtle mt-1">총 <strong th:text="${page.totalElements}">0</strong> 건</p>
      </div>
      <a th:href="@{/admin/system/survey/new(surveyMasterId=${search?.surveyMasterId})}"
         class="px-3 py-1.5 rounded bg-brand-50 text-fg-on text-sm font-medium hover:bg-brand-60">+ 새 설문</a>
    </div>

    <div th:if="${message}" class="mb-4 rounded border border-success-border bg-success-surface px-4 py-3 text-sm text-success-fg" th:text="${message}"></div>
    <div th:if="${error}"   class="mb-4 rounded border border-danger-border bg-danger-surface px-4 py-3 text-sm text-danger-fg"            th:text="${error}"></div>

    <form th:action="@{/admin/system/survey}" method="get" class="bg-surface border border-line rounded-large p-4 mb-4">
      <div class="grid grid-cols-1 md:grid-cols-[1fr_240px_140px_140px_auto] gap-3 items-end">
        <div>
          <label class="block text-xs font-medium text-fg-subtle mb-1">검색어</label>
          <input name="keyword" type="text" th:value="${search?.keyword}" placeholder="제목"
                 class="block w-full rounded border border-line px-3 py-2 text-sm"/>
        </div>
        <div>
          <label class="block text-xs font-medium text-fg-subtle mb-1">설문 마스터</label>
          <select name="surveyMasterId" class="block w-full rounded border border-line px-3 py-2 text-sm">
            <option value="">전체</option>
            <option th:each="m : ${masters}" th:value="${m.surveyMasterId}"
                    th:text="${m.siteCode} + ' · ' + ${m.masterTitle}"
                    th:selected="${search?.surveyMasterId == m.surveyMasterId}">master</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium text-fg-subtle mb-1">상태</label>
          <select name="status" class="block w-full rounded border border-line px-3 py-2 text-sm">
            <option value="">전체</option>
            <option th:each="st : ${statuses}" th:value="${st.name()}"
                    th:text="${st.name()}"
                    th:selected="${search?.status == st.name()}">DRAFT</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium text-fg-subtle mb-1">사용</label>
          <select name="useYn" class="block w-full rounded border border-line px-3 py-2 text-sm">
            <option value="">전체</option>
            <option value="Y" th:selected="${search?.useYn == 'Y'}">사용중</option>
            <option value="N" th:selected="${search?.useYn == 'N'}">사용중지</option>
          </select>
        </div>
        <div class="flex gap-2">
          <button type="submit" class="px-4 py-2 rounded bg-gray-90 text-fg-on text-sm font-medium">검색</button>
          <a th:href="@{/admin/system/survey}" class="px-4 py-2 rounded border border-line bg-surface text-fg text-sm">초기화</a>
        </div>
      </div>
    </form>

    <div class="bg-surface border border-line rounded-large overflow-hidden">
      <table class="min-w-full divide-y divide-line text-sm">
        <thead class="bg-surface-subtle">
          <tr class="text-left text-xs font-semibold text-fg-subtle uppercase">
            <th class="px-4 py-3">제목</th>
            <th class="px-4 py-3">설문 마스터</th>
            <th class="px-4 py-3">사이트</th>
            <th class="px-4 py-3">기간</th>
            <th class="px-4 py-3">상태</th>
            <th class="px-4 py-3">응답수</th>
            <th class="px-4 py-3">사용</th>
            <th class="px-4 py-3 text-right">작업</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-divider">
          <tr th:each="row : ${page.content}" class="hover:bg-surface-subtle">
            <td class="px-4 py-2.5">
              <a th:href="@{/admin/system/survey/{id}(id=${row.surveyId})}"
                 class="text-brand-60 hover:underline font-medium" th:text="${row.surveyTitle}">제목</a>
            </td>
            <td class="px-4 py-2.5 text-fg">
              <a th:href="@{/admin/system/survey-master/{id}(id=${row.surveyMasterId})}"
                 class="text-brand-60 hover:underline" th:text="${row.masterTitle}">master</a>
            </td>
            <td class="px-4 py-2.5 text-fg" th:text="${row.siteCode}">-</td>
            <td class="px-4 py-2.5 text-fg font-mono text-xs">
              <span th:text="${@fmt.dt(row.startAt)}">-</span> ~ <span th:text="${@fmt.dt(row.endAt)}">-</span>
            </td>
            <td class="px-4 py-2.5">
              <span class="inline-flex px-2 py-0.5 rounded text-xs font-medium"
                    th:classappend="${row.status == 'PUBLISHED'} ? 'bg-success-surface text-success-fg' :
                                       (${row.status == 'CLOSED'} ? 'bg-surface-subtler text-fg-subtle' : 'bg-warning-surface text-warning-fg')"
                    th:text="${row.status}">DRAFT</span>
            </td>
            <td class="px-4 py-2.5 text-fg" th:text="${row.responseCount}">0</td>
            <td class="px-4 py-2.5">
              <span th:if="${row.useYn == 'Y'}"  class="inline-flex px-2 py-0.5 rounded text-xs bg-success-surface text-success-fg">사용중</span>
              <span th:unless="${row.useYn == 'Y'}" class="inline-flex px-2 py-0.5 rounded text-xs bg-surface-subtler text-fg-subtle">중지</span>
            </td>
            <td class="px-4 py-2.5 whitespace-nowrap text-right">
              <a th:href="@{/admin/system/survey/{id}/responses(id=${row.surveyId})}"
                 class="px-2.5 py-1 rounded border border-line bg-surface text-xs">응답</a>
              <a th:href="@{/admin/system/survey/{id}/edit(id=${row.surveyId})}"
                 class="inline-flex items-center justify-center w-7 h-7 rounded border border-line bg-surface align-middle text-brand-60 hover:bg-surface-subtle mr-1" title="수정"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="align-middle" aria-hidden="true"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg><span class="sr-only">수정</span></a>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(page.content)}">
            <td colspan="8" class="px-4 py-10 text-center text-fg-subtle">등록된 설문이 없습니다.</td>
          </tr>
        </tbody>
      </table>
    </div>

    <nav th:if="${page.totalPages > 1}" class="mt-4">
      <ul class="flex items-center justify-center gap-1 text-sm">
        <li th:each="p : ${#numbers.sequence(1, page.totalPages)}">
          <a th:href="@{/admin/system/survey(page=${p}, pageSize=${page.pageSize},
                       keyword=${search.keyword}, surveyMasterId=${search.surveyMasterId},
                       status=${search.status}, useYn=${search.useYn})}"
             th:text="${p}"
             th:class="${p == page.page} ? 'inline-flex justify-center min-w-[2rem] px-2 py-1 rounded bg-gray-90 text-fg-on' : 'inline-flex justify-center min-w-[2rem] px-2 py-1 rounded border border-line bg-surface text-fg'">1</a>
        </li>
      </ul>
    </nav>

  </section>
</body>
</html>
