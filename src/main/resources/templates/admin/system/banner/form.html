<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout-admin}"
      lang="ko">
<head>
  <title>배너 등록·수정</title>
  <th:block th:replace="~{fragments/file-picker :: styles}"/>
</head>
<body>
  <section layout:fragment="content">

    <nav aria-label="상위 경로" class="text-sm text-fg-subtle mb-2">
      <a th:href="@{/admin}" class="hover:underline">대시보드</a>
      <span class="mx-1">/</span>
      <a th:href="@{/admin/system/banner}" class="hover:underline">배너</a>
      <span class="mx-1">/</span>
      <span th:text="${mode == 'create' ? '등록' : '수정'}">등록</span>
    </nav>

    <h1 class="text-heading-lg font-bold text-fg-strong mb-6"
        th:text="${mode == 'create' ? '배너 등록' : '배너 수정'}">배너 등록</h1>

    <div th:if="${error}" role="alert"
         class="mb-4 rounded border border-danger-border bg-danger-surface px-4 py-3 text-sm text-danger-fg" th:text="${error}"></div>

    <form th:object="${form}" method="post"
          th:action="${mode == 'create'} ? @{/admin/system/banner} : @{/admin/system/banner/{id}(id=${form.bannerId})}"
          class="space-y-6 bg-surface border border-line rounded-large p-6">

      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <input type="hidden" th:if="${mode == 'edit'}" th:field="*{bannerId}"/>

      <fieldset class="space-y-4">
        <legend class="text-base font-semibold text-fg-strong">기본 정보</legend>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label for="siteId" class="block text-xs font-medium text-fg-subtle mb-1">사이트 <span class="text-danger-fg">*</span></label>
            <select id="siteId" th:field="*{siteId}" required
                    class="block w-full rounded border border-line px-3 py-2 text-sm">
              <option value="">선택</option>
              <option th:each="s : ${sites}" th:value="${s.siteId}"
                      th:text="${s.siteCode} + ' · ' + ${s.siteName}">site</option>
            </select>
          </div>
          <div>
            <label for="bannerLocation" class="block text-xs font-medium text-fg-subtle mb-1">위치 <span class="text-danger-fg">*</span></label>
            <select id="bannerLocation" th:field="*{bannerLocation}" required
                    class="block w-full rounded border border-line px-3 py-2 text-sm">
              <option value="">선택</option>
              <option th:each="o : ${@code.options('BANNER_LOCATION')}" th:value="${o.code}"
                      th:text="${o.codeName} + ' (' + ${o.code} + ')'">위치</option>
            </select>
            <p class="text-[11px] text-fg-subtle mt-1">레이아웃에서 같은 위치 키를 가진 활성 배너를 일괄 노출합니다.
              새 영역은 공통코드 <code class="font-mono">BANNER_LOCATION</code> 그룹에 코드를 추가하세요.</p>
          </div>
        </div>

        <div>
          <label for="bannerTitle" class="block text-xs font-medium text-fg-subtle mb-1">제목 / 캡션 <span class="text-danger-fg">*</span></label>
          <input id="bannerTitle" type="text" th:field="*{bannerTitle}" required maxlength="200"
                 class="block w-full rounded border border-line px-3 py-2 text-sm"/>
        </div>

        <div>
          <label class="block text-xs font-medium text-fg-subtle mb-1">이미지 <span class="text-fg-disabled">(IMAGE 카테고리, 1개)</span></label>
          <div th:replace="~{fragments/file-picker :: picker(
              inputName='imagePickerJson',
              category='IMAGE',
              multiple=false,
              existingFiles=${existingFiles},
              readOnly=false,
              entityType='BANNER',
              entityId=${form.bannerId},
              siteId=${form.siteId},
              maxFiles=1,
              fileGroupId=${fileGroupId})}"></div>
          <input type="hidden" th:field="*{fileGroupId}"/>
          <p class="text-[11px] text-fg-subtle mt-1">picker 로 업로드된 이미지는 file_group 으로 묶여 저장됩니다. 그룹 단위로 다운로드/삭제됩니다.</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label for="altText" class="block text-xs font-medium text-fg-subtle mb-1">대체 텍스트 (접근성)</label>
            <input id="altText" type="text" th:field="*{altText}" maxlength="500"
                   class="block w-full rounded border border-line px-3 py-2 text-sm"/>
          </div>
          <div>
            <label for="linkUrl" class="block text-xs font-medium text-fg-subtle mb-1">링크 URL</label>
            <!-- type="url" 은 절대 http(s)만 통과시켜 사이트 내부 경로(/prg/... 등) 입력을 막음 —
                 서버 검증(BannerSaveForm)이 http(s)/절대경로/#/mailto/tel 화이트리스트를 담당 -->
            <input id="linkUrl" type="text" th:field="*{linkUrl}" maxlength="1000"
                   placeholder="https://... 또는 /prg/faculty/ai 같은 사이트 내부 경로"
                   class="block w-full rounded border border-line px-3 py-2 text-sm"/>
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-fg-subtle mb-1">링크 타겟</label>
          <div class="flex gap-4 text-sm">
            <label class="inline-flex items-center gap-1.5">
              <input type="radio" name="linkTarget" value="_self"
                     th:checked="${form.linkTarget == '_self' or form.linkTarget == null}"/>
              현재 창 (_self)
            </label>
            <label class="inline-flex items-center gap-1.5">
              <input type="radio" name="linkTarget" value="_blank"
                     th:checked="${form.linkTarget == '_blank'}"/>
              새 창 (_blank)
            </label>
          </div>
        </div>
      </fieldset>

      <fieldset class="space-y-4">
        <legend class="text-base font-semibold text-fg-strong">노출 일정</legend>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-medium text-fg-subtle mb-1">노출 시작 <span class="text-danger-fg">*</span></label>
            <input type="datetime-local" th:field="*{showFrom}" required
                   class="block w-full rounded border border-line px-3 py-2 text-sm"/>
          </div>
          <div>
            <label class="block text-xs font-medium text-fg-subtle mb-1">노출 종료 <span class="text-danger-fg">*</span></label>
            <input type="datetime-local" th:field="*{showTo}" required
                   class="block w-full rounded border border-line px-3 py-2 text-sm"/>
          </div>
        </div>
      </fieldset>

      <fieldset class="space-y-4">
        <legend class="text-base font-semibold text-fg-strong">옵션</legend>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs font-medium text-fg-subtle mb-1">정렬 순서</label>
            <input type="number" th:field="*{sortOrder}" min="0"
                   class="block w-full rounded border border-line px-3 py-2 text-sm"/>
          </div>
          <div class="flex items-end">
            <label class="inline-flex items-center gap-2 text-sm">
              <input type="checkbox" name="useYn" value="Y"
                     th:checked="${form.useYn == 'Y'}"
                     class="rounded border-line"/>
              사용함
            </label>
          </div>
        </div>
      </fieldset>

      <div class="flex items-center justify-end gap-2 pt-4 border-t border-line">
        <a th:href="@{/admin/system/banner}"
           class="inline-flex items-center px-4 py-2 rounded border border-line bg-surface text-fg text-sm hover:bg-surface-subtle">목록</a>
        <a th:href="@{/admin/system/banner}"
           class="inline-flex items-center px-4 py-2 rounded border border-line bg-surface text-fg text-sm hover:bg-surface-subtle">취소</a>
        <button type="submit"
                class="inline-flex items-center px-4 py-2 rounded bg-brand-50 text-fg-on text-sm font-medium hover:bg-brand-60"
                th:text="${mode == 'create' ? '등록' : '수정'}">등록</button>
      </div>
    </form>

    <th:block th:replace="~{fragments/file-picker :: scripts}"/>
  </section>
</body>
</html>
