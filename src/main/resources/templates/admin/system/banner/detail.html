<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout-admin}"
      lang="ko">
<head>
  <title>배너 상세</title>
</head>
<body>
  <section layout:fragment="content">

    <nav aria-label="상위 경로" class="text-sm text-fg-subtle mb-2">
      <a th:href="@{/admin}" class="hover:underline">대시보드</a>
      <span class="mx-1">/</span>
      <a th:href="@{/admin/system/banner}" class="hover:underline">배너</a>
      <span class="mx-1">/</span>
      <span th:text="${banner.bannerTitle}">제목</span>
    </nav>

    <div class="flex items-center justify-between gap-4 flex-wrap mb-6">
      <div>
        <h1 class="text-heading-lg font-bold text-fg-strong" th:text="${banner.bannerTitle}">제목</h1>
        <p class="text-sm text-fg-subtle mt-1">
          <span th:text="${banner.siteCode}">site</span> ·
          <span class="font-mono text-xs" th:text="${banner.bannerId}">id</span>
        </p>
      </div>
      <div class="flex items-center gap-2">
        <a th:href="@{/admin/system/banner}"
           class="inline-flex items-center px-3 py-1.5 rounded border border-line bg-surface text-fg text-sm hover:bg-surface-subtle">목록</a>
        <a th:href="@{/admin/system/banner/{id}/edit(id=${banner.bannerId})}"
           class="inline-flex items-center px-3 py-1.5 rounded bg-brand-50 text-fg-on text-sm font-medium hover:bg-brand-60">수정</a>

        <form th:action="@{/admin/system/banner/{id}/use(id=${banner.bannerId})}" method="post" class="inline">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <input type="hidden" name="active" th:value="${banner.useYn == 'Y' ? 'false' : 'true'}"/>
          <button type="submit"
                  th:class="${banner.useYn == 'Y'}
                            ? 'inline-flex items-center px-3 py-1.5 rounded border border-warning-border bg-warning-surface text-warning-fg text-sm hover:bg-warning-10'
                            : 'inline-flex items-center px-3 py-1.5 rounded border border-success-border bg-success-surface text-success-fg text-sm hover:bg-success-10'"
                  th:text="${banner.useYn == 'Y' ? '사용중지' : '사용 재개'}">사용중지</button>
        </form>

        <form th:action="@{/admin/system/banner/{id}/delete(id=${banner.bannerId})}" method="post" class="inline"
              data-confirm="모든 데이타가 삭제 됩니다. 삭제 하시겠습니까?">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button type="submit"
                  class="inline-flex items-center px-3 py-1.5 rounded border border-danger-border bg-danger-surface text-danger-fg text-sm hover:bg-danger-10">삭제</button>
        </form>
      </div>
    </div>

    <div th:if="${message}" role="status"
         class="mb-4 rounded border border-success-border bg-success-surface px-4 py-3 text-sm text-success-fg" th:text="${message}"></div>
    <div th:if="${error}" role="alert"
         class="mb-4 rounded border border-danger-border bg-danger-surface px-4 py-3 text-sm text-danger-fg" th:text="${error}"></div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
      <div class="lg:col-span-2 bg-surface border border-line rounded-large p-5">
        <h2 class="text-base font-semibold text-fg-strong mb-3">기본 정보</h2>
        <dl class="grid grid-cols-[120px_1fr] gap-y-2 text-sm">
          <dt class="text-fg-subtle">위치</dt>
          <dd>
            <span th:text="${@code.label('BANNER_LOCATION', banner.bannerLocation)}">랜딩 히어로 캐러셀</span>
            <code class="font-mono text-xs bg-surface-subtle px-1.5 py-0.5 rounded border border-line"
                  th:text="${banner.bannerLocation}">HEADER</code>
          </dd>
          <dt class="text-fg-subtle">사용</dt>
          <dd>
            <span th:if="${banner.useYn == 'Y'}"
                  class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-success-surface text-success-fg">사용중</span>
            <span th:unless="${banner.useYn == 'Y'}"
                  class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-surface-subtler text-fg-subtle">중지</span>
          </dd>
          <dt class="text-fg-subtle">노출 기간</dt>
          <dd class="font-mono text-xs">
            <span th:text="${@fmt.dt(banner.showFrom)}">-</span> ~
            <span th:text="${@fmt.dt(banner.showTo)}">-</span>
          </dd>
          <dt class="text-fg-subtle">이미지</dt>
          <dd>
            <a th:if="${thumbFileId}"
               th:href="@{/fileDown/{fid}(fid=${thumbFileId})}" target="_blank" rel="noopener">
              <img th:src="@{/fileDown/{fid}/thumb(fid=${thumbFileId})}"
                   th:alt="${banner.altText}"
                   class="max-w-xs border border-line rounded"
                   data-fp-thumb/>
            </a>
            <span th:unless="${thumbFileId}" class="text-fg-subtle">(이미지 없음)</span>
          </dd>
          <dt class="text-fg-subtle">파일 그룹</dt>
          <dd>
            <a th:if="${banner.fileGroupId}"
               th:href="@{/fileDown/group/{gid}(gid=${banner.fileGroupId})}"
               class="text-brand-60 hover:underline font-mono text-xs"
               th:text="${banner.fileGroupId}">group</a>
            <span th:unless="${banner.fileGroupId}" class="text-fg-subtle">-</span>
          </dd>
          <dt class="text-fg-subtle">대체 텍스트</dt>
          <dd th:text="${banner.altText ?: '-'}">-</dd>
          <dt class="text-fg-subtle">링크</dt>
          <dd>
            <a th:if="${banner.linkUrl}" th:href="${banner.linkUrl}" th:target="${banner.linkTarget}"
               rel="noopener" th:text="${banner.linkUrl}"
               class="text-brand-60 hover:underline break-all">link</a>
            <span class="ml-2 text-xs text-fg-subtle" th:text="'(' + ${banner.linkTarget} + ')'">(_self)</span>
            <span th:unless="${banner.linkUrl}" class="text-fg-subtle">-</span>
          </dd>
          <dt class="text-fg-subtle">정렬 순서</dt>
          <dd th:text="${banner.sortOrder}">0</dd>
        </dl>
      </div>

      <div class="bg-surface border border-line rounded-large p-5">
        <h2 class="text-base font-semibold text-fg-strong mb-3">감사 정보</h2>
        <dl class="grid grid-cols-[80px_1fr] gap-y-2 text-sm">
          <dt class="text-fg-subtle">생성</dt>
          <dd class="font-mono text-xs" th:text="${@fmt.dt(banner.createdAt)}">-</dd>
          <dt class="text-fg-subtle">생성자</dt>
          <dd class="font-mono text-xs break-all" th:text="${banner.createdBy ?: '-'}">-</dd>
          <dt class="text-fg-subtle">수정</dt>
          <dd class="font-mono text-xs" th:text="${@fmt.dt(banner.updatedAt)}">-</dd>
          <dt class="text-fg-subtle">수정자</dt>
          <dd class="font-mono text-xs break-all" th:text="${banner.updatedBy ?: '-'}">-</dd>
        </dl>
      </div>
    </div>

  </section>
</body>
</html>
