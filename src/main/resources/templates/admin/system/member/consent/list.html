<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout-admin}"
      lang="ko">
<head><title>회원 동의 이력</title></head>
<body>
  <section layout:fragment="content">

    <nav class="text-sm text-fg-subtle mb-2">
      <a th:href="@{/admin}" class="hover:underline">대시보드</a> /
      <a th:href="@{/admin/system/member}" class="hover:underline">회원</a> /
      <span>동의 이력</span>
    </nav>

    <div class="flex items-center justify-between gap-4 flex-wrap mb-6">
      <div>
        <h1 class="text-heading-lg font-bold text-fg-strong">회원 동의 이력</h1>
        <p class="text-sm text-fg-subtle mt-1">총 <strong class="text-fg-strong" th:text="${page.totalElements}">0</strong> 건</p>
      </div>
      <details class="relative">
        <summary class="list-none inline-flex items-center px-3 py-1.5 rounded border border-line bg-surface text-fg text-sm hover:bg-surface-subtle cursor-pointer">엑셀 다운로드</summary>
        <div class="absolute right-0 mt-1 p-4 w-80 bg-surface border border-line rounded-large shadow-lg z-10">
          <form th:action="@{/admin/system/member/consent/excel}" method="post" class="space-y-2">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="hidden" name="memberId"    th:value="${search?.memberId}"/>
            <input type="hidden" name="consentType" th:value="${search?.consentType}"/>
            <input type="hidden" name="agreeYn"     th:value="${search?.agreeYn}"/>
            <input type="hidden" name="agreedFrom"  th:value="${search?.agreedFrom}"/>
            <input type="hidden" name="agreedTo"    th:value="${search?.agreedTo}"/>
            <label class="block text-xs font-medium text-fg">다운로드 사유 <span class="text-danger-fg">*</span> (10자 이상)</label>
            <textarea name="downloadReason" required minlength="10" maxlength="500" rows="3"
                      placeholder="예: 동의 이력 감사 자료 추출"
                      class="block w-full rounded border border-line px-2 py-1.5 text-sm focus:border-brand-50 focus:ring-2 focus:ring-brand-20 focus:outline-none"></textarea>
            <button type="submit" class="w-full inline-flex items-center justify-center px-3 py-1.5 rounded bg-brand-50 text-fg-on text-sm font-medium hover:bg-brand-60">다운로드</button>
            <p class="text-[11px] text-fg-subtle">사유가 log_audit 에 기록됩니다.</p>
          </form>
        </div>
      </details>
    </div>

    <div th:if="${message}" role="status" class="mb-4 rounded border border-success-border bg-success-surface px-4 py-3 text-sm text-success-fg" th:text="${message}"></div>
    <div th:if="${error}" role="alert" class="mb-4 rounded border border-danger-border bg-danger-surface px-4 py-3 text-sm text-danger-fg" th:text="${error}"></div>

    <form th:action="@{/admin/system/member/consent}" method="get"
          class="bg-surface border border-line rounded-large p-4 mb-4">
      <div class="grid grid-cols-1 md:grid-cols-[2fr_1fr_1fr_1fr_1fr_auto] gap-3 items-end">
        <div>
          <label class="block text-xs font-medium text-fg-subtle mb-1">회원 ID</label>
          <input name="memberId" type="text" th:value="${search?.memberId}" maxlength="40" placeholder="UUID v7"
                 class="block w-full rounded border border-line px-3 py-2 text-sm font-mono"/>
        </div>
        <div>
          <label class="block text-xs font-medium text-fg-subtle mb-1">유형</label>
          <select name="consentType" class="block w-full rounded border border-line px-3 py-2 text-sm">
            <option value="" th:selected="${search?.consentType == null or search?.consentType == ''}">전체</option>
            <option value="TERMS"        th:selected="${search?.consentType == 'TERMS'}">TERMS</option>
            <option value="PRIVACY"      th:selected="${search?.consentType == 'PRIVACY'}">PRIVACY</option>
            <option value="MARKETING"    th:selected="${search?.consentType == 'MARKETING'}">MARKETING</option>
            <option value="SMS"          th:selected="${search?.consentType == 'SMS'}">SMS</option>
            <option value="EMAIL"        th:selected="${search?.consentType == 'EMAIL'}">EMAIL</option>
            <option value="THIRD_PARTY"  th:selected="${search?.consentType == 'THIRD_PARTY'}">THIRD_PARTY</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium text-fg-subtle mb-1">동의 여부</label>
          <select name="agreeYn" class="block w-full rounded border border-line px-3 py-2 text-sm">
            <option value="" th:selected="${search?.agreeYn == null or search?.agreeYn == ''}">전체</option>
            <option value="Y" th:selected="${search?.agreeYn == 'Y'}">Y</option>
            <option value="N" th:selected="${search?.agreeYn == 'N'}">N</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium text-fg-subtle mb-1">시작일</label>
          <input name="agreedFrom" type="date" th:value="${search?.agreedFrom}" class="block w-full rounded border border-line px-3 py-2 text-sm"/>
        </div>
        <div>
          <label class="block text-xs font-medium text-fg-subtle mb-1">종료일</label>
          <input name="agreedTo" type="date" th:value="${search?.agreedTo}" class="block w-full rounded border border-line px-3 py-2 text-sm"/>
        </div>
        <div class="flex items-center gap-2">
          <button type="submit" class="inline-flex items-center px-4 py-2 rounded bg-gray-90 text-fg-on text-sm font-medium hover:bg-gray-70">검색</button>
        </div>
      </div>
    </form>

    <div class="bg-surface border border-line rounded-large overflow-hidden">
      <table class="min-w-full divide-y divide-line text-sm">
        <thead class="bg-surface-subtle">
          <tr class="text-left text-xs font-semibold text-fg-subtle uppercase tracking-wide">
            <th class="px-4 py-3">동의 일시</th>
            <th class="px-4 py-3">유형</th>
            <th class="px-4 py-3">버전</th>
            <th class="px-4 py-3">동의</th>
            <th class="px-4 py-3">회원 ID</th>
            <th class="px-4 py-3">IP</th>
            <th class="px-4 py-3 text-right">작업</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-divider">
          <tr th:each="r : ${page.content}" class="hover:bg-surface-subtle">
            <td class="px-4 py-2.5 font-mono text-xs text-fg" th:text="${@fmt.dt(r.agreedAt)}">-</td>
            <td class="px-4 py-2.5 text-fg-strong" th:text="${r.consentType}">TERMS</td>
            <td class="px-4 py-2.5 text-fg" th:text="${r.consentVersion} ?: '-'">v1</td>
            <td class="px-4 py-2.5">
              <span th:if="${r.agreeYn == 'Y'}" class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-success-surface text-success-fg">Y</span>
              <span th:if="${r.agreeYn == 'N'}" class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-danger-surface text-danger-fg">N</span>
            </td>
            <td class="px-4 py-2.5 font-mono text-[11px] text-fg-subtle" th:text="${r.memberId}">-</td>
            <td class="px-4 py-2.5 font-mono text-xs text-fg" th:text="${r.clientIp} ?: '-'">-</td>
            <td class="px-4 py-2.5 whitespace-nowrap text-right">
              <a th:href="@{/admin/system/member/consent/{id}(id=${r.memberConsentId})}"
                 class="inline-flex items-center justify-center w-7 h-7 rounded border border-line bg-surface align-middle text-fg-subtle hover:bg-surface-subtle mr-1" title="상세"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="align-middle" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg><span class="sr-only">상세</span></a>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(page.content)}">
            <td colspan="7" class="px-4 py-10 text-center text-fg-subtle">조회된 동의 이력이 없습니다.</td>
          </tr>
        </tbody>
      </table>
    </div>

    <nav th:if="${page.totalPages > 1}" class="mt-4">
      <ul class="flex items-center justify-center gap-1 text-sm">
        <li th:each="p : ${#numbers.sequence(1, page.totalPages)}">
          <a th:href="@{/admin/system/member/consent(page=${p}, pageSize=${page.pageSize},
                                                       memberId=${search.memberId}, consentType=${search.consentType},
                                                       agreeYn=${search.agreeYn},
                                                       agreedFrom=${search.agreedFrom}, agreedTo=${search.agreedTo})}"
             th:text="${p}"
             th:class="${p == page.page}
                       ? 'inline-flex items-center justify-center min-w-[2rem] px-2 py-1 rounded bg-gray-90 text-fg-on'
                       : 'inline-flex items-center justify-center min-w-[2rem] px-2 py-1 rounded border border-line bg-surface text-fg hover:bg-surface-subtle'">1</a>
        </li>
      </ul>
    </nav>

  </section>
</body>
</html>
