<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout-admin}"
      lang="ko">
<head><title>휴면 안내 발송 이력</title></head>
<body>
  <section layout:fragment="content">

    <nav class="text-sm text-fg-subtle mb-2">
      <a th:href="@{/admin}" class="hover:underline">대시보드</a> /
      <a th:href="@{/admin/system/member}" class="hover:underline">회원</a> /
      <span>휴면 안내 발송 이력</span>
    </nav>

    <div class="flex items-center justify-between gap-4 flex-wrap mb-6">
      <div>
        <h1 class="text-heading-lg font-bold text-fg-strong">휴면 안내 발송 이력</h1>
        <p class="text-sm text-fg-subtle mt-1">30D / 7D / 1D 안내 메일 — UNIQUE(member_id, stage) 중복 발송 차단. 총 <strong class="text-fg-strong" th:text="${page.totalElements}">0</strong> 건</p>
      </div>
      <details class="relative">
        <summary class="list-none inline-flex items-center px-3 py-1.5 rounded border border-line bg-surface text-fg text-sm hover:bg-surface-subtle cursor-pointer">엑셀 다운로드</summary>
        <div class="absolute right-0 mt-1 p-4 w-80 bg-surface border border-line rounded-large shadow-lg z-10">
          <form th:action="@{/admin/system/member/dormant-notice/excel}" method="post" class="space-y-2">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="hidden" name="memberId" th:value="${search?.memberId}"/>
            <input type="hidden" name="stage"    th:value="${search?.stage}"/>
            <input type="hidden" name="sentFrom" th:value="${search?.sentFrom}"/>
            <input type="hidden" name="sentTo"   th:value="${search?.sentTo}"/>
            <label class="block text-xs font-medium text-fg">다운로드 사유 <span class="text-danger-fg">*</span> (10자 이상)</label>
            <textarea name="downloadReason" required minlength="10" maxlength="500" rows="3" class="block w-full rounded border border-line px-2 py-1.5 text-sm"></textarea>
            <button type="submit" class="w-full inline-flex items-center justify-center px-3 py-1.5 rounded bg-brand-50 text-fg-on text-sm font-medium hover:bg-brand-60">다운로드</button>
          </form>
        </div>
      </details>
    </div>

    <div th:if="${message}" role="status" class="mb-4 rounded border border-success-border bg-success-surface px-4 py-3 text-sm text-success-fg" th:text="${message}"></div>
    <div th:if="${error}" role="alert" class="mb-4 rounded border border-danger-border bg-danger-surface px-4 py-3 text-sm text-danger-fg" th:text="${error}"></div>

    <form th:action="@{/admin/system/member/dormant-notice}" method="get"
          class="bg-surface border border-line rounded-large p-4 mb-4">
      <div class="grid grid-cols-1 md:grid-cols-[2fr_1fr_1fr_1fr_auto] gap-3 items-end">
        <div>
          <label class="block text-xs font-medium text-fg-subtle mb-1">회원 ID</label>
          <input name="memberId" type="text" th:value="${search?.memberId}" maxlength="40" placeholder="UUID v7" class="block w-full rounded border border-line px-3 py-2 text-sm font-mono"/>
        </div>
        <div>
          <label class="block text-xs font-medium text-fg-subtle mb-1">단계</label>
          <select name="stage" class="block w-full rounded border border-line px-3 py-2 text-sm">
            <option value="" th:selected="${search?.stage == null or search?.stage == ''}">전체</option>
            <option value="30D" th:selected="${search?.stage == '30D'}">30D</option>
            <option value="7D"  th:selected="${search?.stage == '7D'}">7D</option>
            <option value="1D"  th:selected="${search?.stage == '1D'}">1D</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium text-fg-subtle mb-1">발송 시작일</label>
          <input name="sentFrom" type="date" th:value="${search?.sentFrom}" class="block w-full rounded border border-line px-3 py-2 text-sm"/>
        </div>
        <div>
          <label class="block text-xs font-medium text-fg-subtle mb-1">발송 종료일</label>
          <input name="sentTo" type="date" th:value="${search?.sentTo}" class="block w-full rounded border border-line px-3 py-2 text-sm"/>
        </div>
        <button type="submit" class="inline-flex items-center px-4 py-2 rounded bg-gray-90 text-fg-on text-sm font-medium hover:bg-gray-70">검색</button>
      </div>
    </form>

    <div class="bg-surface border border-line rounded-large overflow-hidden">
      <table class="min-w-full divide-y divide-line text-sm">
        <thead class="bg-surface-subtle">
          <tr class="text-left text-xs font-semibold text-fg-subtle uppercase tracking-wide">
            <th class="px-4 py-3">발송 일시</th>
            <th class="px-4 py-3">단계</th>
            <th class="px-4 py-3">회원 ID</th>
            <th class="px-4 py-3">발송자</th>
            <th class="px-4 py-3 text-right">작업</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-divider">
          <tr th:each="r : ${page.content}" class="hover:bg-surface-subtle">
            <td class="px-4 py-2.5 font-mono text-xs text-fg" th:text="${@fmt.dt(r.sentAt)}">-</td>
            <td class="px-4 py-2.5">
              <span th:with="s=${r.stage}"
                    th:class="${s == '1D'} ? 'inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-danger-surface text-danger-fg'
                             : (${s == '7D'} ? 'inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-warning-surface text-warning-fg'
                                              : 'inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-info-surface text-info-fg')"
                    th:text="${s}">30D</span>
            </td>
            <td class="px-4 py-2.5 font-mono text-[11px] text-fg-subtle" th:text="${r.memberId}">-</td>
            <td class="px-4 py-2.5 text-fg" th:text="${r.createdBy} ?: 'SYSTEM'">SYSTEM</td>
            <td class="px-4 py-2.5 whitespace-nowrap text-right">
              <a th:href="@{/admin/system/member/dormant-notice/{id}(id=${r.noticeId})}" class="inline-flex items-center justify-center w-7 h-7 rounded border border-line bg-surface align-middle text-fg-subtle hover:bg-surface-subtle mr-1" title="상세"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="align-middle" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg><span class="sr-only">상세</span></a>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(page.content)}">
            <td colspan="5" class="px-4 py-10 text-center text-fg-subtle">조회된 발송 이력이 없습니다.</td>
          </tr>
        </tbody>
      </table>
    </div>

    <nav th:if="${page.totalPages > 1}" class="mt-4">
      <ul class="flex items-center justify-center gap-1 text-sm">
        <li th:each="p : ${#numbers.sequence(1, page.totalPages)}">
          <a th:href="@{/admin/system/member/dormant-notice(page=${p}, pageSize=${page.pageSize},
                                                             memberId=${search.memberId}, stage=${search.stage},
                                                             sentFrom=${search.sentFrom}, sentTo=${search.sentTo})}"
             th:text="${p}"
             th:class="${p == page.page} ? 'inline-flex items-center justify-center min-w-[2rem] px-2 py-1 rounded bg-gray-90 text-fg-on' : 'inline-flex items-center justify-center min-w-[2rem] px-2 py-1 rounded border border-line bg-surface text-fg hover:bg-surface-subtle'">1</a>
        </li>
      </ul>
    </nav>
  </section>
</body>
</html>
