<!DOCTYPE html>
<!--
  ★ 학과소개 샘플(서식) — templates/samples/about.html
  · SiteTemplateScaffolder 가 새 사이트 폴더로 복사하는 원본. 복사 후 각 학과가
    소개 문구·교육 목표·통계 숫자를 자기 내용으로 교체한다.
  · cse 학과소개 구조 이식(소개 hero + 통계 타일 + 교육 목표) — KRDS 시맨틱 토큰판.
-->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{__${layoutPath ?: 'front/layouts/EMPTY/empty'}__}"
      lang="ko">
<head>
  <title>학과소개</title>
  <link rel="stylesheet" th:href="@{/css/banner-carousel.css}"/>
</head>
<body>
<section layout:fragment="content">

  <!-- ══ 소개 — 서브페이지 상단 비주얼(SUB_HERO)은 KRDS 레이아웃이 메뉴↔breadcrumb 사이에
       공통 렌더(배너 없으면 미노출). 페이지는 자체 제목/본문만 담당 ══ -->
  <div class="bg-surface border-b border-line">
    <div class="max-w-content mx-auto px-4 py-16 grid grid-cols-1 lg:grid-cols-12 gap-8">
      <div class="lg:col-span-7">
        <p class="text-label-md text-fg-subtle mb-3">About</p>
        <h1 class="text-heading-xl font-bold text-fg-strong">학과소개</h1>
        <p class="text-body-lg text-fg-subtle mt-4">
          <span th:text="${siteContext?.site?.siteName} ?: '학과'">학과명</span>는
          전문 지식과 실무 역량을 갖춘 인재를 양성합니다.
          <!-- ⬇ 학과 소개 문구를 여기에 작성해 주세요 -->
        </p>
      </div>
      <!-- 통계 타일 — 학과 실측 숫자로 교체 -->
      <div class="lg:col-span-5 grid grid-cols-2 gap-4">
        <div class="bg-surface-subtle border border-line rounded-large p-5">
          <p class="text-display-sm font-bold text-fg-strong">-</p>
          <p class="text-body-xs text-fg-subtle mt-1">전임 교원</p>
        </div>
        <div class="bg-surface-subtle border border-line rounded-large p-5">
          <p class="text-display-sm font-bold text-fg-strong">-</p>
          <p class="text-body-xs text-fg-subtle mt-1">재학생</p>
        </div>
        <div class="bg-surface-subtle border border-line rounded-large p-5">
          <p class="text-display-sm font-bold text-primary-60">-</p>
          <p class="text-body-xs text-fg-subtle mt-1">취업률</p>
        </div>
        <div class="bg-surface-subtle border border-line rounded-large p-5">
          <p class="text-display-sm font-bold text-fg-strong">KY</p>
          <p class="text-body-xs text-fg-subtle mt-1">Konyang University</p>
        </div>
      </div>
    </div>
  </div>

  <!-- ══ 교육 목표 ══ -->
  <div class="max-w-content mx-auto px-4 py-12">
    <h2 class="text-heading-lg font-bold text-fg-strong mb-4">교육 목표</h2>
    <ul class="text-body-md text-fg space-y-2 max-w-3xl">
      <!-- ⬇ 학과 교육 목표로 교체해 주세요 -->
      <li>· 창의적 문제해결 능력을 갖춘 전문 인재 양성</li>
      <li>· 이론과 실무를 겸비한 융합형 인재 교육</li>
      <li>· 산학협력과 현장 중심 교육을 통한 실무 역량 강화</li>
      <li>· 지역사회와 함께 성장하는 봉사 정신 함양</li>
    </ul>
  </div>

</section>
</body>
</html>
