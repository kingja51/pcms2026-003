<!DOCTYPE html>
<!--
  휴면 해제 인증번호 메일 — MailTemplate.CODE_ACCOUNT_DORMANT_OTP
  모델: memberName, loginId, otpCode

  ⚠️ raw hex 를 쓴다. 메일 클라이언트는 CSS 변수를 지원하지 않아 KRDS 토큰이
     그대로 깨진다 — CLAUDE.md 가 명시한 예외다(메일 템플릿 한정).
     인라인 스타일도 같은 이유다. <style> 블록을 지우는 클라이언트가 많다.
-->
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8"/>
  <title>휴면 계정 해제 인증번호</title>
</head>
<body style="margin:0;padding:0;background-color:#f3f4f6;font-family:'Malgun Gothic',AppleSDGothicNeo,sans-serif;">

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f3f4f6;padding:32px 12px;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
             style="max-width:520px;background-color:#ffffff;border:1px solid #e5e7eb;border-radius:8px;">

        <tr>
          <td style="padding:28px 28px 8px 28px;">
            <h1 style="margin:0;font-size:20px;line-height:1.4;color:#111827;">휴면 계정 해제 인증번호</h1>
          </td>
        </tr>

        <tr>
          <td style="padding:8px 28px 0 28px;font-size:14px;line-height:1.7;color:#4b5563;">
            <p style="margin:0 0 4px 0;">
              <strong th:text="${memberName}" style="color:#111827;">회원</strong>님, 안녕하세요.
            </p>
            <p style="margin:0;">
              아이디 <strong th:text="${loginId}" style="color:#111827;">loginId</strong> 의
              휴면 상태를 해제하기 위한 인증번호입니다.
            </p>
          </td>
        </tr>

        <!-- 인증번호 — 자간을 벌려 오독(0/O, 1/l)을 줄인다 -->
        <tr>
          <td style="padding:24px 28px;">
            <div style="background-color:#f9fafb;border:1px solid #e5e7eb;border-radius:6px;padding:20px;text-align:center;">
              <div style="font-size:12px;color:#6b7280;margin-bottom:8px;">인증번호</div>
              <div th:text="${otpCode}"
                   style="font-size:32px;font-weight:700;letter-spacing:8px;color:#111827;font-family:Consolas,Menlo,monospace;">000000</div>
            </div>
          </td>
        </tr>

        <tr>
          <td style="padding:0 28px 24px 28px;font-size:13px;line-height:1.7;color:#6b7280;">
            <ul style="margin:0;padding-left:18px;">
              <li>유효시간은 <strong style="color:#b91c1c;">5분</strong>입니다.</li>
              <li>5회 이상 잘못 입력하면 인증번호가 폐기됩니다. 다시 요청해 주세요.</li>
              <li>본인이 요청하지 않았다면 <strong style="color:#111827;">이 메일을 무시</strong>해 주세요.
                  인증번호를 입력하지 않으면 아무 일도 일어나지 않습니다.</li>
            </ul>
          </td>
        </tr>

        <tr>
          <td style="padding:16px 28px;border-top:1px solid #e5e7eb;font-size:12px;line-height:1.6;color:#9ca3af;">
            본 메일은 발신 전용입니다. 인증번호를 <strong style="color:#6b7280;">누구에게도 알려주지 마세요</strong> —
            정상적인 안내 과정에서 인증번호를 묻는 일은 없습니다.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>

</body>
</html>
