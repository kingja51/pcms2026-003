<!DOCTYPE html>
<!--
  비밀번호 변경 완료 알림 메일 — MemberServiceImpl.changePassword() 직후 발송.
  보안 목적: 본인이 변경하지 않은 경우 신고할 수 있도록 즉시 통지.
  모델 변수:
    memberName  : 회원 이름 (PII)
    loginId     : 로그인 ID
    siteName    : 사이트명
    changedAt   : 변경 일시 (LocalDateTime)
    clientIp    : 변경 수행 클라이언트 IP (마스킹 권장)
    userAgent   : User-Agent (요약)
    supportUrl  : 문의 URL (선택)
-->
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8"/>
  <title>비밀번호 변경 알림</title>
</head>
<body style="margin:0;padding:0;background-color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;color:#0f172a;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color:#f8fafc;padding:24px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="560" cellspacing="0" cellpadding="0" border="0"
               style="background-color:#ffffff;border:1px solid #e2e8f0;border-radius:8px;overflow:hidden;">

          <!-- 헤더 -->
          <tr>
            <td style="padding:24px 32px;border-bottom:1px solid #e2e8f0;">
              <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                <tr>
                  <td style="width:36px;height:36px;background-color:#0f172a;border-radius:6px;color:#ffffff;text-align:center;font-weight:700;font-size:18px;line-height:36px;">G</td>
                  <td style="padding-left:10px;">
                    <div style="font-weight:700;font-size:16px;color:#0f172a;" th:text="${@project.nameKo}">관리자</div>
                    <div style="font-size:12px;color:#64748b;">계정 보안 알림</div>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- 본문 -->
          <tr>
            <td style="padding:28px 32px;">
              <div style="display:inline-block;background-color:#dcfce7;color:#166534;font-size:12px;font-weight:600;padding:4px 10px;border-radius:4px;letter-spacing:0.3px;margin-bottom:12px;">SECURITY</div>
              <h1 style="margin:0 0 12px 0;font-size:18px;color:#0f172a;">비밀번호가 변경되었습니다</h1>
              <p style="margin:0 0 16px 0;font-size:14px;line-height:1.6;color:#334155;">
                <strong th:text="${memberName}">홍길동</strong> 님의 계정 비밀번호가 정상적으로 변경되었습니다.
              </p>

              <!-- 변경 정보 -->
              <div style="margin:20px 0;padding:16px 20px;background-color:#f1f5f9;border:1px solid #e2e8f0;border-radius:6px;">
                <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
                  <tr>
                    <td style="padding:6px 0;font-size:12px;color:#64748b;width:110px;">로그인 ID</td>
                    <td style="padding:6px 0;font-size:13px;color:#0f172a;font-family:ui-monospace,monospace;"
                        th:text="${loginId}">example_user</td>
                  </tr>
                  <tr>
                    <td style="padding:6px 0;font-size:12px;color:#64748b;">변경 일시</td>
                    <td style="padding:6px 0;font-size:13px;color:#0f172a;font-family:ui-monospace,monospace;"
                        th:text="${#temporals.format(changedAt, 'yyyy-MM-dd HH:mm:ss')}">2026-04-21 15:30:00</td>
                  </tr>
                  <tr th:if="${clientIp}">
                    <td style="padding:6px 0;font-size:12px;color:#64748b;">접속 IP</td>
                    <td style="padding:6px 0;font-size:13px;color:#0f172a;font-family:ui-monospace,monospace;"
                        th:text="${clientIp}">192.168.*.*</td>
                  </tr>
                  <tr th:if="${userAgent}">
                    <td style="padding:6px 0;font-size:12px;color:#64748b;vertical-align:top;">기기 정보</td>
                    <td style="padding:6px 0;font-size:12px;color:#334155;word-break:break-all;"
                        th:text="${userAgent}">Mozilla/5.0 (Windows NT 10.0)</td>
                  </tr>
                </table>
              </div>

              <!-- 경고 박스 -->
              <div style="margin:20px 0;padding:14px 16px;background-color:#fef2f2;border-left:4px solid #dc2626;border-radius:4px;">
                <p style="margin:0;font-size:13px;line-height:1.6;color:#7f1d1d;">
                  <strong>본인이 변경하지 않으셨다면</strong> 계정이 탈취됐을 수 있습니다.
                  즉시 비밀번호를 재설정하고 관리자에게 연락해 주세요.
                </p>
              </div>

              <p style="margin:16px 0 0 0;font-size:13px;line-height:1.6;color:#334155;">
                문의: <a th:href="${supportUrl} ?: 'mailto:kingja51@gmail.com'"
                           style="color:#2563eb;text-decoration:none;">고객센터</a>
              </p>
            </td>
          </tr>

          <!-- 푸터 -->
          <tr>
            <td style="padding:16px 32px;border-top:1px solid #e2e8f0;background-color:#f8fafc;font-size:11px;color:#94a3b8;">
              본 메일은 <span th:text="${@project.nameKo}">관리자</span> 시스템에서 자동 발송되었습니다. 회신이 불가합니다.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
