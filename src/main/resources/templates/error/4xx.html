<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko" class="h-full bg-bg">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="|오류 ${status ?: '4xx'} · ${@project.nameKo}|">오류</title>
  <link th:href="@{/css/output.css}" rel="stylesheet" />
</head>
<body class="h-full flex items-center justify-center bg-bg text-fg antialiased px-4">
  <main class="max-w-[512px] w-full">
    <div class="krds-card p-6 md:p-8">
      <p class="text-display-sm font-bold text-fg-disabled tracking-tight" th:text="${status} ?: '4xx'">4xx</p>
      <h1 class="mt-2 text-heading-sm font-bold text-fg-strong"
          th:text="${error} ?: '요청을 처리할 수 없습니다.'">요청을 처리할 수 없습니다.</h1>
      <p class="mt-3 text-body-sm text-fg-subtle leading-relaxed">
        요청하신 페이지를 찾을 수 없거나, 접근 권한이 없거나, 요청 형식이 올바르지 않습니다.
      </p>

      <div class="mt-6">
        <a th:href="@{/}" class="krds-btn krds-btn-primary">홈으로 이동</a>
      </div>

      <dl class="mt-6 pt-4 border-t border-line text-body-xs text-fg-subtle space-y-2" th:if="${path}">
        <div>
          <dt class="font-bold text-fg-subtle">요청 경로</dt>
          <dd class="text-fg break-all mt-0.5" th:text="${path}">/</dd>
        </div>
        <div th:if="${timestamp}">
          <dt class="font-bold text-fg-subtle">시각</dt>
          <dd class="text-fg mt-0.5" th:text="${timestamp}"></dd>
        </div>
      </dl>
    </div>
  </main>
</body>
</html>
